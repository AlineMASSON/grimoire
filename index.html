}
function listeTous() {
  var q = sansAccents(tous.q).trim();
  var l = M.livres.filter(function (b) {
    // « Revendus » : un livre revendu garde son état (lu, plus envie…), on le filtre à part
    if (tous.etat === 'revendus') {
      if (!b.revendu) {
        return false;
      }
    } else if (tous.etat && etatLivre(b) !== tous.etat) {
      return false;
    }
    if (tous.fmt && b.book_type !== tous.fmt) {
      return false;
    }
    if (tous.etagere && (b.etagereIds || []).indexOf(tous.etagere) < 0) {
      return false;
    }
    if (!q) {
      return true;
    }
    var serie = '';
    var k = Object.keys(b.series_memberships)[0];
    if (k && M.series[k]) {
      serie = M.series[k].name;
    }
    var texte = sansAccents([b.title, b.authors.join(' '), b.translators.join(' '), serie, b.publisher, b.isbns.join(' ')].join(' '));
    return q.split(/\s+/).every(function (mot) { return texte.indexOf(mot) >= 0; });
  });
  var tri = {
    ajout: function (a, b) { return (b.created_at || 0) - (a.created_at || 0); },
    titre: function (a, b) { return titre(a).localeCompare(titre(b), 'fr'); },
    auteur: function (a, b) { return String(a.authors[0] || '~').split(' ').pop().localeCompare(String(b.authors[0] || '~').split(' ').pop(), 'fr'); },
    note: function (a, b) { return meilleureNote(b) - meilleureNote(a); },

  }).join('');
  return '<p class="small muted">' + l.length + ' livre' + (l.length > 1 ? 's' : '') + '</p>' + (lignes || '<p class="muted">Aucun livre ne correspond.</p>');

  h += card('Envies (' + envies.length + ')', envies.slice(0, 15).map(function (b) { return ligneLivre(b, 'depuis ' + depuis(b.created_at), 'data-act="livre" data-id="' + b.id + '"'); }).join(''), 'les 15 plus anciennes');

}
// ---------- séries ----------
function vSeries() {
  var parSerie = {};
  M.livres.forEach(function (b) {
    Object.keys(b.series_memberships || {}).forEach(function (k) {
      if (!parSerie[k]) {
        parSerie[k] = [];
      }
      parSerie[k].push({b: b, n: b.series_memberships[k].number});
    });
  });
  var cles = Object.keys(parSerie);
  if (!cles.length) {
    return card('Tes séries', '<p class="muted">Aucune série pour l\'instant : ajoute-la depuis la fiche d\'un livre (' + ic('pencil') + ' Modifier).</p>');
  }

  cles.sort(function (a, b) {
    var aa = (M.series[a] || {}).status === 'abandoned' ? 1 : 0;
    var bb = (M.series[b] || {}).status === 'abandoned' ? 1 : 0;
    return aa - bb;
  });
  return card('Tes séries', cles.map(function (k) {
    var s = M.series[k] || {name: 'Série'};

    var nums = l.map(function (x) { return x.n; });
    var manquants = [];
    for (var i = 1; i < max; i++) {
      if (nums.indexOf(i) < 0) {
        manquants.push(i);
      }

    var abandonnee = s.status === 'abandoned';

      info += ' · 🏳️ série abandonnée';
    } else if (suivant) {
      info += ' · à lire : tome ' + suivant.n + ' (' + esc(titre(suivant.b)) + ')';
    } else if (s.status === 'ongoing') {
      info += ' · tout lu, série en cours de parution';
    } else if (s.nbTomes && l.length < s.nbTomes) {
      info += ' · tout ce que tu as est lu (' + l.length + ' / ' + s.nbTomes + ' tomes)';
    } else {
      info += ' · terminée ✅';
    }
    if (manquants.length && !abandonnee) {
      info += ' · absent(s) de ta bibliothèque : tome ' + manquants.join(', ');
    }
    return '<div style="margin:10px 0 16px' + (abandonnee ? ';opacity:.6' : '') + '"><b style="font:700 18px Cormorant Garamond,Georgia,serif">' + esc(s.name) + '</b> <button aria-label="Modifier la série" class="mini-btn" data-act="formSerie" data-id="' + esc(k) + '">' + ic('pencil') + '</button><div class="meuble" style="margin:6px 0 8px"><div class="fond-meuble"><div class="rangs">' + l.map(function (x) { return tranche(x.b, 0); }).join('') + '</div></div></div><div class="prog"><div style="width:' + (100 * lus / l.length) + '%"></div></div><div class="small muted">' + info + '</div></div>';
  }).join(''));
}
</script>

// ---------- guirlande : en festons de tailles variées, accrochée sous chaque planche (et sous le haut du meuble) ----------
// Une forme de lumière par thème, découpée par deux masques SVG : ::before porte le fil et une lumière sur deux (couleur 1),
// ::after les autres lumières (couleur 2). Le motif fait 350 px de large et la hauteur d'un rayon : il se répète.

  feuille: function (y) { return '<path d="M6 ' + (y + 4) + 'Q8 ' + (y - 6) + ' 18 ' + (y - 5) + 'Q17 ' + (y + 5) + ' 6 ' + (y + 4) + 'Z"/>'; },

function masquesFestons(forme, per) {

  var lueursFil = [];
  var lueursAutres = [];

  FESTONS.forEach(function (f) {

      var py = (1 - s) * (1 - s) * y + 2 * (1 - s) * s * cy + s * s * y + 5;

// les règles CSS de la guirlande d'une forme (étagère en tranches : rayons de 182 px ; vitrine : 126 px) ; une forme n'est
// préparée qu'à son premier usage (un thème n'en utilise qu'une, et chaque forme pèse ~35 Ko de masques)
var formesGuirlandePretes = {};
function preparerStylesGuirlandes(forme) {
  var st = document.getElementById('stylesGuirlandes');
  if (!st) {
    st = document.createElement('style');

    st.textContent = '.m-orne .rangs::before,.m-orne .rangs::after,.m-orne .vitrine::before,.m-orne .vitrine::after{top:-' + DECALAGE_GUIRLANDE + 'px;bottom:22px}' +

  var avecCarnet = Object.keys(NOTES).filter(function (id) { return M.parId[id]; });
  var notes = avecCarnet.filter(estNote);

  var liste = aNoter;
  if (!carnetTout) {
    liste = aNoter.slice(0, 6);
  }
  var plus = '';
  if (aNoter.length > 6) {
    var lib = 'Voir les ' + aNoter.length + ' livres';
    if (carnetTout) {
      lib = 'Réduire';
    }
    plus = '<div class="row" style="margin-top:10px"><button class="act doux" data-act="carnetTout">' + lib + '</button></div>';
  }
  h += card('À glisser dans mon carnet', liste.map(function (r) {
    return ligneLivre(r.book, 'fini le ' + fdate(r.end) + ' · ' + etoiles(r.star), 'data-act="noter" data-id="' + r.book.id + '"');
  }).join('') + plus, 'touche un livre pour noter tes critères, humeurs, tropes…');

  if (avecCarnet.length) {
    h += statsCarnet(avecCarnet);
  }
  if (notes.length) {
    h += card('Mes livres notés (' + notes.length + ')', notes.sort(function (a, b) { return (NOTES[b].maj || 0) - (NOTES[a].maj || 0); }).map(function (id) {
      var b = M.parId[id];
      return '<div class="book noteligne" data-act="noter" data-id="' + id + '">' + cover(b) + '<div style="flex:1"><div class="t">' + esc(titre(b)) + '</div>' + resumeNote(NOTES[id]) + '</div></div>';
    }).join(''));
  }

  // les étoiles se donnent directement dans la liste ; toucher le livre ouvre toute sa lecture
  var sansEtoiles = fin.filter(function (r) { return !r.star; });
  if (sansEtoiles.length) {
    var listeSE = sansEtoiles;
    var legende = 'touche une étoile pour noter le livre (deux fois pour une demi-étoile)';
    var plusSE = '';
    if (sansEtoiles.length > 12) {
      var libSE = 'Voir les ' + sansEtoiles.length + ' livres';
      if (sansEtoilesTout) {
        libSE = 'Réduire';
      } else {
        listeSE = sansEtoiles.slice(0, 12);
        legende += ' · les 12 plus récents';
      }
      plusSE = '<div class="row" style="margin-top:10px"><button class="act doux" data-act="sansEtoilesTout">' + libSE + '</button></div>';
    }
    h += card('Sans étoiles (' + sansEtoiles.length + ')', listeSE.map(function (r) {
      return ligneLivre(r.book, 'fini le ' + fdate(r.end) + '<div class="etoiles-saisie mini" data-v="0">' + boutonsEtoiles(r._id, 0, 'etoileRapide') + '</div>', 'data-act="formLecture" data-id="' + r._id + '"');
    }).join('') + plusSE, legende);
  }

  h += carteCitations();
  return h;
}
ACTIONS.carnetTout = function () {
  carnetTout = !carnetTout;
  rendre();
};
var sansEtoilesTout = false;
ACTIONS.sansEtoilesTout = function () {
  sansEtoilesTout = !sansEtoilesTout;
  rendre();
};

function statsCarnet(ids) {
  var h = '';
  var moyennes = listeCarnet('criteres').map(function (c) {
    var v = ids.map(function (id) { return NOTES[id][c.id]; }).filter(Boolean);
    return {l: libelle(c), v: moy(v) || 0, txt: round(moy(v) || 0, 1) + '/5'};
  });
  h += bars(moyennes, {max: 5});
  var hum = {};
  var tro = {};
  ids.forEach(function (id) {
    (NOTES[id].humeurs || []).forEach(function (x) { hum[x] = (hum[x] || 0) + 1; });
    (NOTES[id].tropes || []).forEach(function (x) {
      if (!tro[x]) {
        tro[x] = [];
      }
      var r = (M.parId[id].reads || []).filter(function (z) { return z.star; })[0];
      var st = 0;
      if (r) {
        st = r.star;
      }
      tro[x].push(st);
    });
  });
  var hk = Object.keys(hum).sort(function (a, b) { return hum[b] - hum[a]; });
  if (hk.length) {
    h += '<p class="small muted" style="margin:14px 0 4px">Les émotions que tu cherches</p><div>' + hk.map(function (x) { return '<span class="chip on">' + esc(x) + ' · ' + hum[x] + '</span>'; }).join('') + '</div>';
  }
  var tk = Object.keys(tro).sort(function (a, b) { return tro[b].length - tro[a].length; });
  if (tk.length) {
    h += '<p class="small muted" style="margin:14px 0 4px">Tes tropes (nombre de livres · note moyenne)</p>' + bars(tk.map(function (x) {
      var et = tro[x].filter(Boolean);
      return {l: x, v: tro[x].length, txt: tro[x].length + ' · ' + etoiles(moy(et))};
    }));
  }
  return card('Ce que tu aimes vraiment', h, 'd\'après ton carnet');
}

// ---------- éditeur d'une note de carnet (enregistrée dans la table « avis ») ----------
ACTIONS.noter = function (el) {
  var id = el.dataset.id;
  var b = M.parId[id];
  if (!b) {
    return;
  }
  if (minuteurNote && brouillon) {
    sauverNote(brouillon);
  }
  var a = D.avis[id] || {};
  brouillon = {id: id, notes: Object.assign({}, a.notes || {}), humeurIds: (a.humeurIds || []).slice(), tropeIds: (a.tropeIds || []).slice(), mot: a.mot || '', nouveau: ''};
  ouvrirFeuille('<div class="tete">' + cover(b) + '<div><h3>' + esc(titre(b)) + '</h3><div class="small muted">' + esc((b.authors || []).join(', ')) + '</div></div></div><div id="editeur"></div>');
  rendreEditeur();
};
// le cœur emoji qui va avec la couleur principale du thème (💜 violet, 🩷 rose, 💚 vert…)
function coeurDuTheme() {
  var t = document.createElement('span');
  t.style.color = 'var(--accent)';
  document.body.appendChild(t);
  var c = getComputedStyle(t).color;
  t.remove();
  var v = (c.match(/[\d.]+/g) || []).map(Number);
  if (v.length < 3) {
    return '💜';
  }
  // rgb(255, 0, 0) ou color(srgb 1 0 0)
  if (c.indexOf('color(') === 0) {
    v = v.map(function (x) { return x * 255; });
  }
  var r = v[0] / 255, g = v[1] / 255, b = v[2] / 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b);
  if (max - min < 0.12) {
    return '🤍';
  }
  var h;
  if (max === r) {
    h = ((g - b) / (max - min) + 6) % 6;
  } else if (max === g) {
    h = (b - r) / (max - min) + 2;
  } else {
    h = (r - g) / (max - min) + 4;
  }
  h *= 60;
  var COEURS = [[15, '❤️'], [40, '🧡'], [65, '💛'], [170, '💚'], [200, '🩵'], [240, '💙'], [290, '💜'], [345, '🩷'], [360, '❤️']];
  return COEURS.filter(function (x) { return h < x[0]; })[0][1];
}
function pips(champ, val, symbole, max) {
  var h = '<span class="pips">';
  for (var i = 1; i <= max; i++) {
    var cls = '';
    if (i <= val) {
      cls = ' class="on"';
    }
    h += '<button' + cls + ' data-act="pip" data-c="' + esc(champ) + '" data-v="' + i + '" aria-label="' + i + ' sur ' + max + '">' + symbole + '</button>';
  }
  return h + '</span>';
}
// petit formulaire en ligne pour créer un critère, une humeur ou un trope sans quitter la note
function zoneNouveau(t) {
  if (brouillon.nouveau !== t) {
    var quoi = {criteres: 'critère', humeurs: 'humeur', tropes: 'trope'}[t];
    return '<button class="chip" data-act="ouvrirNouveau" data-t="' + t + '">' + ic('plus') + ' ' + quoi + '</button>';
  }
  var emoji = '';
  if (t !== 'tropes') {
    emoji = '<input class="champ" id="neEmoji" maxlength="4" placeholder="✨" style="width:64px;text-align:center">';
  }
  return '<div class="avec-bouton" style="margin-top:6px">' + emoji + '<input class="champ" id="neNom" placeholder="Nom" autocomplete="off"><button class="act" data-act="creerElement" data-t="' + t + '">OK</button></div>';
}
function rendreEditeur() {
  var b = brouillon;
  var h = '<h4>Mes critères</h4>' + listeCarnet('criteres', function (c) { return b.notes[c.id]; }).map(function (c) {
    return '<div class="crit"><span>' + esc(libelle(c)) + '</span>' + pips(c.id, b.notes[c.id] || 0, coeurDuTheme(), 5) + '</div>';
  }).join('') + zoneNouveau('criteres');
  h += '<h4>Humeur du livre</h4><div>' + listeCarnet('humeurs', function (x) { return b.humeurIds.indexOf(x.id) >= 0; }).map(function (x) {
    var cls = 'chip';
    if (b.humeurIds.indexOf(x.id) >= 0) {
      cls += ' on';
    }
    return '<button class="' + cls + '" data-act="puce" data-l="humeurIds" data-v="' + esc(x.id) + '">' + esc(libelle(x)) + '</button>';
  }).join('') + zoneNouveau('humeurs') + '</div>';
  // les tropes : une recherche (beaucoup de puces), ceux déjà choisis en premier
  var tropes = listeCarnet('tropes', function (x) { return b.tropeIds.indexOf(x.id) >= 0; });
  var choisis = tropes.filter(function (x) { return b.tropeIds.indexOf(x.id) >= 0; });
  var autres = tropes.filter(function (x) { return b.tropeIds.indexOf(x.id) < 0; });
  h += '<h4>Tropes</h4><input class="champ" id="qTrope" type="search" placeholder="🔎 Chercher un trope" autocomplete="off" value="' + esc(b.qTrope || '') + '" style="margin-bottom:6px"><div id="zTropes">' + choisis.concat(autres).map(function (x) {
    var cls = 'chip';
    if (b.tropeIds.indexOf(x.id) >= 0) {
      cls += ' on';
    }
    return '<button class="' + cls + '" data-act="puce" data-l="tropeIds" data-v="' + esc(x.id) + '" data-s="' + esc(slug(x.nom)) + '">' + esc(libelle(x)) + '</button>';
  }).join('') + '<button class="chip" id="tropeCreer" data-act="creerTropeRecherche" hidden></button>' + zoneNouveau('tropes') + '</div>';
  h += '<h4>Mon petit mot</h4><textarea id="mot" placeholder="Ce que je veux me rappeler de ce livre…">' + esc(b.mot) + '</textarea>';
  h += '<div class="row rang-note" id="rangNote">' + rangNoteHtml(b) + '</div>';
  document.getElementById('editeur').innerHTML = h;
  var mot = document.getElementById('mot');
  mot.addEventListener('input', function () {
    brouillon.mot = mot.value;
    noteModifiee(1000);
  });
  mot.addEventListener('blur', function () {
    if (minuteurNote) {
      sauverNote(brouillon);
    }
  });
  var q = document.getElementById('qTrope');
  q.addEventListener('input', function () {
    brouillon.qTrope = q.value;
    filtrerTropes();
  });
  filtrerTropes();
  var nom = document.getElementById('neNom');
  if (nom) {
    nom.focus();
    nom.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        ACTIONS.creerElement({dataset: {t: brouillon.nouveau}});
      }
    });
  }
}
// n'affiche que les tropes qui contiennent la recherche (sans accents) ; les tropes choisis restent visibles
function filtrerTropes() {
  var q = slug(brouillon.qTrope || '');
  var vus = 0;
  document.querySelectorAll('#zTropes [data-l="tropeIds"]').forEach(function (el) {
    var montrer = !q || el.dataset.s.indexOf(q) >= 0 || el.classList.contains('on');
    el.hidden = !montrer;
    if (montrer && q && !el.classList.contains('on')) {
      vus++;
    }
  });
  // rien ne correspond : proposer de créer le trope tapé
  var creer = document.getElementById('tropeCreer');
  if (creer) {
    creer.hidden = !q || vus > 0;
    creer.innerHTML = ic('plus') + ' Créer le trope « ' + esc(brouillon.qTrope || '') + ' »';
  }
}
ACTIONS.creerTropeRecherche = function () {
  garderMot();
  brouillon.nouveau = 'tropes';
  rendreEditeur();
  var nom = document.getElementById('neNom');
  if (nom) {
    nom.value = (brouillon.qTrope || '').trim();
  }
};
function garderMot() {
  var t = document.getElementById('mot');
  if (t) {
    brouillon.mot = t.value;
  }
}
ACTIONS.pip = function (el) {
  garderMot();
  var v = parseInt(el.dataset.v, 10);
  if (brouillon.notes[el.dataset.c] === v) {
    delete brouillon.notes[el.dataset.c];
  } else {
    brouillon.notes[el.dataset.c] = v;
  }
  rendreEditeur();
  noteModifiee(0);
};
ACTIONS.puce = function (el) {
  garderMot();
  var l = brouillon[el.dataset.l];
  var i = l.indexOf(el.dataset.v);
  if (i >= 0) {
    l.splice(i, 1);
  } else {
    l.push(el.dataset.v);
  }
  rendreEditeur();
  noteModifiee(0);
};
ACTIONS.ouvrirNouveau = function (el) {
  garderMot();
  brouillon.nouveau = el.dataset.t;
  rendreEditeur();
};
ACTIONS.creerElement = function (el) {
  garderMot();
  var t = el.dataset.t;
  var nom = val('neNom');
  if (!nom) {
    brouillon.nouveau = '';
    rendreEditeur();
    return;
  }
  var emoji = val('neEmoji');
  creerElementListe(t, nom, emoji).then(function (x) {
    if (t === 'humeurs' && brouillon.humeurIds.indexOf(x.id) < 0) {
      brouillon.humeurIds.push(x.id);
    } else if (t === 'tropes' && brouillon.tropeIds.indexOf(x.id) < 0) {
      brouillon.tropeIds.push(x.id);
    }
    if (t === 'tropes') {
      brouillon.qTrope = '';
    }
    brouillon.nouveau = '';
    rendreEditeur();
    if (t !== 'criteres') {
      noteModifiee(0);
    }
  }).catch(erreurEcriture);
};
// ---------- enregistrement automatique : chaque cœur, humeur ou trope tout de suite, le petit mot 1 s après la dernière frappe ----------
// La note s'écrit sans redessiner l'éditeur ; la vue du dessous se met à jour à la fermeture de la feuille.
var minuteurNote = null;
function rangNoteHtml(b) {
  var etat = b.etat || 'tes changements s\'enregistrent tout seuls';
  var h = '<span class="small muted etat-note" id="etatNote" role="status">' + etat + '</span>';
  if (D.avis[b.id]) {
    h += '<button class="act doux" data-act="effacerNote">Effacer</button>';
  }
  return h;
}
function majRangNote(b) {
  var r = document.getElementById('rangNote');
  if (r && brouillon === b) {
    r.innerHTML = rangNoteHtml(b);
  }
}
function noteModifiee(delai) {
  var b = brouillon;
  clearTimeout(minuteurNote);
  minuteurNote = null;
  b.etat = '…';
  majRangNote(b);
  if (delai) {
    minuteurNote = setTimeout(function () {
      sauverNote(b);
    }, delai);
  } else {
    sauverNote(b);
  }
}
function sauverNote(b) {
  clearTimeout(minuteurNote);
  minuteurNote = null;
  var notes = {};
  Object.keys(b.notes).forEach(function (k) {
    if (b.notes[k]) {
      notes[k] = b.notes[k];
    }
  });
  var ancien = D.avis[b.id] || {};
  return ecrire([{t: 'avis', o: {id: b.id, notes: notes, humeurIds: b.humeurIds.slice(), tropeIds: b.tropeIds.slice(), mot: b.mot, maj: Date.now(), creeLe: ancien.creeLe}}]).then(function () {
    apresEcritureSansRendu();
    b.etat = '✓ enregistré';
    majRangNote(b);
  }).catch(erreurEcriture);
}
ACTIONS.effacerNote = function () {
  demander('Effacer ta note de carnet pour ce livre ?', {oui: 'Effacer', danger: true}).then(function (ok) {
    if (!ok) {
      return;
    }
    clearTimeout(minuteurNote);
    minuteurNote = null;
    supprimerAvecAnnulation([{t: 'avis', suppr: brouillon.id}], '🗑️ Note de carnet effacée').then(function () {
      fermerFeuille();
      apresEcriture();
    }).catch(erreurEcriture);
  });
};

// ---------- carte-citation en image ----------
function couleurVar(nom) {
  return getComputedStyle(document.documentElement).getPropertyValue(nom).trim();
}
function lignesTexte(ctx, texte, largeur) {
  var mots = texte.split(/\s+/);
  var lignes = [];
  var cur = '';
  mots.forEach(function (m) {
    var essai = cur;
    if (essai) {
      essai += ' ';
    }
    essai += m;
    if (ctx.measureText(essai).width > largeur && cur) {
      lignes.push(cur);
      cur = m;
    } else {
      cur = essai;
    }
  });
  if (cur) {
    lignes.push(cur);
  }
  return lignes;
}
ACTIONS.imageCitation = function (el) {
  var n = M.notes.filter(function (x) { return x._key === el.dataset.k; })[0];
  if (!n) {
    return;
  }
  var polices = Promise.all([
    document.fonts.load('italic 600 54px "Cormorant Garamond"'),
    document.fonts.load('700 44px "Dancing Script"'),
    document.fonts.load('600 30px Nunito')
  ]).catch(function () {});
  polices.then(function () {
    var W = 1080, H = 1350;
    var cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    var ctx = cv.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, couleurVar('--accent-soft'));
    g.addColorStop(1, couleurVar('--lav-soft'));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = couleurVar('--gold');
    for (var i = 0; i < 46; i++) {
      var x = (i * 389) % W, y = (i * 613) % H, r = 1 + (i % 4);
      ctx.globalAlpha = 0.25 + (i % 5) / 8;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = couleurVar('--gold');
    ctx.lineWidth = 3;
    ctx.strokeRect(50, 50, W - 100, H - 100);
    ctx.lineWidth = 1;
    ctx.strokeRect(64, 64, W - 128, H - 128);
    ctx.textAlign = 'center';
    ctx.fillStyle = couleurVar('--accent');
    ctx.font = '700 120px "Cormorant Garamond", Georgia, serif';
    ctx.fillText('❝', W / 2, 270);
    var taille = 58;
    if (n.texte.length > 260) {
      taille = 44;
    }
    if (n.texte.length > 480) {
      taille = 34;
    }
    ctx.font = 'italic 600 ' + taille + 'px "Cormorant Garamond", Georgia, serif';
    ctx.fillStyle = couleurVar('--ink');
    var lignes = lignesTexte(ctx, n.texte, W - 240);
    var hl = taille * 1.35;
    var y0 = H / 2 - (lignes.length * hl) / 2 + taille / 2;
    lignes.forEach(function (l, i) {
      ctx.fillText(l, W / 2, y0 + i * hl);
    });
    if (n.book) {
      ctx.font = '700 46px "Dancing Script", cursive';
      ctx.fillStyle = couleurVar('--accent');
      ctx.fillText(titre(n.book), W / 2, H - 230);
      ctx.font = '600 28px Nunito, sans-serif';
      ctx.fillStyle = couleurVar('--muted');
      ctx.fillText((n.book.authors || []).join(', '), W / 2, H - 180);
    }
    ctx.font = '600 24px Nunito, sans-serif';
    ctx.fillStyle = couleurVar('--gold');
    ctx.fillText('✦  Mon grimoire de lectures  ✦', W / 2, H - 110);
    var url = cv.toDataURL('image/png');
    ouvrirFeuille('<h3>Ta carte citation</h3><p class="small muted">Sur ton téléphone : appui long sur l\'image → « Enregistrer l\'image ».</p><img src="' + url + '" alt="Carte citation" style="width:100%;border-radius:14px;box-shadow:var(--shadow)"><div class="row" style="margin-top:12px"><a class="act" href="' + url + '" download="citation.png">' + ic('download') + ' Télécharger</a></div>');
  });
};

.defi.fini .ico{background:color-mix(in srgb,var(--gold) 25%,transparent)}

        retenir(u[1] + ' ' + u[2], pct, u[4](d));
      }
      cire = '<div class="cire verrou" style="--p:' + (100 * pct).toFixed(0) + '%"><span>' + u[1] + '</span></div>';
    }
    return '<div class="sceau">' + cire + '<b>' + u[2] + '</b><span class="muted">' + esc(u[4](d)) + '</span></div>';
  }));
  var nbPaliers = Object.keys(p).reduce(function (s, k) { return s + p[k]; }, 0);
  var total = FAMILLES_SCEAUX.length * 4 + SCEAUX_UNIQUES.length;
  var sous = nbPaliers + ' / ' + total + ' paliers débloqués';
  if (proche) {
    sous += ' · le plus proche : ' + proche.nom + ' (' + proche.texte + ')';
  }
  return card('Mes sceaux magiques', '<div class="sceaux">' + h.join('') + '</div>', sous);
}

function vQuetes() {
  return avec('quetes', function () {
    return noteExclus('quetes') + carteSaison() + carteNiveau() + carteDefis() + vBingo() + carteAlbum() + vSceaux() + carteSceauxSaison();
  });
}
</script>

<script>
// ---------- Cartes de collection : chaque livre fini devient une carte ----------
var RARETES = [['commune', 'Commune', '◆'], ['rare', 'Rare', '◆◆'], ['epique', 'Épique', '◆◆◆'], ['legendaire', 'Légendaire', '◆◆◆◆']];
var filtreAlbum = -1;
// la rareté vient de la note ; une légendaire est un 5★ qui compte encore plus :
// relu, avec des citations, noté dans le carnet, ou un pavé (600 p. ou 15 h d'écoute)
function speciaux() {
  var cit = {};
  M.notes.forEach(function (n) {
    if (n.bid) {
      cit[n.bid] = 1;
    }
  });
  var relus = {};
  M.lectures.forEach(function (r) {
    if (r.nth >= 2) {
      relus[r.book.id] = 1;
    }
  });
  return {cit: cit, relus: relus};
}
function rareteLecture(r, sp) {
  sp = sp || speciaux();
  var s = r.star || 0;
  var p = 0;
  var h = 0;
  if (r.page_type === 'TIME') {
    h = r.total_page / 3600;
  } else {
    p = pagesLecture(r);
  }
  var id = r.book.id;
  if (s >= 5 && (sp.relus[id] || sp.cit[id] || estNote(id) || p >= 600 || h >= 15)) {
    return 3;
  }
  if (s >= 4.5) {
    return 2;
  }
  if (s >= 4) {
    return 1;
  }
  return 0;
}
// les cartes, numérotées dans l'ordre où les livres ont été finis
function cartesCollection() {
  return avec('quetes', function () {
    var sp = speciaux();
    return finies().slice().sort(function (a, b) { return a.end - b.end; }).map(function (r, i) {
      return {r: r, n: i + 1, rar: rareteLecture(r, sp)};
    });
  });
}
function tailleLecture(r) {
  if (r.page_type === 'TIME') {
    return Math.round(r.total_page / 3600) + ' h';
  }
  if (pagesLecture(r)) {
    return pagesLecture(r) + ' p.';
  }
  return '';
}
function htmlCarte(c, grande) {
  var b = c.r.book;
  var R = RARETES[c.rar];
  var img = '';

    img = '<img loading="lazy" src="' + esc(b.image) + '" alt="" onerror="this.remove()">';
  }

  var attr = ' data-act="voirCarte" data-n="' + c.n + '"';
  if (grande) {
    cls += ' grande';
    attr = '';

  return '<button class="' + cls + '"' + attr + ' aria-label="' + esc(titre(b)) + ', carte ' + R[1].toLowerCase() + '"><span class="art-c">' + esc(titreTranche(b)) + img + '<span class="rar-c">' + R[1].toUpperCase() + '</span></span><span class="nom-c">' + esc(titreTranche(b)) + '</span><span class="bas-c"><span>n° ' + c.n + '</span><span>' + R[2] + '</span><span>' + tailleLecture(c.r) + '</span></span></button>';
}
function carteAlbum() {
  var cartes = cartesCollection();
  if (!cartes.length) {
    return '';
  }
  var nb = [0, 0, 0, 0];
  cartes.forEach(function (c) { nb[c.rar]++; });
  var couleurs = ['var(--line)', '#4a8fe0', '#a879ff', '#d9a338'];
  var compteurs = '<div class="compteurs-c">' + [3, 2, 1, 0].map(function (k) {
    return '<span style="border-color:' + couleurs[k] + '">' + RARETES[k][2] + ' ' + nb[k] + ' ' + RARETES[k][1].toLowerCase() + (nb[k] > 1 ? 's' : '') + '</span>';
  }).join('') + '</div>';
  var dernieres = cartes.slice(-3).reverse();
  return card('Mon album de cartes', compteurs + '<div class="cartes-c">' + dernieres.map(function (c) { return htmlCarte(c); }).join('') + '</div><div class="row" style="justify-content:center;margin-top:12px"><button class="act doux" data-act="album">' + ic('layers') + ' Ouvrir l\'album · ' + cartes.length + ' cartes</button></div>', 'chaque livre fini devient une carte · légendaire = un 5★ relu, cité, noté dans le carnet ou un pavé');
}
ACTIONS.album = function (el) {
  if (el && el.dataset && el.dataset.f !== undefined) {
    filtreAlbum = parseInt(el.dataset.f, 10);
  }
  var cartes = cartesCollection().reverse();
  var liste = cartes;
  if (filtreAlbum >= 0) {
    liste = cartes.filter(function (c) { return c.rar === filtreAlbum; });
  }
  var filtres = [[-1, 'Toutes'], [3, 'Légend.'], [2, 'Épiques'], [1, 'Rares'], [0, 'Communes']];
  var seg = '<div class="seg" style="margin:0 0 12px">' + filtres.map(function (f) {
    var cls = '';
    if (f[0] === filtreAlbum) {
      cls = ' class="on"';
    }

  }).join('') + '</div>';
  var grille = '<div class="cartes-c">' + liste.map(function (c) { return htmlCarte(c); }).join('') + '</div>';
  if (!liste.length) {
    grille = '<p class="muted">Pas encore de carte de cette rareté.</p>';
  }
  ouvrirFeuille('<h3>Mon album</h3><p class="small muted" style="margin:0 0 10px">' + liste.length + ' carte' + (liste.length > 1 ? 's' : '') + ' · les plus récentes d\'abord</p>' + seg + grille);
};
ACTIONS.voirCarte = function (el) {
  var c = cartesCollection()[parseInt(el.dataset.n, 10) - 1];
  if (!c) {
    return;
  }
  var b = c.r.book;
  var etoiles = '';

// le reflet holographique des légendaires suit l'inclinaison du téléphone
function suivreInclinaison() {
  if (window.__inclinaison) {
    return;
  }
  window.__inclinaison = function (e) {
    var cartes = document.querySelectorAll('.carte-c.grande.legendaire');
    if (!cartes.length) {
      window.removeEventListener('deviceorientation', window.__inclinaison);

}

// ---------- Décorations d'étagère à gagner ----------
// chaque décoration est un emoji (rendu par le téléphone)
var DECOS_EMOJI = {plante: '🪴', chat: '🐈‍⬛', bougie: '🕯️', boule: '🔮', chouette: '🦉', pile: '🔖', lanterne: '🏮', sablier: '⏳', fiole: '💎', oeuf: '🐉', citrouille: '🎃', sapin: '🎄',
  bonhomme: '⛄', champignon: '🍄', phenix: '🐦‍🔥', toile: '🕷️', bougie2: '🪔', trophee: '🏆', matriochka: '🪆', theiere: '🫖', tresor: '💰'};
// sur l'étagère : 'haut' = toujours accrochée en haut du rayon (au bout d'un fil), 'haut-bas' = accrochée ou posée ;
// les autres sont posées sur la planche (ou sur le dessus du meuble)
var HAUTEUR_DECOS = {pile: 'haut', toile: 'haut', lanterne: 'haut-bas'};
// [id, nom, comment la gagner, condition sur donneesDecos()]
var DECOS = [
  ['plante', 'Plante grimpante', 'offerte', function () { return true; }],
  ['bougie', 'Bougie', 'Niveau 2', function (d) { return d.niveau >= 1; }],
  ['chat', 'Chat noir', '30 jours d\'affilée', function (d) { return d.flamme >= 30; }],
  ['boule', 'Boule de cristal', 'Niveau 5', function (d) { return d.niveau >= 4; }],
  ['chouette', 'Chouette', '20 relevés après 23 h', function (d) { return d.nuit >= 20; }],
  ['pile', 'Marque-page', '100 livres lus', function (d) { return d.livres >= 100; }],
  ['lanterne', 'Lanterne', '5 défis réussis', function (d) { return d.defis >= 5; }],
  ['sablier', 'Sablier', '50 h au minuteur', function (d) { return d.minuteur >= 50; }],
  ['fiole', 'Gemme', 'Gagner un pari du destin', function (d) { return d.paris >= 1; }],
  ['oeuf', 'Bébé dragon', 'Quête du Mois de l\'Imaginaire', function (d) { return !!d.saisons.imaginaire; }],
  ['citrouille', 'Citrouille', 'Quête d\'Halloween', function (d) { return !!d.saisons.halloween; }],
  ['sapin', 'Sapin', 'Quête de Noël', function (d) { return !!d.saisons.noel; }],
  ['bonhomme', 'Bonhomme de neige', 'Quête de l\'Hiver', function (d) { return !!d.saisons.hiver; }],
  ['champignon', 'Champignon', 'Quête de l\'Automne', function (d) { return !!d.saisons.automne; }],
  ['phenix', 'Phénix', 'Relire un livre', function (d) { return d.relu; }],
  ['toile', 'Araignée', 'Lire un livre en PAL depuis 1 an', function (d) { return d.palAncienne; }],
  ['bougie2', 'Lampe à huile', '10 soirées de lecture après 22 h', function (d) { return d.soirees >= 10; }],
  ['trophee', 'Trophée', 'Atteindre ton objectif de l\'année', function (d) { return d.objectif; }],
  ['matriochka', 'Matriochka', 'Terminer une série', function (d) { return d.series >= 1; }],
  ['theiere', 'Théière', '20 matins de lecture (avant 9 h)', function (d) { return d.matins >= 20; }],
  ['tresor', 'Coffre au trésor', 'Faire un bingo', function (d) { return d.bingo; }]

function donneesDecos() {
  return memo('decos', calculDonneesDecos);
}
function calculDonneesDecos() {
  return avec('quetes', function () {
    var s = donneesSceaux();
    var dr = defisReussis();
    var cles = Object.keys(dr);
    var saisons = {};
    quetesSaisonReussies().forEach(function (k) { saisons[k.split(':')[0]] = 1; });
    var ans = {};
    finies().forEach(function (r) { ans[annee(r.end)] = 1; });
    return {

      flamme: s.flamme,
      nuit: s.nuit,
      livres: s.livres,
      defis: cles.filter(function (k) { return k.charAt(0) === 'S' || k.charAt(0) === 'M'; }).length,

      saisons: saisons,

      soirees: soireesEntre(0, Date.now() + DAY),
      matins: matinsDeLecture(),

    };
  });
}
// jours où une lecture a commencé entre 5 h et 9 h du matin
function matinsDeLecture() {
  var vus = {};
  (M.sessions || []).forEach(function (s) {
    var h = new Date(s.debut).getHours();
    if (compte(s.book) && h >= 5 && h < 9) {
      vus[dkey(new Date(s.debut))] = 1;
    }

  return Object.keys(vus).length;
}
function decosGagnees(d) {

}
// les décorations posées sur les étagères (autant qu'on veut, une par rayon au plus : placerDecos) ; sans choix, toutes les gagnées
function decosPosees() {
  var gagnees = decosGagnees();
  var choix = reglage('decosChoisies', null);
  if (!choix) {

  }

// l'image de chaque décoration, choisie une par une :
// g = emoji Google (Noto Emoji, © Google, licence CC BY 4.0), animé sauf si fixe ;
// f = sticker 3D (Fluent Emoji, © Microsoft, licence MIT), avec ms = sa vraie animation 3D (celle de Microsoft Teams, via la

var NOTO = 'https://fonts.gstatic.com/s/e/notoemoji/latest/';
var FLUENT = 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/';
var FLUENT_ANIME = 'https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis@55e1dceff489121c3f7c7a7ec4f4d401d2cbd53e/Emojis/';
var DECOS_IMAGES = {
  plante: {g: '1fab4', fixe: true},

// l'image d'une déco : animée si anime (et si elle existe), sinon sa version fixe
function urlSticker(id, anime) {

function decalageDeco(id) {

}

function secoursDeco(img) {
  var s = img.getAttribute('data-secours');

    img.removeAttribute('data-secours');

function svgDeco(id, anime) {

  var secours = '';
  var fixe = urlSticker(id, false);
  if (fixe && fixe !== url) {
    secours = ' data-secours="' + fixe + '"';
  }
  return '<span class="' + cls + '"' + style + '><img src="' + url + '" alt="" loading="lazy"' + secours + ' onerror="secoursDeco(this)">' + emoji + '</span>';
}
ACTIONS.mesDecos = function () {
  var d = donneesDecos();
  var gagnees = decosGagnees(d);

  }).join('') + '</div>';

ACTIONS.poserDeco = function (el) {

  } else {
    posees.push(id);

    planifierSauvegarde();
    rendre();
    ACTIONS.mesDecos();
  }).catch(erreurEcriture);
};

<script>
// ---------- Quêtes de saison : une par fête ou par saison, avec un sceau (et parfois une décoration) ----------
function jourLocal(y, m, j) {

}
// les dates des jours de lecture ne sont lues qu'une fois par modèle (cache des calculs)
function joursEntre(a, b) {

}
function joursSurLivres(a, b, test) {
  return joursEntre(a, b).filter(function (k) {

}
function finiesEntre(a, b, test) {
  return finies().filter(function (r) { return r.end >= a && r.end < b && (!test || test(r.book)); });
}

    return 0;
  }

// un livre en cours qui ferait avancer l'objectif
function enCoursPour(test) {
  var b = M.livres.filter(function (x) { return compte(x) && x.statut === 'READING' && test(x); })[0];
  if (!b) {

  }

}
var RE_IMAGINAIRE = /fantasy|science-fiction|dystopie|post-apocalyptique|surnaturel|magie/i;
var RE_PEUR = /horreur|gothique|thriller|policier|mystère/i;
function objectif(ico, titreO, v, cible, unite, info) {

}
function objectifsSaison(a, b) {
  return [objectif('📚', 'Finir 4 livres', finiesEntre(a, b).length, 4, 'livres'), objectif('📅', 'Lire 50 jours', joursEntre(a, b).length, 50, 'jours')];

}

var QUETES_SAISON = [
  ['hiver', '❄️', 'Hiver', function (y) { return [jourLocal(y, 12, 21), jourLocal(y + 1, 3, 20)]; }, objectifsSaison, 200, ''],
  ['valentin', '💌', 'Saint-Valentin', function (y) { return [jourLocal(y, 2, 10), jourLocal(y, 2, 15)]; }, function (a, b) {

  }, 80, ''],
  ['printemps', '🌸', 'Printemps', function (y) { return [jourLocal(y, 3, 20), jourLocal(y, 6, 21)]; }, objectifsSaison, 200, ''],

  ['automne', '🍂', 'Automne', function (y) { return [jourLocal(y, 9, 23), jourLocal(y, 12, 21)]; }, objectifsSaison, 200, ''],
  ['imaginaire', '🐉', 'Mois de l\'Imaginaire', function (y) { return [jourLocal(y, 10, 1), jourLocal(y, 11, 1)]; }, function (a, b) {

function nomInstance(q, y) {

    return q[2] + ' ' + (y + 1);

// toutes les quêtes, de la première année de lecture à l'an prochain, avec leur état (gardées une minute)

// ---------- Pari du destin : finir en 30 jours le livre apporté par le hibou ----------
var XP_PARI = 150;

    }
  }
  if (!b || b.statut === 'DONE') {
    return '';
  }
  return '<button class="act" data-act="releverPari" data-id="' + b.id + '">🎲 Je relève le pari : fini avant le ' + fdate(Date.now() + 30 * DAY) + ' · +' + XP_PARI + ' XP</button>';
}
ACTIONS.releverPari = function (el) {
  if (pariEnCours()) {
    return;
  }
  var p = {livreId: el.dataset.id, debut: Date.now(), echeance: Date.now() + 30 * DAY, xp: XP_PARI};
  regler('pari', p).then(function () {
    planifierSauvegarde();
    var z = document.querySelector('.pari-tirage');
    if (z) {
      z.innerHTML = boutonPari(M.parId[p.livreId]);
    }
    toast('🎲 Pari relevé ! À finir avant le ' + fdate(p.echeance));
  }).catch(erreurEcriture);
};
ACTIONS.renoncerPari = function (el, e) {
  if (e) {
    e.preventDefault();
  }
  demander('Le livre reste dans ta PAL, et tu pourras relever un autre pari avec le hibou.', {titre: 'Renoncer au pari du destin ?', oui: 'Renoncer'}).then(function (ok) {
    if (!ok) {
      return;
    }
    regler('pari', null).then(function () {
      planifierSauvegarde();
      rendre();
    }).catch(erreurEcriture);
  });
};
// la ligne du pari dans les défis de la semaine
function lignePari() {
  var p = pariEnCours();
  if (!p) {
    return '';
  }
  var b = M.parId[p.livreId];
  if (!b) {
    return '';
  }
  var pct = pctLivre(b);
  var reste = Math.max(0, Math.ceil((p.echeance - Date.now()) / DAY));
  return '<div class="defi"><div class="ico">🎲</div><div class="txt"><b>Pari du destin : ' + esc(titre(b)) + '</b><div class="prog"><div style="width:' + pct + '%"></div></div><div class="small muted">' + pct + ' % lu · à finir avant le ' + fdate(p.echeance) + ' (encore ' + reste + ' jour' + (reste > 1 ? 's' : '') + ') · <a href="#" data-act="renoncerPari">renoncer</a></div></div><div class="xp">+' + p.xp + ' XP</div></div>';
}
</script>

@keyframes hibou-avance{0%{transform:translateX(0);animation-timing-function:cubic-bezier(.25,.6,.4,1)}45%{transform:translateX(calc(var(--l,340px) / 2 + 90px));animation-timing-function:cubic-bezier(.6,0,.8,.45)}100%{transform:translateX(calc(var(--l,340px) + 210px))}}

@media (max-height:620px){.hibou-scene{height:210px}.enveloppe-h{top:24px}.lettre-h{top:12px;padding:10px}.lettre-h .contenu img,.lettre-h .contenu .ph{width:46px;height:69px}}

<script>
// ---------- À lire : le courrier du hibou (il apporte un livre de ta PAL) ----------
var hibou = {lettre: null, ouverte: false, dernier: null};
var FILTRES_FORMAT = [['paperBook', '📖 papier'], ['eBook', '📱 ebook'], ['audioBook', '🎧 audio']];
var FILTRES_TAILLE = [['court', '🍬 court · < 250 p.'], ['moyen', '📗 moyen'], ['pave', '📚 pavé · > 450 p.']];
// la chouette des neiges (façon Hedwige) : perchée sur sa branche, et en vol ailes levées, la lettre dans les serres
var NEIGE = {corps: '#f7f6f0', aile: '#e6e3d8', ventre: '#ffffff', motif: '#d8d4c6', face: '#ffffff', iris: '#f2c230', bec: '#3a3a40', pattes: '#c9c4b4'};
function chouettePerchee() {
  var p = NEIGE;
  var plumes = '';
  for (var r = 0; r < 3; r++) {
    for (var c = 0; c < 4 - (r % 2); c++) {
      var x = 44 + c * 11 + (r % 2) * 5.5;
      var y = 90 + r * 10;
      plumes += '<path d="M' + (x - 4) + ' ' + y + ' q4 5 8 0" stroke="' + p.motif + '" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    }
  }
  var taches = [[30, 60], [88, 62], [24, 88], [94, 90], [34, 108], [84, 110], [60, 40], [50, 30], [70, 32]].map(function (t) {
    return '<ellipse cx="' + t[0] + '" cy="' + t[1] + '" rx="2.2" ry="1.4" fill="#2b2b33" opacity=".75"/>';
  }).join('');
  return '<svg viewBox="0 0 120 150" width="104" height="130" aria-hidden="true">' +
    '<path d="M60 20 C 96 20, 108 56, 104 92 C 100 124, 82 136, 60 136 C 38 136, 20 124, 16 92 C 12 56, 24 20, 60 20 Z" fill="' + p.corps + '"/>' +
    '<path d="M20 72 C 6 92, 12 120, 36 130 C 30 108, 30 88, 20 72 Z" fill="' + p.aile + '"/><path d="M100 72 C 114 92, 108 120, 84 130 C 90 108, 90 88, 100 72 Z" fill="' + p.aile + '"/>' +
    '<ellipse cx="60" cy="100" rx="27" ry="30" fill="' + p.ventre + '"/>' + plumes + taches +
    '<circle cx="44" cy="58" r="20" fill="' + p.face + '"/><circle cx="76" cy="58" r="20" fill="' + p.face + '"/><path d="M40 40 Q60 50 80 40" stroke="' + p.aile + '" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>' +
    '<circle cx="44" cy="58" r="12.5" fill="#fffaf0"/><circle cx="76" cy="58" r="12.5" fill="#fffaf0"/>' +
    '<circle cx="45" cy="59" r="9" fill="' + p.iris + '"/><circle cx="75" cy="59" r="9" fill="' + p.iris + '"/>' +
    '<circle cx="45.5" cy="59.5" r="5.5" fill="#1d1430"/><circle cx="74.5" cy="59.5" r="5.5" fill="#1d1430"/>' +
    '<circle cx="48" cy="56" r="2.4" fill="#fff"/><circle cx="77" cy="56" r="2.4" fill="#fff"/><circle cx="43" cy="62" r="1.2" fill="#fff"/><circle cx="72" cy="62" r="1.2" fill="#fff"/>' +
    '<ellipse cx="32" cy="74" rx="6" ry="3.5" fill="#ff9fb8" opacity=".45"/><ellipse cx="88" cy="74" rx="6" ry="3.5" fill="#ff9fb8" opacity=".45"/>' +
    '<path d="M55 68 Q60 66 65 68 L60 78 Z" fill="' + p.bec + '"/>' +
    '<path d="M46 134 q-2 6 -6 8 M50 135 q0 6 -2 9 M54 135 q2 6 1 9 M66 135 q-1 6 -1 9 M70 135 q1 6 3 9 M74 134 q2 6 6 8" stroke="' + p.pattes + '" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
}
function chouetteVol() {
  var p = NEIGE;
  // aile levée, bord de fuite en festons arrondis
  function aile(sens) {
    var m = function (x) { return sens < 0 ? x : 200 - x; };
    var P = function (l) { return l.map(function (c) { return m(c[0]) + ' ' + c[1]; }); };
    var d = P([[86, 52], [70, 40], [48, 22], [30, 4], [26, 14], [28, 20], [36, 22], [32, 28], [35, 33], [44, 33], [42, 39], [47, 43], [56, 42], [56, 48], [62, 52], [70, 51], [72, 58], [79, 61], [86, 64]]);
    var chemin = 'M' + d[0];
    for (var i = 1; i < d.length; i += 3) {
      chemin += ' C ' + d[i] + ', ' + d[i + 1] + ', ' + d[i + 2];
    }
    var cv = P([[84, 54], [72, 46], [56, 32], [42, 18], [44, 30], [56, 42], [82, 60]]);
    var traits = [[[40, 22], [58, 40]], [[50, 30], [66, 46]], [[62, 40], [74, 52]]].map(function (t) {
      return '<path d="M' + m(t[0][0]) + ' ' + t[0][1] + ' L' + m(t[1][0]) + ' ' + t[1][1] + '" stroke="' + p.corps + '" stroke-width="1.4" opacity=".5" stroke-linecap="round"/>';
    }).join('');
    var mouches = [[52, 40], [40, 34], [30, 46], [44, 26], [60, 47], [34, 16]].map(function (t) {
      return '<ellipse cx="' + m(t[0]) + '" cy="' + t[1] + '" rx="2.2" ry="1.4" fill="#2b2b33" opacity=".75"/>';
    }).join('');
    return '<g class="aile ' + (sens < 0 ? 'g' : 'd') + '"><path d="' + chemin + ' Z" fill="' + p.aile + '"/><path d="M' + cv[0] + ' C ' + cv[1] + ', ' + cv[2] + ', ' + cv[3] + ' C ' + cv[4] + ', ' + cv[5] + ', ' + cv[6] + ' Z" fill="' + p.corps + '" opacity=".55"/>' + traits + mouches + '</g>';
  }
  var taches = [[94, 80], [106, 86], [100, 90], [94, 35], [106, 35]].map(function (t) {
    return '<ellipse cx="' + t[0] + '" cy="' + t[1] + '" rx="2.2" ry="1.4" fill="#2b2b33" opacity=".75"/>';
  }).join('');
  return '<svg viewBox="0 0 200 130" aria-hidden="true">' + aile(-1) + aile(1) +
    '<path d="M100 32 C 120 32, 126 52, 124 70 C 122 88, 112 96, 100 96 C 88 96, 78 88, 76 70 C 74 52, 80 32, 100 32 Z" fill="' + p.corps + '"/>' +
    '<ellipse cx="100" cy="76" rx="15" ry="17" fill="' + p.ventre + '"/>' + taches +
    '<circle cx="92" cy="50" r="11" fill="' + p.face + '"/><circle cx="108" cy="50" r="11" fill="' + p.face + '"/>' +
    '<circle cx="92" cy="50" r="7" fill="#fffaf0"/><circle cx="108" cy="50" r="7" fill="#fffaf0"/><circle cx="92.5" cy="50.5" r="5" fill="' + p.iris + '"/><circle cx="107.5" cy="50.5" r="5" fill="' + p.iris + '"/><circle cx="92.8" cy="50.8" r="3" fill="#1d1430"/><circle cx="107.2" cy="50.8" r="3" fill="#1d1430"/><circle cx="94.5" cy="49" r="1.3" fill="#fff"/><circle cx="109" cy="49" r="1.3" fill="#fff"/>' +
    '<path d="M97 56 Q100 55 103 56 L100 62 Z" fill="' + p.bec + '"/>' +
    '<path d="M92 94 l-4 10 M100 96 v10 M108 94 l4 10" stroke="' + p.aile + '" stroke-width="5" stroke-linecap="round"/>' +
    '<g class="lettre-portee" transform="translate(80 100) rotate(-6)"><rect width="40" height="26" rx="3" fill="#f4e6cf" stroke="#c9a77a" stroke-width="1.5"/><path d="M0 2 L20 15 L40 2" fill="#ead6a8" stroke="#c9a77a" stroke-width="1.5"/><circle cx="20" cy="15" r="4.5" fill="#c2385d"/></g>' +
    '<path d="M93 98 q-3 4 -1 6 M100 100 q0 4 1 6 M107 98 q3 4 1 6" stroke="' + p.pattes + '" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
}
var ENVELOPPE = '<svg viewBox="0 0 150 100" aria-hidden="true"><rect x="2" y="2" width="146" height="96" rx="6" fill="#f4e6cf" stroke="#c9a77a" stroke-width="2"/><path d="M2 8 L75 60 L148 8" fill="#ead6a8" stroke="#c9a77a" stroke-width="2"/><path d="M2 96 L58 50 M148 96 L92 50" stroke="#e0caa0" stroke-width="2"/><circle cx="75" cy="58" r="15" fill="#c2385d"/><circle cx="75" cy="58" r="11" fill="none" stroke="#ffb3c4" stroke-width="1.5"/><text x="75" y="63" text-anchor="middle" font-size="13" fill="#fff">✦</text></svg>';

// les filtres du hibou (formats, tailles) : dans la base, réglage « hibou »
function choixHibou() {
  return reglage('hibou', null) || {};
}
// court / moyen / pavé : en pages, ou en heures d'écoute pour un livre audio minuté
function tailleLivre(b) {
  if (b.page_type === 'TIME') {
    var h = (b.total_page || 0) / 3600;
    if (!h) {
      return '';
    }
    if (h < 6) {
      return 'court';
    }
    return h <= 12 ? 'moyen' : 'pave';
  }
  var p = b.total_page || 0;
  if (!p) {
    return '';
  }
  if (p < 250) {
    return 'court';
  }
  return p <= 450 ? 'moyen' : 'pave';
}
function candidatsHibou() {
  var c = choixHibou();
  var f = c.fmts || [];
  var t = c.tailles || [];
  return M.livres.filter(function (b) {
    return b.statut === 'NOT_STARTED' && !b.wishlist && (!f.length || f.indexOf(b.book_type) >= 0) && (!t.length || t.indexOf(tailleLivre(b)) >= 0);
  });
}
ACTIONS.filtreHibou = function (el) {
  var c = JSON.parse(JSON.stringify(choixHibou()));
  var l = c[el.dataset.g] || [];
  var i = l.indexOf(el.dataset.v);
  if (i >= 0) {
    l.splice(i, 1);
  } else {
    l.push(el.dataset.v);
  }
  c[el.dataset.g] = l;
  regler('hibou', c).then(function () {
    planifierSauvegarde();
    hibou.lettre = null;
    rendre();
  }).catch(erreurEcriture);
};
function attenteHibou() {
  return '<div class="hibou-attente">' + chouettePerchee() + '<div class="branche"></div><div>Le hibou attend sur sa branche.<br>Appelle-le : il t\'apportera un livre de ta PAL.</div></div>';
}
function enveloppeHibou(vole, largeur) {
  var vol = '';
  var cls = 'enveloppe-h';
  var indice = 'indice-sceau';
  if (vole) {
    vol = '<div class="hibou-vol" style="--l:' + (largeur || 340) + 'px"><div class="haut">' + chouetteVol() + '</div></div>';
  } else {
    cls += ' posee';
    indice += ' vite';
  }
  return vol + '<button class="' + cls + '" data-act="ouvrirLettre" aria-label="Ouvrir la lettre">' + ENVELOPPE + '</button><div class="' + indice + '">touche le sceau pour ouvrir la lettre</div>';
}
function lettreHibou(b) {
  var info = [];
  var fmt = FILTRES_FORMAT.filter(function (f) { return f[0] === b.book_type; })[0];
  if (fmt) {
    info.push(fmt[1].split(' ')[1]);
  }
  if (b.page_type === 'TIME' && b.total_page) {
    info.push(Math.round(b.total_page / 3600) + ' h');
  } else if (b.total_page) {
    info.push(b.total_page + ' p.');
  }
  info.push('dans ta PAL depuis ' + depuis(b.created_at));
  return '<div class="lettre-h"><span class="sceau-l">✦</span><div class="ecrit">Chère lectrice,</div><div class="contenu">' + cover(b) + '<div><div class="info-l">le destin te propose</div><div class="titre-l">' + esc(titreTranche(b)) + '</div><div class="info-l">' + esc((b.authors || []).join(', ')) + '</div><div class="info-l">' + esc(info.join(' · ')) + '</div></div></div></div>';
}
function basHibou(n) {
  if (hibou.lettre && hibou.ouverte && M.parId[hibou.lettre]) {
    var b = M.parId[hibou.lettre];
    return '<div class="pari-tirage">' + boutonPari(b) + '</div><div class="row" style="margin-top:8px"><button class="act doux" data-act="livre" data-id="' + b.id + '">' + ic('book-open') + ' Voir le livre</button><button class="act doux" data-act="appelerHibou">' + ic('refresh-cw') + ' Autre lettre</button></div>';
  }
  if (hibou.lettre) {
    return '';
  }
  return '<div class="row" style="margin-top:8px"><button class="act" data-act="appelerHibou"' + (n ? '' : ' disabled') + '>🦉 Appeler le hibou</button></div>';
}
function sceneHibou(vole, largeur) {
  if (!hibou.lettre || !M.parId[hibou.lettre]) {
    return attenteHibou();
  }
  if (!hibou.ouverte) {
    return enveloppeHibou(vole, largeur);
  }
  return lettreHibou(M.parId[hibou.lettre]);
}
function carteHibou() {
  var c = choixHibou();
  function groupe(g, liste) {
    return liste.map(function (x) {
      var cls = 'chip';
      if ((c[g] || []).indexOf(x[0]) >= 0) {
        cls += ' on';
      }
      return '<button class="' + cls + '" data-act="filtreHibou" data-g="' + g + '" data-v="' + x[0] + '">' + x[1] + '</button>';
    }).join('');
  }
  var n = candidatsHibou().length;
  var compte = '✨ ' + n + ' livre' + (n > 1 ? 's' : '') + ' de ta PAL correspond' + (n > 1 ? 'ent' : '') + ' · aucun filtre coché = tous';
  if (!n) {
    compte = 'Aucun livre de ta PAL ne correspond : enlève un filtre.';
  }
  var corps = '<div class="filtres-hibou">' + groupe('fmts', FILTRES_FORMAT) + groupe('tailles', FILTRES_TAILLE) + '</div><div class="compte-hibou">' + compte + '</div>' +
    '<div class="hibou-scene" id="hibouScene">' + sceneHibou(false) + '</div><div class="bas-hibou" id="hibouBas">' + basHibou(n) + '</div>';
  return card('Le courrier du hibou', corps, 'il t\'apporte un livre de ta PAL');
}
function majHibou(vole) {
  var s = document.getElementById('hibouScene');
  var bas = document.getElementById('hibouBas');
  if (s) {
    s.innerHTML = sceneHibou(vole, s.clientWidth);
  }
  if (bas) {
    bas.innerHTML = basHibou(candidatsHibou().length);
  }
}
ACTIONS.appelerHibou = function () {
  var l = candidatsHibou();

    var sessions = (M.sessions || []).filter(function (s) { return compte(s.book) && annee(s.debut) === y; });

    d.jours = joursAn.length;

    d.noteMoy = moy(fin.filter(function (r) { return r.star; }).map(function (r) { return r.star; }));
    // nouvelles plumes : auteur·ices jamais lu·es avant cette année
    var vus = {};
    toutes.filter(function (r) { return annee(r.end) < y; }).forEach(function (r) { (r.book.authors || []).forEach(function (a) { vus[a] = 1; }); });

function etoilesCourtes(s) {

// les Grimoires d'or : [emoji, catégorie, gagnant·e, précision, lecture (pour la couverture)]
function prixBilan(d, nouvelles) {

  var prix = [];
  if (!fin.length) {

  }
  var cit = {};

  var classes = fin.slice().sort(function (a, b) {

  });
  // chaque prix va de préférence à un livre (ou une plume) qui n'a encore rien gagné
  var livresPris = {};
  var plumesPrises = {};
  function libre(r) {
    return !livresPris[r.book.id];
  }
  function prendre(r) {
    livresPris[r.book.id] = 1;
  }
  var top = classes[0];
  if (top.star) {
    prix.push(['🏆', 'Livre de l\'année', titreTranche(top.book), (top.book.authors || []).join(', ') + ' · ' + etoilesCourtes(top.star), top]);
    prendre(top);
  }

  var a1 = Object.keys(au).sort(function (a, b) { return au[b].length - au[a].length || moy(au[b].map(function (r) { return r.star || 0; })) - moy(au[a].map(function (r) { return r.star || 0; })); })[0];
  if (a1 && au[a1].length >= 2) {
    prix.push(['✒️', 'Plume de l\'année', a1, au[a1].length + ' livres lus', au[a1].filter(libre)[0] || au[a1][0]]);

  fin.forEach(function (r) { Object.keys(r.book.series_memberships || {}).forEach(function (k) { (se[k] = se[k] || []).push(r); }); });

    var tomesLus = se[s1].slice().sort(function (a, b) { return ((a.book.series_memberships[s1] || {}).number || 0) - ((b.book.series_memberships[s1] || {}).number || 0); });
    prix.push(['🗝️', 'Série dévorée', (M.series[s1] || {}).name || 'Série', info, tomesLus[0], tomesLus]);
  }

  var revs = fin.filter(function (r) { return (r.star || 0) >= 4.5 && (r.book.authors || []).length && (r.book.authors || []).every(function (a) { return nouvelles[a]; }); }).sort(function (a, b) { return b.star - a.star; });
  var rev = revs.filter(function (r) { return libre(r) && !(r.book.authors || []).some(function (a) { return plumesPrises[a]; }); })[0];
  if (rev) {

  var eclairs = fin.filter(function (r) { return r.start && r.end > r.start && pagesLecture(r) >= 150; }).map(function (r) { return {r: r, j: Math.max(1, Math.round((r.end - r.start) / DAY))}; }).sort(function (a, b) { return a.j - b.j; });
  var eclair = eclairs.filter(function (x) { return libre(x.r); })[0] || eclairs[0];
  if (eclair && eclair.j <= 7) {
    prix.push(['⚡', 'Lecture éclair', titreTranche(eclair.r.book), pagesLecture(eclair.r) + ' pages en ' + eclair.j + ' jour' + (eclair.j > 1 ? 's' : ''), eclair.r]);
    prendre(eclair.r);

  }

    d.mois.forEach(function (n, i) { if (n === d.moisMax) { ms.push(MOIS_LONGS[i]); } });
    var nom = ms.length > 1 ? ms.slice(0, -1).join(', ') + ' et ' + ms[ms.length - 1] : ms[0];

// le portrait de lectrice : [emoji, trait, précision]
function portraitBilan(d, sessions, joursAn) {

  }

  var h = heures.indexOf(Math.max.apply(null, heures));
  if (Math.max.apply(null, heures) > 0) {

      moment = ['☀️', 'Lectrice du matin'];
    } else if (h >= 12 && h < 18) {
      moment = ['🍵', 'Lectrice de l\'après-midi'];
    } else if (h >= 18 && h < 23) {
      moment = ['🌙', 'Lectrice du soir'];
    }
    traits.push([moment[0], moment[1], 'ton heure préférée : ' + h + ' h']);
  }
  var js = new Array(7).fill(0);
  joursAn.forEach(function (k) { js[new Date(k + 'T12:00:00').getDay()]++; });
  if (joursAn.length) {
    var j = js.indexOf(Math.max.apply(null, js));
    traits.push(['💫', 'Le ' + JOURS_SEMAINE[j], 'ton jour de lecture favori']);
  }
  var gr = {};
  d.fin.forEach(function (r) {
    var t = tagsDe(r.book);

  });
  var g1 = Object.keys(gr).sort(function (a, b) { return gr[b] - gr[a]; })[0];
  if (g1 && PROFILS_GENRE[g1]) {

function phaseLune(n, max) {
  if (!n) {

// la lune d'un mois : d'après les heures de lecture minutées, ou les livres finis si l'année n'a aucune session
function phaseLuneMois(d, i) {

// 12 h, 3,5 h : une décimale seulement sous 10 h
function heuresCourtes(h) {
  return nombre(h >= 10 ? Math.round(h) : round(h, 1));

// « 12 h · 3 📚 » sous la lune
function texteLune(d, i) {
  var h = d.heuresMois[i];
  var n = d.mois[i];
  if (!h && !n) {
    return '—';
  }
  var t = [];
  if (d.heuresMax > 0) {
    t.push(heuresCourtes(h) + ' h');
  }
  if (n) {
    t.push(n + ' 📚');

  return t.join(' · ');
}

// la petite couverture d'un prix (le titre reste visible si l'image ne charge pas)
// ce que l'année a coûté : les achats datés de l'année (un cadeau n'est pas une dépense : compté à part)
function coutBilan(y) {
  var c = {total: 0, n: 0, avant: 0, nAvant: 0, neuf: {total: 0, n: 0}, occasion: {total: 0, n: 0}, cadeaux: {n: 0, valeur: 0}, achats: [], reventes: {n: 0, total: 0}};
  M.livres.filter(compte).forEach(function (b) {
    // les reventes de l'année (datées du jour de la revente)
    if (b.revente && annee(b.revente.date || b.created_at) === y) {
      c.reventes.n++;
      c.reventes.total += b.revente.prix || 0;
    }
    (b.purchases || []).forEach(function (p) {
      var an = annee(p.purchased_at || p.created_at);
      if (p.cadeau) {
        if (an === y) {
          c.cadeaux.n++;
          c.cadeaux.valeur += p.price || 0;
        }
        return;
      }
      if (!p.price) {
        return;
      }
      if (an === y - 1) {
        c.avant += p.price;
        c.nAvant++;
      }
      if (an !== y) {
        return;
      }
      c.total += p.price;
      c.n++;
      c.achats.push({b: b, prix: p.price, etat: p.etat});
      if (p.etat === 'neuf' || p.etat === 'occasion') {
        c[p.etat].total += p.price;
        c[p.etat].n++;
      }
    });
  });
  c.achats.sort(function (a, b) { return b.prix - a.prix; });

}

}
// la carte « Ton coût » : le total, neuf / occasion / cadeaux, le plus cher et la bonne affaire
function carteCoutBilan(co, y) {

    if (co.n > 1) {
      s = 's';
    }
    var ecart = '';
    if (co.nAvant) {
      var diff = Math.round(co.total - co.avant);
      if (diff > 0) {
        ecart = ' · ' + diff + ' € de plus qu\'en ' + (y - 1);
      } else if (diff < 0) {
        ecart = ' · ' + (-diff) + ' € de moins qu\'en ' + (y - 1);
      } else {
        ecart = ' · autant qu\'en ' + (y - 1);
      }
    }
    h += '<div class="bl-cout"><b>' + euros(co.total) + '</b><span>pour ' + co.n + ' livre' + s + ' acheté' + s + ecart + '</span></div>';
  }
  if (co.reventes.n) {
    var sr = '';
    if (co.reventes.n > 1) {
      sr = 's';
    }
    h += '<p class="small" style="text-align:center;margin:6px 0 0">💸 ' + co.reventes.n + ' livre' + sr + ' revendu' + sr + ' · <b>' + euros(co.reventes.total) + '</b> récupérés · coût réel <b>' + euros(co.total - co.reventes.total) + '</b></p>';
  }
  var tuiles = [];
  [['neuf', '✨', 'neuf', 'neufs'], ['occasion', '♻️', 'd\'occasion', 'd\'occasion']].forEach(function (e) {
    var x = co[e[0]];
    if (x.n) {
      var nom = e[2];
      if (x.n > 1) {
        nom = e[3];
      }
      tuiles.push([e[1], euros(x.total), x.n + ' ' + nom + ' · ' + prix(x.total / x.n, 'EUR') + ' en moyenne']);
    }
  });
  if (co.cadeaux.n) {
    var offerts = 'offert';
    if (co.cadeaux.n > 1) {
      offerts = 'offerts';
    }
    if (co.cadeaux.valeur) {
      offerts += ' · valeur ' + euros(co.cadeaux.valeur);
    }
    tuiles.push(['🎁', String(co.cadeaux.n), offerts]);
  }
  if (tuiles.length) {
    h += '<div class="bl-chiffres" style="grid-template-columns:repeat(' + tuiles.length + ',1fr);margin:12px 0 4px">' + tuiles.map(function (k) {
      return '<div class="bl-chiffre"><div class="e">' + k[0] + '</div><b>' + k[1] + '</b><span>' + k[2] + '</span></div>';
    }).join('') + '</div>';
  }
  if (co.achats.length >= 2) {
    var extremes = [['💎', 'Le plus cher', co.achats[0]], ['🍀', 'La bonne affaire', co.achats[co.achats.length - 1]]];
    h += '<div style="margin-top:12px">' + extremes.map(function (x) {
      var etat = '';
      if (x[2].etat === 'occasion') {
        etat = ' · d\'occasion';
      } else if (x[2].etat === 'neuf') {
        etat = ' · neuf';
      }
      return '<button class="bl-prix" data-act="livre" data-id="' + x[2].b.id + '"><span class="trophee">' + x[0] + '</span><span style="flex:1;min-width:0"><span class="cat">' + x[1] + '</span><span class="gagnant" style="display:block">' + esc(titre(x[2].b)) + '</span><span class="small muted">' + prix(x[2].prix, 'EUR') + etat + '</span></span>' + couvPrix(x[2].b) + '</button>';
    }).join('') + '</div>';
  }
  return card('Ton coût ' + y, h, 'les cadeaux ne comptent pas dans les dépenses');
}
function couvPrix(b, style) {
  var img = '';
  if (b.image && /^(https?|blob):/.test(b.image)) {
    img = '<img loading="lazy" src="' + esc(b.image) + '" alt="" onerror="this.remove()">';
  }
  return '<span class="bl-couv"' + (style ? ' style="' + style + '"' : '') + '>' + esc(titreTranche(b)) + img + '</span>';
}

// ---------- la page ----------
function vBilan() {
  return avec('bilan', vBilanCorps);
}
function vBilanCorps() {
  var ans = {};
  finies().forEach(function (r) { ans[annee(r.end)] = 1; });
  ans[new Date().getFullYear()] = 1;
  var liste = Object.keys(ans).sort().reverse();
  if (!anBilan || !ans[anBilan]) {
    anBilan = liste[0];
  }
  var y = parseInt(anBilan, 10);
  var d = donneesBilan(y);
  var choix = '<select data-chg="anBilan">' + liste.map(function (a) {
    return '<option' + (String(a) === String(anBilan) ? ' selected' : '') + '>' + a + '</option>';
  }).join('') + '</select>';

  // héros : l'année, le nombre de livres, des pastilles positives
  var pastilles = [];
  if (d.record) {
    pastilles.push('<span class="or">🏆 ton record</span>');
  }
  if (d.n > d.precedent && d.precedent) {
    pastilles.push('<span>+' + (d.n - d.precedent) + ' par rapport à ' + (y - 1) + '</span>');
  }
  var obj = objectifAnnee(y);
  if (obj.livres && d.n >= obj.livres) {
    pastilles.push('<span class="or">🎯 objectif atteint</span>');
  }
  if (!pastilles.length && d.jours) {
    pastilles.push('<span>' + d.jours + ' jours de lecture</span>');
  }
  var gros = '<div class="gros">' + d.n + ' <small>livre' + (d.n > 1 ? 's' : '') + '</small></div>';
  if (!d.n) {
    gros = '<div class="sous" style="margin-top:10px">Pas encore de livre fini cette année : la suite s\'écrit maintenant 💫</div>';
  }
  var h = '<div class="bl-heros">' + choix + '<div class="script">Ton année</div><div class="an">' + y + '</div>' + gros + '<div class="bl-pastilles">' + pastilles.join('') + '</div>' +
    (d.n ? '<button class="act" data-act="wrapped" data-an="' + y + '">' + ic('sparkles') + ' Revivre mon année en stories</button>' : '') + '</div>' + noteExclus('bilan');
  if (!d.n) {
    return h;
  }

  // chiffres clés
  var heures = d.secMinuteur || d.secAudio;
  var chiffres = [['📖', nombreFr(d.pages), 'pages']];
  if (heures) {
    chiffres.push(['⏱️', Math.round(heures / 3600) + ' h', d.secMinuteur ? 'au minuteur' : 'd\'écoute']);
  }
  chiffres.push(['📅', d.jours, 'jours de lecture'], ['🔥', d.serie + ' j', 'plus belle série'], ['✒️', d.nouvellesPlumes, 'nouvelles plumes']);
  if (d.noteMoy) {
    chiffres.push(['⭐', String(round(d.noteMoy, 1)).replace('.', ','), 'note moyenne']);
  }
  h += card('Tes chiffres', '<div class="bl-chiffres">' + chiffres.map(function (k) {
    return '<div class="bl-chiffre"><div class="e">' + k[0] + '</div><b>' + k[1] + '</b><span>' + k[2] + '</span></div>';
  }).join('') + '</div>');

  h += carteCoutBilan(d.cout, y);

  // les Grimoires d'or
  if (d.prix.length) {
    h += card('Les Grimoires d\'or ' + y, d.prix.map(function (p) {
      var c = '';
      var attr = '';
      if (p[5] && p[5].length > 1) {
        // une série : les tomes de l'année en pile, légèrement en éventail
        var pile = p[5].slice(0, 5);
        c = '<span class="bl-pile" style="width:' + (44 + (pile.length - 1) * 14) + 'px">' + pile.map(function (r, k) {
          var angle = pile.length > 1 ? -6 + 12 * k / (pile.length - 1) : 0;
          return couvPrix(r.book, 'left:' + (k * 14) + 'px;z-index:' + (k + 1) + ';transform:rotate(' + angle.toFixed(1) + 'deg)');
        }).join('') + '</span>';
        attr = ' data-act="livre" data-id="' + p[4].book.id + '"';
      } else if (p[4]) {
        c = couvPrix(p[4].book, '');
        attr = ' data-act="livre" data-id="' + p[4].book.id + '"';
      }
      return '<button class="bl-prix"' + attr + '><span class="trophee">' + p[0] + '</span><span style="flex:1;min-width:0"><span class="cat">' + esc(p[1]) + '</span><span class="gagnant" style="display:block">' + esc(p[2]) + '</span><span class="small muted">' + esc(p[3]) + '</span></span>' + c + '</button>';
    }).join(''), 'les gagnants de ton année, catégorie par catégorie');
  }

  // les lunes de lecture
  var sousLunes = 'plus la lune est pleine, plus le mois a été livresque · touche un mois';
  if (d.heuresMax > 0) {
    sousLunes = 'plus la lune est pleine, plus tu as lu longtemps · 📚 livres finis · touche un mois';
  }
  h += card('Tes lunes de lecture', '<div class="bl-lunes">' + d.mois.map(function (n, i) {
    var lune = phaseLuneMois(d, i);
    var cls = 'bl-lune';
    if (lune.top) {
      cls += ' top';
    }
    return '<button class="' + cls + '" data-act="moisBilan" data-m="' + i + '"><span class="l" style="font-size:' + (22 + lune.ph * 5) + 'px">' + LUNES[lune.ph] + '</span><small>' + MOIS[i] + '</small><small>' + texteLune(d, i) + '</small></button>';
  }).join('') + '</div>', sousLunes);

  // portrait
  if (d.portrait.length) {
    h += card('Toi, lectrice', '<div class="bl-portrait">' + d.portrait.map(function (t) {
      return '<div class="bl-trait"><div class="e">' + t[0] + '</div><b>' + esc(t[1]) + '</b><span>' + esc(t[2]) + '</span></div>';
    }).join('') + '</div>');
  }

  // toutes tes années
  var annees = Object.keys(d.parAn).map(Number).sort();
  var max = Math.max.apply(null, annees.map(function (a) { return d.parAn[a]; }));
  var recordAn = annees.filter(function (a) { return d.parAn[a] === max; })[0];
  var phrase = '';
  if (d.record) {
    phrase = '🏆 <b>' + y + ', ton record</b> : ' + (d.n - d.meilleurAutre) + ' livre' + (d.n - d.meilleurAutre > 1 ? 's' : '') + ' de plus que ton meilleur score d\'avant.';
  } else {
    phrase = '🏆 Ton record : <b>' + max + ' livres</b> en ' + recordAn + '.';
  }
  h += card('Toutes tes années', '<div class="bl-annees">' + annees.map(function (a) {
    var cls = 'bl-annee';
    if (a === y) {
      cls += ' choisie';
    }
    if (d.parAn[a] === max) {
      cls += ' record';
    }
    return '<button class="' + cls + '" data-act="anneeBilan" data-an="' + a + '"><i style="height:' + Math.max(4, Math.round(100 * d.parAn[a] / max)) + 'px"></i>' + String(a).slice(2) + '<br>' + d.parAn[a] + '</button>';
  }).join('') + '</div><p class="small" style="margin:8px 0 0">' + phrase + '</p>', 'touche une année pour la revoir');

  // l'étagère de l'année
  h += card('Ton étagère ' + y, '<div class="covers">' + d.fin.map(function (r) { return '<div title="' + esc(titre(r.book)) + ' · ' + fdate(r.end) + '" data-act="livre" data-id="' + r.book.id + '">' + cover(r.book) + '</div>'; }).join('') + '</div>', 'dans l\'ordre de lecture');
  return h;
}
ACTIONS.anBilan = function (el) {
  anBilan = el.value;
  rendre();
};
ACTIONS.anneeBilan = function (el) {
  anBilan = el.dataset.an;
  rendre();
  window.scrollTo(0, 0);
};
ACTIONS.moisBilan = function (el) {
  var d = donneesBilan(parseInt(anBilan, 10));
  var m = parseInt(el.dataset.m, 10);
  var l = d.livresMois[m];
  var corps = '<p class="muted">Pas de livre fini ce mois-là.</p>';
  if (l.length) {
    corps = l.map(function (r) { return ligneLivre(r.book, 'fini le ' + fdate(r.end), 'data-act="livre" data-id="' + r.book.id + '"'); }).join('');
  }
  var resume = l.length + ' livre' + (l.length > 1 ? 's' : '') + ' fini' + (l.length > 1 ? 's' : '');
  if (d.heuresMax > 0) {
    resume = heuresCourtes(d.heuresMois[m]) + ' h de lecture minutée · ' + resume;
  }
  ouvrirFeuille('<h3>' + LUNES[phaseLuneMois(d, m).ph] + ' ' + MOIS_LONGS[m].charAt(0).toUpperCase() + MOIS_LONGS[m].slice(1) + ' ' + d.y + '</h3><p class="small muted">' + resume + '</p>' + corps);
};
</script>

<script>
// ---------- Bilan façon « Wrapped » : stories plein écran ----------
var story = {slides: [], i: 0, minuteur: null};
var FONDS = [
  'linear-gradient(160deg,#f7a8c9,#a78bfa)',
  'linear-gradient(160deg,#c084fc,#f472b6)',
  'linear-gradient(160deg,#fbbf8a,#f472b6)',
  'linear-gradient(160deg,#818cf8,#c084fc)',
  'linear-gradient(160deg,#5eead4,#818cf8)',
  'linear-gradient(160deg,#f472b6,#fb923c)',
  'linear-gradient(160deg,#312e81,#9d4edd)',
  'linear-gradient(160deg,#fda4af,#c4b5fd)',
  'linear-gradient(160deg,#1e1b4b,#be185d)',
  'linear-gradient(160deg,#a78bfa,#f9a8d4)'
];

function slidesAnnee(y) {
  return avec('bilan', function () {
    return slidesAnneeCorps(y);
  });
}
function slidesAnneeCorps(y) {
  var d = donneesBilan(y);
  var s = [];
  s.push('<div class="moon" style="font-size:54px">☾</div><div class="script">Ton année</div><div class="gros">' + y + '</div><div class="sous">en lecture ✨</div>');
  if (!d.n) {
    s.push('<div class="titre">Pas encore de livre fini cette année…</div><div class="sous">La suite s\'écrit maintenant 💫</div>');
    return s;
  }
  // le grand chiffre
  var record = '';
  if (d.record) {
    record = '<div class="st-badge">🏆 ton record !</div>';
  }
  var heures = d.secMinuteur || d.secAudio;
  var detail = nombreFr(d.pages) + ' pages tournées';
  if (heures) {
    detail += '<br>' + Math.round(heures / 3600) + ' h de lecture';
  }
  s.push('<div class="sous">Tu as refermé</div><div class="gros">' + d.n + '</div><div class="titre">livres</div>' + record + '<div class="sous">' + detail + '</div>');
  // les lunes
  var lunes = d.mois.map(function (n, i) {
    var ph = phaseLuneMois(d, i).ph;
    var lib = MOIS[i];
    if (d.heuresMax > 0 && d.heuresMois[i]) {
      lib += ' · ' + heuresCourtes(d.heuresMois[i]) + ' h';
    }
    return '<div class="st-lune" style="animation-delay:' + (0.3 + i * 0.12).toFixed(2) + 's"><span style="font-size:' + (24 + ph * 6) + 'px">' + LUNES[ph] + '</span><small>' + lib + '</small></div>';
  }).join('');
  var prixMois = d.prix.filter(function (p) { return p[1] === 'Mois le plus livresque'; })[0];
  s.push('<div class="script">Tes lunes de lecture</div><div class="st-lunes">' + lunes + '</div>' + (prixMois ? '<div class="sous">👑 ' + esc(prixMois[2]) + ' : ' + esc(prixMois[3]) + '</div>' : ''));
  // les Grimoires d'or : le livre de l'année en grand, puis les autres prix deux par deux
  var prix = d.prix.filter(function (p) { return p[1] !== 'Mois le plus livresque'; });
  var livre = prix.filter(function (p) { return p[1] === 'Livre de l\'année'; })[0];
  if (livre) {
    var img = '';
    if (livre[4].book.image) {
      img = '<img class="cv" src="' + esc(livre[4].book.image) + '" alt="">';
    }
    s.push('<div class="st-badge">🏆 Grimoire d\'or</div><div class="sous">Ton livre de l\'année</div>' + img + '<div class="titre">' + esc(livre[2]) + '</div><div class="sous">' + esc(livre[3]) + '</div>');
  }
  var autres = prix.filter(function (p) { return p !== livre; });
  for (var i = 0; i < autres.length && i < 6; i += 2) {
    s.push('<div class="script">Les Grimoires d\'or</div>' + autres.slice(i, i + 2).map(function (p) {
      // la série : ses tomes de l'année en éventail
      var pile = '';
      if (p[5] && p[5].length > 1) {
        var l = p[5].filter(function (r) { return r.book.image; }).slice(0, 5);
        pile = '<div class="st-pile">' + l.map(function (r, k) {
          var angle = l.length > 1 ? -14 + 28 * k / (l.length - 1) : 0;
          return '<img src="' + esc(r.book.image) + '" alt="" onerror="this.remove()" style="--r:' + angle.toFixed(1) + 'deg;animation-delay:' + (0.4 + k * 0.15).toFixed(2) + 's;z-index:' + (k + 1) + '">';
        }).join('') + '</div>';
      }
      return '<div class="st-prix"><div class="st-cat">' + p[0] + ' ' + esc(p[1]) + '</div>' + pile + '<div class="titre" style="font-size:26px">' + esc(p[2]) + '</div><div class="sous">' + esc(p[3]) + '</div></div>';
    }).join(''));
  }
  // le portrait
  if (d.portrait.length) {
    s.push('<div class="script">Toi, lectrice</div><div class="st-traits">' + d.portrait.map(function (t, k) {
      return '<div class="st-trait" style="animation-delay:' + (0.3 + k * 0.35).toFixed(2) + 's"><span>' + t[0] + '</span><b>' + esc(t[1]) + '</b><small>' + esc(t[2]) + '</small></div>';
    }).join('') + '</div>');
  }
  // toutes les années
  var annees = Object.keys(d.parAn).map(Number).sort();
  if (annees.length > 1) {
    var max = Math.max.apply(null, annees.map(function (a) { return d.parAn[a]; }));
    var barres = annees.map(function (a, k) {
      var cls = 'st-an';
      if (d.parAn[a] === max) {
        cls += ' rec';
      }
      if (a === y) {
        cls += ' ici';
      }
      return '<div class="' + cls + '"><i style="height:' + Math.max(6, Math.round(150 * d.parAn[a] / max)) + 'px;animation-delay:' + (0.3 + k * 0.1).toFixed(2) + 's"></i>' + String(a).slice(2) + '<br><b>' + d.parAn[a] + '</b></div>';
    }).join('');
    var mot = d.record ? '🏆 ' + y + ', ton record !' : 'ton record reste ' + max + ' livres';
    s.push('<div class="script">Toutes tes années</div><div class="st-annees">' + barres + '</div><div class="sous">' + mot + '</div>');
  }
  if (d.citation) {
    var c = d.citation;
    var src = '';
    if (c.book) {
      src = '— ' + esc(titre(c.book));
    }
    s.push('<div class="sous">Une phrase que tu as gardée</div><div class="quote" style="color:#fff;font-size:22px;max-width:340px">' + esc(c.texte.slice(0, 280)) + '</div><div class="sous">' + src + '</div>');
  }
  var couv = d.fin.filter(function (r) { return r.book.image; }).slice(-20).map(function (r) { return '<img src="' + esc(r.book.image) + '" alt="">'; }).join('');
  var n = niveau();
  s.push('<div class="script">Ton étagère ' + y + '</div><div class="mosaique">' + couv + '</div><div class="sous">Tu es ' + n.n[1] + ' <b>' + n.n[2] + '</b><br>À l\'année prochaine, belle lectrice ✨</div>');
  return s;
}

function paillettes() {
  var h = '';
  for (var i = 0; i < 14; i++) {
    var c = '✦';
    if (i % 3 === 0) {
      c = '✧';
    }
    h += '<i style="left:' + ((i * 37) % 95) + '%;top:' + ((i * 53) % 92) + '%;font-size:' + (8 + (i % 4) * 4) + 'px;animation-delay:' + (i % 5) * 0.4 + 's">' + c + '</i>';
  }
  return '<div class="paillettes">' + h + '</div>';
}

function afficherStory() {
  var el = document.getElementById('story');
  if (!el) {
    return;
  }
  clearTimeout(story.minuteur);
  var barres = story.slides.map(function (x, k) {
    var cls = '';
    if (k < story.i) {
      cls = 'fait';
    } else if (k === story.i) {
      cls = 'cours';
    }
    return '<i class="' + cls + '"><b></b></i>';
  }).join('');
  el.style.background = FONDS[story.i % FONDS.length];
  el.innerHTML = '<div class="bars">' + barres + '</div><button class="x" data-act="fermerStory" aria-label="Fermer">' + ic('x') + '</button>' + paillettes() + '<div class="slide">' + story.slides[story.i] + '</div>';
  story.minuteur = setTimeout(function () { avancerStory(1); }, 6000);
}
function avancerStory(pas) {
  var i = story.i + pas;
  if (i < 0) {
    i = 0;
  }
  if (i >= story.slides.length) {
    ACTIONS.fermerStory();
    return;
  }
  story.i = i;
  afficherStory();
}
ACTIONS.wrapped = function (el) {
  story.slides = slidesAnnee(parseInt(el.dataset.an, 10));
  story.i = 0;
  var d = document.createElement('div');
  d.className = 'story';
  d.id = 'story';
  d.addEventListener('click', function (e) {
    if (e.target.closest('[data-act]')) {
      return;
    }
    if (e.clientX < window.innerWidth / 3) {
      avancerStory(-1);
    } else {
      avancerStory(1);
    }
  });
  document.body.appendChild(d);
  afficherStory();
};
ACTIONS.fermerStory = function () {
  clearTimeout(story.minuteur);
  var el = document.getElementById('story');
  if (el) {
    el.remove();
  }
};
</script>

// dimanche de Pâques (calcul grégorien)
function paquesDe(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  var h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  var l = (32 + 2 * e + 2 * i - h - k) % 7;
  var m = Math.floor((a + 11 * h + 22 * l) / 451);
  var mois = Math.floor((h + l - 7 * m + 114) / 31);
  var jour = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mois - 1, jour);
}
// la lune est-elle pleine ce jour-là ? (à environ un jour près)
function pleineLune(d) {
  var ref = Date.UTC(2000, 0, 6, 18, 14);
  var lunaison = 29.530588853;
  var midi = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTime();
  var phase = (((midi - ref) / DAY / lunaison) % 1 + 1) % 1;
  return Math.abs(phase - 0.5) < 0.5 / lunaison;
}
function feteDuJour(d) {
  var m = d.getMonth() + 1, j = d.getDate(), y = d.getFullYear();
  if ((m === 12 && j >= 27) || (m === 1 && j <= 3)) {
    return 'nouvelan';
  }
  if (m === 12) {
    return 'noel';
  }
  if ((m === 10 && j >= 25) || (m === 11 && j === 1)) {
    return 'halloween';
  }
  if (m === 2 && j >= 10 && j <= 14) {
    return 'valentin';
  }
  if (m === 2 && j === 2) {
    return 'chandeleur';
  }
  var p = paquesDe(y).getTime();
  var t = new Date(y, m - 1, j).getTime();
  if (t >= p - 3 * DAY && t <= p + DAY) {
    return 'paques';
  }
  if (m === 4 && j === 1) {
    return 'poisson';
  }
  if (m === 4 && j === 23) {
    return 'livre';
  }
  if (m === 6 && j === 21) {
    return 'musique';
  }
  if (m === 8 && j === 8) {
    return 'chat';
  }
  if (m === 8 && j >= 10 && j <= 13) {
    return 'etoiles';
  }
  if (j === 13 && d.getDay() === 5) {
    return 'vendredi13';
  }
  if (pleineLune(d)) {
    return 'pleinelune';
  }
  if (m === 9 && j <= 15) {
    return 'rentree';
  }
  if (m === 10) {
    return 'imaginaire';
  }
  var md = m * 100 + j;
  if (md >= 320 && md <= 620) {
    return 'printemps';
  }
  if (md >= 621 && md <= 922) {
    return 'ete';
  }
  if (md >= 923 && md <= 1220) {
    return 'automne';
  }
  return 'hiver';
}

var THEMES = [['fetes', 'sparkles', 'Au fil de l\'année'], ['auto', 'sun-moon', 'Clair ou sombre (selon le téléphone)'], ['light', 'flower-2', 'Rose féerique'], ['dark', 'moon', 'Nuit enchantée'], ['autumn', 'leaf', 'Automne cosy']];
var feteActive = null;
