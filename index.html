// construit les écritures d'un livre : auteurs, série et genres nouveaux, photo, puis le livre
function opsLivre(f) {
  var ops = [];
  var base = {};
  if (f.id && D.livres[f.id]) {
    base = Object.assign({}, D.livres[f.id]);
  } else {
    base = {id: nouvelId(), origine: 'appli', exclusions: {}};
  }
  var crees = {};
  var contributeurs = [];
  f.contributeurs.forEach(function (c) {
    var aid = c.auteurId;
    if (!aid || !D.auteurs[aid]) {
      var exist = auteurParNom(c.nom);
      if (exist) {
        aid = exist.id;
      } else if (crees[slug(c.nom)]) {
        aid = crees[slug(c.nom)];
      } else {
        aid = 'a:' + slug(c.nom);
        if (D.auteurs[aid]) {
          aid = nouvelId();
        }
        crees[slug(c.nom)] = aid;
        ops.push({t: 'auteurs', o: {id: aid, nom: c.nom, tri: slug(c.nom.split(' ').pop())}});
      }
    }
    if (!contributeurs.some(function (x) { return x.auteurId === aid && x.role === c.role; })) {
      contributeurs.push({auteurId: aid, role: c.role});
    }
  });
  var serieId = '';
  if (f.serieNom) {
    var s = serieParNom(f.serieNom);
    if (s) {
      serieId = s.id;
    } else {
      serieId = nouvelId();
      ops.push({t: 'series', o: {id: serieId, nom: f.serieNom, statut: 'en_cours', nbTomes: null}});
    }
  }
  var genreIds = f.genres.map(function (nom) {
    var g = genreParNom(nom);
    if (g) {
      return g.id;
    }
    var gid = idGenre(nom);
    if (D.genres[gid]) {
      gid = nouvelId();
    }
    ops.push({t: 'genres', o: {id: gid, nom: nom, emoji: '', couleur: '', ordre: valeurs(D.genres).length + ops.length}});
    return gid;
  });
  var couverture = f.couverture || '';
  if (f.photo) {
    couverture = 'p:' + nouvelId();
    ops.push({t: 'photos', o: {id: couverture, blob: f.photo, type: 'image/jpeg', origine: 'appli'}});
  }
  if (/^p:/.test(base.couverture || '') && base.couverture !== couverture) {
    ops.push({t: 'photos', suppr: base.couverture});
  }
  var isbn = isbn13(f.isbn);
  var isbns = (base.isbns || []).filter(function (x) { return x !== isbn; });
  if (isbn) {
    isbns.unshift(isbn);
  }
  var livre = Object.assign(base, {
    titre: f.titre,
    contributeurs: contributeurs,
    serieId: serieId,
    tome: serieId ? f.tome : null,
    format: f.format || 'papier',
    unite: f.unite || 'pages',
    total: f.total || 0,
    possession: f.possession || '',
    isbns: isbns,
    editeur: f.editeur || '',
    annee: f.annee || null,
    langue: f.langue || '',
    genreIds: genreIds,
    etagereIds: f.etagereIds || [],
    couverture: couverture,
    resume: f.resume || ''
  });
  ops.push({t: 'livres', o: livre});
  return {ops: ops, livre: livre};
}

// ---------- auteurs : renommer, fusionner les doublons ----------
function livresDeLAuteur(aid) {

}
ACTIONS.auteurs = function () {

      '<label>Fusionner avec (doublon)</label>' + champ('auCible', '', 'list="dlAuCible" placeholder="Nom de l\'autre fiche" autocomplete="off"') + listeDeChoix('dlAuCible', valeurs(D.auteurs).filter(function (x) { return x.id !== aid; }).map(function (x) { return x.nom; })) +
      '<p class="small muted">En fusionnant, ses livres passent sur l\'autre fiche, puis celle-ci disparaît.</p>' +
      '<div class="row" style="margin-top:12px"><button class="act" data-act="auEnregistrer">💾 Enregistrer</button><button class="act doux" data-act="auteurs">↩️ Retour</button></div>' +

// ajout direct depuis le scanner : mode = pal | envie | achat | lecture
function ajouterDepuisInfos(infos, isbn, mode) {

        return {auteurId: a && a.id, nom: (a && a.nom) || n, role: 'auteur'};
      }),

      unite: 'pages',

      possession: mode === 'envie' ? 'envie' : 'possede',

<style>
.pastille{position:fixed;left:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;max-width:calc(100% - 110px);display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:0;background:var(--ink);color:var(--card);font:600 13px Nunito,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:monte .3s ease}
.pastille b{font-variant-numeric:tabular-nums}
.pastille.pause{opacity:.8}
.chrono{font:700 54px/1 "Cormorant Garamond",Georgia,serif;text-align:center;margin:18px 0 6px;font-variant-numeric:tabular-nums}
</style>
<script>
// ---------- Minuteur de lecture ----------
// Une seule session ouverte à la fois, enregistrée dans la base (elle survit à la fermeture de l'appli) :
// {enCours: true, debut, accumule (secondes déjà comptées), repriseA (ms, ou null en pause)}.
var minuteurTic = null;

function sessionEnCours() {
  return valeurs(D.sessions || {}).find(function (s) { return s.enCours; }) || null;
}
function ecoule(s) {
  var t = s.accumule || 0;
  if (s.repriseA) {
    t += (Date.now() - s.repriseA) / 1000;
  }
  return Math.max(0, Math.round(t));
}
function texteChrono(sec) {
  var h = Math.floor(sec / 3600);
  var m = Math.floor((sec % 3600) / 60);
  var s = sec % 60;
  var mm = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  if (h) {
    return h + ':' + mm;
  }
  return mm;
}
function majPastille() {
  var s = sessionEnCours();
  var p = document.getElementById('pastille');
  if (!s) {
    if (p) {
      p.remove();
    }
    clearInterval(minuteurTic);
    minuteurTic = null;
    return;
  }
  if (!p) {
    p = document.createElement('button');
    p.id = 'pastille';
    p.className = 'pastille';
    p.dataset.act = 'ouvrirMinuteur';
    document.body.appendChild(p);
  }
  var l = D.livres[s.livreId];
  var t = '';
  if (l) {
    t = l.titre.replace(/\s*\([^)]*#\d+(\.\d+)?\)\s*$/, '');
  }
  p.classList.toggle('pause', !s.repriseA);
  p.innerHTML = (s.repriseA ? '⏱️' : '⏸️') + ' <b>' + texteChrono(ecoule(s)) + '</b> · ' + esc(t);
  var g = document.getElementById('chronoGrand');
  if (g) {
    g.textContent = texteChrono(ecoule(s));
  }
  if (!minuteurTic) {
    minuteurTic = setInterval(majPastille, 1000);
  }
}
apresEcritureHooks.push(majPastille);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && D.sessions) {
    majPastille();
  }
});

ACTIONS.lancerMinuteur = function (el) {
  var lid = el.dataset.lecture;
  siIndependant(function () {
    var s = sessionEnCours();
    if (s) {
      if (s.lectureId !== lid) {
        alert('Un minuteur tourne déjà pour « ' + ((D.livres[s.livreId] || {}).titre || '?') + ' » : arrête-le d\'abord.');
      }
      ACTIONS.ouvrirMinuteur();
      return;
    }
    var x = D.lectures[lid];
    var maintenant = Date.now();
    var ops = [{t: 'sessions', o: {id: nouvelId(), lectureId: lid, livreId: x.livreId, debut: maintenant, fin: null, dureeSec: null, position: null, accumule: 0, repriseA: maintenant, enCours: true, origine: 'minuteur'}}];
    if (x.statut === 'pause') {
      ops.push({t: 'lectures', o: Object.assign({}, x, {statut: 'en_cours'})});
    }
    ecrire(ops).then(function () {
      fermerFeuille();
      apresEcriture();
      toast('⏱️ C\'est parti, bonne lecture !');
    }).catch(erreurEcriture);
  });
};
ACTIONS.ouvrirMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  var l = D.livres[s.livreId];
  var bouton = '<button class="act doux" data-act="pauseMinuteur">⏸️ Pause</button>';
  if (!s.repriseA) {
    bouton = '<button class="act doux" data-act="repriseMinuteur">▶️ Reprendre</button>';
  }
  ouvrirFeuille('<h3>' + esc(l ? l.titre : 'Lecture') + '</h3><p class="small muted">commencé à ' + heureVersChamp(s.debut).replace(':', ' h ') + '</p><div class="chrono" id="chronoGrand">' + texteChrono(ecoule(s)) + '</div><div class="row" style="justify-content:center;margin-top:12px">' + bouton + '<button class="act" data-act="arreterMinuteur">⏹️ Arrêter</button></div><div style="text-align:center;margin-top:10px"><button class="lien danger" data-act="annulerMinuteur">Annuler ce minuteur</button></div>');
};
function modifierSessionEnCours(champs) {
  var s = sessionEnCours();
  if (!s) {
    return Promise.resolve();
  }
  return ecrire([{t: 'sessions', o: Object.assign({}, s, champs)}]).then(function () {
    majPastille();
  });
}
ACTIONS.pauseMinuteur = function () {
  var s = sessionEnCours();
  modifierSessionEnCours({accumule: ecoule(s), repriseA: null}).then(ACTIONS.ouvrirMinuteur);
};
ACTIONS.repriseMinuteur = function () {
  modifierSessionEnCours({repriseA: Date.now()}).then(ACTIONS.ouvrirMinuteur);
};
ACTIONS.annulerMinuteur = function () {
  var s = sessionEnCours();
  if (!s || !confirm('Annuler ce minuteur ? Cette session ne sera pas comptée.')) {
    return;
  }
  ecrire([{t: 'sessions', suppr: s.id}]).then(function () {
    fermerFeuille();
    apresEcriture();
  }).catch(erreurEcriture);
};
ACTIONS.arreterMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  var sec = ecoule(s);
  var x = D.lectures[s.lectureId];
  var oubli = '';
  if (sec > 6 * 3600) {
    oubli = '<p class="small">🤔 Plus de 6 heures : tu as peut-être oublié d\'arrêter le minuteur ? Corrige la durée si besoin.</p>';
  }
  var etiquette = 'Tu en es à la page';
  if (x.unite === 'secondes') {
    etiquette = 'Tu en es à (h:mm)';
  } else if (x.unite === 'pourcent') {
    etiquette = 'Tu en es à (%)';
  }
  var avant = '';
  if (x.position) {
    avant = ' (avant : ' + texteLongueur(x.unite, x.position) + ')';
  }
  ouvrirFeuille('<h3>Session terminée ✨</h3><p>Tu as lu <b>' + Math.max(1, Math.round(sec / 60)) + ' min</b>.</p>' + oubli + '<div class="form"><label>Durée (minutes)</label>' + champ('arMinutes', Math.max(1, Math.round(sec / 60)), 'type="number" min="1" inputmode="numeric"') +
    '<label>' + etiquette + avant + '</label>' + champLongueur('arPosition', x.unite, '') +
    '<div class="row" style="margin-top:16px"><button class="act" data-act="validerArret">💾 Enregistrer</button><button class="act doux" data-act="ouvrirMinuteur">↩️ Continuer</button></div></div>');
  setTimeout(function () {
    var c = document.getElementById('arPosition');
    if (c) {
      c.focus();
    }
  }, 300);
  ACTIONS.validerArret = function () {
    var s2 = sessionEnCours();
    if (!s2) {
      fermerFeuille();
      return;
    }
    var mn = valNombre('arMinutes') || Math.round(sec / 60);
    var pos = lireLongueur('arPosition', x.unite);
    var fin = Date.now();
    var session = Object.assign({}, s2, {enCours: false, fin: fin, dureeSec: Math.round(mn * 60), position: pos});
    delete session.accumule;
    delete session.repriseA;
    var ops = [{t: 'sessions', o: session}];
    var lec = D.lectures[s2.lectureId];
    if (pos !== null) {
      ops.push({t: 'lectures', o: Object.assign({}, lec, {position: pos})});
    }
    ecrire(ops).then(function () {
      apresEcriture();
      if (lec.total && pos !== null && pos >= lec.total) {
        proposerFin(lec.id);
      } else {
        fermerFeuille();
        toast('⏱️ ' + Math.round(mn) + ' min de lecture notées');
      }
    }).catch(erreurEcriture);
  };
};
</script>

<style>
.reglage{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.reglage:first-of-type{border-top:0}
.reglage p{margin:4px 0}
.liste-sauv button{display:flex;justify-content:space-between;width:100%;text-align:left;margin:6px 0}
</style>
<script>
// ---------- Réglages (⚙️) : sauvegarde, fichiers, lien avec Bookmory, stockage ----------
ACTIONS.reglages = function () {
  var h = '<h3>Réglages</h3>';

  h += '<div class="reglage"><h4>☁️ Sauvegarde dans ton Drive</h4>';
  if (liaison()) {
    h += '<p class="small">Ton grimoire est copié automatiquement dans le dossier <b>Grimoire sauvegardes</b> de ton Drive, 30 secondes après chaque modification (une copie par jour, gardée 30 jours, puis une par mois).</p>' +
      '<p class="small"><b id="etatDrive">' + esc(texteSauvegarde()) + '</b></p>' +
      '<div class="row"><button class="act" data-act="sauverDrive">☁️ Sauvegarder maintenant</button><button class="act doux" data-act="restaurerDrive">↩️ Restaurer</button><button class="act doux" data-act="delierDrive">Délier</button></div>';
  } else {
    h += '<p class="small">Colle ici le <b>code de liaison</b> : tu le trouves dans ton Drive, fichier <b>Grimoire sauvegardes / code-de-liaison.txt</b> (ouvre-le, copie tout le texte).</p>' +
      '<input class="champ" id="codeLiaison" type="password" autocomplete="off" placeholder="https://script.google.com/macros/s/…#…">' +
      '<div class="row"><button class="act" data-act="relierDrive">🔗 Relier</button></div>';
  }
  h += '</div>';

  h += '<div class="reglage"><h4>💾 Fichier</h4><p class="small muted">Une copie complète (livres, carnet, citations et photos) à garder où tu veux, ou à restaurer.</p><div class="row"><button class="act doux" data-act="exporterSauvegarde">💾 Exporter</button><button class="act doux" data-act="choisirExport">📥 Importer un fichier</button></div></div>';

  h += '<div class="reglage"><h4>✍️ Ma bibliothèque</h4><div class="row"><button class="act doux" data-act="auteurs">✍️ Auteur·ices</button></div></div>';

  var imp = reglage('dernierImport');
  h += '<div class="reglage"><h4>📚 Bookmory</h4>';
  if (reglage('mode', 'miroir') === 'miroir') {
    var quand = 'aucun export reçu pour l\'instant';
    if (imp) {
      quand = 'dernier export reçu le ' + fdate(imp.date) + ' (' + imp.recap.livres + ' livres)';
    }
    h += '<p class="small">Pour l\'instant, ton grimoire recopie Bookmory à chaque export reçu : ' + quand + '. Ton carnet, tes exclusions et ton objectif restent à toi.</p><div class="row"><button class="act" data-act="proposerBascule">✨ Rendre mon grimoire indépendant</button></div>';
  } else {
    h += '<p class="small">Ton grimoire est indépendant de Bookmory depuis le ' + fdate(reglage('bascule', Date.now())) + '.</p>';
  }
  h += '</div>';

  h += '<div class="reglage"><h4>📱 Stockage sur le téléphone</h4><p class="small" id="etatStockage">…</p></div>';
  ouvrirFeuille(h);
  afficherStockage();
};

function afficherStockage() {
  var el = document.getElementById('etatStockage');
  if (!el || !navigator.storage || !navigator.storage.persisted) {
    return;
  }
  Promise.all([navigator.storage.persisted(), navigator.storage.estimate ? navigator.storage.estimate() : {}]).then(function (r) {
    var t = '⚠️ Non protégé : Android pourrait effacer le grimoire s\'il manque de place. La sauvegarde Drive est ton filet.';
    if (r[0]) {
      t = '✅ Protégé : Android ne l\'effacera pas de lui-même.';
    }
    if (r[1].usage) {
      t += ' Place utilisée : ' + nombre(r[1].usage / 1048576) + ' Mo.';
    }
    el.textContent = t;
  });
}

ACTIONS.proposerBascule = function () {
  proposerBascule(null);
};
ACTIONS.relierDrive = function () {
  var l = lireCodeLiaison(document.getElementById('codeLiaison').value);
  if (!l) {
    alert('Ce code ne ressemble pas à un code de liaison : il commence par https://script.google.com/macros/s/ et contient un # suivi du secret.');
    return;
  }
  toast('🔗 Vérification du code…');
  appelRelais('ping', {}, l).then(function () {
    return regler('liaison', l);
  }).then(function () {
    ACTIONS.reglages();
    toast('✨ Drive relié');
    return sauvegarderMaintenant(true);
  }).catch(function (e) {
    alert('La liaison n\'a pas marché : ' + ((e && e.message) || e));
  });
};
ACTIONS.delierDrive = function () {
  if (!confirm('Arrêter la sauvegarde automatique dans ton Drive ? Les sauvegardes déjà faites y restent.')) {
    return;
  }
  ecrire([{t: 'reglages', suppr: 'liaison'}]).then(function () {
    majTemoin('');
    ACTIONS.reglages();
  });
};
ACTIONS.sauverDrive = function () {
  sauvegarderMaintenant(true).then(function () {
    if (!etatSauvegarde) {
      toast('☁️ Sauvegardé dans ton Drive');
    }
  });
};
ACTIONS.restaurerDrive = function () {
  toast('☁️ Je regarde dans ton Drive…');
  listerSauvegardesDrive().then(function (l) {
    if (!l.length) {
      alert('Aucune sauvegarde dans ton Drive pour l\'instant.');
      return;
    }
    ouvrirFeuille('<h3>Restaurer depuis le Drive</h3><p class="small muted">Choisis la copie à remettre dans le grimoire.</p><div class="liste-sauv">' + l.map(function (f) {
      return '<button class="act doux" data-act="restaurerFichierDrive" data-id="' + esc(f.id) + '"><span>' + esc(f.nom.replace(/^grimoire-|\.zip$/g, '')) + '</span><span class="muted">' + nombre(f.taille / 1048576) + ' Mo</span></button>';
    }).join('') + '</div>');
  }).catch(function (e) {
    alert('Impossible de lire ton Drive : ' + ((e && e.message) || e));
  });
};
ACTIONS.restaurerFichierDrive = function (el) {
  toast('☁️ Téléchargement…');
  lireSauvegardeDrive(el.dataset.id).then(lireSauvegarde).then(function (lu) {
    if (!lu) {
      throw new Error('fichier illisible');
    }
    proposerRestauration(lu);
  }).catch(function (e) {
    alert('Restauration impossible : ' + ((e && e.message) || e));
  });
};
</script>

<style>
.import-btn{left:16px;right:auto}
.vide{text-align:center}
.vide .etapes{text-align:left;margin:12px auto;max-width:320px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--card);font:700 14px Nunito,sans-serif;padding:10px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:all .3s;z-index:70;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.vis{opacity:1;transform:translate(-50%,0)}
</style>
<script>
// ---------- Version appli (PWA) : démarrage, fichiers reçus (partage Android ou 📥) ----------
var CACHE_PARTAGE = 'grimoire-partage';

// ancienne base « grimoire » (version lecture seule) : on n'y lit plus que le dernier export reçu
function idb() {
  return new Promise(function (ok, ko) {
    var r = indexedDB.open('grimoire', 1);
    r.onupgradeneeded = function () {
      r.result.createObjectStore('fichiers');
    };
    r.onsuccess = function () {
      ok(r.result);
    };
    r.onerror = function () {
      ko(r.error);
    };
  });
}
function idbGet(k) {
  return idb().then(function (db) {
    return new Promise(function (ok, ko) {
      var q = db.transaction('fichiers').objectStore('fichiers').get(k);
      q.onsuccess = function () {
        ok(q.result);
      };
      q.onerror = function () {
        ko(q.error);
      };
    });
  });
}

function toast(texte) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = texte;
  document.body.appendChild(t);
  setTimeout(function () { t.classList.add('vis'); }, 50);
  setTimeout(function () {
    t.classList.remove('vis');
    setTimeout(function () { t.remove(); }, 400);
  }, 3500);
}
function erreurEcran(e) {
  document.getElementById('app').innerHTML = '<div id="load" class="err">' + esc((e && e.message) || e) + '</div>';
}

function majSource() {
  var morceaux = [];
  var imp = reglage('dernierImport');
  if (reglage('mode', 'miroir') === 'miroir' && imp) {
    morceaux.push('Copie de Bookmory du ' + fdate(imp.date));
  }
  if (texteSauvegarde()) {
    morceaux.push(texteSauvegarde());
  }
  document.getElementById('src').textContent = morceaux.join(' · ');
}
function afficherGrimoire() {
  M = modeleDepuisBase();
  majSource();
  rendre();
  majPastille();
}

// Fichier reçu : sauvegarde du grimoire (→ restaurer) ou export Bookmory (→ importer en miroir)
function recevoirFichier(buf) {
  document.getElementById('app').innerHTML = '<div id="load">J\'ouvre le fichier…</div>';
  return lireSauvegarde(buf).then(function (lu) {
    if (lu) {
      return proposerRestauration(lu);
    }
    if (reglage('mode', 'miroir') !== 'miroir' && !confirm('Ton grimoire ne dépend plus de Bookmory. Réimporter cet export remplacera les livres venus de Bookmory par leur version de l\'export. Continuer ?')) {
      return afficherSiPossible();
    }
    return importerBookmory(buf).then(function (recap) {
      afficherGrimoire();
      planifierSauvegarde();
      toast('✨ Grimoire mis à jour · ' + recap.livres + ' livres');
    });
  }).catch(function (e) {
    erreurEcran(e);
  });
}
function afficherSiPossible() {
  if (valeurs(D.livres).length) {
    afficherGrimoire();
  } else {
    ecranVide();
  }
}
function proposerRestauration(lu) {
  afficherSiPossible();
  ouvrirFeuille('<h3>Restaurer une sauvegarde</h3><p>' + esc(resumeSauvegarde(lu.donnees)) + '</p><p class="small muted">Tout ce qui est actuellement dans le grimoire sera remplacé par cette sauvegarde.</p><div class="row"><button class="act" data-act="confirmerRestauration">↩️ Restaurer</button><button class="act doux" data-act="fermer">Annuler</button></div>');
  ACTIONS.confirmerRestauration = function () {
    fermerFeuille();
    restaurerSauvegarde(lu).then(function () {
      afficherSiPossible();
      planifierSauvegarde();
      toast('✨ Sauvegarde restaurée');
    }).catch(erreurEcriture);
  };
}

function ecranVide() {
  M = null;
  document.getElementById('src').textContent = '';
  document.getElementById('app').innerHTML = card('Bienvenue dans ton grimoire ✨', '<div class="vide"><p>Pour le remplir avec tes lectures, envoie-lui un export Bookmory :</p><div class="etapes">1. Dans Bookmory, <b>exporte tes données</b><br>2. Touche <b>Partager</b><br>3. Choisis <b>Grimoire</b></div><p class="small muted">ou choisis le fichier toi-même (un export Bookmory ou une sauvegarde du grimoire) :</p><button class="act" data-act="choisirExport">📥 Choisir un fichier</button></div>');
}
// première ouverture de la nouvelle version : l'ancien export est déjà sur le téléphone
function proposerImportAncien(e) {
  M = null;
  document.getElementById('app').innerHTML = card('Ton grimoire fait peau neuve ✨', '<div class="vide"><p>Il a maintenant sa propre base : tes lectures vont y être copiées, avec ton carnet, tes exclusions et ton objectif.</p><p class="small muted">Dernier export reçu : ' + fdate(e.date) + '. Pour avoir aussi les photos de tes citations, partage plutôt un nouvel export depuis Bookmory (ta macro le fait quand tu fermes Bookmory).</p><div class="row" style="justify-content:center"><button class="act" data-act="importerAncien">✨ Importer maintenant</button><button class="act doux" data-act="choisirExport">📥 Un autre fichier</button></div></div>');
  ACTIONS.importerAncien = function () {
    recevoirFichier(e.octets.buffer.slice(e.octets.byteOffset, e.octets.byteOffset + e.octets.byteLength));
  };
}

ACTIONS.choisirExport = function () {
  fermerFeuille();
  document.getElementById('fichierImport').click();
};

function demarrer() {
  appliquerTheme(lsGet('bm_theme') || 'fetes');
  try {
    var s = JSON.parse(lsGet('bm_sous') || '{}');
    Object.keys(s).forEach(function (k) { sous[k] = s[k]; });
  } catch (e) {}
  onglet = lsGet('bm_onglet') || 'accueil';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist();
  }
  document.getElementById('fichierImport').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (f) {
      f.arrayBuffer().then(recevoirFichier);
    }
    e.target.value = '';
  });

  preparerBase().then(function () {
    reprendreSauvegarde();
    var params = new URLSearchParams(location.search);
    if (params.has('partage') && 'caches' in window) {
      history.replaceState(null, '', location.pathname);
      return caches.open(CACHE_PARTAGE).then(function (c) {
        return c.match('partage-recu').then(function (rep) {
          if (!rep) {
            return ouvrirGrimoire();
          }
          return rep.arrayBuffer().then(function (b) {
            c.delete('partage-recu');
            return recevoirFichier(b);
          });
        });
      });
    }
    // test en local : ?db=fichier
    if (params.get('db')) {
      return fetch(params.get('db')).then(function (r) { return r.arrayBuffer(); }).then(recevoirFichier);
    }
    return ouvrirGrimoire();
  }).catch(erreurEcran);
}

function ouvrirGrimoire() {
  if (valeurs(D.livres).length) {
    afficherGrimoire();
    return;
  }
  return idbGet('export').then(function (e) {
    if (e && e.octets) {
      proposerImportAncien(e);
    } else {
      ecranVide();
    }
  }).catch(ecranVide);
}
</script>

<script>demarrer();</script>
