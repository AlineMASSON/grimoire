<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Mon grimoire de lectures</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3c3da" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1230" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Thèmes : « rose féerique » (clair), « nuit enchantée » (sombre), « automne cosy » */
:root{
  --bg:#fcf0f6;--bg2:#ece6fc;--card:#fffafd;--ink:#4a2a45;--muted:#97738c;--line:#f1d3e2;
  --accent:#d6588f;--accent-soft:#fbe0ec;--lav:#6f6fd8;--lav-soft:#ebe8fb;--gold:#c08a2a;--gold-soft:#f8ecd5;
  --paper:#e06a9e;--audio:#9a82e2;--ebook:#5fbf9f;--mint-soft:#e2f6ee;
  --heat0:#f6e7ef;--heat1:#f3b6d0;--heat2:#e47aa9;--heat3:#b8457f;
  --frame:linear-gradient(135deg,#f6b8d2,#c9b8f4 55%,#ecd09a);
  --shadow:0 8px 24px rgba(214,88,143,.13);--spark:rgba(214,88,143,.38);--cover-shadow:0 4px 10px rgba(122,40,90,.22);
  --shelf:#e6c3a6;--voile:rgba(60,20,50,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#1a1230;--bg2:#2e1940;--card:#281c3d;--ink:#f7e9f3;--muted:#bba5c8;--line:#46355f;
    --accent:#d35c96;--accent-soft:#4a2948;--lav:#827de4;--lav-soft:#2f2a55;--gold:#d9b46a;--gold-soft:#45391f;
    --paper:#f08bb8;--audio:#b4a0f5;--ebook:#7fd6b8;--mint-soft:#1f3a36;
    --heat0:#372a50;--heat1:#7d4677;--heat2:#c0639c;--heat3:#f59cc8;
    --frame:linear-gradient(135deg,#a0457a,#5d4aa0 55%,#9c7a3c);
    --shadow:0 8px 26px rgba(0,0,0,.38);--spark:rgba(255,226,244,.55);--cover-shadow:0 4px 12px rgba(0,0,0,.5);
    --shelf:#5b3f66;--voile:rgba(5,0,15,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1230;--bg2:#2e1940;--card:#281c3d;--ink:#f7e9f3;--muted:#bba5c8;--line:#46355f;
  --accent:#d35c96;--accent-soft:#4a2948;--lav:#827de4;--lav-soft:#2f2a55;--gold:#d9b46a;--gold-soft:#45391f;
  --paper:#f08bb8;--audio:#b4a0f5;--ebook:#7fd6b8;--mint-soft:#1f3a36;
  --heat0:#372a50;--heat1:#7d4677;--heat2:#c0639c;--heat3:#f59cc8;
  --frame:linear-gradient(135deg,#a0457a,#5d4aa0 55%,#9c7a3c);
  --shadow:0 8px 26px rgba(0,0,0,.38);--spark:rgba(255,226,244,.55);--cover-shadow:0 4px 12px rgba(0,0,0,.5);
  --shelf:#5b3f66;--voile:rgba(5,0,15,.6);
}
:root[data-theme="autumn"]{
  --bg:#f8efe3;--bg2:#f1dcc6;--card:#fffaf2;--ink:#4a2c20;--muted:#93725f;--line:#ecd6bf;
  --accent:#c0573a;--accent-soft:#f7ddd0;--lav:#8e5b7c;--lav-soft:#f1e2ea;--gold:#c48a2c;--gold-soft:#f7e8cc;
  --paper:#c0573a;--audio:#8e5b7c;--ebook:#6f8f4e;--mint-soft:#e7efdc;
  --heat0:#f3e4d4;--heat1:#eab48f;--heat2:#d27b4f;--heat3:#9c4326;
  --frame:linear-gradient(135deg,#e9b08a,#cf9cb8 55%,#e2c07a);
  --shadow:0 8px 24px rgba(160,80,40,.14);--spark:rgba(192,87,58,.35);--cover-shadow:0 4px 10px rgba(110,50,20,.25);
  --shelf:#a8714a;--voile:rgba(60,30,10,.45);
}
:root[data-theme="fete"]{
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--card));
  --lav-soft:color-mix(in srgb,var(--lav) 16%,var(--card));
  --gold-soft:color-mix(in srgb,var(--gold) 20%,var(--card));
  --mint-soft:color-mix(in srgb,var(--ebook) 15%,var(--card));
  --paper:var(--accent);--audio:var(--lav);
  --heat0:color-mix(in srgb,var(--accent) 10%,var(--card));
  --heat1:color-mix(in srgb,var(--accent) 38%,var(--card));
  --heat2:color-mix(in srgb,var(--accent) 68%,var(--card));
  --heat3:var(--accent);
  --frame:linear-gradient(135deg,color-mix(in srgb,var(--accent) 50%,var(--card)),color-mix(in srgb,var(--lav) 50%,var(--card)) 55%,color-mix(in srgb,var(--gold) 55%,var(--card)));
  --spark:color-mix(in srgb,var(--gold) 55%,transparent);
  --shadow:0 8px 24px color-mix(in srgb,var(--accent) 16%,transparent);
  --cover-shadow:0 4px 10px rgba(0,0,0,.25);
  --shelf:color-mix(in srgb,var(--gold) 55%,var(--ink));
  --voile:rgba(10,5,20,.5);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 Nunito,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:
    radial-gradient(1.6px 1.6px at 22px 34px,var(--spark) 50%,transparent 52%),
    radial-gradient(1px 1px at 128px 86px,var(--spark) 50%,transparent 52%),
    radial-gradient(2.2px 2.2px at 204px 170px,var(--spark) 50%,transparent 52%),
    radial-gradient(1.2px 1.2px at 64px 210px,var(--spark) 50%,transparent 52%),
    radial-gradient(1.4px 1.4px at 170px 20px,var(--spark) 50%,transparent 52%),
    linear-gradient(165deg,var(--bg) 0%,var(--bg2) 100%);
  background-size:240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,100% 100%;
  background-attachment:fixed}
header{padding:26px 16px 4px;max-width:760px;margin:0 auto;text-align:center;position:relative}
header .moon{font-size:26px;color:var(--gold);line-height:1}
header h1{margin:2px 0 0;font:700 30px/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:.3px}
header h1 span{display:block;font:700 26px/1.1 "Dancing Script",cursive;color:var(--accent);margin-top:2px}
header .orn{color:var(--gold);letter-spacing:8px;font-size:12px;margin:6px 0 2px}
header .src{color:var(--muted);font-size:11px}
.theme-btn{position:absolute;right:16px;top:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.themes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.themes[hidden]{display:none}
main{padding:0 16px 104px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);display:flex;justify-content:space-around;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 2px 11px;font:600 11px Nunito,sans-serif;cursor:pointer;position:relative}
nav button span{display:block;font-size:21px;line-height:1.25;filter:saturate(.6);opacity:.75;position:relative}
nav button.on{color:var(--accent)}
nav button.on span{filter:none;opacity:1;transform:translateY(-2px)}
nav button.on span::before{content:"";position:absolute;left:50%;top:-4px;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft) 0%,transparent 70%);z-index:-1}
nav button.on::after{content:"✦";position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold)}
.card{background:linear-gradient(var(--card),var(--card)) padding-box,var(--frame) border-box;border:1.5px solid transparent;border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{font:700 21px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 12px}
.card h2::before{content:"✧ ";color:var(--gold);font-size:16px}
.card h2 small{display:block;font:italic 400 12px Nunito,sans-serif;color:var(--muted);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.kpi{background:linear-gradient(145deg,var(--accent-soft),var(--card));border-radius:16px;padding:10px 12px}
.kpi:nth-child(4n+2){background:linear-gradient(145deg,var(--lav-soft),var(--card))}
.kpi:nth-child(4n+3){background:linear-gradient(145deg,var(--gold-soft),var(--card))}
.kpi:nth-child(4n+4){background:linear-gradient(145deg,var(--mint-soft),var(--card))}
.kpi b{display:block;font:700 28px/1.1 "Cormorant Garamond",Georgia,serif}
.kpi i{font-style:normal;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}.small{font-size:12px}
.bar{display:grid;grid-template-columns:minmax(70px,38%) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{background:var(--heat0);border-radius:8px;height:12px;overflow:hidden}
.bar .fil{background:linear-gradient(90deg,var(--lav),var(--accent));height:100%;border-radius:0 6px 6px 0}
.bar .val{color:var(--muted);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.bar[data-tip]{cursor:pointer;border-radius:8px}
.bar.actif .fil{background:var(--gold) !important;box-shadow:0 0 8px var(--gold)}
.bar.axe-x{margin-top:2px}
.graduations{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:2px}
.graph{display:grid;grid-template-columns:auto 1fr;gap:6px}
.axe-y{position:relative;width:28px;height:110px;font-size:10px;color:var(--muted);line-height:1}
.axe-y span{position:absolute;right:0;transform:translateY(-50%)}
.axe-y span:nth-child(1){top:0}.axe-y span:nth-child(2){top:50%}.axe-y span:nth-child(3){top:100%}
.cols{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.cols .col{flex:1;height:100%;display:flex;align-items:flex-end;cursor:pointer;border-radius:4px 4px 0 0}
.cols .col i{display:block;width:100%;background:linear-gradient(180deg,var(--accent),var(--lav));border-radius:4px 4px 0 0;min-height:1px}
.cols .col.actif i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.colslab{display:flex;gap:2px;font-size:10px;color:var(--muted);margin-top:3px}
.colslab span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px dashed var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.heat i{width:11px;height:11px;border-radius:4px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3);box-shadow:0 0 6px var(--heat2)}
.heat i.out{background:transparent}
.heat i[data-tip]{cursor:pointer}
.heat i.actif{outline:2px solid var(--gold);outline-offset:1px}
.heat-mois{position:relative;height:14px;font-size:10px;color:var(--muted)}
.heat-mois span{position:absolute;top:0}
.heat-legende{display:flex;align-items:center;gap:3px;justify-content:flex-end;font-size:10px;color:var(--muted);margin-top:6px}
.heat-legende i{width:11px;height:11px;border-radius:4px;background:var(--heat0)}
.heat-legende i.l1{background:var(--heat1)}.heat-legende i.l2{background:var(--heat2)}.heat-legende i.l3{background:var(--heat3)}
.heat-legende span{margin:0 3px}
/* bulle de valeur */
.bulle{position:fixed;z-index:60;transform:translate(-50%,-100%);background:var(--ink);color:var(--card);font:700 12px/1.3 Nunito,sans-serif;padding:7px 11px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .15s;max-width:240px;text-align:center}
.bulle.vis{opacity:1}
.bulle.dessous{transform:translate(-50%,0)}
.exclus-note{margin:8px 4px 0}
.exclus-note a{color:var(--accent)}
.book{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.book:last-child{border-bottom:0}
.book img,.book .ph{width:44px;height:66px;object-fit:cover;border-radius:6px;background:var(--heat0);flex:none;box-shadow:var(--cover-shadow);transform:rotate(-2deg)}
.book .t{font:700 17px/1.2 "Cormorant Garamond",Georgia,serif}
.prog{background:var(--heat0);height:10px;border-radius:6px;margin:8px 0 6px}
.prog div{background:linear-gradient(90deg,var(--lav),var(--accent));height:100%;border-radius:6px;position:relative;max-width:100%}
.prog div::after{content:"✦";position:absolute;right:-5px;top:-7px;font-size:14px;color:var(--gold);text-shadow:0 0 6px var(--gold-soft)}
.quote{font:italic 600 19px/1.5 "Cormorant Garamond",Georgia,serif;white-space:pre-wrap;text-align:center;padding:4px 6px 0}
.quote::before{content:"❝";display:block;font-size:34px;line-height:1;color:var(--accent);margin:4px 0 8px}
.quotebox{background:linear-gradient(160deg,var(--accent-soft),var(--lav-soft));border-radius:18px;padding:6px 14px 16px}
.qsrc{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}
.qsrc::before{content:"✦ ";color:var(--gold)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.covers img,.covers .ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--heat0);box-shadow:var(--cover-shadow)}
.covers .ph{display:flex;align-items:center;justify-content:center;font-size:10px;padding:4px;text-align:center;color:var(--muted);overflow:hidden}
.covers > div:nth-child(3n+1) > *{transform:rotate(-2deg)}
.covers > div:nth-child(3n+2) > *{transform:rotate(1.5deg)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 8px}
.badge{text-align:center;font-size:12px;line-height:1.3;opacity:.5;filter:grayscale(.9)}
.badge b{display:flex;align-items:center;justify-content:center;width:58px;height:58px;margin:0 auto 6px;border-radius:50%;font-size:26px;background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--lav-soft));border:2px dashed var(--line)}
.badge.ok{opacity:1;filter:none}
.badge.ok b{border:2px solid var(--gold);box-shadow:0 0 0 4px var(--gold-soft),0 4px 14px rgba(192,138,42,.25)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;margin:1px 2px 1px 0;border:1px solid}
.pill.paper{background:color-mix(in srgb,var(--paper) 16%,transparent);border-color:color-mix(in srgb,var(--paper) 45%,transparent)}
.pill.audio{background:color-mix(in srgb,var(--audio) 16%,transparent);border-color:color-mix(in srgb,var(--audio) 45%,transparent)}
.pill.ebook{background:color-mix(in srgb,var(--ebook) 16%,transparent);border-color:color-mix(in srgb,var(--ebook) 45%,transparent)}
.act,select,input[type=number],textarea{font:600 14px Nunito,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px}
textarea{border-radius:16px;width:100%;min-height:80px;font-weight:400;resize:vertical}
.act{display:inline-block;text-decoration:none;background:linear-gradient(135deg,var(--accent),var(--lav));color:#fff;border:0;cursor:pointer;box-shadow:0 4px 12px rgba(214,88,143,.3)}
.act.doux{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#load{padding:60px 16px;text-align:center;font:italic 600 20px "Cormorant Garamond",Georgia,serif;color:var(--muted)}
#load::before{content:"✦";display:block;font-size:30px;color:var(--gold);animation:scintille 1.4s ease-in-out infinite}
.err{color:#c0392b}

/* sous-onglets */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:14px 0 4px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:999px;font:700 13px Nunito,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--lav));color:#fff}

/* puces (humeurs, tropes, thèmes, filtres) */
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 11px;margin:4px 4px 0 0;font:600 12px Nunito,sans-serif;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* feuille (fenêtre du bas) */
.sheet-bg{position:fixed;inset:0;background:var(--voile);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fondu .2s ease}
.sheet{background:var(--card);border-radius:26px 26px 0 0;width:100%;max-width:760px;max-height:90vh;overflow:auto;padding:22px 18px 34px;position:relative;animation:monte .25s ease}
.sheet h3{font:700 23px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 40px 4px 0}
.sheet-x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
.sheet .tete{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.sheet .tete img,.sheet .tete .ph{width:62px;height:92px;object-fit:cover;border-radius:8px;box-shadow:var(--cover-shadow);flex:none;background:var(--heat0)}
.sheet h4{font:700 15px Nunito,sans-serif;margin:16px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-size:11px}
.crit{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:4px;margin:4px 0}
.pips button{border:0;background:none;font-size:22px;opacity:.22;padding:0 1px;cursor:pointer;filter:grayscale(.6)}
.pips button.on{opacity:1;filter:none}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes monte{from{transform:translateY(40px)}to{transform:none}}

/* carnet */
.mini{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted)}
.mini b{color:var(--ink)}
.noteligne{cursor:pointer}

/* niveau */
.niveau{display:flex;gap:14px;align-items:center}
.niveau .em{font-size:44px;width:72px;height:72px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--lav-soft));box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold-soft)}
.niveau .nom{font:700 22px/1.15 "Cormorant Garamond",Georgia,serif}

/* bingo */
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bingo .c{aspect-ratio:1;border-radius:12px;background:var(--heat0);font-size:9px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;position:relative;overflow:hidden;color:var(--muted)}
.bingo .c b{font-size:19px;line-height:1.2;position:relative}
.bingo .c span{position:relative}
.bingo .c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.bingo .c.ok{background:linear-gradient(145deg,var(--accent-soft),var(--lav-soft));box-shadow:inset 0 0 0 2px var(--gold);color:var(--ink);font-weight:700}
.bingo .c.ok::after{content:"✦";position:absolute;top:2px;right:4px;color:var(--gold);font-size:11px}
.bingo .c.ligne{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px var(--gold)}

/* étagère */
.etagere{margin:6px 0 22px}
.etagere h4{margin:0 0 4px;font:700 17px "Cormorant Garamond",Georgia,serif}
.shelf{display:flex;align-items:flex-end;gap:3px;padding:12px 10px 0;min-height:170px;border-bottom:12px solid var(--shelf);border-radius:6px 6px 3px 3px;box-shadow:0 10px 12px -8px rgba(0,0,0,.35);overflow-x:auto;background:linear-gradient(180deg,transparent 70%,color-mix(in srgb,var(--shelf) 25%,transparent))}
.spine{flex:none;border-radius:4px 4px 1px 1px;writing-mode:vertical-rl;transform:rotate(180deg);font:700 10px Nunito,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:8px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.3);box-shadow:inset -3px 0 0 rgba(255,255,255,.28),inset 3px 0 0 rgba(0,0,0,.12)}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:2px;background:rgba(255,236,190,.75)}
.spine::before{top:9px}.spine::after{bottom:9px}
.spine.coeur{box-shadow:inset -3px 0 0 rgba(255,255,255,.28),inset 3px 0 0 rgba(0,0,0,.12),0 0 10px var(--gold)}
.legende{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* roue */
.roue-wrap{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:14px auto 6px}
.roue{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.15,.75,.2,1);filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.roue-ptr{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:28px;color:var(--gold);z-index:2;text-shadow:0 2px 4px rgba(0,0,0,.25)}
.roue-centre{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--lav));color:#fff;font:700 13px Nunito,sans-serif;box-shadow:0 0 0 4px var(--card),0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:2}
.tirage{animation:monte .4s ease}

/* stories façon Wrapped */
.story{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;color:#fff;text-align:center;overflow:hidden;user-select:none}
.story .bars{display:flex;gap:4px;padding:14px 14px 0;position:relative;z-index:3}
.story .bars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.story .bars i b{display:block;height:100%;width:0;background:#fff}
.story .bars i.fait b{width:100%}
.story .bars i.cours b{animation:remplir 6s linear forwards}
.story .x{position:absolute;top:24px;right:14px;z-index:4;background:rgba(255,255,255,.2);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px}
.story .slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px 60px;gap:12px;position:relative;z-index:2;animation:apparait .5s ease}
.story .gros{font:700 82px/1 "Cormorant Garamond",Georgia,serif;text-shadow:0 4px 20px rgba(0,0,0,.2)}
.story .titre{font:700 30px/1.2 "Cormorant Garamond",Georgia,serif}
.story .script{font:700 30px/1.2 "Dancing Script",cursive}
.story .sous{font-size:15px;opacity:.9;max-width:320px}
.story img.cv{width:150px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:rotate(-3deg)}
.story .mosaique{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(340px,86vw)}
.story .mosaique img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:5px}
.story .paillettes{position:absolute;inset:0;z-index:1;pointer-events:none}
.story .paillettes i{position:absolute;font-style:normal;animation:scintille 2.4s ease-in-out infinite}
@keyframes remplir{from{width:0}to{width:100%}}
@keyframes apparait{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* touches féeriques */
@keyframes scintille{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.etoiles{position:fixed;inset:0;pointer-events:none;z-index:0}
.etoiles i{position:absolute;font-style:normal;color:var(--gold);animation:scintille 3.2s ease-in-out infinite}
header,main{position:relative;z-index:1}
header .moon{display:inline-block;animation:flotte 4s ease-in-out infinite;text-shadow:0 0 14px var(--gold-soft)}
.fete-banniere{display:flex;flex-direction:column;align-items:center;gap:2px;margin:14px 0 0;padding:10px 14px;border-radius:18px;background:linear-gradient(135deg,var(--accent-soft),var(--lav-soft));text-align:center;font-size:13px;color:var(--muted)}
.fete-banniere b{font:700 19px "Cormorant Garamond",Georgia,serif;color:var(--ink)}
.themes select{font:600 12px Nunito,sans-serif;padding:5px 10px;margin-top:4px}

/* téléphones étroits (Flip 7 ouvert, ~410 px de large) */
header{padding-top:calc(22px + env(safe-area-inset-top))}
.theme-btn{top:calc(16px + env(safe-area-inset-top))}
@media (max-width:440px){
  header h1{font-size:27px}
  header h1 span{font-size:23px}
  main{padding:0 12px 100px}
  .card{padding:14px 13px;border-radius:20px}
  .card h2{font-size:20px}
  .kpis{gap:6px}
  .kpi{padding:9px 10px}
  .kpi b{font-size:25px}
  .bar{grid-template-columns:minmax(64px,34%) 1fr auto;gap:6px}
  .badges{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .seg button{font-size:12px;padding:8px 2px}
  .crit{grid-template-columns:104px 1fr}
  .pips button{font-size:20px}
  nav button{font-size:10.5px}
}
/* petit écran presque carré (écran externe du Flip, paysage) */
@media (max-height:620px){
  header{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:0}
  header .moon,header .orn{display:none}
  header h1{font-size:22px}
  header h1 span{display:inline;font-size:20px}
  .theme-btn{width:34px;height:34px;font-size:15px;top:calc(8px + env(safe-area-inset-top))}
  main{padding-bottom:78px}
  nav button{padding:6px 2px 7px;font-size:9.5px}
  nav button span{font-size:18px}
  .card{margin:10px 0}
}
@media (prefers-reduced-motion:reduce){.etoiles i,header .moon,#load::before,.story .paillettes i{animation:none}.roue{transition-duration:.01s}}
</style>

<body>
<div class="etoiles" aria-hidden="true"><i style="left:8%;top:12%;font-size:10px">✦</i><i style="left:88%;top:8%;font-size:13px;animation-delay:.8s">✧</i><i style="left:76%;top:34%;font-size:8px;animation-delay:1.6s">✦</i><i style="left:4%;top:48%;font-size:12px;animation-delay:2.2s">✧</i><i style="left:93%;top:62%;font-size:9px;animation-delay:.4s">✦</i><i style="left:12%;top:80%;font-size:11px;animation-delay:1.2s">✧</i><i style="left:60%;top:90%;font-size:8px;animation-delay:2.6s">✦</i></div>

<nav id="nav"></nav>
<script>
var DAY = 86400000;
var FORMATS = {paperBook: 'Papier', audioBook: 'Audio', eBook: 'Numérique'};
var FMT_CLASS = {paperBook: 'paper', audioBook: 'audio', eBook: 'ebook'};
var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
var MOIS_LONGS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
var JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
var M = null;
var NOTES = {};
var ACTIONS = {};
// livres exclus de certaines stats : {idLivre: {stats: 1, bilan: 1, quetes: 1, reco: 1}}
var EXCLUS = {};
// catégorie de stats en cours de calcul (null = tous les livres)
var CAT = null;
var JOURS_LONGS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
var onglet = 'accueil';
var sous = {stats: 'rythme', etagere: 'etagere'};

// ---------- utilitaires ----------
function esc(s) {
  if (s === null || s === undefined) {
    return '';
  }
  return String(s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function lsGet(k) {
  try {
    return localStorage.getItem(k);
  } catch (e) {
    return null;
  }
}
function lsSet(k, v) {
  try {
    localStorage.setItem(k, v);
  } catch (e) {}
}
function dkey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fdate(ts) {
  var d = new Date(ts);
  return d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
}
function round(n, p) {
  var f = Math.pow(10, p || 0);
  return Math.round(n * f) / f;
}
function moy(a) {
  if (!a.length) {
    return null;
  }
  return a.reduce(function (s, x) { return s + x; }, 0) / a.length;
}
function mediane(a) {
  if (!a.length) {
    return null;
  }
  var s = a.slice().sort(function (x, y) { return x - y; });
  return s[Math.floor(s.length / 2)];
}
function etoiles(n) {
  if (!n) {
    return '<span class="muted">–</span>';
  }
  return round(n, 1) + '★';
}
function hm(sec) {
  var h = Math.floor(sec / 3600);
  var m = Math.round((sec % 3600) / 60);
  return h + ' h ' + String(m).padStart(2, '0');
}
function depuis(ts) {
  var j = Math.floor((Date.now() - ts) / DAY);
  if (j < 31) {
    return j + ' j';
  }
  if (j < 365) {
    return Math.round(j / 30) + ' mois';
  }
  var s = '';
  if (j >= 730) {
    s = 's';
  }
  return round(j / 365, 1) + ' an' + s;
}
function titre(b) {
  return b.title.replace(/\s*\([^)]*#\d+(\.\d+)?\)\s*$/, '');
}
function cover(b) {
  if (b.image && /^(https?|blob):/.test(b.image)) {
    return '<img loading="lazy" src="' + esc(b.image) + '" alt="">';
  }
  return '<div class="ph">' + esc(titre(b)).slice(0, 40) + '</div>';
}
function pill(fmt) {
  return '<span class="pill ' + (FMT_CLASS[fmt] || '') + '">' + (FORMATS[fmt] || fmt) + '</span>';
}
function card(titreCarte, html, sous) {
  var s = '';
  if (sous) {
    s = ' <small>' + sous + '</small>';
  }
  return '<section class="card"><h2>' + titreCarte + s + '</h2>' + html + '</section>';
}
function kpis(list) {
  return '<div class="kpis">' + list.map(function (k) {
    return '<div class="kpi"><b>' + k[0] + '</b><i>' + k[1] + '</i></div>';
  }).join('') + '</div>';
}
// arrondit un maximum à une graduation lisible (1, 2, 5, 10, 20…)
function echelle(m) {
  if (m <= 0) {
    return 1;
  }
  var p = Math.pow(10, Math.floor(Math.log10(m)));
  var f = m / p;
  var pas = [1, 2, 5, 10];
  if (m >= 10) {
    pas = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  }
  var n = pas.find(function (x) { return f <= x; });
  return n * p;
}
function nombre(v) {
  return String(round(v, 1)).replace('.', ',');
}
function sansBalises(t) {
  return String(t).replace(/<[^>]+>/g, '');
}
// barres horizontales, avec graduation en dessous ; opts : {unite, max}
function bars(items, opts) {
  opts = opts || {};
  var unite = opts.unite || '';
  var max = opts.max || echelle(Math.max.apply(null, items.map(function (i) { return i.v; }).concat([0])));
  var lignes = items.map(function (i) {
    var txt = i.txt;
    if (txt === undefined) {
      txt = nombre(i.v) + unite;
    }
    var col = '';
    if (i.c) {
      col = ';background:' + i.c;
    }
    return '<div class="bar" data-tip="' + esc(i.l + ' : ' + sansBalises(txt)) + '"><span class="lab">' + esc(i.l) + '</span><div class="trk"><div class="fil" style="width:' + (100 * i.v / max) + '%' + col + '"></div></div><span class="val">' + txt + '</span></div>';
  }).join('');
  return lignes + '<div class="bar axe-x"><span></span><div class="graduations"><span>0</span><span>' + nombre(max / 2) + '</span><span>' + nombre(max) + unite + '</span></div><span></span></div>';
}
// colonnes verticales avec axe gradué ; opts : {unite, noms (libellés complets pour la bulle)}
function colonnes(vals, labels, opts) {
  opts = opts || {};
  var unite = opts.unite || '';
  var noms = opts.noms || labels;
  var max = echelle(Math.max.apply(null, vals.concat([0])));
  var cols = vals.map(function (v, i) {
    return '<div class="col" data-tip="' + esc(noms[i] + ' : ' + nombre(v) + unite) + '"><i style="height:' + (100 * v / max) + '%"></i></div>';
  }).join('');
  return '<div class="graph"><div class="axe-y"><span>' + nombre(max) + '</span><span>' + nombre(max / 2) + '</span><span>0</span></div><div><div class="cols">' + cols + '</div><div class="colslab">' + labels.map(function (l) { return '<span>' + l + '</span>'; }).join('') + '</div></div></div>';
}

// bulle qui affiche la valeur de l'élément touché (barre, colonne, case du calendrier)
var bulleMinuteur = null;
function montrerBulle(el) {
  var b = document.getElementById('bulle');
  if (!b) {
    b = document.createElement('div');
    b.id = 'bulle';
    b.className = 'bulle';
    document.body.appendChild(b);
  }
  document.querySelectorAll('.actif').forEach(function (x) { x.classList.remove('actif'); });
  el.classList.add('actif');
  b.textContent = el.dataset.tip;
  var r = el.getBoundingClientRect();
  var x = Math.max(80, Math.min(window.innerWidth - 80, r.left + r.width / 2));
  b.style.left = x + 'px';
  if (r.top < 60) {
    b.style.top = (r.bottom + 8) + 'px';
    b.classList.add('dessous');
  } else {
    b.style.top = (r.top - 8) + 'px';
    b.classList.remove('dessous');
  }
  b.classList.add('vis');
  clearTimeout(bulleMinuteur);
  bulleMinuteur = setTimeout(cacherBulle, 3000);
}
function cacherBulle() {
  var b = document.getElementById('bulle');
  if (b) {
    b.classList.remove('vis');
  }
  document.querySelectorAll('.actif').forEach(function (x) { x.classList.remove('actif'); });
}
window.addEventListener('scroll', cacherBulle, {passive: true});
function seg(groupe, items) {
  return '<div class="seg">' + items.map(function (it) {
    var cls = '';
    if (sous[groupe] === it[0]) {
      cls = ' class="on"';
    }
    return '<button' + cls + ' data-seg="' + groupe + ':' + it[0] + '">' + it[1] + '</button>';
  }).join('') + '</div>';
}
function ligneLivre(b, sousTitre, attrs) {
  return '<div class="book" ' + (attrs || '') + '>' + cover(b) + '<div><div class="t">' + esc(titre(b)) + '</div><div class="small muted">' + esc((b.authors || []).join(', ')) + '</div><div class="small">' + pill(b.book_type) + ' ' + sousTitre + '</div></div></div>';
}
function melanger(a) {
  var l = a.slice();
  for (var i = l.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = l[i];
    l[i] = l[j];
    l[j] = t;
  }
  return l;
}

// ---------- feuille (fenêtre qui monte du bas) ----------
function ouvrirFeuille(html) {
  fermerFeuille();
  var d = document.createElement('div');
  d.className = 'sheet-bg';
  d.id = 'feuille';
  d.innerHTML = '<div class="sheet"><button class="sheet-x" data-act="fermer" aria-label="Fermer">✕</button>' + html + '</div>';
  d.addEventListener('click', function (e) {
    if (e.target === d) {
      fermerFeuille();
    }
  });
  document.body.appendChild(d);
  return d.querySelector('.sheet');
}
function fermerFeuille() {
  var f = document.getElementById('feuille');
  if (f) {
    f.remove();
  }
}
ACTIONS.fermer = fermerFeuille;

// clics et changements délégués : data-seg, data-act, data-chg
document.addEventListener('click', function (e) {
  var tip = e.target.closest('[data-tip]');
  if (tip) {
    montrerBulle(tip);
  } else {
    cacherBulle();
  }
  var s = e.target.closest('[data-seg]');
  if (s) {
    var p = s.dataset.seg.split(':');
    sous[p[0]] = p[1];
    lsSet('bm_sous', JSON.stringify(sous));
    rendre();
    return;
  }
  var a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) {
    ACTIONS[a.dataset.act](a, e);
  }
});
document.addEventListener('change', function (e) {
  var c = e.target.closest('[data-chg]');
  if (c && ACTIONS[c.dataset.chg]) {
    ACTIONS[c.dataset.chg](c, e);
  }
});

// ---------- thèmes ----------
var THEMES = [['auto', '🌗', 'Auto'], ['light', '🌸', 'Rose féerique'], ['dark', '🌙', 'Nuit enchantée'], ['autumn', '🍂', 'Automne cosy']];
function appliquerTheme(t) {
  if (t === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', t);
  }
  var motifs = ['✦', '✧'];
  if (t === 'autumn') {
    motifs = ['🍂', '🍁'];
  }
  document.querySelectorAll('.etoiles i').forEach(function (el, i) {
    el.textContent = motifs[i % 2];
  });
  document.getElementById('themes').innerHTML = THEMES.map(function (th) {
    var cls = 'chip';
    if (th[0] === t) {
      cls += ' on';
    }
    return '<button class="' + cls + '" data-act="theme" data-t="' + th[0] + '">' + th[1] + ' ' + th[2] + '</button>';
  }).join('');
}
ACTIONS.theme = function (el) {
  lsSet('bm_theme', el.dataset.t);
  appliquerTheme(el.dataset.t);
};
document.getElementById('themeBtn').addEventListener('click', function () {
  var t = document.getElementById('themes');
  t.hidden = !t.hidden;
});

// ---------- genres : tags Goodreads regroupés et traduits ----------
// null = pas un genre (format, pays, époque, étiquette trop générale) : le tag est ignoré
var GENRES_FR = {
  'fiction': null, 'roman': null, 'romans': null, 'novels': null, 'littérature': null, 'literature': null,
  'adult': null, 'adultfiction': null, 'bookclub': null, 'adaptations': null, 'novella': null, 'anthologies': null,
  'audiobook': null, 'performancesaudio': null, 'ebooks': null, 'ebook': null, 'kindle': null, 'audible': null,
  '20esiècle': null, 'xxesiècle': null, '20thcentury': null, '19thcentury': null, '21stcentury': null,
  'produitsdérivésdefilms': null, 'séries': null, 'jeuxvidéo': null, 'rêve': null, 'theory': null,
  'maladie': null, 'pathologiesphysiques': null, 'mentalhealth': null, 'autisticspectrumdisorder': null, 'disability': null,
  'france': null, 'française': null, 'frenchliterature': null, 'scandinave': null, 'scandinavianliterature': null,
  'denmark': null, 'danish': null, 'portugal': null, 'portugueseliterature': null, 'anglais': null, 'asia': null,
  'corée': null, 'american': null, 'theunitedstatesofamerica': null, 'russia': null, 'canada': null, 'afro-américaine': null,
  'japan': null, 'japanese': null, 'british': null, 'england': null, 'germany': null, 'italy': null, 'spain': null,
  'fantasy': 'Fantasy', 'highfantasy': 'Fantasy', 'epicfantasy': 'Fantasy', 'urbanfantasy': 'Fantasy', 'scififantasy': 'Fantasy',
  'darkfantasy': 'Dark fantasy', 'romantasy': 'Romantasy', 'cozyfantasy': 'Cosy', 'cozy': 'Cosy', 'cozymystery': 'Cosy',
  'magic': 'Magie', 'magie': 'Magie', 'witches': 'Magie', 'mythology': 'Mythologie', 'mythes': 'Mythologie', 'légendes': 'Mythologie',
  'fairytales': 'Contes', 'contesdefées': 'Contes', 'retellings': 'Contes', 'magicalrealism': 'Réalisme magique', 'réalismemagique': 'Réalisme magique',
  'paranormal': 'Surnaturel', 'surnaturel': 'Surnaturel', 'steampunk': 'Steampunk',

function genresFr(tags) {
  var vus = {};
  var l = [];
  tags.forEach(function (t) {
    var k = t.toLowerCase();
    var g;
    if (Object.prototype.hasOwnProperty.call(GENRES_FR, k)) {
      g = GENRES_FR[k];
    } else {
      // tag inconnu : on le garde, en séparant les mots collés
      g = t.replace(/([a-zà-ÿ])([A-Z])/g, '$1 $2');
      g = g.charAt(0).toUpperCase() + g.slice(1);
    }
    if (g && !vus[g]) {
      vus[g] = 1;
      l.push(g);
    }
  });
  return l;
}

// ---------- modèle ----------
function modele(S) {
  var series = {};
  (S.series || []).forEach(function (s) { series[s._key] = s; });
  var livres = (S.books || []).map(function (b) {
    b.id = b._key;
    b.tagsBruts = (b.tags || '').split(/\s+/).filter(Boolean).map(function (t) { return t.replace(/^#/, ''); });
    b.tagList = genresFr(b.tagsBruts);
    b.statut = (b.status_list || [])[0] || 'NOT_STARTED';
    return b;
  });
  var parId = {};
  livres.forEach(function (b) { parId[b.id] = b; });
  var lectures = [];
  livres.forEach(function (b) {
    (b.reads || []).forEach(function (r) {
      r.book = b;
      r.fmt = r.book_type || b.book_type;
      r.date = r.end || r.start;
      r.logs = (r.page_log_list || []).slice().sort(function (x, y) { return x.created_at - y.created_at; });
      lectures.push(r);
    });
  });
  var notes = (S.notes || []).map(function (n) {
    var txt = '';
    try {
      txt = JSON.parse(n.content_quill).map(function (op) {
        if (typeof op.insert === 'string') {
          return op.insert;
        }
        return '';
      }).join('').trim();
    } catch (e) {}
    n.texte = txt;
    n.book = parId[n.bid];
    return n;
  });
  var jours = {};
  var joursLivres = {};
  (S.streak_caches || []).forEach(function (s) {
    jours[s._key] = (s.bids || []).length || 1;
    joursLivres[s._key] = s.bids || [];
  });
  return {livres: livres, lectures: lectures, notes: notes, series: series, jours: jours, joursLivres: joursLivres, parId: parId};
}

// ---------- calculs partagés ----------
function series_jours(filtre) {
  var J = jours();
  var keys = Object.keys(J).sort();
  if (filtre) {
    keys = keys.filter(filtre);
  }
  var best = 0, cur = 0, prev = null, bestFin = null;
  keys.forEach(function (k) {
    var d = new Date(k + 'T12:00:00');
    if (prev && Math.round((d - prev) / DAY) === 1) {
      cur++;
    } else {
      cur = 1;
    }
    if (cur > best) {
      best = cur;
      bestFin = k;
    }
    prev = d;
  });
  var d = new Date();
  if (!J[dkey(d)]) {
    d = new Date(Date.now() - DAY);
  }
  var actuelle = 0;
  while (J[dkey(d)]) {
    actuelle++;
    d = new Date(d.getTime() - DAY);
  }
  return {best: best, bestFin: bestFin, actuelle: actuelle, total: keys.length};
}

// pages lues par jour (livres papier/ebook suivis page par page)
function pagesParJour() {
  var p = {};
  lect().forEach(function (r) {
    if (r.fmt === 'audioBook' || r.page_type !== 'PAGE') {
      return;
    }
    var prev = 0;
    r.logs.forEach(function (l, i) {
      var delta = l.page - prev;
      prev = l.page;
      // premier relevé = livre saisi d'un coup, pas une vraie journée de lecture
      if (i === 0 && l.page >= (r.total_page || 1) * 0.9) {
        return;
      }
      if (delta > 0 && delta < 600) {
        var k = dkey(new Date(l.created_at));
        p[k] = (p[k] || 0) + delta;
      }
    });
  });
  return p;
}

function affinites() {

      if (!t[tag]) {
        t[tag] = {n: 0, notes: [], abandons: 0};

      t[tag].n++;
      if (r.star) {
        t[tag].notes.push(r.star);

      if (r.status === 'GIVE_UP') {

}

function projection(r) {

  var jrs = Math.max(1, (Date.now() - t0) / DAY);

  var pct = 0;

}

  }

  h += card('Jours de lecture', '<div class="scroll"><div class="heat-mois" style="width:' + (semaine * 14) + 'px">' + mois + '</div><div class="heat">' + cells + '</div></div>' + legende + '<p class="small muted">' + nb + ' jours de lecture sur les 12 derniers mois · ' + sj.total + ' au total · record : ' + sj.best + ' jours d\'affilée (fin le ' + fdate(new Date(sj.bestFin + 'T12:00').getTime()) + ')</p>', 'touche une case pour voir le jour');

  var ppj = pagesParJour();
  var cles = Object.keys(ppj).sort();
  if (cles.length) {
    var vals = cles.map(function (k) { return ppj[k]; });
    var maxK = cles[vals.indexOf(Math.max.apply(null, vals))];
    var sem = [];
    for (var i = 11; i >= 0; i--) {
      var fin = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i * 7);

  });

function svgRoue(livres) {
  var n = livres.length;
  var R = 150, cx = 150, cy = 150;
  var parts = '';
  var couleurs = ['var(--accent)', 'var(--lav)', 'var(--gold)', 'color-mix(in srgb,var(--accent) 60%,#fff)', 'color-mix(in srgb,var(--lav) 60%,#fff)', 'color-mix(in srgb,var(--gold) 55%,#fff)'];
  livres.forEach(function (b, i) {
    var a0 = (i / n) * 2 * Math.PI - Math.PI / 2;
    var a1 = ((i + 1) / n) * 2 * Math.PI - Math.PI / 2;
    var x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    var x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    var grand = 0;
    if (a1 - a0 > Math.PI) {
      grand = 1;
    }
    var coul = couleurs[i % couleurs.length];
    if (n % couleurs.length === 1 && i === n - 1) {
      coul = couleurs[1];
    }
    parts += '<path d="M' + cx + ',' + cy + ' L' + x0.toFixed(1) + ',' + y0.toFixed(1) + ' A' + R + ',' + R + ' 0 ' + grand + ' 1 ' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' Z" fill="' + coul + '" stroke="var(--card)" stroke-width="2"/>';
    var am = ((i + 0.5) / n) * 360 - 90;
    var t = titre(b);
    if (t.length > 16) {
      t = t.slice(0, 15) + '…';
    }
    parts += '<text x="' + (cx + 44) + '" y="' + (cy + 4) + '" transform="rotate(' + am.toFixed(2) + ' ' + cx + ' ' + cy + ')" fill="#fff" font-size="11" font-weight="700" font-family="Nunito,sans-serif">' + esc(t) + '</text>';
  });
  return '<svg class="roue" id="roue" viewBox="0 0 300 300" style="transform:rotate(' + roue.rot + 'deg)"><circle cx="150" cy="150" r="149" fill="var(--card)"/>' + parts + '<circle cx="150" cy="150" r="148" fill="none" stroke="var(--gold)" stroke-width="3"/></svg>';
}
function vALire() {
  var h = '';

    roue.livres = melanger(candidatsRoue()).slice(0, 10);

  var envies = M.livres.filter(function (b) { return b.wishlist; }).sort(function (a, b) { return a.created_at - b.created_at; });

  var reco = pal.concat(envies).filter(function (b) { return !(EXCLUS[b.id] && EXCLUS[b.id].reco); }).map(function (b) { return {b: b, s: score(b)}; }).filter(function (x) { return x.s > 0; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 5);
  h += card('Les élus de ton cœur', reco.map(function (x) {

  }).join('') + noteExclus('reco'), 'calculé sur tes notes et abandons par genre');
  h += card('Ma pile à lire (' + pal.length + ')', pal.map(function (b) { return ligneLivre(b, 'depuis ' + depuis(b.created_at), 'data-act="livre" data-id="' + b.id + '"'); }).join('') || '<p class="muted">Vide !</p>', 'les plus anciens d\'abord');
  h += card('Envies (' + envies.length + ')', envies.slice(0, 15).map(function (b) { return ligneLivre(b, 'depuis ' + depuis(b.created_at), 'data-act="livre" data-id="' + b.id + '"'); }).join(''), 'les 15 plus anciennes');

function vSeries() {
  var parSerie = {};

    });
  });

  }
  return card('Tes séries', cles.map(function (k) {
    var s = M.series[k] || {name: 'Série'};
    var l = parSerie[k].sort(function (a, b) { return a.n - b.n; });
    var max = Math.max(l[l.length - 1].n || 0, (s.nbTomes || 0) + 1);
    var nums = l.map(function (x) { return x.n; });
    var manquants = [];
    for (var i = 1; i < max; i++) {
      if (nums.indexOf(i) < 0) {
        manquants.push(i);
      }
    }
    var suivant = l.find(function (x) { return x.b.statut !== 'DONE'; });
    var lus = l.filter(function (x) { return x.b.statut === 'DONE'; }).length;
    var info = lus + ' / ' + l.length + ' lus';
    if (suivant) {
      info += ' · à lire : tome ' + suivant.n + ' (' + esc(titre(suivant.b)) + ')';
    } else if (s.status === 'ongoing') {
      info += ' · tout lu, série en cours de parution';
    } else if (s.nbTomes && l.length < s.nbTomes) {
      info += ' · tout ce que tu as est lu (' + l.length + ' / ' + s.nbTomes + ' tomes)';
    } else {
      info += ' · terminée ✅';
    }
    if (manquants.length) {
      info += ' · absent(s) de ta bibliothèque : tome ' + manquants.join(', ');
    }
    return '<div style="margin:10px 0 16px"><b style="font:700 18px Cormorant Garamond,Georgia,serif">' + esc(s.name) + '</b> <button class="mini-btn" data-act="formSerie" data-id="' + esc(k) + '">✏️</button><div class="shelf" style="min-height:0;padding-top:8px">' + l.map(function (x) { return tranche(x.b, 0); }).join('') + '</div><div class="prog"><div style="width:' + (100 * lus / l.length) + '%"></div></div><div class="small muted">' + info + '</div></div>';
  }).join(''));
}

<script>
// ---------- Carnet : notes détaillées, citations ----------
var CRITERES = [['perso', '👥', 'Personnages'], ['plume', '✒️', 'Plume'], ['intrigue', '🗝️', 'Intrigue'], ['emotions', '💧', 'Émotions'], ['univers', '🏰', 'Univers']];

var TROPES = ['Ennemis devenus amants', 'Romance à feu doux', 'Famille de cœur', 'L\'élu·e', 'Proximité forcée', 'Faux couple', 'Grincheux × rayon de soleil', 'Seconde chance', 'Héros ni bon ni méchant', 'Triangle amoureux', 'Académie de magie', 'Fées et Faërie', 'Dragons', 'Enquête', 'Huis clos', 'Retournement final'];

function vCarnet() {

function statsCarnet(ids) {

// ---------- éditeur d'une note ----------
ACTIONS.noter = function (el) {

  var n = NOTES[id] || {};

function pips(champ, val, symbole, max) {

// ---------- carte-citation en image ----------
function couleurVar(nom) {
  return getComputedStyle(document.documentElement).getPropertyValue(nom).trim();
}
function lignesTexte(ctx, texte, largeur) {
  var mots = texte.split(/\s+/);
  var lignes = [];
  var cur = '';
  mots.forEach(function (m) {
    var essai = cur;
    if (essai) {
      essai += ' ';
    }
    essai += m;
    if (ctx.measureText(essai).width > largeur && cur) {
      lignes.push(cur);
      cur = m;
    } else {
      cur = essai;
    }
  });
  if (cur) {
    lignes.push(cur);
  }
  return lignes;
}
ACTIONS.imageCitation = function (el) {
  var n = M.notes.filter(function (x) { return x._key === el.dataset.k; })[0];
  if (!n) {
    return;
  }
  var polices = Promise.all([
    document.fonts.load('italic 600 54px "Cormorant Garamond"'),
    document.fonts.load('700 44px "Dancing Script"'),
    document.fonts.load('600 30px Nunito')
  ]).catch(function () {});
  polices.then(function () {
    var W = 1080, H = 1350;
    var cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    var ctx = cv.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, couleurVar('--accent-soft'));
    g.addColorStop(1, couleurVar('--lav-soft'));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = couleurVar('--gold');
    for (var i = 0; i < 46; i++) {
      var x = (i * 389) % W, y = (i * 613) % H, r = 1 + (i % 4);
      ctx.globalAlpha = 0.25 + (i % 5) / 8;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = couleurVar('--gold');
    ctx.lineWidth = 3;
    ctx.strokeRect(50, 50, W - 100, H - 100);
    ctx.lineWidth = 1;
    ctx.strokeRect(64, 64, W - 128, H - 128);
    ctx.textAlign = 'center';
    ctx.fillStyle = couleurVar('--accent');
    ctx.font = '700 120px "Cormorant Garamond", Georgia, serif';
    ctx.fillText('❝', W / 2, 270);
    var taille = 58;
    if (n.texte.length > 260) {
      taille = 44;
    }
    if (n.texte.length > 480) {
      taille = 34;
    }
    ctx.font = 'italic 600 ' + taille + 'px "Cormorant Garamond", Georgia, serif';
    ctx.fillStyle = couleurVar('--ink');
    var lignes = lignesTexte(ctx, n.texte, W - 240);
    var hl = taille * 1.35;
    var y0 = H / 2 - (lignes.length * hl) / 2 + taille / 2;
    lignes.forEach(function (l, i) {
      ctx.fillText(l, W / 2, y0 + i * hl);
    });
    if (n.book) {
      ctx.font = '700 46px "Dancing Script", cursive';
      ctx.fillStyle = couleurVar('--accent');
      ctx.fillText(titre(n.book), W / 2, H - 230);
      ctx.font = '600 28px Nunito, sans-serif';
      ctx.fillStyle = couleurVar('--muted');
      ctx.fillText((n.book.authors || []).join(', '), W / 2, H - 180);
    }
    ctx.font = '600 24px Nunito, sans-serif';
    ctx.fillStyle = couleurVar('--gold');
    ctx.fillText('✦  Mon grimoire de lectures  ✦', W / 2, H - 110);
    var url = cv.toDataURL('image/png');
    ouvrirFeuille('<h3>Ta carte citation</h3><p class="small muted">Sur ton téléphone : appui long sur l\'image → « Enregistrer l\'image ».</p><img src="' + url + '" alt="Carte citation" style="width:100%;border-radius:14px;box-shadow:var(--shadow)"><div class="row" style="margin-top:12px"><a class="act" href="' + url + '" download="citation.png">⬇️ Télécharger</a></div>');
  });
};

<script>

      c = '✧';
    }
    h += '<i style="left:' + ((i * 37) % 95) + '%;top:' + ((i * 53) % 92) + '%;font-size:' + (8 + (i % 4) * 4) + 'px;animation-delay:' + (i % 5) * 0.4 + 's">' + c + '</i>';
  }
  return '<div class="paillettes">' + h + '</div>';
}

function afficherStory() {
  var el = document.getElementById('story');
  if (!el) {
    return;
  }
  clearTimeout(story.minuteur);
  var barres = story.slides.map(function (x, k) {
    var cls = '';
    if (k < story.i) {
      cls = 'fait';
    } else if (k === story.i) {
      cls = 'cours';
    }
    return '<i class="' + cls + '"><b></b></i>';
  }).join('');
  el.style.background = FONDS[story.i % FONDS.length];
  el.innerHTML = '<div class="bars">' + barres + '</div><button class="x" data-act="fermerStory" aria-label="Fermer">✕</button>' + paillettes() + '<div class="slide">' + story.slides[story.i] + '</div>';
  story.minuteur = setTimeout(function () { avancerStory(1); }, 6000);
}
function avancerStory(pas) {
  var i = story.i + pas;
  if (i < 0) {
    i = 0;
  }
  if (i >= story.slides.length) {
    ACTIONS.fermerStory();
    return;
  }
  story.i = i;
  afficherStory();
}
ACTIONS.wrapped = function (el) {
  story.slides = slidesAnnee(parseInt(el.dataset.an, 10));
  story.i = 0;
  var d = document.createElement('div');
  d.className = 'story';
  d.id = 'story';
  d.addEventListener('click', function (e) {
    if (e.target.closest('[data-act]')) {
      return;
    }
    if (e.clientX < window.innerWidth / 3) {
      avancerStory(-1);
    } else {
      avancerStory(1);
    }
  });
  document.body.appendChild(d);
  afficherStory();
};
ACTIONS.fermerStory = function () {
  clearTimeout(story.minuteur);
  var el = document.getElementById('story');
  if (el) {
    el.remove();
  }
};
</script>

// dimanche de Pâques (calcul grégorien)
function paquesDe(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  var h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  var l = (32 + 2 * e + 2 * i - h - k) % 7;
  var m = Math.floor((a + 11 * h + 22 * l) / 451);
  var mois = Math.floor((h + l - 7 * m + 114) / 31);
  var jour = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mois - 1, jour);
}
// la lune est-elle pleine ce jour-là ? (à environ un jour près)
function pleineLune(d) {
  var ref = Date.UTC(2000, 0, 6, 18, 14);
  var lunaison = 29.530588853;
  var midi = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTime();
  var phase = (((midi - ref) / DAY / lunaison) % 1 + 1) % 1;
  return Math.abs(phase - 0.5) < 0.5 / lunaison;
}
function feteDuJour(d) {
  var m = d.getMonth() + 1, j = d.getDate(), y = d.getFullYear();
  if ((m === 12 && j >= 27) || (m === 1 && j <= 3)) {
    return 'nouvelan';
  }
  if (m === 12) {
    return 'noel';
  }
  if ((m === 10 && j >= 25) || (m === 11 && j === 1)) {
    return 'halloween';
  }
  if (m === 2 && j >= 10 && j <= 14) {
    return 'valentin';
  }
  if (m === 2 && j === 2) {
    return 'chandeleur';
  }
  var p = paquesDe(y).getTime();
  var t = new Date(y, m - 1, j).getTime();
  if (t >= p - 3 * DAY && t <= p + DAY) {
    return 'paques';
  }
  if (m === 4 && j === 1) {
    return 'poisson';
  }
  if (m === 4 && j === 23) {
    return 'livre';
  }
  if (m === 6 && j === 21) {
    return 'musique';
  }
  if (m === 8 && j === 8) {
    return 'chat';
  }
  if (m === 8 && j >= 10 && j <= 13) {
    return 'etoiles';
  }
  if (j === 13 && d.getDay() === 5) {
    return 'vendredi13';
  }
  if (pleineLune(d)) {
    return 'pleinelune';
  }
  if (m === 9 && j <= 15) {
    return 'rentree';
  }
  if (m === 10) {
    return 'imaginaire';
  }
  var md = m * 100 + j;
  if (md >= 320 && md <= 620) {
    return 'printemps';
  }
  if (md >= 621 && md <= 922) {
    return 'ete';
  }
  if (md >= 923 && md <= 1220) {
    return 'automne';
  }
  return 'hiver';
}

var THEMES = [['fetes', '✨', 'Au fil de l\'année'], ['auto', '🌗', 'Auto'], ['light', '🌸', 'Rose féerique'], ['dark', '🌙', 'Nuit enchantée'], ['autumn', '🍂', 'Automne cosy']];

function appliquerTheme(t) {

    return '<option value="' + k + '"' + sel + '>' + FETES[k].emoji + ' ' + FETES[k].nom + '</option>';
  }).join('') + '</select>';
  document.getElementById('themes').innerHTML = THEMES.map(function (th) {
    var cls = 'chip';

      cls += ' on';

    return '<button class="' + cls + '" data-act="theme" data-t="' + th[0] + '">' + th[1] + ' ' + th[2] + '</button>';
  }).join('') + '<div>' + essai + '</div>';
}

<script>
// ---------- Scanner de code-barres (en librairie : « est-ce que je l'ai déjà ? ») ----------
var scan = {flux: null, minuteur: null, detecteur: null, surCode: null, trouve: false};

function chiffres(s) {
  return String(s || '').replace(/[^0-9Xx]/g, '').toUpperCase();
}
// convertit un ISBN-10 en ISBN-13 pour pouvoir comparer
function isbn13(s) {
  var c = chiffres(s);
  if (c.length === 13) {
    return c;
  }
  if (c.length !== 10) {
    return '';
  }
  var base = '978' + c.slice(0, 9);
  var somme = 0;
  for (var i = 0; i < 12; i++) {
    var poids = 1;
    if (i % 2 === 1) {
      poids = 3;
    }
    somme += parseInt(base[i], 10) * poids;
  }
  return base + ((10 - somme % 10) % 10);
}
function normTitre(t) {
  return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\([^)]*\)/g, ' ').split(/\s[:\-–]\s|:/)[0].replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
// « Jennifer Twice » → {nom: 'twice', initiale: 'j'} ; gère « Nom, Prénom » et « A & B »
function personnes(l) {
  var p = [];
  (l || []).join(' & ').split(/\s*(?:&|;| et | and )\s*/).forEach(function (n) {
    n = n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    if (!n) {
      return;
    }
    var mots;
    if (n.indexOf(',') > 0) {
      var parts = n.split(',');
      mots = (parts[1] + ' ' + parts[0]).split(/[^a-z]+/).filter(Boolean);
    } else {
      mots = n.split(/[^a-z]+/).filter(Boolean);
    }
    if (!mots.length) {
      return;
    }
    var initiale = '';
    if (mots.length > 1) {
      initiale = mots[0][0];
    }
    p.push({nom: mots[mots.length - 1], initiale: initiale});
  });
  return p;
}
function memeAuteur(a, b) {
  var pa = personnes(a), pb = personnes(b);
  return pa.some(function (x) {
    return pb.some(function (y) {
      return x.nom === y.nom && x.nom.length >= 3 && (!x.initiale || !y.initiale || x.initiale === y.initiale);
    });
  });
}

// ---------- caméra ----------
// surCode(isbn) : ce qu'on fait du code lu (par défaut, le verdict « déjà lu / pile / nouveau »)
function ouvrirScanner(surCode) {
  fermerFeuille();
  scan.surCode = null;
  if (typeof surCode === 'function') {
    scan.surCode = surCode;
  }
  scan.trouve = false;
  var d = document.createElement('div');
  d.className = 'scan';
  d.id = 'scan';
  d.innerHTML = '<video playsinline muted></video><div class="viseur"></div><div class="haut"><button data-act="fermerScanner" aria-label="Fermer">✕</button><button id="torche" data-act="torche" aria-label="Lampe" hidden>🔦</button></div><div class="consigne">Vise le code-barres du livre</div><div class="bas"><input id="isbnManuel" inputmode="numeric" placeholder="ou tape l\'ISBN"><button data-act="isbnManuel">Chercher</button></div>';
  document.body.appendChild(d);
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) {
    d.querySelector('.consigne').textContent = 'Ce navigateur ne sait pas lire les codes-barres : tape l\'ISBN';
    return;
  }
  scan.detecteur = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e']});
  navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false}).then(function (flux) {
    scan.flux = flux;
    var v = d.querySelector('video');
    v.srcObject = flux;
    v.play();
    var piste = flux.getVideoTracks()[0];
    if (piste.getCapabilities && piste.getCapabilities().torch) {
      document.getElementById('torche').hidden = false;
    }
    scan.minuteur = setInterval(function () {
      if (v.readyState < 2) {
        return;

<script>

  });

  var nbPhotos = 0;
  (S.notes || []).forEach(function (n) {
    var photoId = null;
    var fichier = ((n.images || [])[0] || '').split('/').pop();
    if (fichier) {
      var pid = 'p:' + fichier;
      if (images[fichier]) {
        mettre('photos', {id: pid, blob: images[fichier], type: images[fichier].type || 'image/jpeg', creeLe: n.created_at});
        photoId = pid;
        nbPhotos++;
      } else if (D.photos[pid]) {
        // export sans photos : on garde celle déjà importée
        nouveaux.photos[pid] = D.photos[pid];
        photoId = pid;
      }
    }
    var type = 'citation';
    if (n.type === 'THOUGHT') {
      type = 'pensee';
    }
    var lectureId = null;
    if (n.read_nth) {
      lectureId = n.bid + ':' + n.read_nth;
    }
    mettre('citations', {
      id: n._key,
      livreId: n.bid,
      lectureId: lectureId,
      type: type,
      texte: texteQuill(n.content_quill),
      page: n.page || null,
      pageFin: n.page_end || null,
      photoId: photoId,
      favori: !!n.like,
      commentaires: (n.comments || []).map(function (c) { return {texte: c.content || '', creeLe: c.created_at}; }),
      creeLe: n.created_at,
      modifieLe: n.updated_at
    });
  });

  // miroir : ce qui venait de Bookmory et n'y est plus disparaît (les données du grimoire restent)
  var suppressions = 0;
  TABLES_BOOKMORY.forEach(function (t) {
    valeurs(D[t]).forEach(function (o) {
      if (o.origine === 'bookmory' && !nouveaux[t][o.id]) {
        ops.push({t: t, suppr: o.id});
        suppressions++;
      }
    });
  });

  // carnet, exclusions et objectif de la version précédente (seulement s'ils n'existent pas encore)
  var nbAvis = 0;
  Object.keys(ancien.notes || {}).forEach(function (id) {
    if (!D.avis[id] && nouveaux.livres[id]) {
      avisDepuisNote(id, ancien.notes[id]).forEach(function (op) {
        if (op.t === 'avis') {
          nbAvis++;
          op.o.creeLe = ancien.notes[id].maj;
        }
        ops.push(op);
      });
    }
  });
  var y = String(new Date().getFullYear());
  if (ancien.objectif && !D.objectifs[y]) {
    ops.push({t: 'objectifs', o: {id: y, livres: parseInt(ancien.objectif, 10) || 25}});
  }

  return {
    ops: opsListes.concat(ops),
    recap: {
      livres: Object.keys(nouveaux.livres).length,
      lectures: Object.keys(nouveaux.lectures).length,
      sessions: Object.keys(nouveaux.sessions).length,
      citations: Object.keys(nouveaux.citations).length,
      photos: nbPhotos,
      achats: Object.keys(nouveaux.achats).length,
      series: Object.keys(nouveaux.series).length,
      auteurs: Object.keys(nouveaux.auteurs).length,
      avis: nbAvis,
      suppressions: suppressions
    }
  };
}

// ancien carnet, exclusions et objectif (localStorage de la version « lecture seule »)
function ancienCarnet() {
  var a = {notes: {}, exclus: {}, objectif: lsGet('bm_objectif')};
  try {
    a.notes = JSON.parse(lsGet('bm_notes') || '{}');
  } catch (e) {}
  try {
    a.exclus = JSON.parse(lsGet('bm_exclus') || '{}');
  } catch (e) {}
  return a;
}

function texteRecap(r) {
  var morceaux = [r.livres + ' livres', r.lectures + ' lectures', r.sessions + ' relevés et minuteurs', r.citations + ' citations'];
  if (r.photos) {
    morceaux.push(r.photos + ' photos');
  }
  morceaux.push(r.achats + ' achats', r.series + ' séries');
  if (r.avis) {
    morceaux.push(r.avis + ' notes de carnet');
  }
  return morceaux.join(' · ');
}

// Importe un export : renvoie le récapitulatif. Ne redessine rien (l'appelant décide).
function importerBookmory(buf) {
  return lireExportBookmory(buf).then(function (lu) {
    var c = convertirBookmory(lu.stores, lu.images, ancienCarnet());
    return ecrire(c.ops).then(function () {
      return regler('dernierImport', {date: Date.now(), recap: c.recap});
    }).then(function () {
      return c.recap;
    });
  });
}
</script>

<script>
// ---------- Sauvegarde : tout le grimoire dans un zip (donnees.json + photos/) ----------
var FORMAT_SAUVEGARDE = 'grimoire';
// réglages qui ne quittent jamais le téléphone
var REGLAGES_PRIVES = ['liaison'];

function nomFichierPhoto(id, type) {
  var ext = 'jpg';
  if (/png/.test(type || '')) {
    ext = 'png';
  } else if (/webp/.test(type || '')) {
    ext = 'webp';
  }
  return 'photos/' + id.replace(/^p:/, '').replace(/\.(jpe?g|png|webp)$/i, '').replace(/[^a-zA-Z0-9_-]/g, '_') + '.' + ext;
}

// → Promise<Blob> (zip)
function fabriquerSauvegarde() {
  return jszip().then(function (JSZip) {
    var z = new JSZip();
    var tables = {};
    Object.keys(TABLES).forEach(function (t) {
      if (t === 'photos') {
        return;
      }
      tables[t] = valeurs(D[t]);
      if (t === 'reglages') {
        tables[t] = tables[t].filter(function (r) { return REGLAGES_PRIVES.indexOf(r.id) < 0; });
      }
    });
    var photos = valeurs(D.photos).map(function (p) {
      var f = nomFichierPhoto(p.id, p.type);
      z.file(f, p.blob);
      return {id: p.id, type: p.type, fichier: f, creeLe: p.creeLe, modifieLe: p.modifieLe, origine: p.origine};
    });
    z.file('donnees.json', JSON.stringify({format: FORMAT_SAUVEGARDE, version: BASE_VERSION, date: Date.now(), tables: tables, photos: photos}));
    return z.generateAsync({type: 'blob', compression: 'DEFLATE', compressionOptions: {level: 6}});
  });
}

// Le zip est-il une sauvegarde du grimoire ? → Promise<{donnees, zip}|null>
function lireSauvegarde(buf) {
  if (!estZip(new Uint8Array(buf))) {
    return Promise.resolve(null);
  }
  return jszip().then(function (JSZip) {
    return JSZip.loadAsync(buf);
  }).then(function (z) {
    var f = z.file('donnees.json');
    if (!f) {
      return null;
    }
    return f.async('string').then(function (t) {
      var d = JSON.parse(t);
      if (d.format !== FORMAT_SAUVEGARDE) {
        return null;
      }
      return {donnees: d, zip: z};
    });
  });
}
function resumeSauvegarde(d) {
  var t = d.tables || {};
  function n(x) {
    return (t[x] || []).length;
  }
  return n('livres') + ' livres · ' + n('lectures') + ' lectures · ' + n('citations') + ' citations · ' + (d.photos || []).length + ' photos · du ' + fdate(d.date);
}

// Remplace TOUTE la base par la sauvegarde (les réglages privés du téléphone sont gardés).
function restaurerSauvegarde(lu) {
  var d = lu.donnees;
  var photos = d.photos || [];
  return Promise.all(photos.map(function (p) {
    var f = lu.zip.file(p.fichier);
    if (!f) {
      return null;
    }
    return f.async('blob').then(function (b) {
      return {id: p.id, blob: new Blob([b], {type: p.type || 'image/jpeg'}), type: p.type, creeLe: p.creeLe, modifieLe: p.modifieLe, origine: p.origine};
    });
  })).then(function (ph) {
    var tables = {};
    Object.keys(TABLES).forEach(function (t) {
      tables[t] = (d.tables || {})[t] || [];
    });
    tables.photos = ph.filter(Boolean);
    REGLAGES_PRIVES.forEach(function (k) {
      if (D.reglages[k]) {
        tables.reglages = tables.reglages.filter(function (r) { return r.id !== k; }).concat([D.reglages[k]]);
      }
    });
    return remplacerBase(tables);
  });
}
function remplacerBase(tables) {
  return ouvrirBase().then(function (db) {
    var noms = Object.keys(TABLES);
    return new Promise(function (ok, ko) {
      var tx = db.transaction(noms, 'readwrite');
      noms.forEach(function (t) {
        var s = tx.objectStore(t);
        s.clear();
        (tables[t] || []).forEach(function (o) {
          if (o && o.id !== undefined) {
            s.put(o);
          }
        });
      });
      tx.oncomplete = ok;
      tx.onerror = function () {
        ko(tx.error);
      };
      tx.onabort = function () {
        ko(tx.error || new Error('Restauration annulée'));
      };
    });
  }).then(chargerBase);
}

function nomSauvegarde() {
  return 'grimoire-' + dkey(new Date()) + '.zip';
}
ACTIONS.exporterSauvegarde = function () {
  fabriquerSauvegarde().then(function (blob) {
    var f = new File([blob], nomSauvegarde(), {type: 'application/zip'});
    if (navigator.canShare && navigator.canShare({files: [f]})) {
      return navigator.share({files: [f], title: 'Sauvegarde de mon grimoire'}).catch(function () {});
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    a.click();
  }).catch(erreurEcriture);
};

// ---------- Sauvegarde automatique dans le Drive, par le relais Apps Script ----------
// Code de liaison : « https://script.google.com/macros/s/…/exec#secret », collé une fois dans Réglages.
var DELAI_SAUVEGARDE = 30000;
var minuteurSauvegarde = null;
var sauvegardeEnCours = false;
var etatSauvegarde = '';

function liaison() {
  return reglage('liaison', null);
}
function lireCodeLiaison(code) {
  var m = String(code || '').trim().match(/^(https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec)#([A-Za-z0-9_-]{20,})$/);
  if (!m) {
    return null;
  }
  return {url: m[1], secret: m[2]};
}
function appelRelais(action, champs, l) {
  l = l || liaison();
  if (!l) {
    return Promise.reject(new Error('Sauvegarde Drive pas encore reliée'));
  }
  var corps = Object.assign({secret: l.secret, action: action}, champs || {});
  return fetch(l.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(corps)}).then(function (r) {
    return r.json();
  }).then(function (rep) {
    if (!rep.ok) {
      var msg = rep.erreur;
      if (rep.erreur === 'secret') {
        msg = 'code de liaison refusé';
      }
      throw new Error(msg);
    }
    return rep;
  });
}
function blobEnBase64(blob) {
  return new Promise(function (ok, ko) {
    var r = new FileReader();
    r.onload = function () {
      ok(String(r.result).split(',')[1]);
    };
    r.onerror = function () {
      ko(r.error);
    };
    r.readAsDataURL(blob);
  });
}
function base64EnBuffer(b64) {
  var bin = atob(b64);
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) {
    u8[i] = bin.charCodeAt(i);
  }
  return u8.buffer;
}

function heure(ts) {
  var d = new Date(ts);
  if (dkey(d) === dkey(new Date())) {
    return d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0');
  }
  return fdate(ts);
}
function texteSauvegarde() {
  if (!liaison()) {
    return '';
  }
  if (etatSauvegarde) {
    return etatSauvegarde;
  }
  var d = reglage('derniereSauvegarde');
  if (d) {
    return '☁️ ' + heure(d.date);
  }
  return '☁️ pas encore sauvegardé';
}
function majTemoin(etat) {
  etatSauvegarde = etat || '';
  if (typeof majSource === 'function') {
    majSource();
  }
  var r = document.getElementById('etatDrive');
  if (r) {
    r.textContent = texteSauvegarde();
  }
}

function planifierSauvegarde() {
  if (!liaison()) {
    return;
  }
  lsSet('bm_sauv_attente', '1');
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(sauvegarderMaintenant, DELAI_SAUVEGARDE);
}
apresEcritureHooks.push(planifierSauvegarde);

// force : passe outre le garde-fou (envoi demandé à la main)
function sauvegarderMaintenant(force) {
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = null;
  if (!liaison() || sauvegardeEnCours) {
    return Promise.resolve();
  }
  var n = valeurs(D.livres).length;
  var avant = reglage('derniereSauvegarde');
  // garde-fou : un grimoire soudain vidé ne doit pas écraser les sauvegardes
  if (force !== true && avant && avant.livres && n < avant.livres * 0.8) {
    majTemoin('⚠️ sauvegarde suspendue (' + n + ' livres au lieu de ' + avant.livres + ')');
    return Promise.resolve();
  }
  sauvegardeEnCours = true;
  majTemoin('☁️ sauvegarde…');
  return fabriquerSauvegarde().then(blobEnBase64).then(function (b64) {
    return appelRelais('sauver', {contenu: b64, jour: dkey(new Date())});
  }).then(function (rep) {
    lsSet('bm_sauv_attente', '');
    return regler('derniereSauvegarde', {date: Date.now(), livres: n, taille: rep.taille, nom: rep.nom});
  }).then(function () {
    sauvegardeEnCours = false;
    majTemoin('');
  }).catch(function (e) {
    sauvegardeEnCours = false;
    majTemoin('☁️ pas sauvegardé (' + ((e && e.message) || 'hors connexion ?') + ')');
  });
}
// l'appli passe en arrière-plan : on n'attend pas la fin du délai
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden' && minuteurSauvegarde) {
    sauvegarderMaintenant();
  }
});
// au démarrage : une sauvegarde n'a pas pu partir la dernière fois
function reprendreSauvegarde() {
  if (lsGet('bm_sauv_attente') === '1') {
    planifierSauvegarde();
  }
}

function listerSauvegardesDrive() {
  return appelRelais('lister').then(function (rep) {
    return rep.fichiers;
  });
}
function lireSauvegardeDrive(id) {
  return appelRelais('lire', {id: id}).then(function (rep) {
    return base64EnBuffer(rep.contenu);
  });
}
</script>

<script>
// ---------- Formulaires : livres, lectures, sessions, achats, séries, auteurs ----------
var FORMATS_FR = [['papier', '📖 Papier'], ['numerique', '📱 Numérique'], ['audio', '🎧 Audio']];
var UNITES = [['pages', 'Pages'], ['secondes', 'Durée (audio)'], ['pourcent', 'Pourcentage'], ['episodes', 'Épisodes']];
var POSSESSIONS = [['possede', '📚 Dans ma bibliothèque'], ['envie', '💫 Dans mes envies'], ['emprunte', '🤝 Emprunté'], ['', 'Non précisé']];
var STATUTS = [['en_cours', '📖 En cours'], ['pause', '⏸️ En pause'], ['terminee', '✅ Terminée'], ['abandonnee', '🏳️ Abandonnée']];
var DEVISES = [['EUR', '€'], ['USD', '$'], ['GBP', '£'], ['CHF', 'CHF'], ['CAD', 'CA$']];

// ---------- petits outils de formulaire ----------
function champ(id, valeur, attrs) {
  return '<input class="champ" id="' + id + '" value="' + esc(valeur === null || valeur === undefined ? '' : valeur) + '" ' + (attrs || '') + '>';
}
function choix(id, options, valeur) {
  return '<select class="champ" id="' + id + '">' + options.map(function (o) {
    var sel = '';
    if (String(o[0]) === String(valeur === null || valeur === undefined ? '' : valeur)) {
      sel = ' selected';
    }
    return '<option value="' + esc(o[0]) + '"' + sel + '>' + esc(o[1]) + '</option>';
  }).join('') + '</select>';
}
function listeDeChoix(id, valeurs) {
  var vus = {};
  return '<datalist id="' + id + '">' + valeurs.filter(function (v) {
    if (!v || vus[v]) {
      return false;
    }
    vus[v] = 1;
    return true;
  }).sort(function (a, b) { return a.localeCompare(b, 'fr'); }).map(function (v) {
    return '<option value="' + esc(v) + '">';
  }).join('') + '</datalist>';
}
function val(id) {
  var e = document.getElementById(id);
  if (!e) {
    return '';
  }
  return String(e.value || '').trim();
}
function valNombre(id) {
  var v = val(id).replace(',', '.');
  if (v === '') {
    return null;
  }
  var n = parseFloat(v);
  if (isNaN(n)) {
    return null;
  }
  return n;
}
// durées : « 8:04 », « 8h04 », « 8 h » → secondes ; un nombre seul = des minutes
function lireDuree(s) {
  s = String(s || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!s) {
    return null;
  }
  var m = s.match(/^(\d+)(?:[:h](\d{0,2}))?(?:min)?$/);
  if (!m) {
    return null;
  }
  if (s.indexOf(':') < 0 && s.indexOf('h') < 0) {
    return parseInt(m[1], 10) * 60;
  }
  return parseInt(m[1], 10) * 3600 + parseInt(m[2] || '0', 10) * 60;
}
function texteDuree(sec) {
  if (sec === null || sec === undefined || sec === '') {
    return '';
  }
  var h = Math.floor(sec / 3600);
  var mn = Math.round((sec % 3600) / 60);
  if (mn === 60) {
    h++;
    mn = 0;
  }
  return h + ':' + String(mn).padStart(2, '0');
}
function champLongueur(id, unite, v) {
  if (unite === 'secondes') {
    return champ(id, texteDuree(v), 'placeholder="h:mm" inputmode="numeric"');
  }
  var ph = 'pages';
  if (unite === 'pourcent') {
    ph = '%';
  } else if (unite === 'episodes') {
    ph = 'épisodes';
  }
  var txt = '';
  if (v !== null && v !== undefined && v !== '') {
    txt = String(v).replace('.', ',');
  }
  return champ(id, txt, 'inputmode="decimal" placeholder="' + ph + '"');
}
function lireLongueur(id, unite) {
  if (unite === 'secondes') {
    return lireDuree(val(id));
  }
  return valNombre(id);
}
function texteLongueur(unite, v) {
  v = v || 0;
  if (unite === 'secondes') {
    return hm(v);
  }
  if (unite === 'pourcent') {
    return round(v, 1) + ' %';
  }
  if (unite === 'episodes') {
    return v + ' ép.';
  }
  return v + ' p.';
}
function dateVersChamp(ts) {
  if (!ts) {
    return '';
  }
  return dkey(new Date(ts));
}
// une date sans heure est rangée à midi ; une date inchangée garde son heure d'origine
function champVersDate(v, ancien) {
  if (!v) {
    return null;
  }
  if (ancien && dkey(new Date(ancien)) === v) {
    return ancien;
  }
  return new Date(v + 'T12:00:00').getTime();
}
function heureVersChamp(ts) {
  var d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function prix(v, devise) {
  var s = String(round(v || 0, 2).toFixed(2)).replace('.', ',');
  var d = DEVISES.find(function (x) { return x[0] === (devise || 'EUR'); });
  return s + ' ' + ((d && d[1]) || devise || '€');

// note de 0 à 5 par demi-étoiles : toucher une étoile la remplit, la retoucher la coupe en deux, puis l'efface
function champEtoiles(id, v) {
  return '<div class="etoiles-saisie" id="' + id + '" data-v="' + (v || 0) + '">' + boutonsEtoiles(id, v || 0) + '</div>';
}
function boutonsEtoiles(id, v) {
  var h = '';
  for (var i = 1; i <= 5; i++) {
    var cls = '';
    if (v >= i) {
      cls = 'plein';
    } else if (v >= i - 0.5) {
      cls = 'demi';
    }
    h += '<button type="button" class="' + cls + '" data-act="etoile" data-cible="' + id + '" data-n="' + i + '">★</button>';
  }
  var txt = 'pas de note';
  if (v) {
    txt = nombre(v) + ' / 5';
  }
  return h + '<span>' + txt + '</span>';
}
ACTIONS.etoile = function (el) {
  var c = document.getElementById(el.dataset.cible);
  var cur = parseFloat(c.dataset.v) || 0;
  var n = parseInt(el.dataset.n, 10);
  var v = n;
  if (cur === n) {
    v = n - 0.5;
  } else if (cur === n - 0.5) {
    v = 0;
  }
  c.dataset.v = v;
  c.innerHTML = boutonsEtoiles(c.id, v);
};
function valEtoiles(id) {

  var v = parseFloat(c && c.dataset.v) || 0;

}

// redimensionne une photo (appareil ou fichier) → Blob JPEG
function redimensionnerImage(fichier, max) {
  return createImageBitmap(fichier).then(function (img) {
    var r = Math.min(1, max / Math.max(img.width, img.height));
    var c = document.createElement('canvas');
    c.width = Math.round(img.width * r);
    c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return new Promise(function (ok) {
      c.toBlob(ok, 'image/jpeg', 0.85);
    });
  });
}

  } else {

      });

    if (!fl.genres.length) {
