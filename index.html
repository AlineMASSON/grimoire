<script>
// ---------- Version appli (PWA) : démarrage, fichiers reçus (partage Android ou 📥) ----------
var CACHE_PARTAGE = 'grimoire-partage';

// ancienne base « grimoire » (version lecture seule) : on n'y lit plus que le dernier export reçu
function idb() {
  return new Promise(function (ok, ko) {
    var r = indexedDB.open('grimoire', 1);
    r.onupgradeneeded = function () {
      r.result.createObjectStore('fichiers');
    };
    r.onsuccess = function () {
      ok(r.result);
    };
    r.onerror = function () {
      ko(r.error);
    };
  });
}
function idbGet(k) {
  return idb().then(function (db) {
    return new Promise(function (ok, ko) {
      var q = db.transaction('fichiers').objectStore('fichiers').get(k);
      q.onsuccess = function () {
        ok(q.result);
      };
      q.onerror = function () {
        ko(q.error);
      };
    });
  });
}

function toast(texte) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = texte;
  document.body.appendChild(t);
  setTimeout(function () { t.classList.add('vis'); }, 50);
  setTimeout(function () {
    t.classList.remove('vis');
    setTimeout(function () { t.remove(); }, 400);
  }, 3500);
}
function erreurEcran(e) {
  document.getElementById('app').innerHTML = '<div id="load" class="err">' + esc((e && e.message) || e) + '</div>';
}

function majSource() {
  var morceaux = [];
  var imp = reglage('dernierImport');
  if (reglage('mode', 'miroir') === 'miroir' && imp) {
    morceaux.push('Copie de Bookmory du ' + fdate(imp.date));
  }
  if (texteSauvegarde()) {
    morceaux.push(texteSauvegarde());
  }
  document.getElementById('src').textContent = morceaux.join(' · ');
}
function afficherGrimoire() {
  M = modeleDepuisBase();
  majSource();
  rendre();
  majPastille();
}

// Fichier reçu : sauvegarde du grimoire (→ restaurer) ou export Bookmory (→ importer en miroir)
function recevoirFichier(buf) {
  document.getElementById('app').innerHTML = '<div id="load">J\'ouvre le fichier…</div>';
  return lireSauvegarde(buf).then(function (lu) {
    if (lu) {
      return proposerRestauration(lu);
    }
    if (reglage('mode', 'miroir') !== 'miroir') {
      afficherSiPossible();
      proposerExportBookmory(buf);
      return;
    }
    return importerEtAfficher(buf);
  }).catch(function (e) {
    erreurEcran(e);
  });
}
// grimoire indépendant : un export Bookmory sert surtout à récupérer les photos des citations
function proposerExportBookmory(buf) {
  ouvrirFeuille('<h3>Un export Bookmory</h3><p class="small muted">Ton grimoire ne dépend plus de Bookmory. Que veux-tu faire de ce fichier ?</p>' +
    '<button class="act" data-act="photosBookmory" style="margin-top:8px">' + ic('image') + ' Récupérer les photos des citations</button><p class="small muted">Ajoute les photos qui manquent aux citations venues de Bookmory. Rien d\'autre ne change.</p>' +
    '<button class="act doux" data-act="reimporterBookmory" style="margin-top:12px">' + ic('rotate-ccw') + ' Tout réimporter</button><p class="small muted">Remplace les livres venus de Bookmory par leur version de l\'export : ce que tu as changé sur ces livres dans le grimoire serait perdu.</p>');
  ACTIONS.photosBookmory = function () {
    fermerFeuille();
    toast('J\'ouvre l\'export…');
    recupererPhotosBookmory(buf).then(function (r) {
      if (r.ajoutees) {
        apresEcriture();
      }
      return avertir(texteRecupPhotos(r), 'Photos des citations');
    }).catch(erreurEcriture);
  };
  ACTIONS.reimporterBookmory = function () {
    fermerFeuille();
    demander('Les livres venus de Bookmory seront remplacés par leur version de l\'export. Ce que tu as changé sur ces livres dans le grimoire sera perdu.', {titre: 'Tout réimporter ?', oui: 'Réimporter', danger: true}).then(function (ok) {
      if (ok) {
        return importerEtAfficher(buf);
      }
    }).catch(erreurEcran);
  };
}
function importerEtAfficher(buf) {
  return importerBookmory(buf).then(function (recap) {
    afficherGrimoire();
    planifierSauvegarde();
    toast('✨ Grimoire mis à jour · ' + recap.livres + ' livres');
  });
}
function afficherSiPossible() {
  if (valeurs(D.livres).length || reglage('mode', 'miroir') !== 'miroir') {
    afficherGrimoire();
  } else {
    ecranVide();
  }
}
function proposerRestauration(lu) {
  afficherSiPossible();
  ouvrirFeuille('<h3>Restaurer une sauvegarde</h3><p>' + esc(resumeSauvegarde(lu.donnees)) + '</p><p class="small muted">Tout ce qui est actuellement dans le grimoire sera remplacé par cette sauvegarde.</p><div class="row"><button class="act" data-act="confirmerRestauration">' + ic('rotate-ccw') + ' Restaurer</button><button class="act doux" data-act="fermer">Annuler</button></div>');
  ACTIONS.confirmerRestauration = function () {
    fermerFeuille();
    restaurerSauvegarde(lu).then(function () {
      afficherSiPossible();
      planifierSauvegarde();
      toast('✨ Sauvegarde restaurée');
    }).catch(erreurEcriture);
  };
}

function ecranVide() {
  M = null;
  document.getElementById('src').textContent = '';
  document.getElementById('app').innerHTML = card('Bienvenue dans ton grimoire ✨', '<div class="vide"><p><b>Nouveau téléphone ?</b> Retrouve ton grimoire depuis ton Drive : ⚙️ Réglages → colle ton code de liaison (fichier <i>Grimoire sauvegardes / code-de-liaison.txt</i>) → ' + ic('rotate-ccw') + ' Restaurer.</p><div class="row" style="justify-content:center"><button class="act" data-act="reglages">' + ic('cloud-download') + ' Restaurer depuis mon Drive</button></div><p class="small muted" style="margin-top:16px">Ou choisis un fichier : une sauvegarde du grimoire, ou un export Bookmory.</p><div class="row" style="justify-content:center"><button class="act doux" data-act="choisirExport">' + ic('folder-open') + ' Choisir un fichier</button><button class="act doux" data-act="grimoireVide">' + ic('sparkles') + ' Commencer à zéro</button></div></div>');
}
ACTIONS.grimoireVide = function () {
  ecrire([{t: 'reglages', o: {id: 'mode', v: 'independant'}}, {t: 'reglages', o: {id: 'bascule', v: Date.now()}}]).then(function () {
    afficherGrimoire();
    toast('✨ À toi d\'écrire la première page : touche « + »');
  }).catch(erreurEcriture);
};
// première ouverture de la nouvelle version : l'ancien export est déjà sur le téléphone
function proposerImportAncien(e) {
  M = null;
  document.getElementById('app').innerHTML = card('Ton grimoire fait peau neuve ✨', '<div class="vide"><p>Il a maintenant sa propre base : tes lectures vont y être copiées, avec ton carnet, tes exclusions et ton objectif.</p><p class="small muted">Dernier export reçu : ' + fdate(e.date) + '. Pour avoir aussi les photos de tes citations, partage plutôt un nouvel export depuis Bookmory (ta macro le fait quand tu fermes Bookmory).</p><div class="row" style="justify-content:center"><button class="act" data-act="importerAncien">' + ic('sparkles') + ' Importer maintenant</button><button class="act doux" data-act="choisirExport">' + ic('folder-open') + ' Un autre fichier</button></div></div>');
  ACTIONS.importerAncien = function () {
    recevoirFichier(e.octets.buffer.slice(e.octets.byteOffset, e.octets.byteOffset + e.octets.byteLength));
  };
}

ACTIONS.choisirExport = function () {
  fermerFeuille();
  document.getElementById('fichierImport').click();
};

// ---------- mises à jour de l'appli ----------
// assembler.py écrit la date de fabrication ici et dans version.txt : si le site a une version plus récente
// que la page ouverte (Android garde l'appli en mémoire), on recharge en revenant dans l'appli.
var VERSION_APPLI = '2026-10-04 20:44:02';
function appliOccupee() {
  return !!(document.getElementById('feuille') || document.querySelector('.boite-fond') || document.getElementById('pageMinuteur'));
}
function proposerMiseAJour() {
  if (document.getElementById('majDispo')) {
    return;
  }
  var b = document.createElement('button');
  b.id = 'majDispo';
  b.className = 'maj-dispo';
  b.innerHTML = ic('refresh-cw') + ' Nouvelle version : toucher pour l\'avoir';
  b.addEventListener('click', function () {
    location.reload();
  });
  document.body.appendChild(b);
}
function verifierMiseAJour() {
  if (VERSION_APPLI.indexOf('__') === 0 || !navigator.onLine) {
    return;
  }
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistration().then(function (r) {
      if (r) {
        r.update();
      }
    }).catch(function () {});
  }
  fetch('version.txt', {cache: 'no-store'}).then(function (r) {
    if (!r.ok) {
      return '';
    }
    return r.text();
  }).then(function (v) {
    v = v.trim();
    if (!v || v <= VERSION_APPLI) {
      return;
    }
    // un seul rechargement automatique par version (si le serveur tarde à servir la nouvelle page, on n'insiste pas)
    var deja = '';
    try {
      deja = sessionStorage.getItem('bm_maj') || '';
    } catch (e) {}
    if (appliOccupee() || deja === v) {
      proposerMiseAJour();
      return;
    }
    try {
      sessionStorage.setItem('bm_maj', v);
    } catch (e) {}
    location.reload();
  }).catch(function () {});
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    verifierMiseAJour();
  }
});

function demarrer() {
  appliquerTheme(lsGet('bm_theme') || 'fetes');
  try {
    var s = JSON.parse(lsGet('bm_sous') || '{}');
    Object.keys(s).forEach(function (k) { sous[k] = s[k]; });
  } catch (e) {}
  // l'appli s'ouvre toujours sur l'Accueil
  onglet = 'accueil';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist();
  }
  document.getElementById('fichierImport').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (f) {
      f.arrayBuffer().then(recevoirFichier);
    }
    e.target.value = '';
  });

  preparerBase().then(function () {
    reprendreSauvegarde();
    var params = new URLSearchParams(location.search);
    if (params.has('partage') && 'caches' in window) {
      history.replaceState(null, '', location.pathname);
      return caches.open(CACHE_PARTAGE).then(function (c) {
        return c.match('partage-recu').then(function (rep) {
          if (!rep) {
            return ouvrirGrimoire();
          }
          return rep.arrayBuffer().then(function (b) {
            c.delete('partage-recu');
            return recevoirFichier(b);
          });
        });
      });
    }
    // test en local : ?db=fichier
    if (params.get('db')) {
      return fetch(params.get('db')).then(function (r) { return r.arrayBuffer(); }).then(recevoirFichier);
    }
    return ouvrirGrimoire();
  }).then(function () {
    setTimeout(verifierMiseAJour, 2000);
  }).catch(erreurEcran);
}

function ouvrirGrimoire() {
  if (valeurs(D.livres).length || reglage('mode', 'miroir') !== 'miroir') {
    afficherGrimoire();
    return;
  }
  return idbGet('export').then(function (e) {
    if (e && e.octets) {
      proposerImportAncien(e);
    } else {
      ecranVide();
    }
  }).catch(ecranVide);
}
</script>

<script>demarrer();</script>
</body>
