// ---------- sceaux magiques (succès) ----------
function vSceaux() {
  var fin = finies();
  var sj = series_jours();
  var ppj = pagesParJour();
  var maxPages = Math.max.apply(null, Object.keys(ppj).map(function (k) { return ppj[k]; }).concat([0]));
  var nuit = 0;
  lect().forEach(function (r) {
    r.logs.forEach(function (l) {
      var hh = new Date(l.created_at).getHours();
      if (hh >= 23 || hh < 4) {
        nuit++;
      }
    });
  });
  var au = {};
  fin.forEach(function (r) { (r.book.authors || []).forEach(function (a) { au[a] = (au[a] || 0) + 1; }); });
  var maxAu = Math.max.apply(null, Object.keys(au).map(function (k) { return au[k]; }).concat([0]));
  var pave = Math.max.apply(null, fin.filter(function (r) { return r.fmt !== 'audioBook'; }).map(function (r) { return r.total_page || 0; }).concat([0]));
  var relu = lect().some(function (r) { return r.nth >= 2; });
  var fmtAn = {};
  fin.forEach(function (r) {
    var y = annee(r.end);
    if (!fmtAn[y]) {
      fmtAn[y] = {};
    }
    fmtAn[y][r.fmt] = 1;
  });
  var trio = Object.keys(fmtAn).some(function (y) { return Object.keys(fmtAn[y]).length >= 3; });
  var nbNotes = Object.keys(NOTES).length;
  var B = [
    ['📗', '50 livres', fin.length >= 50, fin.length + '/50'],
    ['📘', '100 livres', fin.length >= 100, fin.length + '/100'],
    ['📙', '200 livres', fin.length >= 200, fin.length + '/200'],
    ['🔥', '7 jours d\'affilée', sj.best >= 7, 'record ' + sj.best + ' j'],
    ['🔥', '30 jours d\'affilée', sj.best >= 30, 'record ' + sj.best + ' j'],
    ['🌋', '100 jours d\'affilée', sj.best >= 100, 'record ' + sj.best + ' j'],
    ['🏃', 'Marathon : 150 p. en un jour', maxPages >= 150, 'record ' + maxPages + ' p.'],
    ['🧱', 'Un pavé de 700 p.', pave >= 700, 'le plus gros : ' + pave + ' p.'],
    ['🦉', 'Noctambule : 20 relevés après 23h', nuit >= 20, nuit + '/20'],
    ['💞', 'Fidèle : 10 livres d\'un même auteur', maxAu >= 10, 'max ' + maxAu],
    ['🧭', 'Exploratrice : 75 auteurs', Object.keys(au).length >= 75, Object.keys(au).length + '/75'],
    ['🎧', 'Les 3 formats la même année', trio, ''],
    ['🔁', 'Relire un livre', relu, ''],
    ['✒️', 'Carnet : 10 livres notés', nbNotes >= 10, nbNotes + '/10']
  ];
  var nbOk = B.filter(function (b) { return b[2]; }).length;
  return card('Mes sceaux magiques', '<div class="badges">' + B.map(function (b) {
    var cls = 'badge';
    if (b[2]) {
      cls += ' ok';
    }
    return '<div class="' + cls + '"><b>' + b[0] + '</b>' + b[1] + '<div class="small muted">' + b[3] + '</div></div>';
  }).join('') + '</div>', nbOk + ' / ' + B.length + ' débloqués');
}

function vQuetes() {
  return avec('quetes', function () {
    return noteExclus('quetes') + carteNiveau() + vBingo() + vSceaux();
  });
}

<script>
// ---------- Bilan façon « Wrapped » : stories plein écran ----------
var story = {slides: [], i: 0, minuteur: null};
var FONDS = [
  'linear-gradient(160deg,#f7a8c9,#a78bfa)',
  'linear-gradient(160deg,#c084fc,#f472b6)',
  'linear-gradient(160deg,#fbbf8a,#f472b6)',
  'linear-gradient(160deg,#818cf8,#c084fc)',
  'linear-gradient(160deg,#5eead4,#818cf8)',
  'linear-gradient(160deg,#f472b6,#fb923c)',
  'linear-gradient(160deg,#312e81,#9d4edd)',
  'linear-gradient(160deg,#fda4af,#c4b5fd)',
  'linear-gradient(160deg,#1e1b4b,#be185d)',
  'linear-gradient(160deg,#a78bfa,#f9a8d4)'
];

function slidesAnnee(y) {
  return avec('bilan', function () {
    return slidesAnneeCorps(y);
  });
}
function slidesAnneeCorps(y) {
  var fin = finies().filter(function (r) { return annee(r.end) === y; }).sort(function (a, b) { return a.end - b.end; });
  var s = [];
  s.push('<div class="moon" style="font-size:54px">☾</div><div class="script">Ton année</div><div class="gros">' + y + '</div><div class="sous">en lecture ✨</div>');
  if (!fin.length) {
    s.push('<div class="titre">Pas encore de livre fini cette année…</div><div class="sous">La suite s\'écrit maintenant 💫</div>');
    return s;
  }
  var pages = 0, sec = 0;
  fin.forEach(function (r) {
    if (r.page_type === 'TIME') {
      sec += r.total_page;
    } else {
      pages += pagesLecture(r);
    }
  });
  var extra = '';
  if (sec) {
    extra = '<br>et ' + hm(sec) + ' d\'écoute';
  }
  s.push('<div class="sous">Tu as refermé</div><div class="gros">' + fin.length + '</div><div class="titre">livres</div><div class="sous">soit ' + pages.toLocaleString('fr-FR') + ' pages tournées' + extra + '</div>');

  var mois = new Array(12).fill(0);
  fin.forEach(function (r) { mois[new Date(r.end).getMonth()]++; });
  var mMax = mois.indexOf(Math.max.apply(null, mois));
  var joursAn = Object.keys(jours()).filter(function (k) { return k.slice(0, 4) === String(y); }).length;
  s.push('<div class="sous">Ton mois le plus livresque</div><div class="titre" style="font-size:44px">' + MOIS_LONGS[mMax] + '</div><div class="sous">' + mois[mMax] + ' livres terminés · ' + joursAn + ' jours de lecture dans l\'année</div>');

  var au = {}, tg = {};
  fin.forEach(function (r) {
    (r.book.authors || []).forEach(function (a) { au[a] = (au[a] || 0) + 1; });
    r.book.tagList.forEach(function (t) {
      if (t !== 'Fiction') {
        tg[t] = (tg[t] || 0) + 1;
      }
    });
  });
  var a1 = Object.keys(au).sort(function (a, b) { return au[b] - au[a]; })[0];
  var g1 = Object.keys(tg).sort(function (a, b) { return tg[b] - tg[a]; })[0];
  s.push('<div class="sous">Ton auteur de l\'année</div><div class="titre">' + esc(a1) + '</div><div class="sous">' + au[a1] + ' livre(s) lu(s)</div><div style="height:16px"></div><div class="sous">Ton genre fétiche</div><div class="script">' + esc(g1 || '—') + '</div>');

  var coeur = fin.filter(function (r) { return r.star >= 5; });
  var top = coeur[coeur.length - 1] || fin.slice().sort(function (a, b) { return b.star - a.star; })[0];
  if (top) {
    var img = '';
    if (top.book.image) {
      img = '<img class="cv" src="' + esc(top.book.image) + '" alt="">';
    }
    s.push('<div class="sous">Ton coup de cœur</div>' + img + '<div class="titre">' + esc(titre(top.book)) + '</div><div class="sous">' + esc((top.book.authors || []).join(', ')) + ' · ' + coeur.length + ' livre(s) à 5★ cette année</div>');
  }

  var gros = fin.filter(function (r) { return pagesLecture(r); }).sort(function (a, b) { return pagesLecture(b) - pagesLecture(a); })[0];
  if (gros) {
    s.push('<div class="sous">Ton plus gros pavé</div><div class="gros">' + pagesLecture(gros) + '</div><div class="sous">pages</div><div class="titre">' + esc(titre(gros.book)) + '</div>');
  }

  var sj = series_jours(function (k) { return k.slice(0, 4) === String(y); });
  s.push('<div class="sous">Ta plus belle série</div><div class="gros">' + sj.best + '</div><div class="titre">jours d\'affilée</div><div class="sous">sans lâcher ton livre 🔥</div>');

  var cits = M.notes.filter(function (n) { return n.type !== 'NOTE' && n.texte.length > 20 && annee(n.created_at) === y; });
  if (cits.length) {
    var c = cits[0];
    var src = '';
    if (c.book) {
      src = '— ' + esc(titre(c.book));
    }
    s.push('<div class="sous">Une phrase que tu as gardée</div><div class="quote" style="color:#fff;font-size:22px;max-width:340px">' + esc(c.texte.slice(0, 280)) + '</div><div class="sous">' + src + '</div>');
  }

  var couv = fin.filter(function (r) { return r.book.image; }).slice(-20).map(function (r) { return '<img src="' + esc(r.book.image) + '" alt="">'; }).join('');
  var n = niveau();
  s.push('<div class="script">Ton étagère ' + y + '</div><div class="mosaique">' + couv + '</div><div class="sous">Tu es ' + n.n[1] + ' <b>' + n.n[2] + '</b><br>À l\'année prochaine, belle lectrice ✨</div>');
  return s;
}

function paillettes() {
  var h = '';
  for (var i = 0; i < 14; i++) {
    var c = '✦';
    if (i % 3 === 0) {
      c = '✧';
    }
    h += '<i style="left:' + ((i * 37) % 95) + '%;top:' + ((i * 53) % 92) + '%;font-size:' + (8 + (i % 4) * 4) + 'px;animation-delay:' + (i % 5) * 0.4 + 's">' + c + '</i>';
  }
  return '<div class="paillettes">' + h + '</div>';
}

function afficherStory() {
  var el = document.getElementById('story');
  if (!el) {
    return;
  }
  clearTimeout(story.minuteur);
  var barres = story.slides.map(function (x, k) {
    var cls = '';
    if (k < story.i) {
      cls = 'fait';
    } else if (k === story.i) {
      cls = 'cours';
    }
    return '<i class="' + cls + '"><b></b></i>';
  }).join('');
  el.style.background = FONDS[story.i % FONDS.length];
  el.innerHTML = '<div class="bars">' + barres + '</div><button class="x" data-act="fermerStory" aria-label="Fermer">' + ic('x') + '</button>' + paillettes() + '<div class="slide">' + story.slides[story.i] + '</div>';
  story.minuteur = setTimeout(function () { avancerStory(1); }, 6000);
}
function avancerStory(pas) {
  var i = story.i + pas;
  if (i < 0) {
    i = 0;
  }
  if (i >= story.slides.length) {
    ACTIONS.fermerStory();
    return;
  }
  story.i = i;
  afficherStory();
}
ACTIONS.wrapped = function (el) {
  story.slides = slidesAnnee(parseInt(el.dataset.an, 10));
  story.i = 0;
  var d = document.createElement('div');
  d.className = 'story';
  d.id = 'story';
  d.addEventListener('click', function (e) {
    if (e.target.closest('[data-act]')) {
      return;
    }
    if (e.clientX < window.innerWidth / 3) {
      avancerStory(-1);
    } else {
      avancerStory(1);
    }
  });
  document.body.appendChild(d);
  afficherStory();
};
ACTIONS.fermerStory = function () {
  clearTimeout(story.minuteur);
  var el = document.getElementById('story');
  if (el) {
    el.remove();
  }
};
</script>

// dimanche de Pâques (calcul grégorien)
function paquesDe(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  var h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  var l = (32 + 2 * e + 2 * i - h - k) % 7;
  var m = Math.floor((a + 11 * h + 22 * l) / 451);
  var mois = Math.floor((h + l - 7 * m + 114) / 31);
  var jour = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mois - 1, jour);
}
// la lune est-elle pleine ce jour-là ? (à environ un jour près)
function pleineLune(d) {
  var ref = Date.UTC(2000, 0, 6, 18, 14);
  var lunaison = 29.530588853;
  var midi = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTime();
  var phase = (((midi - ref) / DAY / lunaison) % 1 + 1) % 1;
  return Math.abs(phase - 0.5) < 0.5 / lunaison;
}
function feteDuJour(d) {
  var m = d.getMonth() + 1, j = d.getDate(), y = d.getFullYear();
  if ((m === 12 && j >= 27) || (m === 1 && j <= 3)) {
    return 'nouvelan';
  }
  if (m === 12) {
    return 'noel';
  }
  if ((m === 10 && j >= 25) || (m === 11 && j === 1)) {
    return 'halloween';
  }
  if (m === 2 && j >= 10 && j <= 14) {
    return 'valentin';
  }
  if (m === 2 && j === 2) {
    return 'chandeleur';
  }
  var p = paquesDe(y).getTime();
  var t = new Date(y, m - 1, j).getTime();
  if (t >= p - 3 * DAY && t <= p + DAY) {
    return 'paques';
  }
  if (m === 4 && j === 1) {
    return 'poisson';
  }
  if (m === 4 && j === 23) {
    return 'livre';
  }
  if (m === 6 && j === 21) {
    return 'musique';
  }
  if (m === 8 && j === 8) {
    return 'chat';
  }
  if (m === 8 && j >= 10 && j <= 13) {
    return 'etoiles';
  }
  if (j === 13 && d.getDay() === 5) {
    return 'vendredi13';
  }
  if (pleineLune(d)) {
    return 'pleinelune';
  }
  if (m === 9 && j <= 15) {
    return 'rentree';
  }
  if (m === 10) {
    return 'imaginaire';
  }
  var md = m * 100 + j;
  if (md >= 320 && md <= 620) {
    return 'printemps';
  }
  if (md >= 621 && md <= 922) {
    return 'ete';
  }
  if (md >= 923 && md <= 1220) {
    return 'automne';
  }
  return 'hiver';
}

<script>
// ---------- Scanner de code-barres (en librairie : « est-ce que je l'ai déjà ? ») ----------
var scan = {flux: null, minuteur: null, detecteur: null, surCode: null, trouve: false};

function chiffres(s) {
  return String(s || '').replace(/[^0-9Xx]/g, '').toUpperCase();
}
// convertit un ISBN-10 en ISBN-13 pour pouvoir comparer
function isbn13(s) {
  var c = chiffres(s);
  if (c.length === 13) {
    return c;
  }
  if (c.length !== 10) {
    return '';
  }
  var base = '978' + c.slice(0, 9);
  var somme = 0;
  for (var i = 0; i < 12; i++) {
    var poids = 1;
    if (i % 2 === 1) {
      poids = 3;
    }
    somme += parseInt(base[i], 10) * poids;
  }
  return base + ((10 - somme % 10) % 10);
}
function normTitre(t) {
  return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\([^)]*\)/g, ' ').split(/\s[:\-–]\s|:/)[0].replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
// « Jennifer Twice » → {nom: 'twice', initiale: 'j'} ; gère « Nom, Prénom » et « A & B »
function personnes(l) {
  var p = [];
  (l || []).join(' & ').split(/\s*(?:&|;| et | and )\s*/).forEach(function (n) {
    n = n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    if (!n) {
      return;
    }
    var mots;
    if (n.indexOf(',') > 0) {
      var parts = n.split(',');
      mots = (parts[1] + ' ' + parts[0]).split(/[^a-z]+/).filter(Boolean);
    } else {
      mots = n.split(/[^a-z]+/).filter(Boolean);
    }
    if (!mots.length) {
      return;
    }
    var initiale = '';
    if (mots.length > 1) {
      initiale = mots[0][0];
    }
    p.push({nom: mots[mots.length - 1], initiale: initiale});
  });
  return p;
}
function memeAuteur(a, b) {
  var pa = personnes(a), pb = personnes(b);
  return pa.some(function (x) {
    return pb.some(function (y) {
      return x.nom === y.nom && x.nom.length >= 3 && (!x.initiale || !y.initiale || x.initiale === y.initiale);
    });
  });
}

// ---------- caméra ----------
// surCode(isbn) : ce qu'on fait du code lu (par défaut, le verdict « déjà lu / pile / nouveau »)
function ouvrirScanner(surCode) {
  fermerFeuille();
  scan.surCode = null;
  if (typeof surCode === 'function') {
    scan.surCode = surCode;
  }
  scan.trouve = false;
  var d = document.createElement('div');
  d.className = 'scan';
  d.id = 'scan';
  d.innerHTML = '<video playsinline muted></video><div class="viseur"></div><div class="haut"><button data-act="fermerScanner" aria-label="Fermer">' + ic('x') + '</button><button id="torche" data-act="torche" aria-label="Lampe" hidden>' + ic('flashlight') + '</button></div><div class="consigne">Vise le code-barres du livre</div><div class="bas"><input id="isbnManuel" inputmode="numeric" placeholder="ou tape l\'ISBN"><button data-act="isbnManuel">Chercher</button></div>';
  document.body.appendChild(d);
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) {
    d.querySelector('.consigne').textContent = 'Ce navigateur ne sait pas lire les codes-barres : tape l\'ISBN';
    return;
  }
  scan.detecteur = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e']});
  navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false}).then(function (flux) {
    scan.flux = flux;
    var v = d.querySelector('video');
    v.srcObject = flux;
    v.play();
    var piste = flux.getVideoTracks()[0];
    if (piste.getCapabilities && piste.getCapabilities().torch) {
      document.getElementById('torche').hidden = false;
    }
    scan.minuteur = setInterval(function () {
      if (v.readyState < 2) {
        return;
      }
      scan.detecteur.detect(v).then(function (codes) {
        var code = codes.map(function (c) { return chiffres(c.rawValue); }).find(function (c) { return /^97[89]\d{10}$/.test(c); });
        if (code && !scan.trouve) {

          if (navigator.vibrate) {
            navigator.vibrate(80);
          }
          codeLu(code);
        }

  }).catch(function () {
    d.querySelector('.consigne').textContent = 'Caméra refusée : autorise-la ou tape l\'ISBN';
  });
}
function fermerScanner() {

}
function codeLu(code) {

}

// ---------- recherche du livre ----------
function infosDepuisVolume(v) {

  }

  var titreComplet = v.title || '';

<script>
// ---------- Base de données du grimoire (IndexedDB « grimoire-base ») ----------
// Tout est chargé en mémoire dans D (D.livres = {id: objet}…) ; une seule fonction écrit : ecrire().
// L'adaptateur modeleDepuisBase() fabrique ensuite le modèle M attendu par les vues.
var BASE_NOM = 'grimoire-base';
var BASE_VERSION = 1;
var TABLES = {
  livres: ['serieId'],
  auteurs: [],
  series: [],
  genres: [],
  criteres: [],
  humeurs: [],
  tropes: [],
  etageres: [],
  lectures: ['livreId'],
  sessions: ['lectureId', 'livreId'],

var D = {};

var PHOTOS = {};

<script>

      });
      (r.read_timer_list || []).forEach(function (t) {
        var debut = t.read_started_at || t.created_at;
        var rel = (relevesPar[t.created_at] || []).shift();
        var fin = debut + (t.elapsed_sec || 0) * 1000;
        var position = null;
        if (rel) {
          fin = rel.created_at;
          position = rel.page;
        }
        mettre('sessions', {id: idUnique(lid + ':T:' + debut), lectureId: lid, livreId: id, debut: debut, fin: fin, dureeSec: t.elapsed_sec || 0, position: position, creeLe: t.created_at, modifieLe: t.updated_at});
      });
      Object.keys(relevesPar).forEach(function (k) {
        relevesPar[k].forEach(function (l) {
          mettre('sessions', {id: idUnique(lid + ':L:' + l.created_at), lectureId: lid, livreId: id, debut: l.created_at, fin: l.created_at, dureeSec: null, position: l.page, creeLe: l.created_at, modifieLe: l.updated_at});
        });
      });
    });
  });

  var nbPhotos = 0;
  (S.notes || []).forEach(function (n) {
    var photoId = null;
    var fichier = ((n.images || [])[0] || '').split('/').pop();
    if (fichier) {
      var pid = 'p:' + fichier;
      if (images[fichier]) {
        mettre('photos', {id: pid, blob: images[fichier], type: images[fichier].type || 'image/jpeg', creeLe: n.created_at});
        photoId = pid;
        nbPhotos++;
      } else if (D.photos[pid]) {
        // export sans photos : on garde celle déjà importée
        nouveaux.photos[pid] = D.photos[pid];
        photoId = pid;
      }
    }
    var type = 'citation';
    if (n.type === 'THOUGHT') {
      type = 'pensee';
    }
    var lectureId = null;
    if (n.read_nth) {
      lectureId = n.bid + ':' + n.read_nth;
    }
    mettre('citations', {
      id: n._key,
      livreId: n.bid,
      lectureId: lectureId,
      type: type,
      texte: texteQuill(n.content_quill),
      page: n.page || null,
      pageFin: n.page_end || null,
      photoId: photoId,
      favori: !!n.like,
      commentaires: (n.comments || []).map(function (c) { return {texte: c.content || '', creeLe: c.created_at}; }),
      creeLe: n.created_at,
      modifieLe: n.updated_at
    });
  });

  // miroir : ce qui venait de Bookmory et n'y est plus disparaît (les données du grimoire restent)
  var suppressions = 0;
  TABLES_BOOKMORY.forEach(function (t) {
    valeurs(D[t]).forEach(function (o) {
      if (o.origine === 'bookmory' && !nouveaux[t][o.id]) {
        ops.push({t: t, suppr: o.id});
        suppressions++;
      }
    });
  });

  // carnet, exclusions et objectif de la version précédente (seulement s'ils n'existent pas encore)
  var nbAvis = 0;
  Object.keys(ancien.notes || {}).forEach(function (id) {
    if (!D.avis[id] && nouveaux.livres[id]) {
      avisDepuisNote(id, ancien.notes[id]).forEach(function (op) {
        if (op.t === 'avis') {
          nbAvis++;
          op.o.creeLe = ancien.notes[id].maj;
        }
        ops.push(op);
      });
    }
  });
  var y = String(new Date().getFullYear());
  if (ancien.objectif && !D.objectifs[y]) {
    ops.push({t: 'objectifs', o: {id: y, livres: parseInt(ancien.objectif, 10) || 25}});
  }

  return {
    ops: opsListes.concat(ops),
    recap: {
      livres: Object.keys(nouveaux.livres).length,
      lectures: Object.keys(nouveaux.lectures).length,
      sessions: Object.keys(nouveaux.sessions).length,
      citations: Object.keys(nouveaux.citations).length,
      photos: nbPhotos,
      achats: Object.keys(nouveaux.achats).length,
      series: Object.keys(nouveaux.series).length,
      auteurs: Object.keys(nouveaux.auteurs).length,
      avis: nbAvis,
      suppressions: suppressions
    }
  };
}

// ancien carnet, exclusions et objectif (localStorage de la version « lecture seule »)
function ancienCarnet() {
  var a = {notes: {}, exclus: {}, objectif: lsGet('bm_objectif')};
  try {
    a.notes = JSON.parse(lsGet('bm_notes') || '{}');
  } catch (e) {}
  try {
    a.exclus = JSON.parse(lsGet('bm_exclus') || '{}');
  } catch (e) {}
  return a;
}

function texteRecap(r) {
  var morceaux = [r.livres + ' livres', r.lectures + ' lectures', r.sessions + ' relevés et minuteurs', r.citations + ' citations'];
  if (r.photos) {
    morceaux.push(r.photos + ' photos');
  }
  morceaux.push(r.achats + ' achats', r.series + ' séries');
  if (r.avis) {
    morceaux.push(r.avis + ' notes de carnet');
  }
  return morceaux.join(' · ');
}

// Ajoute seulement les photos manquantes aux citations venues de Bookmory : rien d'autre ne change.
// → {ajoutees, dejaLa, sansPhotoDansLeFichier, citationsSupprimees}
function recupererPhotosBookmory(buf) {
  return lireExportBookmory(buf).then(function (lu) {
    var ops = [];
    var r = {ajoutees: 0, dejaLa: 0, sansPhotoDansLeFichier: 0, citationsSupprimees: 0};
    (lu.stores.notes || []).forEach(function (n) {
      var fichier = ((n.images || [])[0] || '').split('/').pop();
      if (!fichier) {
        return;
      }
      var c = D.citations[n._key];
      if (!c) {
        r.citationsSupprimees++;
        return;
      }
      if (c.photoId && D.photos[c.photoId]) {
        r.dejaLa++;
        return;
      }
      var blob = lu.images[fichier];
      if (!blob) {
        r.sansPhotoDansLeFichier++;
        return;
      }
      var pid = 'p:' + fichier;
      ops.push({t: 'photos', o: {id: pid, blob: blob, type: blob.type || 'image/jpeg', creeLe: n.created_at}});
      ops.push({t: 'citations', o: Object.assign({}, c, {photoId: pid}), garderDate: true});
      r.ajoutees++;
    });
    if (!ops.length) {
      return r;
    }
    return ecrire(ops).then(function () {
      return r;
    });
  });
}
function texteRecupPhotos(r) {
  var t = '';
  if (r.ajoutees) {
    t = r.ajoutees + ' photo' + (r.ajoutees > 1 ? 's ajoutées' : ' ajoutée') + ' à tes citations.';
  } else {
    t = 'Aucune photo à ajouter.';
  }
  if (r.dejaLa) {
    t += '\n' + r.dejaLa + ' citation' + (r.dejaLa > 1 ? 's avaient déjà leur photo.' : ' avait déjà sa photo.');
  }
  if (r.sansPhotoDansLeFichier) {
    t += '\n' + r.sansPhotoDansLeFichier + ' photo' + (r.sansPhotoDansLeFichier > 1 ? 's manquent' : ' manque') + ' dans ce fichier : il faut l\'export complet (.zip) de Bookmory, pas seulement la base.';
  }
  if (r.citationsSupprimees) {
    t += '\n' + r.citationsSupprimees + ' citation' + (r.citationsSupprimees > 1 ? 's ne sont' : ' n\'est') + ' plus dans ton grimoire : ignorée' + (r.citationsSupprimees > 1 ? 's' : '') + '.';
  }
  return t;
}

// Importe un export : renvoie le récapitulatif. Ne redessine rien (l'appelant décide).
function importerBookmory(buf) {
  return lireExportBookmory(buf).then(function (lu) {
    var c = convertirBookmory(lu.stores, lu.images, ancienCarnet());
    return ecrire(c.ops).then(function () {
      return regler('dernierImport', {date: Date.now(), recap: c.recap});
    }).then(function () {
      return c.recap;
    });
  });
}
</script>

<script>
// ---------- Sauvegarde : tout le grimoire dans un zip (donnees.json + photos/) ----------
var FORMAT_SAUVEGARDE = 'grimoire';
// réglages qui ne quittent jamais le téléphone
var REGLAGES_PRIVES = ['liaison'];

function nomFichierPhoto(id, type) {
  var ext = 'jpg';
  if (/png/.test(type || '')) {
    ext = 'png';
  } else if (/webp/.test(type || '')) {
    ext = 'webp';
  }
  return 'photos/' + id.replace(/^p:/, '').replace(/\.(jpe?g|png|webp)$/i, '').replace(/[^a-zA-Z0-9_-]/g, '_') + '.' + ext;
}

// → Promise<Blob> (zip)
function fabriquerSauvegarde() {
  return jszip().then(function (JSZip) {
    var z = new JSZip();
    var tables = {};
    Object.keys(TABLES).forEach(function (t) {
      if (t === 'photos') {
        return;
      }
      tables[t] = valeurs(D[t]);
      if (t === 'reglages') {
        tables[t] = tables[t].filter(function (r) { return REGLAGES_PRIVES.indexOf(r.id) < 0; });
      }
    });
    var photos = valeurs(D.photos).map(function (p) {
      var f = nomFichierPhoto(p.id, p.type);
      z.file(f, p.blob);
      return {id: p.id, type: p.type, fichier: f, creeLe: p.creeLe, modifieLe: p.modifieLe, origine: p.origine};
    });
    z.file('donnees.json', JSON.stringify({format: FORMAT_SAUVEGARDE, version: BASE_VERSION, date: Date.now(), tables: tables, photos: photos}));
    return z.generateAsync({type: 'blob', compression: 'DEFLATE', compressionOptions: {level: 6}});
  });
}

// Le zip est-il une sauvegarde du grimoire ? → Promise<{donnees, zip}|null>
function lireSauvegarde(buf) {
  if (!estZip(new Uint8Array(buf))) {
    return Promise.resolve(null);
  }
  return jszip().then(function (JSZip) {
    return JSZip.loadAsync(buf);
  }).then(function (z) {
    var f = z.file('donnees.json');
    if (!f) {
      return null;
    }
    return f.async('string').then(function (t) {
      var d = JSON.parse(t);
      if (d.format !== FORMAT_SAUVEGARDE) {
        return null;
      }
      return {donnees: d, zip: z};
    });
  });
}
function resumeSauvegarde(d) {
  var t = d.tables || {};
  function n(x) {
    return (t[x] || []).length;
  }
  return n('livres') + ' livres · ' + n('lectures') + ' lectures · ' + n('citations') + ' citations · ' + (d.photos || []).length + ' photos · du ' + fdate(d.date);
}

// Remplace TOUTE la base par la sauvegarde (les réglages privés du téléphone sont gardés).
function restaurerSauvegarde(lu) {
  var d = lu.donnees;
  var photos = d.photos || [];
  return Promise.all(photos.map(function (p) {
    var f = lu.zip.file(p.fichier);
    if (!f) {
      return null;
    }
    return f.async('blob').then(function (b) {
      return {id: p.id, blob: new Blob([b], {type: p.type || 'image/jpeg'}), type: p.type, creeLe: p.creeLe, modifieLe: p.modifieLe, origine: p.origine};
    });
  })).then(function (ph) {
    var tables = {};
    Object.keys(TABLES).forEach(function (t) {
      tables[t] = (d.tables || {})[t] || [];
    });
    tables.photos = ph.filter(Boolean);
    REGLAGES_PRIVES.forEach(function (k) {
      if (D.reglages[k]) {
        tables.reglages = tables.reglages.filter(function (r) { return r.id !== k; }).concat([D.reglages[k]]);
      }
    });
    return remplacerBase(tables);
  });
}
function remplacerBase(tables) {
  return ouvrirBase().then(function (db) {
    var noms = Object.keys(TABLES);
    return new Promise(function (ok, ko) {
      var tx = db.transaction(noms, 'readwrite');
      noms.forEach(function (t) {
        var s = tx.objectStore(t);
        s.clear();
        (tables[t] || []).forEach(function (o) {
          if (o && o.id !== undefined) {
            s.put(o);
          }
        });
      });
      tx.oncomplete = ok;
      tx.onerror = function () {
        ko(tx.error);
      };
      tx.onabort = function () {
        ko(tx.error || new Error('Restauration annulée'));
      };
    });
  }).then(chargerBase);
}

function nomSauvegarde() {
  return 'grimoire-' + dkey(new Date()) + '.zip';
}
ACTIONS.exporterSauvegarde = function () {
  fabriquerSauvegarde().then(function (blob) {
    var f = new File([blob], nomSauvegarde(), {type: 'application/zip'});
    if (navigator.canShare && navigator.canShare({files: [f]})) {
      return navigator.share({files: [f], title: 'Sauvegarde de mon grimoire'}).catch(function () {});
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    a.click();
  }).catch(erreurEcriture);
};

// ---------- Sauvegarde automatique dans le Drive, par le relais Apps Script ----------
// Code de liaison : « https://script.google.com/macros/s/…/exec#secret », collé une fois dans Réglages.
var DELAI_SAUVEGARDE = 30000;
var minuteurSauvegarde = null;
var sauvegardeEnCours = false;
var etatSauvegarde = '';

function liaison() {
  return reglage('liaison', null);
}
function lireCodeLiaison(code) {
  var m = String(code || '').trim().match(/^(https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec)#([A-Za-z0-9_-]{20,})$/);
  if (!m) {
    return null;
  }
  return {url: m[1], secret: m[2]};
}
function appelRelais(action, champs, l) {
  l = l || liaison();
  if (!l) {
    return Promise.reject(new Error('Sauvegarde Drive pas encore reliée'));
  }
  var corps = Object.assign({secret: l.secret, action: action}, champs || {});
  return fetch(l.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(corps)}).then(function (r) {
    return r.json();
  }).then(function (rep) {
    if (!rep.ok) {
      var msg = rep.erreur;
      if (rep.erreur === 'secret') {
        msg = 'code de liaison refusé';
      }
      throw new Error(msg);
    }
    return rep;
  });
}
function blobEnBase64(blob) {
  return new Promise(function (ok, ko) {
    var r = new FileReader();
    r.onload = function () {
      ok(String(r.result).split(',')[1]);
    };
    r.onerror = function () {
      ko(r.error);
    };
    r.readAsDataURL(blob);
  });
}
function base64EnBuffer(b64) {
  var bin = atob(b64);
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) {
    u8[i] = bin.charCodeAt(i);
  }
  return u8.buffer;
}

function heure(ts) {
  var d = new Date(ts);
  if (dkey(d) === dkey(new Date())) {
    return d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0');
  }
  return fdate(ts);
}
function texteSauvegarde() {
  if (!liaison()) {
    return '';
  }
  if (etatSauvegarde) {
    return etatSauvegarde;
  }
  var d = reglage('derniereSauvegarde');
  if (d) {
    return '☁️ ' + heure(d.date);
  }
  return '☁️ pas encore sauvegardé';
}
function majTemoin(etat) {
  etatSauvegarde = etat || '';
  if (typeof majSource === 'function') {
    majSource();
  }
  var r = document.getElementById('etatDrive');
  if (r) {
    r.textContent = texteSauvegarde();
  }
}

function planifierSauvegarde() {
  if (!liaison()) {
    return;
  }
  lsSet('bm_sauv_attente', '1');
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(sauvegarderMaintenant, DELAI_SAUVEGARDE);
}
apresEcritureHooks.push(planifierSauvegarde);

// force : passe outre le garde-fou (envoi demandé à la main)
function sauvegarderMaintenant(force) {
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = null;
  if (!liaison() || sauvegardeEnCours) {
    return Promise.resolve();
  }
  var n = valeurs(D.livres).length;
  var avant = reglage('derniereSauvegarde');
  // garde-fou : un grimoire soudain vidé ne doit pas écraser les sauvegardes
  if (force !== true && avant && avant.livres && n < avant.livres * 0.8) {
    majTemoin('⚠️ sauvegarde suspendue (' + n + ' livres au lieu de ' + avant.livres + ')');
    return Promise.resolve();
  }
  sauvegardeEnCours = true;
  majTemoin('☁️ sauvegarde…');
  return fabriquerSauvegarde().then(blobEnBase64).then(function (b64) {
    return appelRelais('sauver', {contenu: b64, jour: dkey(new Date())});
  }).then(function (rep) {
    lsSet('bm_sauv_attente', '');
    return regler('derniereSauvegarde', {date: Date.now(), livres: n, taille: rep.taille, nom: rep.nom});
  }).then(function () {
    sauvegardeEnCours = false;
    majTemoin('');
  }).catch(function (e) {
    sauvegardeEnCours = false;
    majTemoin('☁️ pas sauvegardé (' + ((e && e.message) || 'hors connexion ?') + ')');
  });
}
// l'appli passe en arrière-plan : on n'attend pas la fin du délai
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden' && minuteurSauvegarde) {
    sauvegarderMaintenant();
  }
});
// au démarrage : une sauvegarde n'a pas pu partir la dernière fois
function reprendreSauvegarde() {
  if (lsGet('bm_sauv_attente') === '1') {
    planifierSauvegarde();
  }
}

function listerSauvegardesDrive() {
  return appelRelais('lister').then(function (rep) {
    return rep.fichiers;
  });
}
function lireSauvegardeDrive(id) {
  return appelRelais('lire', {id: id}).then(function (rep) {
    return base64EnBuffer(rep.contenu);
  });
}
</script>

<script>
// ---------- Formulaires : livres, lectures, sessions, achats, séries, auteurs ----------
var FORMATS_FR = [['papier', '📖 Papier'], ['numerique', '📱 Numérique'], ['audio', '🎧 Audio']];
var UNITES = [['pages', 'Pages'], ['secondes', 'Durée (audio)'], ['pourcent', 'Pourcentage'], ['episodes', 'Épisodes']];
var POSSESSIONS = [['possede', '📚 Dans ma bibliothèque'], ['envie', '💫 Dans mes envies'], ['emprunte', '🤝 Emprunté'], ['', 'Non précisé']];
var STATUTS = [['en_cours', '📖 En cours'], ['pause', '⏸️ En pause'], ['terminee', '✅ Terminée'], ['abandonnee', '🏳️ Abandonnée'], ['plusenvie', '🍃 Plus envie']];
var DEVISES = [['EUR', '€'], ['USD', '$'], ['GBP', '£'], ['CHF', 'CHF'], ['CAD', 'CA$']];

// ---------- petits outils de formulaire ----------
function champ(id, valeur, attrs) {
  return '<input class="champ" id="' + id + '" value="' + esc(valeur === null || valeur === undefined ? '' : valeur) + '" ' + (attrs || '') + '>';
}
function choix(id, options, valeur) {
  return '<select class="champ" id="' + id + '">' + options.map(function (o) {
    var sel = '';
    if (String(o[0]) === String(valeur === null || valeur === undefined ? '' : valeur)) {
      sel = ' selected';
    }
    return '<option value="' + esc(o[0]) + '"' + sel + '>' + esc(o[1]) + '</option>';
  }).join('') + '</select>';
}
function listeDeChoix(id, valeurs) {
  var vus = {};
  return '<datalist id="' + id + '">' + valeurs.filter(function (v) {
    if (!v || vus[v]) {
      return false;
    }
    vus[v] = 1;
    return true;
  }).sort(function (a, b) { return a.localeCompare(b, 'fr'); }).map(function (v) {
    return '<option value="' + esc(v) + '">';

// durées : « 8:04 », « 8h04 », « 8 h » → secondes ; un nombre seul = des minutes
function lireDuree(s) {
  s = String(s || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!s) {
    return null;
  }
  var m = s.match(/^(\d+)(?:[:h](\d{0,2}))?(?:min)?$/);
  if (!m) {
    return null;
  }
  if (s.indexOf(':') < 0 && s.indexOf('h') < 0) {
    return parseInt(m[1], 10) * 60;
  }
  return parseInt(m[1], 10) * 3600 + parseInt(m[2] || '0', 10) * 60;
}
function texteDuree(sec) {
  if (sec === null || sec === undefined || sec === '') {
    return '';
  }
  var h = Math.floor(sec / 3600);
  var mn = Math.round((sec % 3600) / 60);
  if (mn === 60) {
    h++;
    mn = 0;
  }
  return h + ':' + String(mn).padStart(2, '0');
}
function champLongueur(id, unite, v) {

  }
  var ph = 'pages';

  } else if (unite === 'episodes') {

  }
  var txt = '';
  if (v !== null && v !== undefined && v !== '') {
    txt = String(v).replace('.', ',');
  }
  return champ(id, txt, 'inputmode="decimal" placeholder="' + ph + '"');
}
function lireLongueur(id, unite) {

}
function texteLongueur(unite, v) {
  v = v || 0;
  if (unite === 'secondes') {
    return hm(v);
  }
  if (unite === 'pourcent') {
    return round(v, 1) + ' %';
  }
  if (unite === 'episodes') {
    return v + ' ép.';
  }
  return v + ' p.';
}
function dateVersChamp(ts) {
  if (!ts) {
    return '';
  }

}
// une date sans heure est rangée à midi ; une date inchangée garde son heure d'origine
function champVersDate(v, ancien) {

  if (ancien && dkey(new Date(ancien)) === v) {

}
function heureVersChamp(ts) {

// note de 0 à 5 par demi-étoiles : toucher une étoile la remplit, la retoucher la coupe en deux, puis l'efface
function champEtoiles(id, v) {

function boutonsEtoiles(id, v) {

// redimensionne une photo (appareil ou fichier) → Blob JPEG
function redimensionnerImage(fichier, max) {
  return createImageBitmap(fichier).then(function (img) {
    var r = Math.min(1, max / Math.max(img.width, img.height));
    var c = document.createElement('canvas');
    c.width = Math.round(img.width * r);
    c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return new Promise(function (ok) {
      c.toBlob(ok, 'image/jpeg', 0.85);
    });
  });
}

// construit les écritures d'un livre : auteurs, série et genres nouveaux, photo, puis le livre
function opsLivre(f) {
  var ops = [];
  var base = {};
  if (f.id && D.livres[f.id]) {
    base = Object.assign({}, D.livres[f.id]);
  } else {
    base = {id: nouvelId(), origine: 'appli', exclusions: {}};
  }
  var crees = {};
  var contributeurs = [];
  f.contributeurs.forEach(function (c) {
    var aid = c.auteurId;
    if (!aid || !D.auteurs[aid]) {
      var exist = auteurParNom(c.nom);
      if (exist) {
        aid = exist.id;
      } else if (crees[slug(c.nom)]) {
        aid = crees[slug(c.nom)];
      } else {
        aid = 'a:' + slug(c.nom);
        if (D.auteurs[aid]) {
          aid = nouvelId();
        }
        crees[slug(c.nom)] = aid;
        ops.push({t: 'auteurs', o: {id: aid, nom: c.nom, tri: slug(c.nom.split(' ').pop())}});
      }
    }
    if (!contributeurs.some(function (x) { return x.auteurId === aid && x.role === c.role; })) {
      contributeurs.push({auteurId: aid, role: c.role});
    }
  });
  var serieId = '';
  if (f.serieNom) {
    var s = serieParNom(f.serieNom);
    if (s) {
      serieId = s.id;
    } else {
      serieId = nouvelId();
      ops.push({t: 'series', o: {id: serieId, nom: f.serieNom, statut: 'en_cours', nbTomes: null}});
    }
  }
  var genreIds = f.genres.map(function (nom) {
    var g = genreParNom(nom);
    if (g) {
      return g.id;
    }
    var gid = idGenre(nom);
    if (D.genres[gid]) {
      gid = nouvelId();
    }
    ops.push({t: 'genres', o: {id: gid, nom: nom, emoji: '', couleur: '', ordre: valeurs(D.genres).length + ops.length}});
    return gid;
  });
  var couverture = f.couverture || '';
  if (f.photo) {
    couverture = 'p:' + nouvelId();
    ops.push({t: 'photos', o: {id: couverture, blob: f.photo, type: 'image/jpeg', origine: 'appli'}});
  }
  if (/^p:/.test(base.couverture || '') && base.couverture !== couverture) {
    ops.push({t: 'photos', suppr: base.couverture});
  }
  var isbn = isbn13(f.isbn);
  var isbns = (base.isbns || []).filter(function (x) { return x !== isbn; });
  if (isbn) {
    isbns.unshift(isbn);
  }
  var livre = Object.assign(base, {
    titre: f.titre,
    contributeurs: contributeurs,
    serieId: serieId,
    tome: serieId ? f.tome : null,
    format: f.format || 'papier',
    unite: f.unite || 'pages',
    total: f.total || 0,
    possession: f.possession || '',
    isbns: isbns,
    editeur: f.editeur || '',
    annee: f.annee || null,
    langue: f.langue || '',
    genreIds: genreIds,
    etagereIds: f.etagereIds || [],
    couverture: couverture,
    resume: f.resume || ''
  });
  ops.push({t: 'livres', o: livre});
  return {ops: ops, livre: livre};
}

ACTIONS.sessions = function (el) {

// une session garde son heure de début, son heure de fin et son temps de lecture (pauses déduites)
function heureLisible(ts) {
  return heureVersChamp(ts).replace(':', ' h ');
}
function dureeLecture(sec) {
  var m = Math.round(sec / 60);
  if (m < 60) {
    return Math.max(1, m) + ' min';
  }
  return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
}
// « 18 h 00 → 19 h 00 · 45 min de lecture » ; un simple relevé de page : « à 15 h 33 »
function texteSession(s) {
  var parts = [];
  if (s.fin && s.fin - s.debut >= 60000) {
    parts.push(heureLisible(s.debut) + ' → ' + heureLisible(s.fin));
  } else if (s.dureeSec) {
    parts.push('dès ' + heureLisible(s.debut));
  } else {
    parts.push('à ' + heureLisible(s.debut));
  }
  if (s.dureeSec) {
    parts.push('<b>' + dureeLecture(s.dureeSec) + '</b> de lecture');
  }
  return parts.join(' · ');
}
function afficherSessions(lid) {
  var x = D.lectures[lid];
  var l = D.livres[x.livreId];

  }).join('');
  h += '<div class="row" style="margin-top:12px"><button class="act doux" data-act="formSession" data-lecture="' + lid + '">' + ic('plus') + ' Ajouter une session</button><button class="act doux" data-act="retourFiche" data-id="' + l.id + '">' + ic('chevron-left') + ' Retour</button></div>';
  ouvrirFeuille(h);
}
ACTIONS.formSession = function (el) {
  var sid = el.dataset.id;
  var lid = el.dataset.lecture;
  siIndependant(function () {
    var s = (sid && D.sessions[sid]) || null;
    var x = D.lectures[(s && s.lectureId) || lid];
    var maintenant = Date.now();
    var v = s || {debut: maintenant - 30 * 60000, fin: maintenant, dureeSec: 30 * 60, position: null};
    var fin = '';
    if (v.fin && v.fin - v.debut >= 60000) {
      fin = heureVersChamp(v.fin);
    }
    var h = '<h3>' + (s ? 'Modifier la session' : 'Ajouter une session') + '</h3><div class="form">' +
      '<label>Date</label>' + champ('seDate', dateVersChamp(v.debut), 'type="date"') +
      '<div class="deux"><div><label>Début</label>' + champ('seHeure', heureVersChamp(v.debut), 'type="time"') + '</div><div><label>Fin</label>' + champ('seFin', fin, 'type="time"') + '</div></div>' +
      '<div class="deux"><div><label>Temps de lecture (min)</label>' + champ('seMinutes', v.dureeSec ? Math.round(v.dureeSec / 60) : '', 'type="number" min="0" inputmode="numeric"') + '</div><div><label>Arrivée à</label>' + champLongueur('sePosition', x.unite, v.position) + '</div></div>' +
      '<p class="small muted" style="margin:6px 0 0">Le temps de lecture compte sans les pauses : par ex. de 18 h à 19 h avec 15 min de pause, 45 min. Laisse-le vide pour compter tout le temps entre le début et la fin.</p>' +
      '<div class="row" style="margin-top:16px"><button class="act" data-act="seEnregistrer">' + ic('check') + ' Enregistrer</button><button class="act doux" data-act="seRetour">Annuler</button></div>';
    if (s) {
      h += '<button class="lien danger" data-act="seSupprimer" style="margin-top:14px">' + ic('trash-2') + ' Supprimer cette session</button>';
    }
    ouvrirFeuille(h + '</div>');
    ACTIONS.seRetour = function () {
      afficherSessions(x.id);
    };
    ACTIONS.seEnregistrer = function () {
      var jour = val('seDate');
      if (!jour) {
        avertir('Indique la date.');
        return;
      }
      var debut = new Date(jour + 'T' + (val('seHeure') || '12:00') + ':00').getTime();
      var mn = valNombre('seMinutes');
      var finSession = null;
      if (val('seFin')) {
        finSession = new Date(jour + 'T' + val('seFin') + ':00').getTime();
        // fin avant le début : la lecture a passé minuit
        if (finSession < debut) {
          finSession += DAY;
        }
        if (mn === null && finSession > debut) {
          mn = Math.round((finSession - debut) / 60000);
        }
      } else {
        finSession = debut + (mn || 0) * 60000;
      }
      if (mn && finSession > debut && mn * 60000 > finSession - debut + 59000) {
        avertir('Le temps de lecture (' + mn + ' min) dépasse le temps entre le début et la fin (' + Math.round((finSession - debut) / 60000) + ' min).');
        return;
      }
      var pos = lireLongueur('sePosition', x.unite);
      var ses = Object.assign({}, s || {id: nouvelId(), lectureId: x.id, livreId: x.livreId, origine: 'manuel'}, {
        debut: debut,
        fin: finSession,
        dureeSec: mn ? Math.round(mn * 60) : null,
        position: pos
      });
      var ops = [{t: 'sessions', o: ses}];
      // la lecture avance si c'est la position la plus récente
      var plusRecente = valeurs(D.sessions).filter(function (y) { return y.lectureId === x.id && y.id !== ses.id && y.position !== null && y.position !== undefined; }).every(function (y) { return (y.fin || y.debut) <= ses.fin; });
      if (pos !== null && plusRecente) {
        ops.push({t: 'lectures', o: Object.assign({}, x, {position: pos})});
      }
      ecrire(ops).then(function () {
        apresEcriture();
        afficherSessions(x.id);
      }).catch(erreurEcriture);
    };
    ACTIONS.seSupprimer = function () {
      demander('Supprimer cette session ?', {oui: 'Supprimer', danger: true}).then(function (ok) {
        if (!ok) {
          return;
        }
        ecrire([{t: 'sessions', suppr: s.id}]).then(function () {
          apresEcriture();
          afficherSessions(x.id);
        }).catch(erreurEcriture);
      });
    };
  });
};

          fermerFeuille();

          if (message) {
            toast(message);
          }
        }).catch(erreurEcriture);
      }

      var nonLus = [];

      }

        ouvrirFormAchat(null, r.livre.id);
      } else {
        ouvrirFiche(r.livre.id);
      }
      toast('✨ Ajouté à ton grimoire');
    }).catch(erreurEcriture);
  });
}
</script>

<script>
// ---------- Minuteur de lecture ----------
// Une seule session ouverte à la fois, enregistrée dans la base (elle survit à la fermeture de l'appli) :
// {enCours: true, debut, accumule (secondes déjà comptées), repriseA (ms, ou null en pause)}.
var minuteurTic = null;
var verrouEcran = null;

function sessionEnCours() {
  return valeurs(D.sessions || {}).find(function (s) { return s.enCours; }) || null;
}
function ecoule(s) {
  var t = s.accumule || 0;
  if (s.repriseA) {
    t += (Date.now() - s.repriseA) / 1000;
  }
  return Math.max(0, Math.round(t));
}
function texteChrono(sec) {
  var h = Math.floor(sec / 3600);
  var m = Math.floor((sec % 3600) / 60);
  var s = sec % 60;
  var mm = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  if (h) {
    return h + ':' + mm;
  }
  return mm;
}
function vibrer(motif) {
  if (navigator.vibrate) {
    try {
      navigator.vibrate(motif);
    } catch (e) {}
  }
}
function titreCourt(l) {
  return String((l && l.titre) || 'Lecture').replace(/\s*\([^)]*#\d+(\.\d+)?\)\s*$/, '');
}
function couvSession(s) {
  var b = M && M.parId[s.livreId];
  if (b) {
    return cover(b);
  }
  return '<div class="ph"></div>';
}

// garder l'écran allumé tant que la page du minuteur est ouverte et que la lecture tourne
function majVerrouEcran() {
  var s = sessionEnCours();
  var voulu = !!(document.getElementById('pageMinuteur') && s && s.repriseA && document.visibilityState === 'visible');
  if (voulu && !verrouEcran && navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(function (v) {
      verrouEcran = v;
      v.addEventListener('release', function () {
        verrouEcran = null;
      });
    }).catch(function () {});
  } else if (!voulu && verrouEcran) {
    verrouEcran.release().catch(function () {});
    verrouEcran = null;
  }
}

// rafraîchit le mini-lecteur et la page du minuteur (chaque seconde tant qu'une session est ouverte)
function majMinuteur() {
  var s = sessionEnCours();
  var bar = document.getElementById('lecteur');
  document.body.classList.toggle('minuteur-actif', !!s);
  if (!s) {
    if (bar) {
      bar.remove();
    }
    fermerPageMinuteur();
    clearInterval(minuteurTic);
    minuteurTic = null;
    return;
  }
  var l = D.livres[s.livreId];
  var pause = !s.repriseA;
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'lecteur';
    bar.className = 'lecteur';
    document.body.appendChild(bar);
    bar.innerHTML = '<div class="ouvrir" data-act="pageMinuteur"><span class="couv-mini"></span><div class="txt"><div class="chrono"></div><div class="tt"></div></div></div><button class="b" data-act="basculerMinuteur" aria-label="Pause ou reprise"></button><button class="b stop" data-act="arreterMinuteur" aria-label="Terminer la session">' + ic('square') + '</button>';
  }
  if (bar.dataset.session !== s.id) {
    bar.dataset.session = s.id;
    bar.querySelector('.couv-mini').innerHTML = couvSession(s);
  }
  bar.classList.toggle('pause', pause);
  bar.querySelector('.chrono').textContent = texteChrono(ecoule(s));
  bar.querySelector('.tt').textContent = (pause ? '⏸ EN PAUSE · ' : '') + titreCourt(l);
  var bascule = bar.querySelector('[data-act="basculerMinuteur"]');
  if (bascule.dataset.etat !== String(pause)) {
    bascule.dataset.etat = String(pause);
    bascule.innerHTML = pause ? ic('play') : ic('pause');
  }
  majPageMinuteur();
  if (!minuteurTic) {
    minuteurTic = setInterval(majMinuteur, 1000);
  }
}
// ancien nom, appelé ailleurs
var majPastille = majMinuteur;
apresEcritureHooks.push(majMinuteur);
document.addEventListener('visibilitychange', function () {
  if (D.sessions) {
    majMinuteur();
    majVerrouEcran();
  }
});

// ---------- page du minuteur ----------
ACTIONS.pageMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  fermerFeuille();
  var p = document.getElementById('pageMinuteur');
  if (!p) {
    p = document.createElement('div');
    p.id = 'pageMinuteur';
    p.className = 'page-minuteur';
    document.body.appendChild(p);
  }
  var l = D.livres[s.livreId] || {};
  var b = M && M.parId[s.livreId];
  var auteurs = '';
  if (b) {
    auteurs = b.authors.join(', ');
  }
  p.innerHTML = '<div class="bandeau-pause">⏸ EN PAUSE ⏸ EN PAUSE ⏸ EN PAUSE ⏸ EN PAUSE</div>' +
    '<div class="haut"><button data-act="fermerPageMinuteur">' + ic('chevron-left') + ' Retour</button><span class="small muted" id="eveilEcran"></span><button class="annuler-haut" data-act="annulerMinuteur">' + ic('x') + ' Annuler</button></div>' +
    '<div class="couv">' + couvSession(s) + '</div><div class="titre">' + esc(titreCourt(l)) + '</div><div class="auteur">' + esc(auteurs) + '</div>' +
    '<div class="anneau-m"><div class="chrono-m" id="chronoGrand"></div><div class="etat-m" id="etatMinuteur"></div></div>' +
    '<div class="infos-m" id="infosMinuteur"></div>' +
    '<div class="commandes"><button class="rond-m annuler" data-act="annulerMinuteur">' + ic('x') + '<small>annuler</small></button><button class="gros-m" id="boutonMinuteur" data-act="basculerMinuteur"></button><button class="rond-m" data-act="arreterMinuteur">' + ic('square') + '<small>terminer</small></button></div>';
  majPageMinuteur();
  majVerrouEcran();
};
function majPageMinuteur() {
  var p = document.getElementById('pageMinuteur');
  var s = sessionEnCours();
  if (!p || !s) {
    return;
  }
  var pause = !s.repriseA;
  p.classList.toggle('pause', pause);
  document.getElementById('chronoGrand').textContent = texteChrono(ecoule(s));
  document.getElementById('etatMinuteur').textContent = pause ? '⏸ en pause' : '✨ lecture en cours';
  var gros = document.getElementById('boutonMinuteur');
  if (gros.dataset.etat !== String(pause)) {
    gros.dataset.etat = String(pause);
    gros.innerHTML = pause ? ic('play') : ic('pause');
  }
  var x = D.lectures[s.lectureId] || {};
  var info;
  if (pause) {
    info = 'en pause' + (s.pauseA ? ' depuis <b>' + dureeCourte((Date.now() - s.pauseA) / 1000) + '</b>' : '') + '<br>touche ▶ pour reprendre';
  } else {
    info = 'commencé à <b>' + heureVersChamp(s.debut).replace(':', ' h ') + '</b>';
    if (x.position) {
      info += ' · départ <b>' + texteLongueur(x.unite, x.position) + '</b>';
    }
    var r = M && M.lectures.find(function (y) { return y._id === s.lectureId; });
    if (r) {
      var est = estimationLecture(r);
      if (est.reste) {
        info += '<br>' + est.reste.replace('⏳ ', '') + ' pour finir le livre';
      }
    }
  }
  document.getElementById('infosMinuteur').innerHTML = info;
  var eveil = document.getElementById('eveilEcran');
  if (eveil) {
    eveil.textContent = (verrouEcran && !pause) ? '🔆 écran allumé' : '';
  }
}
function fermerPageMinuteur() {
  var p = document.getElementById('pageMinuteur');
  if (p) {
    p.remove();
  }
  majVerrouEcran();
}
ACTIONS.fermerPageMinuteur = fermerPageMinuteur;

// ---------- commandes ----------
// ▶ Lire : lance le minuteur (ou rouvre celui qui tourne) et affiche sa page
ACTIONS.lireMaintenant = function (el) {
  var lid = el.dataset.lecture;
  siIndependant(function () {
    var s = sessionEnCours();
    if (s) {
      if (s.lectureId !== lid) {
        toast('⏱️ Un minuteur tourne déjà pour « ' + titreCourt(D.livres[s.livreId]) + ' »');
      }
      ACTIONS.pageMinuteur();
      return;
    }
    var x = D.lectures[lid];
    var maintenant = Date.now();
    var ops = [{t: 'sessions', o: {id: nouvelId(), lectureId: lid, livreId: x.livreId, debut: maintenant, fin: null, dureeSec: null, position: null, accumule: 0, repriseA: maintenant, enCours: true, origine: 'minuteur'}}];
    if (x.statut === 'pause') {
      ops.push({t: 'lectures', o: Object.assign({}, x, {statut: 'en_cours'})});
    }
    vibrer(50);
    ecrire(ops).then(function () {
      fermerFeuille();
      apresEcriture();
      ACTIONS.pageMinuteur();
    }).catch(erreurEcriture);
  });
};
ACTIONS.lancerMinuteur = ACTIONS.lireMaintenant;
ACTIONS.ouvrirMinuteur = function () {
  ACTIONS.pageMinuteur();
};
function modifierSessionEnCours(champs) {
  var s = sessionEnCours();
  if (!s) {
    return Promise.resolve();
  }
  return ecrire([{t: 'sessions', o: Object.assign({}, s, champs)}]).then(function () {
    majMinuteur();
    majVerrouEcran();
  });
}
// ▶ / ⏸ : un « bzz » pour reprendre, deux pour la pause
ACTIONS.basculerMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  if (s.repriseA) {
    vibrer([60, 80, 60]);
    modifierSessionEnCours({accumule: ecoule(s), repriseA: null, pauseA: Date.now()});
  } else {
    vibrer(50);
    modifierSessionEnCours({repriseA: Date.now(), pauseA: null});
  }
};
ACTIONS.pauseMinuteur = function () {
  var s = sessionEnCours();
  if (s && s.repriseA) {
    ACTIONS.basculerMinuteur();
  }
};
ACTIONS.repriseMinuteur = function () {
  var s = sessionEnCours();
  if (s && !s.repriseA) {
    ACTIONS.basculerMinuteur();
  }
};
ACTIONS.annulerMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  demander('Cette session ne sera pas comptée.', {titre: 'Annuler ce minuteur ?', oui: 'Annuler le minuteur', non: 'Continuer', danger: true}).then(function (ok) {
    if (!ok) {
      return;
    }
    ecrire([{t: 'sessions', suppr: s.id}]).then(function () {
      fermerPageMinuteur();
      apresEcriture();
    }).catch(erreurEcriture);
  });
};

// ⏹ : la fenêtre d'arrêt, avec la page pré-remplie et des raccourcis
function pagesMoyennesParSession(lid) {
  var ss = valeurs(D.sessions).filter(function (s) { return s.lectureId === lid && !s.enCours && s.position !== null && s.position !== undefined; }).sort(function (a, b) { return (a.fin || a.debut) - (b.fin || b.debut); });
  var gains = [];
  var max = 0;
  ss.forEach(function (s, i) {
    if (i > 0 && s.dureeSec && s.position > max) {
      gains.push(s.position - max);
    }
    max = Math.max(max, s.position);
  });
  if (gains.length < 2) {
    return null;
  }
  return Math.round(mediane(gains));
}
ACTIONS.arreterMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  vibrer(120);
  var sec = ecoule(s);
  var finArret = Date.now();
  var x = D.lectures[s.lectureId];
  var mn = Math.max(1, Math.round(sec / 60));
  var pauseSec = Math.max(0, (finArret - s.debut) / 1000 - sec);
  var plage = '' + ic('history') + ' ' + heureLisible(s.debut) + ' → ' + heureLisible(finArret);
  if (pauseSec >= 60) {
    plage += ' · ⏸ ' + dureeLecture(pauseSec) + ' de pause';
  }
  var depart = x.position || 0;
  var propose = depart;
  var pas = '';
  if (x.unite === 'secondes') {
    // en audio, la position avance avec le temps d'écoute
    propose = depart + sec;
  } else if (x.unite === 'pages') {
    var moy = pagesMoyennesParSession(x.id);
    var raccourcis = [10, 20];
    if (moy && raccourcis.indexOf(moy) < 0) {
      raccourcis.push(moy);
    }
    raccourcis.push(50);
    pas = '<div class="pas">' + raccourcis.map(function (n) {
      return '<button data-act="pasPage" data-n="' + n + '">+' + n + (n === moy ? ' (ta moyenne)' : '') + '</button>';
    }).join('') + '</div>';
  }
  var oubli = '';
  if (sec > 6 * 3600) {
    oubli = '<p class="small">🤔 Plus de 6 heures : tu as peut-être oublié d\'arrêter le minuteur ? Corrige la durée si besoin.</p>';
  }
  var question = 'Tu en es à quelle page ?';
  if (x.unite === 'secondes') {
    question = 'Tu en es où dans l\'écoute ? (h:mm)';
  } else if (x.unite === 'pourcent') {
    question = 'Tu en es à combien de % ?';
  }
  ouvrirFeuille('<h3>Session terminée ✨</h3><p class="small muted" style="margin:0">' + esc(titreCourt(D.livres[s.livreId])) + '</p>' +
    '<div class="grand-chrono">' + dureeLecture(sec) + '</div><p class="small muted" style="text-align:center;margin:0">de lecture · ' + plage + '</p>' + oubli +
    '<p class="small" style="margin:6px 0 0;text-align:center">' + question + '</p>' +
    '<div class="champ-page"><button class="rond-m" data-act="pasPage" data-n="-1">' + ic('minus') + '</button>' + (x.unite === 'secondes' ? champ('arPosition', texteDuree(propose), 'inputmode="numeric"') : champ('arPosition', propose || '', 'inputmode="decimal"')) + '<button class="rond-m" data-act="pasPage" data-n="1">' + ic('plus') + '</button></div>' +
    pas + '<p class="small muted" style="text-align:center;margin:8px 0 0" id="arResume"></p>' +
    '<div class="form" style="margin-top:6px"><label>Temps de lecture (min, pauses déduites)</label>' + champ('arMinutes', mn, 'type="number" min="1" inputmode="numeric"') + '</div>' +
    '<div class="row" style="margin-top:14px"><button class="act" data-act="validerArret">' + ic('check') + ' Enregistrer</button><button class="act doux" data-act="reprendreApresArret">' + ic('play') + ' Reprendre</button></div>');
  function resume() {
    var pos = lireLongueur('arPosition', x.unite);
    var el = document.getElementById('arResume');
    if (!el) {
      return;
    }
    var avant = 'avant : ' + texteLongueur(x.unite, depart);
    if (pos !== null && pos > depart && x.unite === 'pages') {
      avant += ' · soit <b style="color:var(--ink)">' + round(pos - depart, 1) + ' pages</b> en ' + (valNombre('arMinutes') || mn) + ' min';
    }
    el.innerHTML = avant;
  }
  resume();
  document.getElementById('arPosition').addEventListener('input', resume);
  ACTIONS.pasPage = function (el) {
    var n = parseFloat(el.dataset.n);
    if (x.unite === 'secondes') {
      var v = lireDuree(val('arPosition')) || depart;
      document.getElementById('arPosition').value = texteDuree(Math.max(0, v + n * 60));
    } else {
      var base = depart;
      if (Math.abs(n) === 1) {
        base = valNombre('arPosition') || depart;
      }
      var nv = Math.max(0, base + n);
      if (x.total && x.unite === 'pages') {
        nv = Math.min(nv, x.total);
      }
      document.getElementById('arPosition').value = String(nv).replace('.', ',');
    }
    resume();
  };
  ACTIONS.reprendreApresArret = function () {
    fermerFeuille();
    ACTIONS.pageMinuteur();
  };
  ACTIONS.validerArret = function () {
    var s2 = sessionEnCours();
    if (!s2) {
      fermerFeuille();
      return;
    }
    var minutes = valNombre('arMinutes') || mn;
    var pos = lireLongueur('arPosition', x.unite);
    var session = Object.assign({}, s2, {enCours: false, fin: finArret, dureeSec: Math.round(minutes * 60), position: pos});
    delete session.accumule;
    delete session.repriseA;
    delete session.pauseA;
    var ops = [{t: 'sessions', o: session}];
    var lec = D.lectures[s2.lectureId];
    if (pos !== null) {
      ops.push({t: 'lectures', o: Object.assign({}, lec, {position: pos})});
    }
    ecrire(ops).then(function () {
      fermerPageMinuteur();
      apresEcriture();
      if (lec.total && pos !== null && pos >= lec.total) {
        proposerFin(lec.id);
      } else {
        fermerFeuille();
        toast('⏱️ ' + Math.round(minutes) + ' min de lecture notées');
      }
    }).catch(erreurEcriture);
  };
};
</script>

<script>
// ---------- Mes listes : genres, critères, humeurs, tropes, étagères ----------
var LISTES = [
  ['genres', '' + ic('tag') + ' Genres', 'genre', 'g:'],
  ['criteres', '' + ic('heart') + ' Critères', 'critère', 'c:'],
  ['humeurs', '' + ic('smile') + ' Humeurs', 'humeur', 'h:'],
  ['tropes', '' + ic('sparkles') + ' Tropes', 'trope', 't:'],
  ['etageres', '' + ic('library-big') + ' Étagères', 'étagère', 'e:']
];
var listeOuverte = 'humeurs';

function infoListe(t) {
  return LISTES.find(function (l) { return l[0] === t; });
}
// combien de livres utilisent cet élément
function usages(t, id) {
  if (t === 'genres' || t === 'etageres') {
    var champ = 'genreIds';
    if (t === 'etageres') {
      champ = 'etagereIds';
    }
    return valeurs(D.livres).filter(function (l) { return (l[champ] || []).indexOf(id) >= 0; }).length;
  }
  return valeurs(D.avis).filter(function (a) {
    if (t === 'criteres') {
      return !!(a.notes || {})[id];
    }
    var champ2 = 'humeurIds';
    if (t === 'tropes') {
      champ2 = 'tropeIds';
    }
    return (a[champ2] || []).indexOf(id) >= 0;
  }).length;
}
// crée un élément (ou renvoie celui qui porte déjà ce nom) → Promise<élément>
function creerElementListe(t, nom, emoji) {
  var existe = valeurs(D[t]).find(function (x) { return slug(x.nom) === slug(nom); });
  if (existe) {
    if (existe.archive) {
      return enregistrer(t, Object.assign({}, existe, {archive: false})).then(function () { return D[t][existe.id]; });
    }
    return Promise.resolve(existe);
  }
  var id = infoListe(t)[3] + slug(nom);
  if (t === 'humeurs') {
    id = idHumeur('x ' + nom);
  } else if (t === 'tropes') {
    id = idTrope(nom);
  } else if (t === 'genres') {
    id = idGenre(nom);
  }
  if (D[t][id]) {
    id = nouvelId();
  }
  var ordre = valeurs(D[t]).reduce(function (m, x) { return Math.max(m, x.ordre || 0); }, -1) + 1;
  var o = {id: id, nom: nom, emoji: emoji || '', ordre: ordre};
  if (t === 'genres') {
    o.couleur = '';
  }
  return enregistrer(t, o).then(function () { return D[t][id]; });
}

ACTIONS.mesListes = function (el) {
  if (el && el.dataset && el.dataset.t) {
    listeOuverte = el.dataset.t;
  }
  var t = listeOuverte;
  var info = infoListe(t);
  var elements = listeTriee(t);
  var actifs = elements.filter(function (x) { return !x.archive; });
  var h = '<h3>Mes listes</h3><div>' + LISTES.map(function (l) {

  h += '<div class="liste-perso" style="margin-top:10px">' + elements.map(function (x) {

    }
    var haut = '<button class="mini-btn" data-act="deplacerElement" data-id="' + esc(x.id) + '" data-sens="-1"' + (i <= 0 ? ' disabled' : '') + '>' + ic('chevron-up') + '</button>';
    var bas = '<button class="mini-btn" data-act="deplacerElement" data-id="' + esc(x.id) + '" data-sens="1"' + (i < 0 || i >= actifs.length - 1 ? ' disabled' : '') + '>' + ic('chevron-down') + '</button>';
    if (x.archive) {

    }

  }).join('') + '</div>';
  h += '<button class="lien" data-act="formElement" data-t="' + t + '">' + ic('plus') + ' Ajouter un·e ' + info[2] + '</button>';

};
ACTIONS.deplacerElement = function (el) {
  var t = listeOuverte;
  var actifs = listeTriee(t).filter(function (x) { return !x.archive; });
  var i = actifs.findIndex(function (x) { return x.id === el.dataset.id; });
  var j = i + parseInt(el.dataset.sens, 10);
  if (i < 0 || j < 0 || j >= actifs.length) {
    return;
  }
  var tmp = actifs[i];
  actifs[i] = actifs[j];
  actifs[j] = tmp;
  // on renumérote toute la liste pour garder un ordre propre
  var ops = actifs.map(function (x, k) { return {t: t, o: Object.assign({}, x, {ordre: k})}; });
  ecrire(ops).then(function () {
    apresEcriture();
    ACTIONS.mesListes();

};
ACTIONS.formElement = function (el) {
  var t = el.dataset.t;
  var x = (el.dataset.id && D[t][el.dataset.id]) || null;
  var info = infoListe(t);
  var n = x ? usages(t, x.id) : 0;
  var h = '<h3>' + (x ? 'Modifier' : 'Ajouter') + ' : ' + info[2] + '</h3><div class="form">' +

  if (t === 'genres') {

  }
  if (x) {
    h += '<label class="small" style="text-transform:none;letter-spacing:0;margin-top:14px"><input type="checkbox" id="elArchive"' + (x.archive ? ' checked' : '') + '> archivé (caché des choix, gardé sur les livres déjà notés)</label>';
  }
  h += '<div class="row" style="margin-top:16px"><button class="act" data-act="elEnregistrer">' + ic('check') + ' Enregistrer</button><button class="act doux" data-act="mesListes">' + ic('chevron-left') + ' Retour</button></div>';
  if (x) {
    var avec = '';
    if (n) {
      avec = ' (il sera retiré de ' + n + ' livre' + (n > 1 ? 's' : '') + ')';
    }
    h += '<button class="lien danger" data-act="elSupprimer" style="margin-top:14px">' + ic('trash-2') + ' Supprimer' + avec + '</button>';
  }
  ouvrirFeuille(h + '</div>');
  ACTIONS.elEnregistrer = function () {
    var nom = val('elNom');
    if (!nom) {
      avertir('Il manque le nom.');
      return;
    }
    var p;
    if (x) {
      var o = Object.assign({}, x, {nom: nom, emoji: val('elEmoji')});
      var arch = document.getElementById('elArchive');
      o.archive = !!(arch && arch.checked);
      if (t === 'genres') {
        o.couleur = document.getElementById('elSansCouleur').checked ? '' : val('elCouleur');
      }
      p = enregistrer(t, o);
    } else {
      p = creerElementListe(t, nom, val('elEmoji')).then(function (nv) {
        if (t === 'genres' && !document.getElementById('elSansCouleur').checked) {
          return enregistrer(t, Object.assign({}, nv, {couleur: val('elCouleur')}));
        }
      });
    }
    p.then(function () {
      ACTIONS.mesListes();
    }).catch(erreurEcriture);
  };
  ACTIONS.elSupprimer = function () {
    demander('Supprimer « ' + x.nom + ' » ?' + (n ? ' Il sera retiré de ' + n + ' livre(s).' : ''), {oui: 'Supprimer', danger: true}).then(function (ok) {
      if (!ok) {
        return;
      }
      var ops = [{t: t, suppr: x.id}];
      if (t === 'genres' || t === 'etageres') {
        var champ1 = 'genreIds';
        if (t === 'etageres') {
          champ1 = 'etagereIds';
        }
        valeurs(D.livres).forEach(function (l) {
          if ((l[champ1] || []).indexOf(x.id) >= 0) {
            var m = {};
            m[champ1] = l[champ1].filter(function (g) { return g !== x.id; });
            ops.push({t: 'livres', o: Object.assign({}, l, m)});
          }
        });
      } else {
        valeurs(D.avis).forEach(function (a) {
          var m = {};
          if (t === 'criteres' && (a.notes || {})[x.id]) {
            m.notes = Object.assign({}, a.notes);
            delete m.notes[x.id];
          } else if (t === 'humeurs' && (a.humeurIds || []).indexOf(x.id) >= 0) {
            m.humeurIds = a.humeurIds.filter(function (y) { return y !== x.id; });
          } else if (t === 'tropes' && (a.tropeIds || []).indexOf(x.id) >= 0) {
            m.tropeIds = a.tropeIds.filter(function (y) { return y !== x.id; });
          }
          if (Object.keys(m).length) {
            ops.push({t: 'avis', o: Object.assign({}, a, m)});
          }
        });
      }
      ecrire(ops).then(function () {
        apresEcriture();
        ACTIONS.mesListes();
      }).catch(erreurEcriture);
    });
  };
};

<script>
// ---------- Citations et pensées : texte, page, photo de la page, lecture du texte (OCR) ----------
var TESSERACT = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/';
var TESSERACT_CORE = 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1';
var TESSERACT_FRA = 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/fra@1.0.0/4.0.0_best_int';
var fc = null;
// types d'une entrée du carnet ; les notes (infos, rappels…) ne s'affichent pas comme des citations
var TYPES_CITATION = [['citation', '❝ Citation'], ['pensee', '💭 Pensée'], ['note', '📝 Note']];
var INDICES_CITATION = {citation: 'La phrase qui t\'a marquée…', pensee: 'Ce que ça t\'inspire…', note: 'Un personnage, une info, un rappel…'};
var NOMS_CITATION = {citation: 'la citation', pensee: 'la pensée', note: 'la note'};
function iconeTypeCitation(type) {
  if (type === 'pensee' || type === 'THOUGHT') {
    return '💭 ';
  }
  if (type === 'note' || type === 'NOTE') {
    return '📝 ';
  }
  return '';
}

// filtre du carnet : [type de l'adaptateur, libellé, icône]
var FILTRES_CITATIONS = [['tout', 'Tout', ''], ['BOOK_CONTENT', 'Citations', 'quote'], ['THOUGHT', 'Pensées', 'message-circle-heart'], ['NOTE', 'Notes', 'sticky-note']];
ACTIONS.filtreCitations = function (el) {
  lsSet('bm_filtre_cit', el.dataset.f);

};
function carteCitations() {
  var toutes = M.notes.filter(function (n) { return n.texte || n.photo; }).sort(function (a, b) { return b.created_at - a.created_at; });
  var nb = {};

  }).join(''));

// citations d'un livre, pour sa fiche
function blocCitationsLivre(id) {

    '<div class="row" style="margin-top:16px"><button class="act" data-act="ciEnregistrer">' + ic('check') + ' Enregistrer</button><button class="act doux" data-act="ciAnnuler">Annuler</button></div>';

function livreDepuisTitre(t) {

ACTIONS.ciEnregistrer = function () {

    }

  }

  if (!texte && !fc.photo && !fc.photoId) {
    avertir('Écris le texte ou ajoute une photo.');
    return;
  }
  var ancienne = (fc.id && D.citations[fc.id]) || null;
  var ops = [];
  var photoId = fc.photoId;
  if (fc.photo) {
    photoId = 'p:' + nouvelId();
    ops.push({t: 'photos', o: {id: photoId, blob: fc.photo, type: 'image/jpeg', origine: 'appli'}});
  }
  if (ancienne && ancienne.photoId && ancienne.photoId !== photoId) {
    ops.push({t: 'photos', suppr: ancienne.photoId});
  }
  var cit = Object.assign({}, ancienne || {id: nouvelId(), origine: 'appli', commentaires: []}, {

ACTIONS.ciSupprimer = function () {

      }
    }).catch(erreurEcriture);

// ---------- lecture du texte d'une photo (Tesseract, en français, chargé au premier usage) ----------
var ocrTravailleur = null;
function travailleurOcr(suivi) {
  if (!ocrTravailleur) {
    ocrTravailleur = chargerScript(TESSERACT + 'tesseract.min.js').then(function () {
      return Tesseract.createWorker('fra', 1, {
        workerPath: TESSERACT + 'worker.min.js',
        corePath: TESSERACT_CORE,
        langPath: TESSERACT_FRA,
        logger: function (m) {
          if (suivi.f) {
            suivi.f(m);
          }
        }
      });
    }).catch(function (e) {
      ocrTravailleur = null;
      throw e;
    });
  }
  return ocrTravailleur;
}
var suiviOcr = {f: null};
// recolle les lignes coupées : « mot-\nsuite » → « motsuite », retours simples → espaces
function nettoyerOcr(t) {
  return String(t || '').replace(/-\n(?=[a-zà-ÿ])/g, '').replace(/([^\n])\n(?!\n)/g, '$1 ').replace(/[ \t]+/g, ' ').replace(/\n{2,}/g, '\n\n').trim();
}
function lireTexteImage(source) {
  return travailleurOcr(suiviOcr).then(function (w) {
    return w.recognize(source);
  }).then(function (r) {
    return nettoyerOcr(r.data.text);
  });
}
ACTIONS.preparerOcr = function () {
  toast('🔤 Téléchargement de la lecture de texte (≈ 5 Mo)…');
  travailleurOcr(suiviOcr).then(function () {
    regler('ocrPret', Date.now());
    toast('✨ Lecture de texte prête, même hors connexion');
  }).catch(function (e) {
    avertir('Téléchargement impossible : ' + ((e && e.message) || e));
  });
};

// recadrage : on trace au doigt la zone à lire, ou on lit toute la page
ACTIONS.ciLireTexte = function () {
  var src = srcPhotoCitation();
  if (!src) {
    return;
  }
  var d = document.createElement('div');
  d.className = 'recadrage';
  d.id = 'recadrage';
  d.innerHTML = '<div class="consigne">Trace au doigt un cadre autour du passage à lire</div><div class="zone"><img src="' + esc(src) + '" alt=""><div class="cadre" hidden></div></div><div class="etat" id="etatOcr"></div><div class="bas"><button class="act" data-act="ocrZone">' + ic('scan-text') + ' Lire la zone</button><button class="act doux" data-act="ocrTout">Toute la page</button><button class="act doux" data-act="fermerRecadrage">Annuler</button></div>';
  document.body.appendChild(d);
  var img = d.querySelector('img');
  var cadre = d.querySelector('.cadre');
  var zone = d.querySelector('.zone');
  var depart = null;
  recadre = null;
  zone.addEventListener('pointerdown', function (e) {
    var r = img.getBoundingClientRect();
    depart = {x: Math.min(Math.max(e.clientX, r.left), r.right), y: Math.min(Math.max(e.clientY, r.top), r.bottom)};
    zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener('pointermove', function (e) {
    if (!depart) {
      return;
    }
    var r = img.getBoundingClientRect();
    var zr = zone.getBoundingClientRect();
    var x = Math.min(Math.max(e.clientX, r.left), r.right);
    var y = Math.min(Math.max(e.clientY, r.top), r.bottom);
    var g = Math.min(depart.x, x), h = Math.min(depart.y, y);
    var w = Math.abs(x - depart.x), t = Math.abs(y - depart.y);
    cadre.hidden = false;
    cadre.style.left = (g - zr.left) + 'px';
    cadre.style.top = (h - zr.top) + 'px';
    cadre.style.width = w + 'px';
    cadre.style.height = t + 'px';
    // en proportion de l'image réelle
    recadre = {x: (g - r.left) / r.width, y: (h - r.top) / r.height, w: w / r.width, h: t / r.height};
  });
  zone.addEventListener('pointerup', function () {
    depart = null;
  });
};
var recadre = null;
ACTIONS.fermerRecadrage = function () {
  var d = document.getElementById('recadrage');
  if (d) {
    d.remove();
  }
};
function lancerOcr(zoneSeule) {
  var d = document.getElementById('recadrage');
  var img = d.querySelector('img');
  var etat = document.getElementById('etatOcr');
  var source = img;
  if (zoneSeule) {
    if (!recadre || recadre.w < 0.03 || recadre.h < 0.02) {
      avertir('Trace d\'abord un cadre autour du passage (ou choisis « Toute la page »).');
      return;
    }
    var c = document.createElement('canvas');
    var nw = img.naturalWidth, nh = img.naturalHeight;
    c.width = Math.round(recadre.w * nw);
    c.height = Math.round(recadre.h * nh);
    c.getContext('2d').drawImage(img, recadre.x * nw, recadre.y * nh, c.width, c.height, 0, 0, c.width, c.height);
    source = c;
  }
  d.querySelectorAll('.bas button').forEach(function (b) { b.disabled = true; });
  etat.textContent = 'Je prépare la lecture…';
  suiviOcr.f = function (m) {
    if (m.status === 'recognizing text') {
      etat.textContent = 'Lecture du texte… ' + Math.round((m.progress || 0) * 100) + ' %';
    } else if (/load|initializ/.test(m.status || '')) {
      etat.textContent = 'Chargement (la première fois seulement)… ' + Math.round((m.progress || 0) * 100) + ' %';
    }
  };
  lireTexteImage(source).then(function (texte) {
    suiviOcr.f = null;
    ACTIONS.fermerRecadrage();
    var t = document.getElementById('ciTexte');
    if (!texte) {
      toast('Je n\'ai pas trouvé de texte lisible');
      return;
    }
    if (!t) {
      return;
    }
    if (!t.value.trim()) {
      t.value = texte;
      toast('✨ Texte lu : relis-le et corrige si besoin');
      return;
    }
    demander('Tu avais déjà écrit un texte : le remplacer par celui de la photo, ou ajouter celui de la photo à la suite ?', {oui: 'Remplacer', non: 'Ajouter à la suite'}).then(function (remplacer) {
      if (remplacer) {
        t.value = texte;
      } else {
        t.value = t.value.trim() + '\n' + texte;
      }
      toast('✨ Texte lu : relis-le et corrige si besoin');
    });
  }).catch(function (e) {
    suiviOcr.f = null;
    d.querySelectorAll('.bas button').forEach(function (b) { b.disabled = false; });
    etat.textContent = 'La lecture n\'a pas marché : ' + ((e && e.message) || e) + ' (hors connexion ?)';
  });
}
ACTIONS.ocrZone = function () {
  lancerOcr(true);
};
ACTIONS.ocrTout = function () {
  lancerOcr(false);
};
</script>
