<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Mon grimoire de lectures</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3c3da" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1230" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Thèmes : « rose féerique » (clair), « nuit enchantée » (sombre), « automne cosy » */
:root{
  --bg:#fcf0f6;--bg2:#ece6fc;--card:#fffafd;--ink:#4a2a45;--muted:#97738c;--line:#f1d3e2;
  --accent:#d6588f;--accent-soft:#fbe0ec;--lav:#6f6fd8;--lav-soft:#ebe8fb;--gold:#c08a2a;--gold-soft:#f8ecd5;
  --paper:#e06a9e;--audio:#9a82e2;--ebook:#5fbf9f;--mint-soft:#e2f6ee;
  --heat0:#f6e7ef;--heat1:#f3b6d0;--heat2:#e47aa9;--heat3:#b8457f;
  --frame:linear-gradient(135deg,#f6b8d2,#c9b8f4 55%,#ecd09a);
  --shadow:0 8px 24px rgba(214,88,143,.13);--spark:rgba(214,88,143,.38);--cover-shadow:0 4px 10px rgba(122,40,90,.22);
  --shelf:#e6c3a6;--voile:rgba(60,20,50,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#1a1230;--bg2:#2e1940;--card:#281c3d;--ink:#f7e9f3;--muted:#bba5c8;--line:#46355f;
    --accent:#d35c96;--accent-soft:#4a2948;--lav:#827de4;--lav-soft:#2f2a55;--gold:#d9b46a;--gold-soft:#45391f;
    --paper:#f08bb8;--audio:#b4a0f5;--ebook:#7fd6b8;--mint-soft:#1f3a36;
    --heat0:#372a50;--heat1:#7d4677;--heat2:#c0639c;--heat3:#f59cc8;
    --frame:linear-gradient(135deg,#a0457a,#5d4aa0 55%,#9c7a3c);
    --shadow:0 8px 26px rgba(0,0,0,.38);--spark:rgba(255,226,244,.55);--cover-shadow:0 4px 12px rgba(0,0,0,.5);
    --shelf:#5b3f66;--voile:rgba(5,0,15,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1230;--bg2:#2e1940;--card:#281c3d;--ink:#f7e9f3;--muted:#bba5c8;--line:#46355f;
  --accent:#d35c96;--accent-soft:#4a2948;--lav:#827de4;--lav-soft:#2f2a55;--gold:#d9b46a;--gold-soft:#45391f;
  --paper:#f08bb8;--audio:#b4a0f5;--ebook:#7fd6b8;--mint-soft:#1f3a36;
  --heat0:#372a50;--heat1:#7d4677;--heat2:#c0639c;--heat3:#f59cc8;
  --frame:linear-gradient(135deg,#a0457a,#5d4aa0 55%,#9c7a3c);
  --shadow:0 8px 26px rgba(0,0,0,.38);--spark:rgba(255,226,244,.55);--cover-shadow:0 4px 12px rgba(0,0,0,.5);
  --shelf:#5b3f66;--voile:rgba(5,0,15,.6);
}
:root[data-theme="autumn"]{
  --bg:#f8efe3;--bg2:#f1dcc6;--card:#fffaf2;--ink:#4a2c20;--muted:#93725f;--line:#ecd6bf;
  --accent:#c0573a;--accent-soft:#f7ddd0;--lav:#8e5b7c;--lav-soft:#f1e2ea;--gold:#c48a2c;--gold-soft:#f7e8cc;
  --paper:#c0573a;--audio:#8e5b7c;--ebook:#6f8f4e;--mint-soft:#e7efdc;
  --heat0:#f3e4d4;--heat1:#eab48f;--heat2:#d27b4f;--heat3:#9c4326;
  --frame:linear-gradient(135deg,#e9b08a,#cf9cb8 55%,#e2c07a);
  --shadow:0 8px 24px rgba(160,80,40,.14);--spark:rgba(192,87,58,.35);--cover-shadow:0 4px 10px rgba(110,50,20,.25);
  --shelf:#a8714a;--voile:rgba(60,30,10,.45);
}
:root[data-theme="fete"]{
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--card));
  --lav-soft:color-mix(in srgb,var(--lav) 16%,var(--card));
  --gold-soft:color-mix(in srgb,var(--gold) 20%,var(--card));
  --mint-soft:color-mix(in srgb,var(--ebook) 15%,var(--card));
  --paper:var(--accent);--audio:var(--lav);
  --heat0:color-mix(in srgb,var(--accent) 10%,var(--card));
  --heat1:color-mix(in srgb,var(--accent) 38%,var(--card));
  --heat2:color-mix(in srgb,var(--accent) 68%,var(--card));
  --heat3:var(--accent);
  --frame:linear-gradient(135deg,color-mix(in srgb,var(--accent) 50%,var(--card)),color-mix(in srgb,var(--lav) 50%,var(--card)) 55%,color-mix(in srgb,var(--gold) 55%,var(--card)));
  --spark:color-mix(in srgb,var(--gold) 55%,transparent);
  --shadow:0 8px 24px color-mix(in srgb,var(--accent) 16%,transparent);
  --cover-shadow:0 4px 10px rgba(0,0,0,.25);
  --shelf:color-mix(in srgb,var(--gold) 55%,var(--ink));
  --voile:rgba(10,5,20,.5);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 Nunito,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:
    radial-gradient(1.6px 1.6px at 22px 34px,var(--spark) 50%,transparent 52%),
    radial-gradient(1px 1px at 128px 86px,var(--spark) 50%,transparent 52%),
    radial-gradient(2.2px 2.2px at 204px 170px,var(--spark) 50%,transparent 52%),
    radial-gradient(1.2px 1.2px at 64px 210px,var(--spark) 50%,transparent 52%),
    radial-gradient(1.4px 1.4px at 170px 20px,var(--spark) 50%,transparent 52%),
    linear-gradient(165deg,var(--bg) 0%,var(--bg2) 100%);
  background-size:240px 240px,240px 240px,240px 240px,240px 240px,240px 240px,100% 100%;
  background-attachment:fixed}
header{padding:18px 16px 2px;max-width:760px;margin:0 auto;position:relative}
/* bandeau coloré du thème, sur toute la largeur, qui se fond dans le fond */
header::before{content:"";position:absolute;top:0;left:50%;width:100vw;height:190px;transform:translateX(-50%);background:var(--bandeau,radial-gradient(100% 90% at 50% 0%,var(--accent-soft),transparent 70%));-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);z-index:-1;pointer-events:none}
.tete-n{display:flex;align-items:center;gap:10px}
.tete-n h1{flex:1;margin:0;font:700 27px/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:.3px}
.tete-n h1 span{font:700 23px "Dancing Script",cursive;color:var(--accent)}
.tete-n .rond{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.puce-fete{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:7px 14px;border-radius:999px;background:linear-gradient(90deg,var(--accent-soft),var(--lav-soft));font-size:12.5px;color:var(--muted);line-height:1.35}
.puce-fete .em{font-size:20px;flex:none}
.puce-fete b{color:var(--ink)}
header .src{color:var(--muted);font-size:11px;margin:6px 4px 0;min-height:15px}
main{padding:0 16px 104px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);display:flex;justify-content:space-around;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 2px 11px;font:600 11px Nunito,sans-serif;cursor:pointer;position:relative}
nav button span{display:block;font-size:21px;line-height:1.25;filter:saturate(.6);opacity:.75;position:relative}
nav button.on{color:var(--accent)}
nav button.on span{filter:none;opacity:1;transform:translateY(-2px)}
nav button.on span::before{content:"";position:absolute;left:50%;top:-4px;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft) 0%,transparent 70%);z-index:-1}
nav button.on::after{content:"✦";position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:8px;color:var(--gold)}
.card{background:linear-gradient(var(--card),var(--card)) padding-box,var(--frame) border-box;border:1.5px solid transparent;border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{font:700 21px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 12px}
.card h2::before{content:"✧ ";color:var(--gold);font-size:16px}
.card h2 small{display:block;font:italic 400 12px Nunito,sans-serif;color:var(--muted);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.kpi{background:linear-gradient(145deg,var(--accent-soft),var(--card));border-radius:16px;padding:10px 12px}
.kpi:nth-child(4n+2){background:linear-gradient(145deg,var(--lav-soft),var(--card))}
.kpi:nth-child(4n+3){background:linear-gradient(145deg,var(--gold-soft),var(--card))}
.kpi:nth-child(4n+4){background:linear-gradient(145deg,var(--mint-soft),var(--card))}
.kpi b{display:block;font:700 28px/1.1 "Cormorant Garamond",Georgia,serif}
.kpi i{font-style:normal;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}.small{font-size:12px}
.bar{display:grid;grid-template-columns:minmax(70px,38%) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{background:var(--heat0);border-radius:8px;height:12px;overflow:hidden}
.bar .fil{background:linear-gradient(90deg,var(--lav),var(--accent));height:100%;border-radius:0 6px 6px 0}
.bar .val{color:var(--muted);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.bar[data-tip]{cursor:pointer;border-radius:8px}
.bar.actif .fil{background:var(--gold) !important;box-shadow:0 0 8px var(--gold)}
.bar.axe-x{margin-top:2px}
.graduations{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:2px}
.graph{display:grid;grid-template-columns:auto 1fr;gap:6px}
.axe-y{position:relative;width:28px;height:110px;font-size:10px;color:var(--muted);line-height:1}
.axe-y span{position:absolute;right:0;transform:translateY(-50%)}
.axe-y span:nth-child(1){top:0}.axe-y span:nth-child(2){top:50%}.axe-y span:nth-child(3){top:100%}
.cols{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.cols .col{flex:1;height:100%;display:flex;align-items:flex-end;cursor:pointer;border-radius:4px 4px 0 0}
.cols .col i{display:block;width:100%;background:linear-gradient(180deg,var(--accent),var(--lav));border-radius:4px 4px 0 0;min-height:1px}
.cols .col.actif i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.colslab{display:flex;gap:2px;font-size:10px;color:var(--muted);margin-top:3px}
.colslab span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px dashed var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.heat i{width:11px;height:11px;border-radius:4px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3);box-shadow:0 0 6px var(--heat2)}
.heat i.out{background:transparent}
.heat i[data-tip]{cursor:pointer}
.heat i.actif{outline:2px solid var(--gold);outline-offset:1px}
.heat-mois{position:relative;height:14px;font-size:10px;color:var(--muted)}
.heat-mois span{position:absolute;top:0}
.heat-legende{display:flex;align-items:center;gap:3px;justify-content:flex-end;font-size:10px;color:var(--muted);margin-top:6px}
.heat-legende i{width:11px;height:11px;border-radius:4px;background:var(--heat0)}
.heat-legende i.l1{background:var(--heat1)}.heat-legende i.l2{background:var(--heat2)}.heat-legende i.l3{background:var(--heat3)}
.heat-legende span{margin:0 3px}
/* bulle de valeur */
.bulle{position:fixed;z-index:60;transform:translate(-50%,-100%);background:var(--ink);color:var(--card);font:700 12px/1.3 Nunito,sans-serif;padding:7px 11px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .15s;max-width:240px;text-align:center}
.bulle.vis{opacity:1}
.bulle.dessous{transform:translate(-50%,0)}
.exclus-note{margin:8px 4px 0}
.exclus-note a{color:var(--accent)}
.book{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.book:last-child{border-bottom:0}
.book img,.book .ph{width:44px;height:66px;object-fit:cover;border-radius:6px;background:var(--heat0);flex:none;box-shadow:var(--cover-shadow);transform:rotate(-2deg)}
.book .t{font:700 17px/1.2 "Cormorant Garamond",Georgia,serif}
.prog{background:var(--heat0);height:10px;border-radius:6px;margin:8px 0 6px}
.prog div{background:linear-gradient(90deg,var(--lav),var(--accent));height:100%;border-radius:6px;position:relative;max-width:100%}
.prog div::after{content:"✦";position:absolute;right:-5px;top:-7px;font-size:14px;color:var(--gold);text-shadow:0 0 6px var(--gold-soft)}
.quote{font:italic 600 19px/1.5 "Cormorant Garamond",Georgia,serif;white-space:pre-wrap;text-align:center;padding:4px 6px 0}
.quote::before{content:"❝";display:block;font-size:34px;line-height:1;color:var(--accent);margin:4px 0 8px}
.quotebox{background:linear-gradient(160deg,var(--accent-soft),var(--lav-soft));border-radius:18px;padding:6px 14px 16px}
.qsrc{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}
.qsrc::before{content:"✦ ";color:var(--gold)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.covers img,.covers .ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--heat0);box-shadow:var(--cover-shadow)}
.covers .ph{display:flex;align-items:center;justify-content:center;font-size:10px;padding:4px;text-align:center;color:var(--muted);overflow:hidden}
.covers > div:nth-child(3n+1) > *{transform:rotate(-2deg)}
.covers > div:nth-child(3n+2) > *{transform:rotate(1.5deg)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 8px}
.badge{text-align:center;font-size:12px;line-height:1.3;opacity:.5;filter:grayscale(.9)}
.badge b{display:flex;align-items:center;justify-content:center;width:58px;height:58px;margin:0 auto 6px;border-radius:50%;font-size:26px;background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--lav-soft));border:2px dashed var(--line)}
.badge.ok{opacity:1;filter:none}
.badge.ok b{border:2px solid var(--gold);box-shadow:0 0 0 4px var(--gold-soft),0 4px 14px rgba(192,138,42,.25)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;margin:1px 2px 1px 0;border:1px solid}
.pill.paper{background:color-mix(in srgb,var(--paper) 16%,transparent);border-color:color-mix(in srgb,var(--paper) 45%,transparent)}
.pill.audio{background:color-mix(in srgb,var(--audio) 16%,transparent);border-color:color-mix(in srgb,var(--audio) 45%,transparent)}
.pill.ebook{background:color-mix(in srgb,var(--ebook) 16%,transparent);border-color:color-mix(in srgb,var(--ebook) 45%,transparent)}
.act,select,input[type=number],textarea{font:600 14px Nunito,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px}
textarea{border-radius:16px;width:100%;min-height:80px;font-weight:400;resize:vertical}
.act{display:inline-block;text-decoration:none;background:linear-gradient(135deg,var(--accent),var(--lav));color:#fff;border:0;cursor:pointer;box-shadow:0 4px 12px rgba(214,88,143,.3)}
.act.doux{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#load{padding:60px 16px;text-align:center;font:italic 600 20px "Cormorant Garamond",Georgia,serif;color:var(--muted)}
#load::before{content:"✦";display:block;font-size:30px;color:var(--gold);animation:scintille 1.4s ease-in-out infinite}
.err{color:#c0392b}

/* sous-onglets */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:14px 0 4px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:999px;font:700 13px Nunito,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--lav));color:#fff}

/* puces (humeurs, tropes, thèmes, filtres) */
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 11px;margin:4px 4px 0 0;font:600 12px Nunito,sans-serif;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* feuille (fenêtre du bas) */
.sheet-bg{position:fixed;inset:0;background:var(--voile);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fondu .2s ease}
.sheet{background:var(--card);border-radius:26px 26px 0 0;width:100%;max-width:760px;max-height:90vh;overflow:auto;padding:22px 18px 34px;position:relative;animation:monte .25s ease}
.sheet h3{font:700 23px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 40px 4px 0}
.sheet-x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
.sheet .tete{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.sheet .tete img,.sheet .tete .ph{width:62px;height:92px;object-fit:cover;border-radius:8px;box-shadow:var(--cover-shadow);flex:none;background:var(--heat0)}
.sheet h4{font:700 15px Nunito,sans-serif;margin:16px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-size:11px}
.crit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0}
.crit > span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crit .pips{flex:none;white-space:nowrap}
.pips button{border:0;background:none;font-size:22px;opacity:.22;padding:0 1px;cursor:pointer;filter:grayscale(.6)}
.pips button.on{opacity:1;filter:none}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes monte{from{transform:translateY(40px)}to{transform:none}}

/* carnet */
.mini{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted)}
.mini b{color:var(--ink)}
.noteligne{cursor:pointer}

/* niveau */
.niveau{display:flex;gap:14px;align-items:center}
.niveau .em{font-size:44px;width:72px;height:72px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--lav-soft));box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold-soft)}
.niveau .nom{font:700 22px/1.15 "Cormorant Garamond",Georgia,serif}

/* bingo */
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bingo .c{aspect-ratio:1;border-radius:12px;background:var(--heat0);font-size:9px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;position:relative;overflow:hidden;color:var(--muted)}
.bingo .c b{font-size:19px;line-height:1.2;position:relative}
.bingo .c span{position:relative}
.bingo .c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.bingo .c.ok{background:linear-gradient(145deg,var(--accent-soft),var(--lav-soft));box-shadow:inset 0 0 0 2px var(--gold);color:var(--ink);font-weight:700}
.bingo .c.ok::after{content:"✦";position:absolute;top:2px;right:4px;color:var(--gold);font-size:11px}
.bingo .c.ligne{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px var(--gold)}

/* étagère : meuble en bois, guirlande lumineuse, tranches ou couvertures (rangées fixes : 168 px de livres + 14 px de planche) */
.etagere{margin:6px 0 20px}
.etagere h4{display:inline-flex;align-items:baseline;gap:6px;margin:0 0 8px;padding:3px 14px 4px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent);font:700 18px "Cormorant Garamond",Georgia,serif}
.etagere h4 .small{font-family:Nunito,sans-serif}
.bascule-vue{display:flex;gap:6px;margin:0 0 12px}
.bascule-vue button{display:inline-flex;align-items:center;gap:5px;font:700 13px Nunito,sans-serif;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.bascule-vue button.on{color:var(--ink);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.bascule-vue .ic{width:15px;height:15px}
.meuble{border-radius:14px;padding:9px 9px 0;background:linear-gradient(160deg,#a87346,#7a4b2a 45%,#8e5c35 70%,#6a3f22);box-shadow:0 8px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,220,170,.35)}
.fond-meuble{border-radius:8px 8px 0 0;padding-top:10px;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 26px),linear-gradient(90deg,rgba(0,0,0,.45),transparent 16px,transparent calc(100% - 16px),rgba(0,0,0,.45)),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 12px,rgba(0,0,0,.08) 12px 14px,transparent 14px 25px),#3a2618}
.rangs,.vitrine{--haut:168px;--per:182px;position:relative;padding:0 10px 14px;background:repeating-linear-gradient(180deg,transparent 0 var(--haut),#e0a86d var(--haut) calc(var(--haut) + 1.5px),#c0844d calc(var(--haut) + 1.5px) calc(var(--haut) + 7px),#94603a calc(var(--haut) + 7px) calc(var(--haut) + 11px),#4a2c17 calc(var(--haut) + 11px) var(--per))}
.rangs::before,.rangs::after,.vitrine::before,.vitrine::after{content:"";position:absolute;inset:0;pointer-events:none;animation:guirlande 2.6s ease-in-out infinite}
.rangs::before,.vitrine::before{background:radial-gradient(circle at 12px calc(var(--haut) + 8px),#fffbe6 0 1.3px,color-mix(in srgb,var(--gold) 85%,transparent) 2.2px,color-mix(in srgb,var(--gold) 22%,transparent) 4.5px,transparent 6.5px) 0 0/24px var(--per) repeat}
.rangs::after,.vitrine::after{background:radial-gradient(circle at 0 calc(var(--haut) + 9px),#fff0f6 0 1.3px,rgba(255,150,200,.75) 2.2px,rgba(255,150,200,.18) 4.5px,transparent 6.5px) 0 0/24px var(--per) repeat;animation-delay:-1.3s}
@keyframes guirlande{0%,100%{opacity:1}50%{opacity:.4}}
.rangs{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:3px;row-gap:14px}
.place-l,.deco-e{height:168px;display:flex;align-items:flex-end;flex:none}
.deco-e{margin-left:4px}
.deco-e.cachee{display:none}
.tr-l{position:relative;flex:none;cursor:pointer;color:#fff;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.2) 28%,rgba(255,255,255,.05) 52%,rgba(0,0,0,.32)),var(--c);box-shadow:3px 1px 4px rgba(0,0,0,.4)}
.tr-l.relie{border-radius:7px 7px 1px 1px}
.tr-l::before{content:"✦";position:absolute;top:4px;left:0;right:0;text-align:center;font-size:8px;line-height:1;color:rgba(255,232,170,.95)}
.tr-l::after{content:"";position:absolute;left:3px;right:3px;bottom:6px;height:3px;border-top:1px solid rgba(255,232,170,.8);border-bottom:1px solid rgba(255,232,170,.8)}
.tr-l .t{position:absolute;left:0;right:0;top:16px;bottom:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tr-l .t span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;font:800 10px/1.05 Nunito,sans-serif;letter-spacing:.2px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.tr-l.coeur{background:linear-gradient(180deg,#f3d58a 0 3px,transparent 3px),linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.2) 28%,rgba(255,255,255,.05) 52%,rgba(0,0,0,.32)),var(--c);box-shadow:3px 1px 4px rgba(0,0,0,.4),0 0 12px color-mix(in srgb,var(--gold) 80%,transparent)}
.tr-l.coeur::before{content:"★";color:#fff3c4;top:6px;font-size:9px}
.tr-l.coeur .t{top:20px}
.tr-l .audio{position:absolute;left:0;right:0;bottom:13px;display:flex;justify-content:center}
.tr-l .audio .ic{width:10px;height:10px;stroke-width:2.4}
.tr-l.ecoute .t{bottom:27px}
.penche .tr-l{transform:rotate(13deg);transform-origin:100% 100%}
.vitrine{--haut:112px;--per:126px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:112px;column-gap:10px;row-gap:14px;padding:0 12px 14px}
.case-v{display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.cadre-v{position:relative;width:100%;max-width:75px}
.couv-v{position:relative;width:100%;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;box-shadow:4px 3px 7px rgba(0,0,0,.6);background:var(--c)}
.couv-v img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.couv-v::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.25) 60%,transparent)}
.couv-v .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font:700 13px/1.1 "Cormorant Garamond",Georgia,serif;color:#fff;overflow:hidden;word-break:break-word}
.coeur-v{position:absolute;top:-6px;right:-6px;z-index:3;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#3a2618;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px color-mix(in srgb,var(--gold) 80%,transparent)}
.coeur-v .ic{width:11px;height:11px;fill:currentColor;stroke-width:1.5}
.audio-v{position:absolute;left:4px;bottom:4px;z-index:3;width:18px;height:18px;border-radius:50%;background:rgba(14,31,29,.85);color:#fff;display:flex;align-items:center;justify-content:center}
.audio-v .ic{width:11px;height:11px;stroke-width:2.4}
@media (prefers-reduced-motion:reduce){.rangs::before,.rangs::after,.vitrine::before,.vitrine::after{animation:none}}
.legende{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* roue */
.roue-wrap{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:14px auto 6px}
.roue{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.15,.75,.2,1);filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.roue-ptr{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:28px;color:var(--gold);z-index:2;text-shadow:0 2px 4px rgba(0,0,0,.25)}
.roue-centre{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--lav));color:#fff;font:700 13px Nunito,sans-serif;box-shadow:0 0 0 4px var(--card),0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:2}
.tirage{animation:monte .4s ease}

/* stories façon Wrapped */
.story{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;color:#fff;text-align:center;overflow:hidden;user-select:none}
.story .bars{display:flex;gap:4px;padding:14px 14px 0;position:relative;z-index:3}
.story .bars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.story .bars i b{display:block;height:100%;width:0;background:#fff}
.story .bars i.fait b{width:100%}
.story .bars i.cours b{animation:remplir 6s linear forwards}
.story .x{position:absolute;top:24px;right:14px;z-index:4;background:rgba(255,255,255,.2);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px}
.story .slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px 60px;gap:12px;position:relative;z-index:2;animation:apparait .5s ease}
.story .gros{font:700 82px/1 "Cormorant Garamond",Georgia,serif;text-shadow:0 4px 20px rgba(0,0,0,.2)}
.story .titre{font:700 30px/1.2 "Cormorant Garamond",Georgia,serif}
.story .script{font:700 30px/1.2 "Dancing Script",cursive}
.story .sous{font-size:15px;opacity:.9;max-width:320px}
.story img.cv{width:150px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:rotate(-3deg)}
.story .mosaique{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(340px,86vw)}
.story .mosaique img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:5px}
.story .paillettes{position:absolute;inset:0;z-index:1;pointer-events:none}
.story .paillettes i{position:absolute;font-style:normal;animation:scintille 2.4s ease-in-out infinite}
@keyframes remplir{from{width:0}to{width:100%}}
@keyframes apparait{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* touches féeriques */
@keyframes scintille{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.etoiles{position:fixed;inset:0;pointer-events:none;z-index:0}
.etoiles i{position:absolute;font-style:normal;color:var(--gold);animation:scintille 3.2s ease-in-out infinite}
header,main{position:relative;z-index:1}
.fete-banniere{display:flex;flex-direction:column;align-items:center;gap:2px;margin:14px 0 0;padding:10px 14px;border-radius:18px;background:linear-gradient(135deg,var(--accent-soft),var(--lav-soft));text-align:center;font-size:13px;color:var(--muted)}
.fete-banniere b{font:700 19px "Cormorant Garamond",Georgia,serif;color:var(--ink)}

/* téléphones étroits (Flip 7 ouvert, ~410 px de large) */
header{padding-top:calc(22px + env(safe-area-inset-top))}
@media (max-width:440px){
  header h1{font-size:27px}
  header h1 span{font-size:23px}
  main{padding:0 12px 100px}
  .card{padding:14px 13px;border-radius:20px}
  .card h2{font-size:20px}
  .kpis{gap:6px}
  .kpi{padding:9px 10px}
  .kpi b{font-size:25px}
  .bar{grid-template-columns:minmax(64px,34%) 1fr auto;gap:6px}
  .badges{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .seg button{font-size:12px;padding:8px 2px}
  .pips button{font-size:20px}
  nav button{font-size:10.5px}
}
/* petit écran presque carré (écran externe du Flip, paysage) */
@media (max-height:620px){
  header{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:0}
  header .moon,header .orn{display:none}
  header h1{font-size:22px}
  header h1 span{display:inline;font-size:20px}
    main{padding-bottom:78px}
  nav button{padding:6px 2px 7px;font-size:9.5px}
  nav button span{font-size:18px}
  .card{margin:10px 0}
}
@media (prefers-reduced-motion:reduce){.etoiles i,header .moon,#load::before,.story .paillettes i{animation:none}.roue{transition-duration:.01s}}

/* ---------- accueil ---------- */
.titre-section{font:700 21px/1.2 "Cormorant Garamond",Georgia,serif;margin:20px 2px 10px}
.titre-section::before{content:"✧ ";color:var(--gold);font-size:16px}
.carrousel{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
/* marge de fin : sans elle, la dernière carte touche le bord droit */
.carrousel::after{content:"";flex:none;width:4px}
.carrousel::-webkit-scrollbar{display:none}
.carte-livre{flex:none;width:76%;max-width:300px;scroll-snap-align:start;border-radius:22px;padding:14px;background:linear-gradient(160deg,var(--accent-soft),var(--card));border:1px solid var(--line);position:relative;box-shadow:var(--shadow)}
.carrousel.seul .carte-livre{width:100%;max-width:none}
.couv-carte{cursor:pointer}
.couv-carte img,.couv-carte .ph{width:100%;height:170px;object-fit:cover;object-position:center 30%;border-radius:14px;box-shadow:var(--cover-shadow);display:block;background:var(--heat0)}
.couv-carte .ph{display:flex;align-items:center;justify-content:center;font:700 16px "Cormorant Garamond",serif;color:var(--muted);text-align:center;padding:10px}
.carte-livre .lire{position:absolute;right:24px;top:150px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--lav));color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 3px var(--card);cursor:pointer}
.carte-livre .lire.en-cours{background:var(--gold);color:#2a1a08;animation:respire-bouton 2s ease-in-out infinite}
@keyframes respire-bouton{50%{box-shadow:0 6px 22px var(--gold),0 0 0 3px var(--card)}}
.carte-livre .t{font:700 19px/1.15 "Cormorant Garamond",Georgia,serif;margin-top:12px;padding-right:56px;cursor:pointer}
.carte-livre .small{line-height:1.55}
.carte-livre .small b{color:var(--ink)}
.carte-actions{margin-top:10px}
.card h2 .act-h{margin-left:auto;float:right;border:0;font:700 12px Nunito,sans-serif;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 11px;cursor:pointer}
.annee{display:flex;gap:16px;align-items:center}
.anneau{--p:0%;width:108px;height:108px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) 0 var(--p),var(--heat0) var(--p) 100%);position:relative}
.anneau::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}

.anneau b{display:block;font:700 32px "Cormorant Garamond",Georgia,serif}
.anneau small{font-size:11px;color:var(--muted)}
.ligne-obj{font-size:13px;margin:4px 0 10px}

.pastilles-annee{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pastille-annee{font:700 12px Nunito,sans-serif;padding:5px 11px;border-radius:999px;background:var(--gold-soft);color:var(--ink)}
.niveau-mini{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:18px;background:linear-gradient(90deg,var(--gold-soft),var(--lav-soft));margin:16px 0;cursor:pointer}

.niveau-mini .prog{height:6px;margin:5px 0 0}
.photo-cit{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:10px 0 4px;box-shadow:var(--cover-shadow)}
.couvs{display:flex;gap:12px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.couvs::-webkit-scrollbar{display:none}
.couvs > div{flex:none;width:80px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;line-height:1.4}
.couvs img,.couvs .ph{width:80px;height:120px;object-fit:cover;border-radius:8px;box-shadow:var(--cover-shadow);display:block;margin-bottom:5px;background:var(--heat0)}
.couvs .ph{display:flex;align-items:center;justify-content:center;font-size:10px;padding:4px;overflow:hidden}
@media (max-width:440px){.carrousel{margin:0 -12px;padding-left:12px;padding-right:12px;scroll-padding-inline:12px}}
.tete-n .ajout-haut{display:none}
/* écran externe du Flip 7 : accueil compact */
@media (max-height:620px){
  .fab-scan{display:none !important}
  .tete-n .ajout-haut{display:inline-block}
  header .src{display:none}
  .tete-n h1{font-size:21px}
  .tete-n h1 span{font-size:18px}
  .tete-n .rond{width:36px;height:36px}
  .puce-fete{margin-top:6px;padding:5px 12px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .puce-fete .em{font-size:15px;margin-right:4px}
  header::before{height:120px}
  .titre-section{font-size:18px;margin:12px 2px 8px}
  .carte-livre{width:86%;max-width:340px;padding:10px;display:grid;grid-template-columns:62px 1fr;column-gap:12px;align-content:start}
  .couv-carte{grid-row:1 / span 4}

  .carte-actions .mini-btn{padding:3px 8px;font-size:11px}
  .annee{gap:12px}
  .anneau{width:82px;height:82px}
  .anneau::before{inset:8px}
  .anneau b{font-size:24px}
  .anneau small{font-size:10px}
  .ligne-obj{font-size:12px;margin:2px 0 7px}
  .pastilles-annee{margin-top:8px}
  .pastille-annee{font-size:11px;padding:4px 9px}
  .niveau-mini{margin:10px 0;padding:8px 12px}
  .niveau-mini .em{font-size:20px}
  .photo-cit{max-height:150px}

  .couvs > div{width:62px}

  .fab-scan{width:48px;height:48px;bottom:calc(66px + env(safe-area-inset-bottom))}
  .fab-scan .ic{width:24px;height:24px}
  nav button span .ic{width:19px;height:19px}
}

<style>
/* fenêtres de l'appli (à la place des alertes du navigateur « alinemasson.github.io indique… ») */
.boite-fond{position:fixed;inset:0;z-index:80;background:var(--voile);display:flex;align-items:center;justify-content:center;padding:20px;animation:fondu .15s ease}
.boite{width:100%;max-width:360px;background:var(--card);color:var(--ink);border-radius:24px;padding:20px 18px 16px;box-shadow:0 18px 40px rgba(0,0,0,.4);border:1.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--frame) border-box;animation:apparait .18s ease}
.boite h3{font:700 21px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 6px}
.boite p{margin:0;font-size:14px;line-height:1.5;white-space:pre-line;color:var(--ink)}
.boite .champ{margin-top:10px}
.boite .boutons-boite{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.boite .act.danger-plein{background:linear-gradient(135deg,#d9486a,#b8417f);color:#fff}
</style>
<script>
// ---------- fenêtres de l'appli : avertir, demander, saisir (toutes renvoient une promesse) ----------
function boite(contenu, boutons) {
  return new Promise(function (ok) {
    var d = document.createElement('div');
    d.className = 'boite-fond';
    d.innerHTML = '<div class="boite" role="dialog" aria-modal="true">' + contenu + '<div class="boutons-boite">' + boutons.map(function (b, i) {
      return '<button class="act ' + (b.cls || '') + '" data-boite="' + i + '">' + b.texte + '</button>';
    }).join('') + '</div></div>';
    function fermer(v) {
      d.remove();
      document.removeEventListener('keydown', clavier);
      ok(v);
    }
    function clavier(e) {
      if (e.key === 'Escape') {
        fermer(boutons[0].valeur(d));
      }
    }
    d.addEventListener('click', function (e) {
      var b = e.target.closest('[data-boite]');
      if (b) {
        e.stopPropagation();
        fermer(boutons[parseInt(b.dataset.boite, 10)].valeur(d));
      } else if (e.target === d) {
        fermer(boutons[0].valeur(d));
      }
    });
    document.addEventListener('keydown', clavier);
    document.body.appendChild(d);
    var champBoite = d.querySelector('input');
    var focus = champBoite || d.querySelector('[data-boite="' + (boutons.length - 1) + '"]');
    if (focus) {
      setTimeout(function () { focus.focus(); }, 50);
    }
  });
}
function titreBoite(titreB) {
  if (!titreB) {
    return '';
  }
  return '<h3>' + titreB + '</h3>';
}
// une information, un seul bouton
function avertir(message, titreB) {
  return boite(titreBoite(titreB) + '<p>' + esc(message) + '</p>', [{texte: 'D\'accord', valeur: function () { return true; }}]);
}
// une question oui / non ; options : {titre, oui, non, danger}
function demander(message, options) {
  options = options || {};
  var clsOui = '';
  if (options.danger) {
    clsOui = 'danger-plein';
  }
  return boite(titreBoite(options.titre) + '<p>' + esc(message) + '</p>', [
    {texte: options.non || 'Annuler', cls: 'doux', valeur: function () { return false; }},
    {texte: options.oui || 'Oui', cls: clsOui, valeur: function () { return true; }}
  ]);
}
// une saisie de texte → la valeur, ou null si on annule
function saisir(message, valeur, options) {
  options = options || {};
  return boite(titreBoite(options.titre) + '<p>' + esc(message) + '</p><input class="champ" id="saisieBoite" value="' + esc(valeur || '') + '" placeholder="' + esc(options.placeholder || '') + '" autocomplete="off">', [
    {texte: 'Annuler', cls: 'doux', valeur: function () { return null; }},
    {texte: options.oui || 'Valider', valeur: function (d) { return d.querySelector('#saisieBoite').value; }}
  ]);
}
</script>

<script>

}

// arrondit un maximum à une graduation lisible (1, 2, 5, 10, 20…)
function echelle(m) {
  if (m <= 0) {
    return 1;
  }
  var p = Math.pow(10, Math.floor(Math.log10(m)));
  var f = m / p;
  var pas = [1, 2, 5, 10];
  if (m >= 10) {
    pas = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  }
  var n = pas.find(function (x) { return f <= x; });
  return n * p;
}
function nombre(v) {

function sansBalises(t) {

function bars(items, opts) {

function genresFr(tags) {
  var vus = {};
  var l = [];
  tags.forEach(function (t) {
    var k = t.toLowerCase();
    var g;
    if (Object.prototype.hasOwnProperty.call(GENRES_FR, k)) {
      g = GENRES_FR[k];
    } else {
      // tag inconnu : on le garde, en séparant les mots collés
      g = t.replace(/([a-zà-ÿ])([A-Z])/g, '$1 $2');
      g = g.charAt(0).toUpperCase() + g.slice(1);
    }
    if (g && !vus[g]) {
      vus[g] = 1;
      l.push(g);
    }
  });
  return l;
}

// un livre compte-t-il dans la catégorie de stats en cours ?
function compte(b) {
  return !(CAT && EXCLUS[b.id] && EXCLUS[b.id][CAT]);
}
// les lectures (sans les livres laissés « plus envie », qui n'ont pas vraiment été lus)
function lect() {
  return M.lectures.filter(function (r) { return compte(r.book) && r.status !== 'DROPPED'; });
}
function plusEnvie() {
  return M.lectures.filter(function (r) { return compte(r.book) && r.status === 'DROPPED'; });
}
// affinité d'un genre pour les recommandations : note moyenne moins les abandons ; « plus envie » compte pour moitié
function scoreAffinite(x) {
  if (!x || x.notes.length < 2) {
    return null;
  }
  return moy(x.notes) - (x.abandons + 0.5 * x.plusEnvie) / (x.n + x.plusEnvie);
}
function finies() {
  return lect().filter(function (r) { return r.status === 'DONE' && r.end; });
}
// jours de lecture, sans ceux où l'on n'a lu que des livres exclus
function jours() {
  if (!CAT) {
    return M.jours;
  }
  var j = {};
  Object.keys(M.jours).forEach(function (k) {
    var l = M.joursLivres[k];
    if (!l.length) {
      j[k] = M.jours[k];
      return;
    }
    var n = l.filter(function (id) { return !M.parId[id] || compte(M.parId[id]); }).length;
    if (n) {
      j[k] = n;
    }
  });
  return j;
}
// calcule f() en ne comptant que les livres non exclus de la catégorie
function avec(cat, f) {

  CAT = cat;
  try {
    return f();
  } finally {
    CAT = avant;
  }
}
var CATS_EXCLUSION = [['stats', '' + ic('chart-column') + ' Stats'], ['bilan', '' + ic('crown') + ' Bilan'], ['quetes', '' + ic('target') + ' Quêtes'], ['reco', '' + ic('heart') + ' Recos']];
function exclusDe(cat) {
  return Object.keys(EXCLUS).filter(function (id) { return EXCLUS[id][cat] && M.parId[id]; });
}
function noteExclus(cat) {
  var n = exclusDe(cat).length;
  if (!n) {
    return '';
  }
  var s = '';
  if (n > 1) {
    s = 's';
  }
  return '<p class="small muted exclus-note">🙈 ' + n + ' livre' + s + ' exclu' + s + ' de ces stats · <a href="#" data-act="voirExclus">voir</a></p>';
}
ACTIONS.voirExclus = function (el, e) {
  e.preventDefault();
  var ids = Object.keys(EXCLUS).filter(function (id) { return M.parId[id]; });
  var lignes = ids.map(function (id) {
    var b = M.parId[id];
    var cats = CATS_EXCLUSION.filter(function (c) { return EXCLUS[id][c[0]]; }).map(function (c) { return c[1]; }).join(' · ');
    return ligneLivre(b, 'exclu de : ' + cats, 'data-act="livre" data-id="' + id + '"');
  }).join('');

  }

};

  var e = EXCLUS[id] || {};
  if (e[c]) {
    delete e[c];
  } else {
    e[c] = 1;
  }
  if (Object.keys(e).length) {
    EXCLUS[id] = e;
  } else {
    delete EXCLUS[id];
  }
  el.classList.toggle('on');
  sauverExclusion(id);
};

  }).join('') + '</div><p class="small muted">Décoche pour retirer ce livre d\'une catégorie de stats. Il reste toujours sur ton étagère.</p>';
}
function annee(ts) {
  return new Date(ts).getFullYear();
}

// ---------- calculs partagés ----------
function series_jours(filtre) {
  var J = jours();
  var keys = Object.keys(J).sort();
  if (filtre) {
    keys = keys.filter(filtre);
  }
  var best = 0, cur = 0, prev = null, bestFin = null;
  keys.forEach(function (k) {
    var d = new Date(k + 'T12:00:00');
    if (prev && Math.round((d - prev) / DAY) === 1) {
      cur++;
    } else {
      cur = 1;
    }
    if (cur > best) {
      best = cur;
      bestFin = k;
    }
    prev = d;
  });
  var d = new Date();
  if (!J[dkey(d)]) {
    d = new Date(Date.now() - DAY);
  }
  var actuelle = 0;
  while (J[dkey(d)]) {
    actuelle++;
    d = new Date(d.getTime() - DAY);
  }
  return {best: best, bestFin: bestFin, actuelle: actuelle, total: keys.length};
}

// pages lues par jour (livres papier/ebook suivis page par page)
function pagesParJour() {
  var p = {};
  lect().forEach(function (r) {
    if (r.fmt === 'audioBook' || r.page_type !== 'PAGE') {
      return;
    }
    var prev = 0;
    r.logs.forEach(function (l, i) {
      var delta = l.page - prev;
      prev = l.page;
      // premier relevé = livre saisi d'un coup, pas une vraie journée de lecture
      if (i === 0 && l.page >= (r.total_page || 1) * 0.9) {
        return;
      }
      if (delta > 0 && delta < 600) {
        var k = dkey(new Date(l.created_at));
        p[k] = (p[k] || 0) + delta;
      }
    });
  });
  return p;
}

function affinites() {
  var t = {};
  lect().forEach(function (r) {
    r.book.tagList.forEach(function (tag) {
      if (!t[tag]) {
        t[tag] = {n: 0, notes: [], abandons: 0, plusEnvie: 0};
      }
      t[tag].n++;
      if (r.star) {
        t[tag].notes.push(r.star);
      }
      if (r.status === 'GIVE_UP') {
        t[tag].abandons++;
      }
    });
  });
  plusEnvie().forEach(function (r) {
    r.book.tagList.forEach(function (tag) {
      if (!t[tag]) {
        t[tag] = {n: 0, notes: [], abandons: 0, plusEnvie: 0};
      }
      t[tag].plusEnvie++;
    });
  });
  return t;
}

// durée lisible : « 18 min », « 2 h 30 », « 6 h »
function dureeCourte(sec) {
  var m = Math.round(sec / 60);
  if (m < 60) {
    return Math.max(1, m) + ' min';
  }
  // au-delà d'une heure : arrondi au quart d'heure, c'est une estimation
  m = Math.round(m / 15) * 15;
  var h = Math.floor(m / 60);
  var r = m % 60;
  if (h >= 10 || !r) {
    return Math.round(m / 60) + ' h';
  }
  return h + ' h ' + String(r).padStart(2, '0');
}
// vitesse (pages par heure) des sessions minutées d'au moins 5 min ; une lecture précise, ou toutes
function vitessesLecture(filtre) {
  var parLecture = {};
  (M.sessions || []).forEach(function (s) {
    if (s.position !== null && s.position !== undefined && (!filtre || filtre(s))) {
      if (!parLecture[s.lectureId]) {
        parLecture[s.lectureId] = [];
      }
      parLecture[s.lectureId].push(s);
    }
  });
  var pages = {};
  M.lectures.forEach(function (r) {
    if (r.page_type === 'PAGE' && r.fmt !== 'audioBook') {
      pages[r._id] = 1;
    }
  });
  var v = [];
  Object.keys(parLecture).forEach(function (k) {
    if (!pages[k]) {
      return;
    }
    var max = 0;
    parLecture[k].sort(function (a, b) { return (a.fin || a.debut) - (b.fin || b.debut); }).forEach(function (s, i) {
      if (i > 0 && s.dureeSec >= 300) {
        var x = (s.position - max) / (s.dureeSec / 3600);
        if (x > 0 && x < 200) {
          v.push(x);
        }
      }
      max = Math.max(max, s.position);
    });
  });
  return v;
}
var cacheVitesse = {m: null, v: null};
function vitesseGlobale() {
  if (cacheVitesse.m !== M) {
    var v = vitessesLecture(null);
    cacheVitesse = {m: M, v: v.length >= 3 ? mediane(v) : null};
  }
  return cacheVitesse.v;
}
// temps de lecture restant et date de fin estimée
function estimationLecture(r) {
  var total = r.total_page || r.book.total_page || 0;
  var fait = r.page || 0;
  var res = {reste: '', fin: ''};
  if (total > fait) {
    var sec = 0;
    if (r.page_type === 'TIME') {
      sec = total - fait;
    } else if (r.page_type === 'PAGE') {
      var propre = vitessesLecture(function (s) { return s.lectureId === r._id; });
      var v = propre.length >= 2 ? mediane(propre) : (vitesseGlobale() || 30);
      sec = (total - fait) / v * 3600;
    }
    if (sec > 0) {
      res.reste = '⏳ ≈ ' + dureeCourte(sec) + ' restante' + (sec >= 7200 ? 's' : '');
    }
  }
  // rythme sur les 21 derniers jours, pour la date
  var depuisTs = Date.now() - 21 * DAY;
  var base = null;
  r.logs.forEach(function (l) {
    if (l.created_at <= depuisTs) {
      base = l;
    }
  });
  var t0 = depuisTs, v0 = 0;
  if (base) {
    v0 = base.page;
  } else {
    t0 = r.start || Date.now();
  }
  var rythme = (fait - v0) / Math.max(1, (Date.now() - t0) / DAY);
  if (rythme > 0 && total > fait) {
    var d = new Date(Date.now() + (total - fait) / rythme * DAY);
    res.fin = '📅 fini vers le ' + d.getDate() + ' ' + MOIS[d.getMonth()];
  } else if (total > fait) {
    res.fin = 'dernière lecture il y a ' + depuis(derniereActivite(r));
  }
  return res;
}

function vRythme() {
  var h = '';
  var sj = series_jours();
  var now = new Date();
  // calendrier des 53 dernières semaines, en commençant un lundi
  var debut = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 52 * 7);
  debut = new Date(debut.getTime() - ((debut.getDay() + 6) % 7) * DAY);
  var J = jours();
  var cells = '', nb = 0, d = debut, semaine = 0, mois = '';
  while (d <= now || (d.getDay() + 6) % 7 !== 0) {
    var k = dkey(d);

    var cls = '';

      cls = 'out';
    } else if (v >= 3) {
      cls = 'l3';
    } else if (v === 2) {
      cls = 'l2';
    } else if (v === 1) {
      cls = 'l1';

    if (v >= 1 && d <= now) {

    }

    if (d <= now) {
      tip = ' data-tip="' + JOURS_LONGS[(d.getDay() + 6) % 7] + ' ' + fdate(d.getTime()) + ' · ' + quoi + '"';
    }
    cells += '<i class="' + cls + '"' + tip + '></i>';
    if ((d.getDay() + 6) % 7 === 6) {
      semaine++;
    }
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  }
  var legende = '<div class="heat-legende"><span>moins</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><span>plus</span></div>';
  h += card('Jours de lecture', '<div class="scroll"><div class="heat-mois" style="width:' + (semaine * 14) + 'px">' + mois + '</div><div class="heat">' + cells + '</div></div>' + legende + '<p class="small muted">' + nb + ' jours de lecture sur les 12 derniers mois · ' + sj.total + ' au total · record : ' + sj.best + ' jours d\'affilée (fin le ' + fdate(new Date(sj.bestFin + 'T12:00').getTime()) + ')</p>', 'touche une case pour voir le jour');

  var parJour = [0, 0, 0, 0, 0, 0, 0];
  Object.keys(jours()).forEach(function (k) {
    parJour[(new Date(k + 'T12:00').getDay() + 6) % 7]++;
  });
  h += card('Tes jours de lecture', colonnes(parJour, JOURS, {noms: JOURS_LONGS, unite: ' jours'}), 'nombre de jours lus, par jour de la semaine');

  var heures = new Array(24).fill(0);
  lect().forEach(function (r) {
    r.logs.forEach(function (l) { heures[new Date(l.created_at).getHours()]++; });
  });
  var lh = heures.map(function (x, i) {
    if (i % 3 === 0) {
      return i + 'h';
    }
    return '';
  });
  h += card('Tes heures de lecture', colonnes(heures, lh, {noms: heures.map(function (x, i) { return 'Entre ' + i + 'h et ' + (i + 1) + 'h'; }), unite: ' relevés'}), 'heure où tu notes ta progression');

  var ppj = pagesParJour();
  var cles = Object.keys(ppj).sort();
  if (cles.length) {
    var vals = cles.map(function (k) { return ppj[k]; });
    var maxK = cles[vals.indexOf(Math.max.apply(null, vals))];
    var sem = [];
    for (var i = 11; i >= 0; i--) {
      var fin = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i * 7);
      var tot = 0;
      for (var j = 0; j < 7; j++) {
        tot += ppj[dkey(new Date(fin.getFullYear(), fin.getMonth(), fin.getDate() - j))] || 0;
      }
      sem.push(tot);
    }
    var ls = sem.map(function (x, i) {
      if (i === 11) {
        return 'cette';
      }
      return '';
    });
    var noms = sem.map(function (x, i) {
      var fin = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i * 7);
      return 'Semaine du ' + fdate(fin.getTime() - 6 * DAY);
    }).reverse();
    h += card('Pages lues', kpis([
      [Math.round(moy(vals)), 'pages par jour de lecture'],
      [Math.max.apply(null, vals), 'record (' + fdate(new Date(maxK + 'T12:00').getTime()) + ')']
    ]) + '<p class="small muted" style="margin:12px 0 4px">Pages par semaine, 12 dernières semaines</p>' + colonnes(sem, ls, {noms: noms, unite: ' pages'}), 'livres papier et ebook suivis page par page');
  }

  var tps = statsTemps();
  if (tps) {
    h += tps;
  }

  // durée pour finir un livre (lectures saisies en direct uniquement)
  var direct = finies().filter(function (r) { return r.start && r.created_at < r.end; });
  var parFmt = {};
  direct.forEach(function (r) {
    if (!parFmt[r.fmt]) {
      parFmt[r.fmt] = [];
    }
    parFmt[r.fmt].push(Math.max(1, Math.round((r.end - r.start) / DAY)));
  });
  var lignes = Object.keys(parFmt).filter(function (f) { return parFmt[f].length >= 3; }).map(function (f) {
    return {l: FORMATS[f] || f, v: mediane(parFmt[f]), txt: mediane(parFmt[f]) + ' j', c: 'var(--' + FMT_CLASS[f] + ')'};
  });
  if (lignes.length) {
    h += card('Temps pour finir un livre', bars(lignes, {unite: ' j'}), 'médiane, lectures saisies au fil de l\'eau');
  }

  // par année et format
  var ans = {};
  lect().forEach(function (r) {
    if (!r.date) {
      return;
    }
    var a = annee(r.date);
    if (!ans[a]) {
      ans[a] = {paperBook: 0, audioBook: 0, eBook: 0, ab: 0};
    }
    if (r.status === 'DONE') {
      ans[a][r.fmt] = (ans[a][r.fmt] || 0) + 1;
    }
    if (r.status === 'GIVE_UP') {
      ans[a].ab++;
    }
  });
  h += card('Par année', '<table><tr><th>Année</th><th class="n">Papier</th><th class="n">Audio</th><th class="n">Ebook</th><th class="n">Total</th><th class="n">Abandons</th></tr>' +
    Object.keys(ans).sort().reverse().map(function (a) {
      var x = ans[a];
      return '<tr><td>' + a + '</td><td class="n">' + x.paperBook + '</td><td class="n">' + x.audioBook + '</td><td class="n">' + x.eBook + '</td><td class="n"><b>' + (x.paperBook + x.audioBook + x.eBook) + '</b></td><td class="n">' + x.ab + '</td></tr>';
    }).join('') + '</table>');
  return h;
}

// temps de lecture d'après les sessions minutées : heures, minutes par jour, vitesse, heure préférée
function statsTemps() {
  var ss = (M.sessions || []).filter(function (s) { return compte(s.book) && s.dureeSec > 0; });
  if (!ss.length) {
    return '';
  }
  var now = new Date();
  var y = now.getFullYear();
  var parJour = {};
  var heures = new Array(24).fill(0);
  ss.forEach(function (s) {
    var k = dkey(new Date(s.debut));
    parJour[k] = (parJour[k] || 0) + s.dureeSec;
    heures[new Date(s.debut).getHours()] += s.dureeSec;
  });
  var jours = Object.keys(parJour);
  var moyJour = moy(jours.map(function (k) { return parJour[k]; })) / 60;
  var hPref = heures.indexOf(Math.max.apply(null, heures));
  // vitesse : pages gagnées pendant une session minutée d'au moins 5 min (livres suivis en pages)
  var lecturesPages = {};
  M.lectures.forEach(function (r) {
    if (r.page_type === 'PAGE' && r.fmt !== 'audioBook') {
      lecturesPages[r._id] = 1;
    }
  });
  var parLecture = {};
  (M.sessions || []).forEach(function (s) {
    if (lecturesPages[s.lectureId] && s.position !== null && s.position !== undefined) {
      if (!parLecture[s.lectureId]) {
        parLecture[s.lectureId] = [];
      }
      parLecture[s.lectureId].push(s);
    }
  });
  var vitesses = [];
  Object.keys(parLecture).forEach(function (k) {
    var l = parLecture[k].sort(function (a, b) { return (a.fin || a.debut) - (b.fin || b.debut); });
    var max = 0;
    l.forEach(function (s, i) {
      if (i > 0 && s.dureeSec >= 300 && compte(s.book)) {
        var v = (s.position - max) / (s.dureeSec / 3600);
        if (v > 0 && v < 200) {
          vitesses.push(v);
        }
      }
      max = Math.max(max, s.position);
    });
  });
  var tuiles = [[nombre(heuresAnnee(y)) + ' h', 'lues en ' + y], [Math.round(moyJour) + ' min', 'par jour de lecture minutée']];
  if (vitesses.length >= 3) {
    tuiles.push([Math.round(mediane(vitesses)) + ' p./h', 'ta vitesse (papier, numérique)']);
  }
  tuiles.push([hPref + ' h', 'ton heure préférée']);
  var mois = [], noms = [], libs = [];
  for (var i = 11; i >= 0; i--) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var cle = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    var tot = 0;
    jours.forEach(function (k) {
      if (k.slice(0, 7) === cle) {
        tot += parJour[k];
      }
    });
    mois.push(round(tot / 3600, 1));
    noms.push(MOIS_LONGS[d.getMonth()] + ' ' + d.getFullYear());
    libs.push(MOIS[d.getMonth()].slice(0, 1).toUpperCase());
  }
  return card('Temps de lecture', kpis(tuiles) + '<p class="small muted" style="margin:12px 0 4px">Heures de lecture, 12 derniers mois</p>' + colonnes(mois, libs, {noms: noms, unite: ' h'}), 'd\'après tes sessions minutées');
}

function vGouts() {
  var h = '';
  var fm = {};
  lect().forEach(function (r) {
    if (!fm[r.fmt]) {
      fm[r.fmt] = {n: 0, ab: 0, notes: []};
    }
    fm[r.fmt].n++;
    if (r.status === 'GIVE_UP') {
      fm[r.fmt].ab++;
    }
    if (r.star) {
      fm[r.fmt].notes.push(r.star);
    }
  });
  h += card('Par format', '<table><tr><th>Format</th><th class="n">Lectures</th><th class="n">Abandons</th><th class="n">Note moy.</th></tr>' +
    Object.keys(fm).map(function (f) {
      var x = fm[f];
      return '<tr><td>' + pill(f) + '</td><td class="n">' + x.n + '</td><td class="n">' + x.ab + ' (' + Math.round(100 * x.ab / x.n) + ' %)</td><td class="n">' + etoiles(moy(x.notes)) + '</td></tr>';
    }).join('') + '</table>');

  var dist = {};
  lect().forEach(function (r) {
    if (r.star) {
      dist[r.star] = (dist[r.star] || 0) + 1;
    }
  });
  h += card('Tes notes', bars(Object.keys(dist).sort(function (a, b) { return b - a; }).map(function (k) {
    return {l: k + ' ★', v: dist[k], txt: dist[k] + ' livres'};
  })));

  var aff = affinites();
  var tags = Object.keys(aff).filter(function (t) { return aff[t].n >= 3; }).sort(function (a, b) { return aff[b].n - aff[a].n; }).slice(0, 18);
  h += card('Genres', '<table><tr><th>Genre</th><th class="n">Lectures</th><th class="n">Note</th><th class="n">Abandons</th></tr>' +
    tags.map(function (t) {
      var x = aff[t];
      return '<tr><td>' + esc(t) + '</td><td class="n">' + x.n + '</td><td class="n">' + etoiles(moy(x.notes)) + '</td><td class="n">' + Math.round(100 * x.abandons / x.n) + ' %</td></tr>';
    }).join('') + '</table>', 'au moins 3 lectures');

  // évolution des genres
  var top = tags.filter(function (t) { return t !== 'Fiction'; }).slice(0, 6);
  var parAn = {};
  lect().forEach(function (r) {
    if (!r.date) {
      return;
    }
    var a = annee(r.date);
    if (!parAn[a]) {
      parAn[a] = {n: 0};
    }
    parAn[a].n++;
    r.book.tagList.forEach(function (t) { parAn[a][t] = (parAn[a][t] || 0) + 1; });
  });
  h += card('Tes genres au fil des années', '<div class="scroll"><table><tr><th>Année</th>' + top.map(function (t) { return '<th class="n">' + esc(t) + '</th>'; }).join('') + '</tr>' +
    Object.keys(parAn).sort().reverse().map(function (a) {
      return '<tr><td>' + a + '</td>' + top.map(function (t) {
        var p = Math.round(100 * (parAn[a][t] || 0) / parAn[a].n);
        return '<td class="n" style="background:color-mix(in srgb,var(--accent) ' + Math.round(p * 0.6) + '%,transparent)">' + p + ' %</td>';
      }).join('') + '</tr>';
    }).join('') + '</table></div>', '% des lectures de l\'année');

  // auteurs
  var au = {};
  lect().forEach(function (r) {
    (r.book.authors || []).forEach(function (a) {
      if (!au[a]) {
        au[a] = {n: 0, notes: [], premier: r.date || Infinity};
      }
      au[a].n++;
      if (r.star) {
        au[a].notes.push(r.star);
      }
      if (r.date && r.date < au[a].premier) {
        au[a].premier = r.date;
      }
    });
  });
  var topAu = Object.keys(au).sort(function (a, b) { return au[b].n - au[a].n; }).slice(0, 10);
  h += card('Auteurs les plus lus', bars(topAu.map(function (a) {
    return {l: a, v: au[a].n, txt: au[a].n + ' · ' + etoiles(moy(au[a].notes))};
  }), {unite: ' livres'}));
  var decouv = {};
  Object.keys(au).forEach(function (a) {
    if (au[a].premier !== Infinity) {
      var y = annee(au[a].premier);
      decouv[y] = (decouv[y] || 0) + 1;
    }
  });
  var ys = Object.keys(decouv).sort();
  h += card('Nouveaux auteurs découverts', colonnes(ys.map(function (y) { return decouv[y]; }), ys.map(function (y) { return "'" + String(y).slice(2); }), {noms: ys, unite: ' nouveaux auteurs'}), Object.keys(au).length + ' auteurs au total');

  // moment de l'abandon
  var tranches = [['avant 10 %', 0], ['10–25 %', 0], ['25–50 %', 0], ['50–75 %', 0], ['après 75 %', 0], ['sans info', 0]];
  var laisses = plusEnvie().length;
  lect().filter(function (r) { return r.status === 'GIVE_UP'; }).forEach(function (r) {
    var tot = r.total_page || r.book.total_page;
    if (!tot || !r.page) {
      tranches[5][1]++;
      return;
    }
    var p = r.page / tot;
    var i = 4;
    if (p < 0.1) {
      i = 0;
    } else if (p < 0.25) {
      i = 1;
    } else if (p < 0.5) {
      i = 2;
    } else if (p < 0.75) {
      i = 3;
    }
    tranches[i][1]++;
  });
  if (!tranches[5][1]) {
    tranches.pop();
  }
  var laissesTxt = '';
  if (laisses) {
    laissesTxt = '<p class="small" style="margin:12px 0 0">🍃 <b>' + laisses + ' livre' + (laisses > 1 ? 's' : '') + '</b> laissé' + (laisses > 1 ? 's' : '') + ' avant de commencer (plus envie) : pas comptés comme abandons.</p>';
  }
  h += card('Quand tu abandonnes', bars(tranches.map(function (t) { return {l: t[0], v: t[1], txt: t[1] + ' abandon' + (t[1] > 1 ? 's' : '')}; })) + laissesTxt, 'à quel moment du livre');
  return h;
}

function vArgent() {
  var achats = [];
  M.livres.filter(compte).forEach(function (b) {
    (b.purchases || []).forEach(function (p) {
      if (p.price) {
        var r = (b.reads || []).filter(function (x) { return x.star; })[0];
        var star = 0;
        if (r) {
          star = r.star;
        }
        achats.push({b: b, prix: p.price, date: p.purchased_at || p.created_at, star: star});
      }
    });
  });
  if (!achats.length) {
    return card('Argent', '<p class="muted">Aucun prix saisi pour l\'instant.</p>');
  }
  var total = achats.reduce(function (s, a) { return s + a.prix; }, 0);
  var parAn = {};
  achats.forEach(function (a) { parAn[annee(a.date)] = (parAn[annee(a.date)] || 0) + a.prix; });
  var lus = achats.filter(function (a) { return a.b.statut === 'DONE'; });
  return card('Argent', kpis([
    [Math.round(total) + ' €', achats.length + ' livres achetés'],
    [round(total / achats.length, 2) + ' €', 'prix moyen'],
    [lus.length + '/' + achats.length, 'achats déjà lus']
  ]) + '<p class="small muted" style="margin:12px 0 4px">Dépenses par année</p>' + bars(Object.keys(parAn).sort().reverse().map(function (y) { return {l: y, v: parAn[y], txt: Math.round(parAn[y]) + ' €'}; }), {unite: ' €'}) +
    '<table style="margin-top:10px"><tr><th>Livre</th><th class="n">Prix</th><th class="n">€/★</th><th class="n">cts/page</th></tr>' + achats.sort(function (a, b) { return b.prix - a.prix; }).map(function (a) {
      var parEt = '–';
      if (a.star) {
        parEt = round(a.prix / a.star, 2);
      }
      var parPage = '–';
      if (a.b.total_page && a.b.book_type !== 'audioBook') {
        parPage = round(100 * a.prix / a.b.total_page, 1);
      }
      return '<tr><td>' + esc(titre(a.b)) + '</td><td class="n">' + a.prix + '</td><td class="n">' + parEt + '</td><td class="n">' + parPage + '</td></tr>';
    }).join('') + '</table>', 'livres avec un prix saisi');
}

// (la fiche d'un livre est dans Formulaires.html)

// ---------- Bilan annuel ----------
var anBilan = null;
function vBilan() {
  return avec('bilan', vBilanCorps);
}
function vBilanCorps() {
  var ans = {};
  finies().forEach(function (r) { ans[annee(r.end)] = 1; });
  var liste = Object.keys(ans).sort().reverse();
  if (!anBilan) {
    anBilan = liste[0];
  }
  var y = parseInt(anBilan, 10);
  var h = '<div class="row" style="margin-top:14px"><select data-chg="anBilan">' + liste.map(function (a) {
    var sel = '';
    if (String(a) === String(anBilan)) {
      sel = ' selected';
    }
    return '<option' + sel + '>' + a + '</option>';
  }).join('') + '</select><button class="act" data-act="wrapped" data-an="' + y + '">' + ic('sparkles') + ' Revivre mon année en stories</button></div>' + noteExclus('bilan');

  var fin = finies().filter(function (r) { return annee(r.end) === y; });
  var ab = lect().filter(function (r) { return r.status === 'GIVE_UP' && r.date && annee(r.date) === y; });
  var pages = 0, sec = 0, audioSansDuree = 0;
  fin.forEach(function (r) {
    if (r.page_type === 'TIME') {
      sec += r.total_page;
    } else if (r.fmt === 'audioBook') {
      audioSansDuree++;
    } else {
      pages += r.total_page || r.book.total_page || 0;
    }
  });
  var notes = fin.filter(function (r) { return r.star; }).map(function (r) { return r.star; });
  var joursAn = Object.keys(jours()).filter(function (k) { return k.slice(0, 4) === String(y); }).length;
  var mois = new Array(12).fill(0);
  fin.forEach(function (r) { mois[new Date(r.end).getMonth()]++; });
  var au = {}, tg = {};
  fin.forEach(function (r) {
    (r.book.authors || []).forEach(function (a) { au[a] = (au[a] || 0) + 1; });
    r.book.tagList.forEach(function (t) {
      if (t !== 'Fiction') {
        tg[t] = (tg[t] || 0) + 1;
      }
    });
  });
  var audioTxt = hm(sec);
  if (audioSansDuree) {
    audioTxt += ' <span class="small">+ ' + audioSansDuree + ' sans durée</span>';
  }
  var tuiles = [
    [fin.length, 'livres finis'],
    [pages.toLocaleString('fr-FR'), 'pages (papier + ebook)']
  ];
  if (sec || audioSansDuree) {
    tuiles.push([audioTxt, 'd\'écoute']);
  }
  tuiles.push([etoiles(moy(notes)), 'note moyenne'], [joursAn, 'jours de lecture'], [ab.length, 'abandons']);
  h += card('Ton année ' + y, kpis(tuiles) + '<p style="margin:12px 0 0">✍️ Auteur de l\'année : <b>' + esc(premierDe(au)) + '</b><br>🏷️ Genre de l\'année : <b>' + esc(premierDe(tg)) + '</b></p>');
  h += card('Livres finis par mois', colonnes(mois, MOIS.map(function (m) { return m.slice(0, 1).toUpperCase(); }), {noms: MOIS_LONGS, unite: ' livres'}));

  var coeur = fin.filter(function (r) { return r.star >= 5; });
  if (coeur.length) {
    h += card('Coups de cœur ★★★★★', '<div class="covers">' + coeur.map(function (r) { return '<div title="' + esc(titre(r.book)) + '" data-act="livre" data-id="' + r.book.id + '">' + cover(r.book) + '</div>'; }).join('') + '</div>');
  }
  var parTaille = fin.filter(function (r) { return r.fmt !== 'audioBook' && r.total_page; }).sort(function (a, b) { return b.total_page - a.total_page; });
  if (parTaille.length > 1) {
    var g = parTaille[0], p = parTaille[parTaille.length - 1];
    h += card('Le plus gros et le plus court', ligneLivre(g.book, g.total_page + ' pages') + ligneLivre(p.book, p.total_page + ' pages'));
  }
  h += card('Ton étagère ' + y, '<div class="covers">' + fin.sort(function (a, b) { return a.end - b.end; }).map(function (r) { return '<div title="' + esc(titre(r.book)) + ' · ' + fdate(r.end) + '" data-act="livre" data-id="' + r.book.id + '">' + cover(r.book) + '</div>'; }).join('') + '</div>', 'dans l\'ordre de lecture');
  return h;
}
ACTIONS.anBilan = function (el) {
  anBilan = el.value;
  rendre();
};
function premierDe(o) {
  var k = Object.keys(o).sort(function (a, b) { return o[b] - o[a]; })[0];
  if (!k) {
    return '–';
  }
  return k + ' (' + o[k] + ')';
}

<script>
// ---------- Étagère magique, roue de la PAL, séries ----------
var filtreEtagere = 'lus';
var roue = {livres: null, rot: 0, fmt: '', envies: false};

// couleur d'une tranche selon le genre principal
var GENRES_COULEURS = [
  [/fantasy|romantasy|magie|mythologie|contes|surnaturel|steampunk|réalisme magique/i, '#9b84e0', 'Fantasy & magie'],
  [/romance|feel-good/i, '#e46c9f', 'Romance'],
  [/horreur|gothique/i, '#5b4a78', 'Frissons'],
  [/thriller|policier|mystère|espionnage/i, '#4f6d9a', 'Thriller & polar'],
  [/jeunesse|young adult/i, '#4fb39a', 'Jeunesse & YA'],
  [/historique|guerre/i, '#c58b4c', 'Historique'],
  [/science-fiction|dystopie|post-apocalyptique/i, '#4aa3c2', 'SF & dystopie']
];
var PASTELS = ['#e8a0bf', '#b9a3e8', '#8fcdb8', '#f0b27a', '#9ab8e6', '#e39a9a', '#c9a4d9'];
function couleurLivre(b) {
  // couleur choisie dans « Mes listes » pour un de ses genres
  for (var g = 0; g < (b.genreIds || []).length; g++) {
    var genre = D.genres && D.genres[b.genreIds[g]];
    if (genre && genre.couleur) {
      return genre.couleur;
    }
  }
  var t = b.tagList.join(' ');
  for (var i = 0; i < GENRES_COULEURS.length; i++) {
    if (GENRES_COULEURS[i][0].test(t)) {
      return GENRES_COULEURS[i][1];
    }
  }
  var h = 0;
  for (var j = 0; j < b.title.length; j++) {
    h = (h * 31 + b.title.charCodeAt(j)) % 997;
  }
  return PASTELS[h % PASTELS.length];
}
// titre d'une tranche : sans la partie entre parenthèses ni le sous-titre (après « : » ou « - »)
function titreTranche(b) {
  var t = titre(b).replace(/\s*\([^)]*\)\s*$/, '');
  var morceaux = t.split(/\s+[:–-]\s+/);
  if (morceaux.length > 1 && morceaux[0].length >= 4) {
    t = morceaux[0];
  }
  return t;
}
// une tranche ; penche : le dernier livre de l'étagère, posé de biais
function tranche(b, star, penche) {
  var p = b.total_page || 300;
  if (b.book_type === 'audioBook' || b.page_type === 'TIME') {
    p = 380;
  }
  var haut = Math.round(108 + Math.min(52, p / 14));
  var larg = Math.round(16 + Math.min(16, p / 45));
  var cls = 'tr-l';
  var plus = '';
  if (star >= 5) {
    cls += ' coeur';
  }
  if (b.book_type === 'audioBook') {
    cls += ' ecoute';
    plus = '<span class="audio">' + ic('headphones') + '</span>';
  }
  if (p > 450) {
    cls += ' relie';
  }
  var place = '<div class="place-l">';
  if (penche) {
    // la marge à droite laisse la place au haut du livre penché
    place = '<div class="place-l penche" style="margin:0 ' + (Math.round(haut * 0.23) + 2) + 'px 0 6px">';
  }

function vSeries() {
  var parSerie = {};
  M.livres.forEach(function (b) {
    Object.keys(b.series_memberships || {}).forEach(function (k) {
      if (!parSerie[k]) {

      }

    });
  });

    return card('Tes séries', '<p class="muted">Aucune série pour l\'instant : ajoute-la depuis la fiche d\'un livre (' + ic('pencil') + ' Modifier).</p>');
  }
  // les séries abandonnées en dernier
  cles.sort(function (a, b) {
    var aa = (M.series[a] || {}).status === 'abandoned' ? 1 : 0;
    var bb = (M.series[b] || {}).status === 'abandoned' ? 1 : 0;
    return aa - bb;
  });
  return card('Tes séries', cles.map(function (k) {
    var s = M.series[k] || {name: 'Série'};
    var l = parSerie[k].sort(function (a, b) { return a.n - b.n; });
    var max = Math.max(l[l.length - 1].n || 0, (s.nbTomes || 0) + 1);
    var nums = l.map(function (x) { return x.n; });
    var manquants = [];
    for (var i = 1; i < max; i++) {
      if (nums.indexOf(i) < 0) {
        manquants.push(i);
      }
    }
    var suivant = l.find(function (x) { return x.b.statut !== 'DONE'; });
    var lus = l.filter(function (x) { return x.b.statut === 'DONE'; }).length;
    var info = lus + ' / ' + l.length + ' lus';
    var abandonnee = s.status === 'abandoned';
    if (abandonnee) {
      info += ' · 🏳️ série abandonnée';
    } else if (suivant) {
      info += ' · à lire : tome ' + suivant.n + ' (' + esc(titre(suivant.b)) + ')';
    } else if (s.status === 'ongoing') {
      info += ' · tout lu, série en cours de parution';
    } else if (s.nbTomes && l.length < s.nbTomes) {
      info += ' · tout ce que tu as est lu (' + l.length + ' / ' + s.nbTomes + ' tomes)';
    } else {
      info += ' · terminée ✅';
    }
    if (manquants.length && !abandonnee) {
      info += ' · absent(s) de ta bibliothèque : tome ' + manquants.join(', ');
    }
    return '<div style="margin:10px 0 16px' + (abandonnee ? ';opacity:.6' : '') + '"><b style="font:700 18px Cormorant Garamond,Georgia,serif">' + esc(s.name) + '</b> <button class="mini-btn" data-act="formSerie" data-id="' + esc(k) + '">' + ic('pencil') + '</button><div class="meuble" style="margin:6px 0 8px"><div class="fond-meuble"><div class="rangs">' + l.map(function (x) { return tranche(x.b, 0); }).join('') + '</div></div></div><div class="prog"><div style="width:' + (100 * lus / l.length) + '%"></div></div><div class="small muted">' + info + '</div></div>';
  }).join(''));
}
</script>

<script>

var brouillon = null;

// listes du carnet, lues dans la base (les constantes ci-dessus ne servent qu'à les créer la première fois)

function resumeNote(n) {

function vCarnet() {

ACTIONS.carnetTout = function () {

function statsCarnet(ids) {

// ---------- éditeur d'une note de carnet (enregistrée dans la table « avis ») ----------
ACTIONS.noter = function (el) {

// petit formulaire en ligne pour créer un critère, une humeur ou un trope sans quitter la note

function rendreEditeur() {

  h += '<h4>Mon petit mot</h4><textarea id="mot" placeholder="Ce que je veux me rappeler de ce livre…">' + esc(b.mot) + '</textarea>';

// ---------- carte-citation en image ----------
function couleurVar(nom) {
  return getComputedStyle(document.documentElement).getPropertyValue(nom).trim();
}
function lignesTexte(ctx, texte, largeur) {
  var mots = texte.split(/\s+/);
  var lignes = [];
  var cur = '';
  mots.forEach(function (m) {
    var essai = cur;
    if (essai) {
      essai += ' ';
    }
    essai += m;
    if (ctx.measureText(essai).width > largeur && cur) {
      lignes.push(cur);
      cur = m;
    } else {
      cur = essai;
    }
  });
  if (cur) {
    lignes.push(cur);
  }
  return lignes;
}
ACTIONS.imageCitation = function (el) {
  var n = M.notes.filter(function (x) { return x._key === el.dataset.k; })[0];
  if (!n) {
    return;
  }
  var polices = Promise.all([
    document.fonts.load('italic 600 54px "Cormorant Garamond"'),
    document.fonts.load('700 44px "Dancing Script"'),
    document.fonts.load('600 30px Nunito')
  ]).catch(function () {});
  polices.then(function () {
    var W = 1080, H = 1350;
    var cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    var ctx = cv.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, couleurVar('--accent-soft'));
    g.addColorStop(1, couleurVar('--lav-soft'));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = couleurVar('--gold');
    for (var i = 0; i < 46; i++) {
      var x = (i * 389) % W, y = (i * 613) % H, r = 1 + (i % 4);
      ctx.globalAlpha = 0.25 + (i % 5) / 8;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = couleurVar('--gold');
    ctx.lineWidth = 3;
    ctx.strokeRect(50, 50, W - 100, H - 100);
    ctx.lineWidth = 1;
    ctx.strokeRect(64, 64, W - 128, H - 128);
    ctx.textAlign = 'center';
    ctx.fillStyle = couleurVar('--accent');
    ctx.font = '700 120px "Cormorant Garamond", Georgia, serif';
    ctx.fillText('❝', W / 2, 270);
    var taille = 58;
    if (n.texte.length > 260) {
      taille = 44;
    }
    if (n.texte.length > 480) {
      taille = 34;
    }
    ctx.font = 'italic 600 ' + taille + 'px "Cormorant Garamond", Georgia, serif';
    ctx.fillStyle = couleurVar('--ink');
    var lignes = lignesTexte(ctx, n.texte, W - 240);
    var hl = taille * 1.35;
    var y0 = H / 2 - (lignes.length * hl) / 2 + taille / 2;
    lignes.forEach(function (l, i) {
      ctx.fillText(l, W / 2, y0 + i * hl);
    });
    if (n.book) {
      ctx.font = '700 46px "Dancing Script", cursive';
      ctx.fillStyle = couleurVar('--accent');
      ctx.fillText(titre(n.book), W / 2, H - 230);
      ctx.font = '600 28px Nunito, sans-serif';
      ctx.fillStyle = couleurVar('--muted');
      ctx.fillText((n.book.authors || []).join(', '), W / 2, H - 180);
    }
    ctx.font = '600 24px Nunito, sans-serif';
    ctx.fillStyle = couleurVar('--gold');
    ctx.fillText('✦  Mon grimoire de lectures  ✦', W / 2, H - 110);
    var url = cv.toDataURL('image/png');
    ouvrirFeuille('<h3>Ta carte citation</h3><p class="small muted">Sur ton téléphone : appui long sur l\'image → « Enregistrer l\'image ».</p><img src="' + url + '" alt="Carte citation" style="width:100%;border-radius:14px;box-shadow:var(--shadow)"><div class="row" style="margin-top:12px"><a class="act" href="' + url + '" download="citation.png">' + ic('download') + ' Télécharger</a></div>');
  });
};
</script>

<script>
// ---------- Quêtes : niveau de sorcière, bingo, sceaux ----------
var NIVEAUX = [
  [0, '🌱', 'Apprentie des grimoires'],
  [3000, '🕯️', 'Novice à la chandelle'],
  [8000, '📜', 'Lectrice des parchemins'],
  [15000, '🌙', 'Enchanteresse lunaire'],
  [25000, '🔮', 'Gardienne des runes'],
  [40000, '🧚', 'Fée des bibliothèques'],
  [60000, '👑', 'Archimage'],
  [85000, '🌌', 'Grande Bibliothécaire céleste']
];
var anBingo = null;

// XP : 1 par page, 40 par heure d'écoute, 60 par livre fini, 5 par jour de lecture
function niveau() {
  return avec('quetes', niveauCorps);
}
function niveauCorps() {
  var fin = finies();
  var pages = 0, sec = 0;
  fin.forEach(function (r) {
    if (r.page_type === 'TIME') {
      sec += r.total_page;
    } else {
      pages += pagesLecture(r);
    }
  });
  var xp = Math.round(pages + sec / 3600 * 40 + fin.length * 60 + Object.keys(jours()).length * 5);
  var i = 0;
  while (i + 1 < NIVEAUX.length && xp >= NIVEAUX[i + 1][0]) {
    i++;
  }
  var suivant = NIVEAUX[i + 1];
  var pct = 100;
  if (suivant) {
    pct = 100 * (xp - NIVEAUX[i][0]) / (suivant[0] - NIVEAUX[i][0]);
  }
  return {xp: xp, i: i, n: NIVEAUX[i], suivant: suivant, pct: pct};
}
function carteNiveau() {
  var n = niveau();
  var reste = '<b>Niveau maximum atteint ✨</b>';
  if (n.suivant) {
    reste = 'Encore <b>' + (n.suivant[0] - n.xp).toLocaleString('fr-FR') + ' XP</b> pour devenir ' + n.suivant[1] + ' ' + n.suivant[2];
  }
  return card('Mon niveau', '<div class="niveau"><div class="em">' + n.n[1] + '</div><div style="flex:1"><div class="small muted">Niveau ' + (n.i + 1) + ' · ' + n.xp.toLocaleString('fr-FR') + ' XP</div><div class="nom">' + n.n[2] + '</div><div class="prog"><div style="width:' + n.pct + '%"></div></div><div class="small">' + reste + '</div></div></div>', '1 XP par page · 40 par heure d\'écoute · 60 par livre fini · 5 par jour de lecture');
}

// ---------- bingo ----------
function tagsDe(b) {
  return b.tagList.join(' ');
}
function anneePub(b) {
  var m = /^(\d{4})/.exec(b.publication_date || '');
  if (m) {
    return parseInt(m[1], 10);
  }
  return 0;
}
function premiersAuteurs() {
  var vu = {};
  var premier = {};
  lect().filter(function (r) { return r.date; }).sort(function (a, b) { return a.date - b.date; }).forEach(function (r) {
    (r.book.authors || []).forEach(function (a) {
      if (!vu[a]) {
        vu[a] = 1;
        premier[r.book.id + ':' + r.nth] = 1;
      }
    });
  });
  return premier;
}
function casesBingo(y) {
  var fin = finies().filter(function (r) { return annee(r.end) === y; });
  var tout = lect().filter(function (r) { return r.date && annee(r.date) === y; });
  var nouveaux = premiersAuteurs();
  function lecture(test) {
    return fin.filter(test)[0] || null;
  }
  function tag(re) {
    return lecture(function (r) { return re.test(tagsDe(r.book)); });
  }
  var J = jours();
  var joursAn = Object.keys(J).filter(function (k) { return k.slice(0, 4) === String(y); });
  var serie7 = series_jours(function (k) { return k.slice(0, 4) === String(y); }).best >= 7;
  var minuit = tout.filter(function (r) {
    return r.logs.some(function (l) {
      var d = new Date(l.created_at);
      return d.getFullYear() === y && d.getHours() < 4;
    });
  })[0] || null;
  var achat = null;

  var citation = M.notes.filter(function (n) { return n.type !== 'NOTE' && n.texte && annee(n.created_at) === y; })[0];

function vBingo() {

  }
  lignes.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
  var gagnees = lignes.filter(function (l) { return l.every(function (k) { return ok[k]; }); });

  }).join('') + '</select><span class="small"><b>' + nbOk + '/25</b> cases · <b>' + gagnees.length + '</b> bingo' + (gagnees.length > 1 ? 's' : '') + ' 🎉</span></div>';
