};
function carteCitations() {
  var toutes = M.notes.filter(function (n) { return n.texte || n.photo; }).sort(function (a, b) { return b.created_at - a.created_at; });
  var nb = {};
  toutes.forEach(function (n) {
    nb[n.type] = (nb[n.type] || 0) + 1;
  });
  nb.tout = toutes.length;
  var filtre = lsGet('bm_filtre_cit') || 'tout';
  if (!nb[filtre]) {
    filtre = 'tout';
  }
  var cit = toutes;
  if (filtre !== 'tout') {
    cit = toutes.filter(function (n) { return n.type === filtre; });
  }
  // le filtre n'apparaît que s'il y a au moins deux types différents
  var presents = FILTRES_CITATIONS.filter(function (f) { return nb[f[0]]; });
  var filtres = '';
  if (presents.length > 2) {
    filtres = '<div class="seg seg-cit">' + presents.map(function (f) {
      var cls = '';
      if (f[0] === filtre) {
        cls = ' class="on"';
      }
      var icone = '';
      if (f[2]) {
        icone = ic(f[2]);
      }
      return '<button' + cls + ' data-act="filtreCitations" data-f="' + f[0] + '">' + icone + '<span>' + f[1] + '</span></button>';
    }).join('') + '</div>';
  }
  return card('Mon carnet de citations (' + cit.length + ')', '<div class="row"><button class="act" data-act="formCitation">' + ic('plus') + ' Ajouter une citation</button></div>' + filtres + cit.map(function (n) {
    var src = '';
    if (n.book) {
      src = esc(titre(n.book));
      if (n.page) {
        src += ', p. ' + esc(n.page);
      }
    }
    var type = iconeTypeCitation(n.type);
    var fav = '';
    if (n.favori) {
      fav = '⭐ ';
    }
    var photo = '';
    if (n.photo) {
      photo = '<img class="cit-photo" loading="lazy" src="' + esc(n.photo) + '" alt="Photo de la page">';
    }
    var texte = '';
    if (n.texte) {
      texte = '<div class="quote">' + fav + type + esc(n.texte) + '</div>';
    }
    var image = '';
    if (n.texte && n.type !== 'NOTE') {
      image = '<button class="act doux" data-act="imageCitation" data-k="' + esc(n._key) + '">' + ic('image') + ' En faire une image</button>';
    }
    var boite = 'quotebox';
    if (n.type === 'NOTE') {
      boite += ' note-cit';
    }
    return '<div style="margin:14px 0 18px"><div class="' + boite + '">' + texte + photo + '<p class="qsrc">' + src + ' · ' + fdate(n.created_at) + '</p></div><div class="row" style="justify-content:center;margin-top:8px"><button aria-label="Modifier la citation" class="act doux" data-act="formCitation" data-id="' + esc(n._key) + '">' + ic('pencil') + '</button>' + image + '</div></div>';
  }).join(''));
}

// citations d'un livre, pour sa fiche
function blocCitationsLivre(id) {
  var l = valeurs(D.citations).filter(function (c) { return c.livreId === id; }).sort(function (a, b) { return (a.page || 0) - (b.page || 0); });
  return '<h4>Citations (' + l.length + ')</h4>' + l.map(function (c) {
    var t = c.texte || '(photo)';
    if (t.length > 120) {
      t = t.slice(0, 120) + '…';
    }
    var p = '';
    if (c.page) {
      p = 'p. ' + esc(c.page) + ' · ';
    }
    var icone = iconeTypeCitation(c.type);

    var vignette = '';
    if (c.photoId && urlPhoto(c.photoId)) {
      vignette = '<img class="cit-vignette" style="width:48px;height:48px" src="' + esc(urlPhoto(c.photoId)) + '" alt="">';
    }
    return '<div class="ligne-ed">' + vignette + '<div class="small" style="flex:1"><span class="muted">' + p + '</span>' + icone + '<i>' + esc(t) + '</i></div><div class="boutons"><button aria-label="Modifier la citation" class="mini-btn" data-act="formCitation" data-id="' + esc(c.id) + '">' + ic('pencil') + '</button></div></div>';
  }).join('') + '<button class="lien" data-act="formCitation" data-livre="' + id + '">' + ic('plus') + ' Ajouter une citation</button>';
}

ACTIONS.formCitation = function (el) {
  var id = el.dataset.id;
  var c = (id && D.citations[id]) || null;
  var livreId = (c && c.livreId) || el.dataset.livre || '';
  fc = {id: c ? c.id : null, livreId: livreId, photo: null, photoId: c ? c.photoId : null, retour: el.dataset.livre ? livreId : ''};
  var v = c || {type: 'citation', texte: '', page: null, pageFin: null, favori: false};
  var livre = D.livres[livreId];
  var choixLivre = '';
  if (!livre || !el.dataset.livre) {
    // livre à choisir parmi les titres du grimoire (les plus récents d'abord)
    var titres = M.livres.slice().sort(function (a, b) { return (b.created_at || 0) - (a.created_at || 0); }).map(function (b) { return titre(b); });
    var actuel = '';
    if (livre) {
      actuel = titre(M.parId[livreId]);
    }
    choixLivre = '<label>Livre</label>' + champ('ciLivre', actuel, 'list="dlLivres" placeholder="Titre du livre" autocomplete="off"') + listeDeChoix('dlLivres', titres);
  }
  var h = '<h3>' + (c ? 'Modifier ' + (NOMS_CITATION[v.type] || 'la citation') : 'Nouvelle citation') + '</h3>' + (livre && el.dataset.livre ? '<p class="small muted">' + esc(livre.titre) + '</p>' : '') + '<div class="form">' + choixLivre +
    '<label>Type</label>' + choix('ciType', TYPES_CITATION, v.type) +
    '<label>Photo de la page</label><div id="zPhotoCit"></div>' +
    '<label>Texte</label><textarea class="champ" id="ciTexte" placeholder="' + esc(INDICES_CITATION[v.type] || '') + '">' + esc(v.texte) + '</textarea>' +
    '<div class="deux"><div><label>Page</label>' + champ('ciPage', v.page, 'inputmode="numeric"') + '</div><div><label>Jusqu\'à la page</label>' + champ('ciPageFin', v.pageFin, 'inputmode="numeric"') + '</div></div>' +
    '<label class="small" style="text-transform:none;letter-spacing:0;margin-top:12px"><input type="checkbox" id="ciFavori"' + (v.favori ? ' checked' : '') + '> ⭐ favorite</label>' +
    '<div class="row" style="margin-top:16px"><button class="act" data-act="ciEnregistrer">' + ic('check') + ' Enregistrer</button><button class="act doux" data-act="ciAnnuler">Annuler</button></div>';
  if (c) {
    h += '<button class="lien danger" data-act="ciSupprimer" style="margin-top:14px">' + ic('trash-2') + ' Supprimer</button>';
  }
  var f = ouvrirFeuille(h + '</div><input type="file" id="ciFichier" accept="image/*" hidden>');
  f.querySelector('#ciType').addEventListener('change', function (e) {
    document.getElementById('ciTexte').placeholder = INDICES_CITATION[e.target.value] || '';
  });
  rendrePhotoCitation();
  f.querySelector('#ciFichier').addEventListener('change', function (e) {
    var fic = e.target.files[0];
    if (!fic) {
      return;
    }
    toast('📷 Je prépare la photo…');
    redimensionnerImage(fic, 2000).then(function (blob) {
      fc.photo = blob;
      rendrePhotoCitation();
    }).catch(function () {
      avertir('Je n\'arrive pas à lire cette image.');
    });
    e.target.value = '';
  });
};
function srcPhotoCitation() {
  if (fc.photo) {
    return URL.createObjectURL(fc.photo);
  }
  if (fc.photoId) {
    return urlPhoto(fc.photoId);
  }
  return '';
}
function rendrePhotoCitation() {
  var z = document.getElementById('zPhotoCit');
  if (!z) {
    return;
  }
  var src = srcPhotoCitation();
  if (!src) {
    z.innerHTML = '<div class="row"><button type="button" class="mini-btn" data-act="ciPhoto">' + ic('camera') + ' Prendre ou choisir une photo</button></div>';
    return;
  }
  z.innerHTML = '<div style="display:flex;gap:12px;align-items:center"><img class="cit-vignette" src="' + esc(src) + '" alt=""><div class="row"><button type="button" class="mini-btn" data-act="ciLireTexte">' + ic('scan-text') + ' Lire le texte</button><button aria-label="Changer la photo" type="button" class="mini-btn" data-act="ciPhoto">' + ic('refresh-cw') + '</button><button aria-label="Retirer la photo" type="button" class="mini-btn" data-act="ciSansPhoto">' + ic('x') + '</button></div></div>';
}
ACTIONS.ciPhoto = function () {
  document.getElementById('ciFichier').click();
};
ACTIONS.ciSansPhoto = function () {
  fc.photo = null;
  fc.photoId = null;
  rendrePhotoCitation();
};
ACTIONS.ciAnnuler = function () {
  var retour = fc && fc.retour;
  fc = null;
  if (retour) {
    ouvrirFiche(retour);
  } else {
    fermerFeuille();
  }
};
function livreDepuisTitre(t) {
  var s = slug(t);
  if (!s) {
    return null;
  }
  return M.livres.find(function (b) { return slug(titre(b)) === s; }) || M.livres.find(function (b) { return slug(b.title) === s; }) || null;
}
ACTIONS.ciEnregistrer = function () {
  var livreId = fc.livreId;
  if (document.getElementById('ciLivre')) {
    var b = livreDepuisTitre(val('ciLivre'));
    if (!b) {
      avertir('Choisis le livre dans la liste (commence à taper son titre).');
      return;
    }
    livreId = b.id;
  }
  var texte = val('ciTexte');
  if (!texte && !fc.photo && !fc.photoId) {
    avertir('Écris le texte ou ajoute une photo.');
    return;
  }
  var ancienne = (fc.id && D.citations[fc.id]) || null;
  var ops = [];
  var photoId = fc.photoId;
  if (fc.photo) {
    photoId = 'p:' + nouvelId();
    ops.push({t: 'photos', o: {id: photoId, blob: fc.photo, type: 'image/jpeg', origine: 'appli'}});
  }
  if (ancienne && ancienne.photoId && ancienne.photoId !== photoId) {
    ops.push({t: 'photos', suppr: ancienne.photoId});
  }
  var cit = Object.assign({}, ancienne || {id: nouvelId(), origine: 'appli', commentaires: []}, {
    livreId: livreId,
    type: val('ciType'),
    texte: texte,
    page: parseInt(val('ciPage'), 10) || null,
    pageFin: parseInt(val('ciPageFin'), 10) || null,
    favori: document.getElementById('ciFavori').checked,
    photoId: photoId || null
  });
  ops.push({t: 'citations', o: cit});
  var retour = fc.retour;
  ecrire(ops).then(function () {
    fc = null;
    apresEcriture();
    if (retour) {
      ouvrirFiche(retour);
    } else {
      fermerFeuille();
    }
    toast('❝ Citation enregistrée');
  }).catch(erreurEcriture);
};
ACTIONS.ciSupprimer = function () {
  var c = D.citations[fc.id];
  demander('Supprimer cette citation ?', {oui: 'Supprimer', danger: true}).then(function (ok) {
    if (!ok) {
      return;
    }
    var ops = [{t: 'citations', suppr: c.id}];
    if (c.photoId) {
      ops.push({t: 'photos', suppr: c.photoId});
    }
    var retour = fc.retour;
    supprimerAvecAnnulation(ops, '🗑️ Citation supprimée', function () {
      if (retour) {
        rafraichirFeuille('fiche', retour, ouvrirFiche);
      }
    }).then(function () {
      fc = null;
      apresEcriture();
      if (retour) {
        ouvrirFiche(retour);
      } else {
        fermerFeuille();
      }
    }).catch(erreurEcriture);
  });
};

// ---------- lecture du texte d'une photo (Tesseract, en français, chargé au premier usage) ----------
var ocrTravailleur = null;
function travailleurOcr(suivi) {
  if (!ocrTravailleur) {
    ocrTravailleur = chargerScript(TESSERACT + 'tesseract.min.js').then(function () {
      return Tesseract.createWorker('fra', 1, {
        workerPath: TESSERACT + 'worker.min.js',
        corePath: TESSERACT_CORE,
        langPath: TESSERACT_FRA,
        logger: function (m) {
          if (suivi.f) {
            suivi.f(m);
          }
        }
      });
    }).catch(function (e) {
      ocrTravailleur = null;
      throw e;
    });
  }
  return ocrTravailleur;
}
var suiviOcr = {f: null};
// recolle les lignes coupées : « mot-\nsuite » → « motsuite », retours simples → espaces
function nettoyerOcr(t) {
  return String(t || '').replace(/-\n(?=[a-zà-ÿ])/g, '').replace(/([^\n])\n(?!\n)/g, '$1 ').replace(/[ \t]+/g, ' ').replace(/\n{2,}/g, '\n\n').trim();
}
function lireTexteImage(source) {
  return travailleurOcr(suiviOcr).then(function (w) {
    return w.recognize(source);
  }).then(function (r) {
    return nettoyerOcr(r.data.text);
  });
}
ACTIONS.preparerOcr = function () {
  toast('🔤 Téléchargement de la lecture de texte (≈ 5 Mo)…');
  travailleurOcr(suiviOcr).then(function () {
    regler('ocrPret', Date.now()).catch(erreurEcriture);
    toast('✨ Lecture de texte prête, même hors connexion');
  }).catch(function (e) {
    avertir('Téléchargement impossible : ' + ((e && e.message) || e));
  });
};

// recadrage : on trace au doigt la zone à lire, ou on lit toute la page
ACTIONS.ciLireTexte = function () {
  var src = srcPhotoCitation();
  if (!src) {
    return;
  }
  var d = document.createElement('div');
  d.className = 'recadrage';
  d.id = 'recadrage';
  d.innerHTML = '<div class="consigne">Trace au doigt un cadre autour du passage à lire</div><div class="zone"><img src="' + esc(src) + '" alt=""><div class="cadre" hidden></div></div><div class="etat" id="etatOcr"></div><div class="bas"><button class="act" data-act="ocrZone">' + ic('scan-text') + ' Lire la zone</button><button class="act doux" data-act="ocrTout">Toute la page</button><button class="act doux" data-act="fermerRecadrage">Annuler</button></div>';
  document.body.appendChild(d);
  var img = d.querySelector('img');
  var cadre = d.querySelector('.cadre');
  var zone = d.querySelector('.zone');
  var depart = null;
  recadre = null;
  zone.addEventListener('pointerdown', function (e) {
    var r = img.getBoundingClientRect();
    depart = {x: Math.min(Math.max(e.clientX, r.left), r.right), y: Math.min(Math.max(e.clientY, r.top), r.bottom)};
    zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener('pointermove', function (e) {
    if (!depart) {
      return;
    }
    var r = img.getBoundingClientRect();
    var zr = zone.getBoundingClientRect();
    var x = Math.min(Math.max(e.clientX, r.left), r.right);
    var y = Math.min(Math.max(e.clientY, r.top), r.bottom);
    var g = Math.min(depart.x, x), h = Math.min(depart.y, y);
    var w = Math.abs(x - depart.x), t = Math.abs(y - depart.y);
    cadre.hidden = false;
    cadre.style.left = (g - zr.left) + 'px';
    cadre.style.top = (h - zr.top) + 'px';
    cadre.style.width = w + 'px';
    cadre.style.height = t + 'px';
    // en proportion de l'image réelle
    recadre = {x: (g - r.left) / r.width, y: (h - r.top) / r.height, w: w / r.width, h: t / r.height};
  });
  zone.addEventListener('pointerup', function () {
    depart = null;
  });
};
var recadre = null;
ACTIONS.fermerRecadrage = function () {
  var d = document.getElementById('recadrage');
  if (d) {
    d.remove();
  }
};
function lancerOcr(zoneSeule) {
  var d = document.getElementById('recadrage');
  var img = d.querySelector('img');
  var etat = document.getElementById('etatOcr');
  var source = img;
  if (zoneSeule) {
    if (!recadre || recadre.w < 0.03 || recadre.h < 0.02) {
      avertir('Trace d\'abord un cadre autour du passage (ou choisis « Toute la page »).');
      return;
    }
    var c = document.createElement('canvas');
    var nw = img.naturalWidth, nh = img.naturalHeight;
    c.width = Math.round(recadre.w * nw);
    c.height = Math.round(recadre.h * nh);
    c.getContext('2d').drawImage(img, recadre.x * nw, recadre.y * nh, c.width, c.height, 0, 0, c.width, c.height);
    source = c;
  }
  d.querySelectorAll('.bas button').forEach(function (b) { b.disabled = true; });
  etat.textContent = 'Je prépare la lecture…';
  suiviOcr.f = function (m) {
    if (m.status === 'recognizing text') {
      etat.textContent = 'Lecture du texte… ' + Math.round((m.progress || 0) * 100) + ' %';
    } else if (/load|initializ/.test(m.status || '')) {
      etat.textContent = 'Chargement (la première fois seulement)… ' + Math.round((m.progress || 0) * 100) + ' %';
    }
  };
  lireTexteImage(source).then(function (texte) {
    suiviOcr.f = null;
    ACTIONS.fermerRecadrage();
    var t = document.getElementById('ciTexte');
    if (!texte) {
      toast('Je n\'ai pas trouvé de texte lisible');
      return;
    }
    if (!t) {
      return;
    }
    if (!t.value.trim()) {
      t.value = texte;
      toast('✨ Texte lu : relis-le et corrige si besoin');
      return;
    }
    demander('Tu avais déjà écrit un texte : le remplacer par celui de la photo, ou ajouter celui de la photo à la suite ?', {oui: 'Remplacer', non: 'Ajouter à la suite'}).then(function (remplacer) {
      if (remplacer) {
        t.value = texte;
      } else {
        t.value = t.value.trim() + '\n' + texte;
      }
      toast('✨ Texte lu : relis-le et corrige si besoin');
    });
  }).catch(function (e) {
    suiviOcr.f = null;
    d.querySelectorAll('.bas button').forEach(function (b) { b.disabled = false; });
    etat.textContent = 'La lecture n\'a pas marché : ' + ((e && e.message) || e) + ' (hors connexion ?)';
  });
}
ACTIONS.ocrZone = function () {
  lancerOcr(true);
};
ACTIONS.ocrTout = function () {
  lancerOcr(false);
};
</script>

<script>
// ---------- Propositions : genres, tropes, traductions et couvertures trouvés en ligne, à valider livre par livre ----------
// Fichier JSON reçu par 📥 ou par le partage :
// {format: 'grimoire-propositions', date, livres: [{id, titre, genres[], tropes[], traducteurs[], roles[{nom, role}],
//  langue, source, confiance, note, couverture: {image: 'data:image/…' ou 'https://…', source},
//  infos: {parution: 'AAAA-MM-JJ', editeur, isbn, langue, resume, unite: 'pages'},
//  achats: [{id, etat: 'neuf'|'occasion', cadeau, boutique, prix, memo, date: 'AAAA-MM-JJ', format}],
//  revente: {prix, date: 'AAAA-MM-JJ', lieu}, possession: 'possede'|'envie'|'emprunte'}]}
// (un achat qui existe déjà, retrouvé par son id, n'est que complété ; une revente ne touche pas un livre déjà revendu)
// (langue = langue d'origine d'une traduction ; infos.langue = langue de l'édition du livre)
// Les infos ne remplissent que ce qui manque au livre (une date plus précise que l'année seule compte comme manquante).
// Une couverture en data: est rangée dans la table photos (elle ne peut plus casser), une adresse est gardée telle quelle.
// Rien n'est écrit avant « Appliquer ». Les tropes vont dans le carnet (sans que le livre compte comme noté : estNote()).
// Les genres déjà sur le livre mais pas proposés restent tant qu'on ne les décoche pas.
var FORMAT_PROPOSITIONS = 'grimoire-propositions';
var propEtat = null;

// Le fichier est-il un fichier de propositions ? → l'objet lu, ou null
function lirePropositions(buf) {
  var u = new Uint8Array(buf);
  var i = 0;
  if (u[0] === 0xEF && u[1] === 0xBB && u[2] === 0xBF) {
    i = 3;
  }
  while (i < u.length && (u[i] === 0x20 || u[i] === 0x0A || u[i] === 0x0D || u[i] === 0x09)) {
    i++;
  }
  if (u[i] !== 0x7B) {
    return null;
  }
  try {
    var d = JSON.parse(new TextDecoder('utf-8').decode(u.subarray(i)));
    if (d && d.format === FORMAT_PROPOSITIONS && Array.isArray(d.livres)) {
      return d;
    }
  } catch (e) {
    return null;
  }
  return null;
}

function propParNom(t, nom) {
  var s = slug(nom);
  return valeurs(D[t]).find(function (x) { return slug(x.nom) === s; }) || null;
}
function propLivre(p) {
  if (p.id && D.livres[p.id]) {
    return D.livres[p.id];
  }
  // repli : le même titre, s'il n'y en a qu'un
  var s = slug(p.titre);
  var l = valeurs(D.livres).filter(function (x) { return s && slug(x.titre) === s; });
  if (l.length === 1) {
    return l[0];
  }
  return null;
}
// pour reconnaître une couverture déjà posée par un fichier de propositions (sans garder toute l'image)
function empreinteImage(u) {
  return u.length + ':' + u.slice(-48);
}
function libelleRole(r) {

// ce qu'on propose pour un livre : [{type: genre|trope|role, etat: ajout|retrait|change|deja, nom, on…}]
function propChoix(l, p) {
  var choix = [];
  var couv = p.couverture || {};
  var photo = D.photos[l.couverture] || {};
  if (/^(data:image\/|https?:\/\/)/.test(couv.image || '') && couv.image !== l.couverture && photo.empreinte !== empreinteImage(couv.image)) {
    choix.push({type: 'couverture', etat: 'ajout', nom: 'nouvelle couverture', image: couv.image, on: true});
  }
  var genres = (l.genreIds || []).filter(function (g) { return D.genres[g]; });
  var proposes = {};
  var vusG = {};
  (p.genres || []).forEach(function (nom) {
    var g = propParNom('genres', nom);
    var s = slug(nom);
    if (!s || vusG[s]) {
      return;
    }
    vusG[s] = 1;
    if (g) {
      proposes[g.id] = 1;
    }
    if (g && genres.indexOf(g.id) >= 0) {
      choix.push({type: 'genre', etat: 'deja', nom: g.nom});
    } else {
      choix.push({type: 'genre', etat: 'ajout', nom: (g && g.nom) || nom, on: true});
    }
  });
  // un fichier qui ne propose pas de genres pour ce livre (ex. seulement une couverture) ne retire rien
  genres.forEach(function (gid) {
    if ((p.genres || []).length && !proposes[gid]) {
      choix.push({type: 'genre', etat: 'retrait', nom: D.genres[gid].nom, gid: gid, on: true});
    }
  });

  var tropes = ((D.avis[l.id] || {}).tropeIds || []).filter(function (t) { return D.tropes[t]; });
  var vusT = {};
  (p.tropes || []).forEach(function (nom) {
    var t = propParNom('tropes', nom);
    var s = slug(nom);
    if (!s || vusT[s]) {
      return;
    }
    vusT[s] = 1;
    if (t && tropes.indexOf(t.id) >= 0) {
      choix.push({type: 'trope', etat: 'deja', nom: t.nom});
    } else {
      choix.push({type: 'trope', etat: 'ajout', nom: (t && t.nom) || nom, on: true});
    }
  });

  // traduction et rôles : un nom déjà sur le livre change de rôle, un traducteur absent est ajouté
  var contributeurs = (l.contributeurs || []).filter(function (c) { return D.auteurs[c.auteurId]; });
  var nbAuteurs = contributeurs.filter(function (c) { return c.role === 'auteur'; }).length;
  var vusR = {};
  var roles = (p.traducteurs || []).map(function (nom) { return {nom: nom, role: 'traduction', ajout: true}; }).concat(p.roles || []);
  roles.forEach(function (r) {
    var s = slug(r.nom);
    if (!s || vusR[s] || !ROLES.some(function (y) { return y[0] === r.role; })) {
      return;
    }
    vusR[s] = 1;
    var cs = contributeurs.filter(function (c) { return slug(D.auteurs[c.auteurId].nom) === s; });
    if (cs.some(function (c) { return c.role === r.role; })) {
      choix.push({type: 'role', etat: 'deja', nom: D.auteurs[cs[0].auteurId].nom, vers: r.role});
    } else if (cs.length) {
      // jamais le seul auteur·ice du livre
      if (cs[0].role === 'auteur' && nbAuteurs < 2) {
        return;
      }
      choix.push({type: 'role', etat: 'change', nom: D.auteurs[cs[0].auteurId].nom, auteurId: cs[0].auteurId, de: cs[0].role, vers: r.role, on: true});
    } else if (r.ajout) {
      choix.push({type: 'role', etat: 'ajout', nom: r.nom, vers: r.role, on: true});
    }
  });
  return choix.concat(propChoixInfos(l, p.infos || {}), propChoixAchats(l, p));
}

          livreChange = true;
          n.genres++;
        }
      } else if (c.type === 'genre' && c.etat === 'retrait' && !c.on) {
        genreIds = genreIds.filter(function (g) { return g !== c.gid; });
        livreChange = true;
        n.retraits++;
      } else if (c.type === 'trope' && c.on) {
        var tid = idListe('tropes', c.nom);
        if (tropeIds.indexOf(tid) < 0) {
          tropeIds.push(tid);
          avisChange = true;
          n.tropes++;
        }
      } else if (c.type === 'couverture' && c.on) {
        // une image en data: devient une photo (blobs : préparés avant l'écriture par blobsCouvertures)
        var nouvelle = c.image;
        if (/^data:/.test(c.image)) {
          nouvelle = 'p:' + nouvelId();
          if (blobs && blobs[c.image]) {
            ops.push({t: 'photos', o: {id: nouvelle, blob: blobs[c.image], type: blobs[c.image].type || 'image/jpeg', origine: 'propositions', empreinte: empreinteImage(c.image)}});
          }
        }
        if (/^p:/.test(couverture)) {
          ops.push({t: 'photos', suppr: couverture});
        }
        couverture = nouvelle;
        livreChange = true;
        n.couvertures++;
      } else if (c.type === 'role' && c.etat === 'ajout' && c.on) {
        var aid = idPersonne(c.nom);
        if (!contributeurs.some(function (x) { return x.auteurId === aid && x.role === c.vers; })) {
          contributeurs.push({auteurId: aid, role: c.vers});
          livreChange = true;
          n.roles++;
        }
      } else if (c.type === 'role' && c.etat === 'change' && c.on) {
        var nouveaux = [];
        contributeurs.forEach(function (x) {
          var y = x;
          if (x.auteurId === c.auteurId && x.role === c.de) {
            y = {auteurId: x.auteurId, role: c.vers};
          }
          if (!nouveaux.some(function (z) { return z.auteurId === y.auteurId && z.role === y.role; })) {
            nouveaux.push(y);
          }
        });
        contributeurs = nouveaux;
        livreChange = true;
        n.roles++;
      } else if (c.type === 'info' && c.on) {
        infos[c.champ] = c.valeur;
        livreChange = true;
        n.infos++;
      } else if (c.type === 'achat' && c.on) {
        var a = c.achat;
        var ex = a.id && D.achats[a.id];
        if (ex) {
          var maj = Object.assign({}, ex);
          if (!achatEtat(ex) && a.etat) {
            maj.etat = a.etat;
          }
          if (!achatCadeau(ex) && a.cadeau) {
            maj.cadeau = true;
          }
          if (!ex.boutique && a.boutique) {
            maj.boutique = a.boutique;
          }
          if (!ex.prix && a.prix) {
            maj.prix = a.prix;
          }
          if (!ex.memo && a.memo) {
            maj.memo = a.memo;
          }
          ops.push({t: 'achats', o: maj, garderDate: true});
        } else {
          // sans date : l'achat compte à la date d'ajout du livre
          ops.push({t: 'achats', o: {id: a.id || nouvelId(), livreId: it.id, prix: Number(a.prix) || 0, devise: a.devise || 'EUR', date: dateMidi(a.date), format: a.format || l.format || 'papier', boutique: a.boutique || '', etat: a.etat || '', cadeau: !!a.cadeau, memo: a.memo || '', origine: 'propositions', creeLe: l.creeLe}});
          acquis = true;
        }
        achatsChange = true;
        n.achats++;
      } else if (c.type === 'revente' && c.on) {
        revente = c.revente;
        livreChange = true;
        n.reventes++;
      } else if (c.type === 'possession' && c.on) {
        possession = c.valeur;
        livreChange = true;
        n.infos++;
      }
    });
    var champs = {};
    // un achat ajouté met le livre dans la bibliothèque ; une revente le passe « revendu »
    if (acquis && (!l.possession || l.possession === 'envie')) {
      champs.possession = 'possede';
      livreChange = true;
    }
    if (possession) {
      champs.possession = possession;
    }
    if (revente) {
      champs.possession = 'revendu';
      champs.revente = revente;
    }
    if (infos.parution) {
      champs.parution = infos.parution;
      champs.annee = anneeParution(infos.parution);
    }
    ['editeur', 'langue', 'resume'].forEach(function (k) {
      if (infos[k]) {
        champs[k] = infos[k];
      }
    });
    if (infos.isbn) {
      champs.isbns = [infos.isbn].concat((l.isbns || []).filter(function (x) { return x !== infos.isbn; }));
    }
    if (infos.unite) {
      champs.unite = 'pages';
      valeurs(D.lectures).forEach(function (x) {
        if (x.livreId === it.id && x.unite && x.unite !== 'pages') {
          ops.push({t: 'lectures', o: Object.assign({}, x, {unite: 'pages'})});
        }
      });
    }
    if (livreChange) {
      ops.push({t: 'livres', o: Object.assign({}, l, {genreIds: genreIds, contributeurs: contributeurs, couverture: couverture}, champs)});
    }
    if (avisChange) {
      if (avis) {
        ops.push({t: 'avis', o: Object.assign({}, avis, {tropeIds: tropeIds})});
      } else {
        ops.push({t: 'avis', o: {id: it.id, notes: {}, humeurIds: [], tropeIds: tropeIds, mot: ''}});
      }
    }
    if (livreChange || avisChange || achatsChange) {
      n.livres++;
    }
  });
  n.changements = n.genres + n.retraits + n.tropes + n.roles + n.couvertures + n.infos + n.achats + n.reventes;
  var morceaux = [];
  if (n.genres) {
    morceaux.push(n.genres + ' genre' + (n.genres > 1 ? 's' : '') + ' ajouté' + (n.genres > 1 ? 's' : ''));
  }
  if (n.retraits) {
    morceaux.push(n.retraits + ' retiré' + (n.retraits > 1 ? 's' : ''));
  }
  if (n.tropes) {
    morceaux.push(n.tropes + ' trope' + (n.tropes > 1 ? 's' : ''));
  }
  if (n.roles) {
    morceaux.push(n.roles + ' traduction' + (n.roles > 1 ? 's' : '') + ' ou rôle' + (n.roles > 1 ? 's' : ''));
  }
  if (n.couvertures) {
    morceaux.push(n.couvertures + ' couverture' + (n.couvertures > 1 ? 's' : ''));
  }
  if (n.infos) {
    morceaux.push(n.infos + ' info' + (n.infos > 1 ? 's' : '') + ' d\'édition');
  }
  if (n.achats) {
    morceaux.push(n.achats + ' achat' + (n.achats > 1 ? 's' : ''));
  }
  if (n.reventes) {
    morceaux.push(n.reventes + ' revente' + (n.reventes > 1 ? 's' : ''));
  }
  return {ops: ops, changements: n.changements, livres: n.livres, resume: morceaux.join(', ')};
}

ACTIONS.propAppliquer = function () {
  var r = propOperations();
  if (!r.ops.length) {
    avertir('Rien n\'est coché : ton grimoire ne change pas.', 'Propositions');
    return;
  }
  demander(r.livres + ' livres vont être mis à jour (' + r.resume + '). Tu pourras tout retoucher ensuite, livre par livre.', {titre: 'Appliquer les propositions ?', oui: 'Appliquer'}).then(function (ok) {
    if (!ok) {
      return;
    }
    return faireInstantane('avant des propositions').then(function () {
      return blobsCouvertures();
    }).then(function (blobs) {
      r = propOperations(blobs);
      return ecrire(r.ops);
    }).then(function () {
      propEtat = null;
      fermerFeuille();
      apresEcriture();
      toast('✨ ' + r.livres + ' livres enrichis');
    });
  }).catch(erreurEcriture);
};
// ---------- Compléter avec Claude : la demande (prompt du dépôt + livres à compléter), puis sa réponse collée ----------
// Le prompt est publié à côté de la page (prompt-propositions.md, sans données perso). La liste des livres ne quitte le
// téléphone que quand on la partage soi-même ; la réponse de Claude repasse par l'écran des propositions.
var propDemandeClaude = '';
var FORMATS_CLAUDE = {paperBook: 'papier', eBook: 'numérique', audioBook: 'audio'};

// livres de la PAL ou en cours (même en pause) à qui il manque les genres ou les tropes
function livresACompleter() {
  return M.livres.filter(function (b) {
    var pal = b.statut === 'NOT_STARTED' && !b.wishlist;
    var enCours = b.statut === 'READING' || b.statut === 'PAUSE';
    if (!pal && !enCours) {
      return false;
    }
    var tropes = ((D.avis[b.id] || {}).tropeIds || []).filter(function (t) { return D.tropes[t]; });
    return !b.genreIds.length || !tropes.length;
  });
}
function demandeClaude(prompt, livres, date) {
  var l = livres.map(function (b) {
    var x = D.livres[b.id] || {};
    var statut = 'en cours';
    if (b.statut === 'NOT_STARTED') {
      statut = 'PAL';
    }
    var o = {id: b.id, titre: b.title, auteurs: b.authors, traducteurs: b.translators, editeur: b.publisher, isbn: b.isbn, annee: b.publication_date, format: FORMATS_CLAUDE[b.book_type] || '', statut: statut, genres: b.tagList, tropes: (NOTES[b.id] || {}).tropes || []};
    if (x.serieId && D.series[x.serieId]) {
      o.serie = D.series[x.serieId].nom;
      o.tome = x.tome;
    }
    if (x.resume) {
      o.resume = x.resume.slice(0, 300);
    }
    // champs vides retirés : la demande reste courte
    Object.keys(o).forEach(function (k) {
      if (o[k] === '' || o[k] === null || o[k] === undefined || (Array.isArray(o[k]) && !o[k].length)) {
        delete o[k];
      }
    });
    return o;
  });
  var genres = listeTriee('genres').filter(function (g) { return !g.archive; }).map(function (g) { return g.nom; });
  var tropes = listeTriee('tropes').filter(function (t) { return !t.archive; }).map(function (t) { return t.nom; });
  return prompt.trim() + '\n\n---\n\n## Date à recopier dans ta réponse\n\n' + date + '\n\n## Mes genres\n\n' + genres.join(', ') + '\n\n## Mes tropes\n\n' + tropes.join(', ') + '\n\n## Livres à compléter (' + l.length + ')\n\n```json\n' + JSON.stringify(l, null, 1) + '\n```\n';
}
ACTIONS.preparerClaude = function () {
  var livres = livresACompleter();
  if (!livres.length) {
    avertir('Tous les livres de ta PAL et en cours ont déjà leurs genres et leurs tropes.', 'Compléter avec Claude');
    return;
  }
  fetch('prompt-propositions.md', {cache: 'no-store'}).then(function (rep) {
    if (!rep.ok) {
      throw new Error(rep.status);
    }
    return rep.text();
  }).then(function (prompt) {
    propDemandeClaude = demandeClaude(prompt, livres, Date.now());
    var s = '';
    if (livres.length > 1) {
      s = 's';
    }
    ouvrirFeuille('<h3>Compléter avec Claude</h3><p>' + livres.length + ' livre' + s + ' de ta PAL ou en cours n\'' + (livres.length > 1 ? 'ont' : 'a') + ' pas encore ' + (livres.length > 1 ? 'leurs' : 'ses') + ' genres ou ' + (livres.length > 1 ? 'leurs' : 'ses') + ' tropes.</p>' +
      '<ol class="small"><li>Envoie la demande à Claude : <b>Partager</b> vers l\'appli Claude, ou <b>Copier</b> puis colle-la dans une nouvelle conversation (recherche sur le web activée).</li><li>Quand Claude a répondu, copie son bloc JSON.</li><li>Reviens ici : ⚙️ → <b>Coller la réponse de Claude</b>.</li></ol>' +
      '<div class="row"><button class="act" data-act="partagerClaude">' + ic('share-2') + ' Partager</button><button class="act doux" data-act="copierClaude">' + ic('copy') + ' Copier</button></div>');
  }).catch(function () {
    avertir('Je n\'arrive pas à lire la consigne pour Claude : vérifie ta connexion internet.', 'Compléter avec Claude');
  });
};
// Chrome sur Android refuse de partager un .md (NotAllowedError « Permission denied ») même quand canShare dit oui :
// fichier .txt en text/plain. share() est appelé tout de suite dans le clic (la demande est prête depuis l'ouverture).
ACTIONS.partagerClaude = function () {
  var f = new File([propDemandeClaude], 'grimoire-a-completer.txt', {type: 'text/plain'});
  if (!navigator.share) {
    ACTIONS.copierClaude();
    return;
  }
  var donnees = {title: 'Mon grimoire : livres à compléter', text: propDemandeClaude};
  if (navigator.canShare && navigator.canShare({files: [f]})) {
    donnees = {files: [f], title: 'Mon grimoire : livres à compléter', text: 'Suis les consignes du fichier joint.'};
  }
  navigator.share(donnees).catch(function (e) {
    // « Annuler » dans la feuille de partage : rien à dire
    if (e && e.name === 'AbortError') {
      return;
    }
    avertir('Le partage n\'a pas marché sur ce téléphone (' + ((e && e.name) || 'erreur') + '). Utilise plutôt « Copier », puis colle la demande dans une nouvelle conversation avec Claude.', 'Compléter avec Claude');
  });
};
ACTIONS.copierClaude = function () {
  navigator.clipboard.writeText(propDemandeClaude).then(function () {
    toast('📋 Copié : colle-le dans une conversation avec Claude');
  }).catch(function () {
    avertir('La copie n\'a pas marché : essaie plutôt « Partager ».', 'Compléter avec Claude');
  });
};

// la réponse de Claude : le bloc ```json``` s'il y en a un, sinon du premier « { » au dernier « } »
function propositionsDansTexte(t) {
  var blocs = [];
  var re = /```(?:json)?\s*([\s\S]*?)```/g;
  var m;
  while ((m = re.exec(t))) {
    blocs.push(m[1]);
  }
  blocs.push(t);
  for (var i = 0; i < blocs.length; i++) {
    var s = blocs[i];
    var debut = s.indexOf('{');
    var fin = s.lastIndexOf('}');
    if (debut < 0 || fin <= debut) {
      continue;
    }
    try {
      var d = JSON.parse(s.slice(debut, fin + 1).replace(/[“”]/g, '"'));
      if (d && Array.isArray(d.livres) && (!d.format || d.format === FORMAT_PROPOSITIONS)) {
        d.format = FORMAT_PROPOSITIONS;
        if (!d.date) {
          d.date = Date.now();
        }
        return d;
      }
    } catch (e) {
      // bloc suivant
    }
  }
  return null;
}
ACTIONS.collerClaude = function () {
  ouvrirFeuille('<h3>Coller la réponse de Claude</h3><p class="small muted">Colle ici son bloc JSON, ou toute sa réponse : le bloc sera retrouvé.</p><textarea id="reponseClaude" rows="8" placeholder="{&quot;format&quot;: &quot;grimoire-propositions&quot;, …}"></textarea>' +
    '<div class="row" style="margin-top:10px"><button class="act" data-act="lireReponseClaude">' + ic('check') + ' Voir les propositions</button><button class="act doux" data-act="collerPressePapiers">' + ic('clipboard-paste') + ' Coller</button></div>');
};
ACTIONS.collerPressePapiers = function () {
  if (!navigator.clipboard || !navigator.clipboard.readText) {
    avertir('Appuie longuement dans la zone de texte, puis « Coller ».', 'Coller la réponse de Claude');
    return;
  }
  navigator.clipboard.readText().then(function (t) {
    var z = document.getElementById('reponseClaude');
    if (z) {
      z.value = t;
    }
  }).catch(function () {
    avertir('Appuie longuement dans la zone de texte, puis « Coller ».', 'Coller la réponse de Claude');
  });
};
ACTIONS.lireReponseClaude = function () {
  var z = document.getElementById('reponseClaude');
  var d = propositionsDansTexte((z && z.value) || '');
  if (!d) {
    avertir('Je ne trouve pas de propositions dans ce texte. Copie bien le bloc de Claude qui commence par {"format": "grimoire-propositions".', 'Coller la réponse de Claude');
    return;
  }
  fermerFeuille();
  proposerPropositions(d);
};

</style>
<script>
// ---------- Célébrations : on compare l'état du jeu à ce qui a déjà été fêté ----------
var fileFetes = [];
var jeuEnCours = false;

function lireEtatJeu() {
  try {
    return JSON.parse(lsGet('bm_etat_jeu') || 'null');
  } catch (e) {
    return null;
  }
}
function etatJeu() {
  return avec('quetes', function () {
    var y = new Date().getFullYear();
    var eb = etatBingo(y);
    return {
      niveau: niveauCorps().i,
      annee: y,
      cases: eb.ok.map(function (o, k) { return o ? k : -1; }).filter(function (k) { return k >= 0; }),
      bingos: eb.gagnees.length,
      sceaux: paliersSceaux(),
      livres: finies().map(function (r) { return r.book.id + ':' + r.nth; }),
      saisons: quetesSaisonReussies(),
      decos: decosGagnees(),
      catalogue: DECOS.map(function (x) { return x[0]; })
    };
  });
}
// les récompenses qui donnent de l'XP, enregistrées une seule fois dans la base :
// défis réussis, pari du destin gagné, quêtes de saison réussies pendant qu'elles ont lieu
function enregistrerRecompenses(avant) {
  var deja = defisReussis();
  var tous = Object.assign({}, deja);
  var res = {defis: [], pari: null, pariPasse: false, ecrit: false};
  var ops = [];
  var now = Date.now();
  avec('quetes', defisEnCours).forEach(function (d) {
    if (d.fini && !deja[d.cle]) {
      tous[d.cle] = {xp: d.xp, date: now, titre: d.titre};
      res.defis.push(d);
    }
  });
  var p = pariEnCours();
  if (p) {
    var r = lecturePari(p);
    if (r) {
      tous['P:' + p.debut] = {xp: p.xp, date: r.end, titre: 'Pari du destin : ' + titre(r.book)};
      res.pari = {p: p, r: r};
      ops.push({t: 'reglages', o: {id: 'pari', v: null}});
    } else if (now > p.echeance) {
      ops.push({t: 'reglages', o: {id: 'pari', v: null}});
      res.pariPasse = true;
    }
  }
  if (avant && avant.saisons) {
    quetesSaisonReussies().forEach(function (k) {
      if (avant.saisons.indexOf(k) >= 0 || deja['Q:' + k]) {
        return;
      }
      var i = instanceSaison(k);
      if (i && i.fin > now - 2 * DAY) {
        tous['Q:' + k] = {xp: i.q[5], date: now, titre: 'Quête : ' + i.nom};
      }
    });
  }
  if (Object.keys(tous).length !== Object.keys(deja).length) {
    ops.push({t: 'reglages', o: {id: 'defisReussis', v: tous}});
  }
  if (!ops.length) {
    return Promise.resolve(res);
  }
  return ecrire(ops).then(function () {
    planifierSauvegarde();
    res.ecrit = true;
    return res;
  });
}
function union(a, b) {
  var l = (a || []).slice();
  (b || []).forEach(function (x) {
    if (l.indexOf(x) < 0) {
      l.push(x);
    }
  });
  return l;
}
// la vérification attend que l'appli soit au repos ; plusieurs modifications rapprochées n'en font qu'une
var minuteurVerifJeu = null;
var jeuARefaire = false;
function planifierVerifJeu(delai) {
  clearTimeout(minuteurVerifJeu);
  minuteurVerifJeu = setTimeout(function () {
    if (window.requestIdleCallback) {
      requestIdleCallback(verifierJeu, {timeout: 2000});
    } else {
      verifierJeu();
    }
  }, delai);
}
function verifierJeu() {
  if (jeuEnCours) {
    jeuARefaire = true;
    return;
  }
  if (!M || !D.livres || !valeurs(D.livres).length) {
    return;
  }
  jeuEnCours = true;
  var avant = lireEtatJeu();
  enregistrerRecompenses(avant).then(function (res) {
    var apres = etatJeu();
    var fetes = [];
    if (avant) {
      fetes = differencesJeu(avant, apres, res);
      // on garde le meilleur déjà fêté : un niveau, un sceau ou une déco perdus puis retrouvés ne sont pas refêtés
      apres.niveau = Math.max(apres.niveau, avant.niveau || 0);
      Object.keys(avant.sceaux || {}).forEach(function (k) {
        apres.sceaux[k] = Math.max(apres.sceaux[k] || 0, avant.sceaux[k]);
      });
      if (avant.annee === apres.annee) {
        apres.cases = union(apres.cases, avant.cases);
        apres.bingos = Math.max(apres.bingos, avant.bingos || 0);
      }
      apres.saisons = union(apres.saisons, avant.saisons);
      apres.decos = union(apres.decos, avant.decos);
    }
    lsSet('bm_etat_jeu', JSON.stringify(apres));
    // une restauration ou un import : pas de feu d'artifice géant
    if (fetes.length > 8) {
      fetes = [];
    }
    // une nouvelle décoration se pose d'elle-même sur les étagères
    var suite = Promise.resolve();
    var nouvellesDecos = fetes.filter(function (f) { return f.type === 'deco'; });
    if (nouvellesDecos.length) {
      var posees = decosPosees();
      nouvellesDecos.forEach(function (f) {
        if (posees.indexOf(f.id) < 0) {
          posees.push(f.id);
          f.posee = true;
        }
      });
      if (nouvellesDecos.some(function (f) { return f.posee; })) {
        suite = regler('decosChoisies', posees).then(function () {
          planifierSauvegarde();
          res.ecrit = true;
        });
      }
    }
    return suite.then(function () {
      fetes.forEach(function (f) { fileFetes.push(f); });
      if (res.pariPasse) {
        toast('🎲 Le pari du destin est passé. Pas grave, le hibou repassera !');
      }
      if (res.ecrit) {
        rendre();
      }
      montrerFete();
    });
  }).catch(function () {}).then(function () {
    jeuEnCours = false;
    if (jeuARefaire) {
      jeuARefaire = false;
      planifierVerifJeu(0);
    }
  });
}
function differencesJeu(avant, apres, res) {
  var fetes = [];
  var now = Date.now();
  // livres terminés (récemment : pas les vieilles lectures retrouvées)
  var connus = {};
  (avant.livres || []).forEach(function (k) { connus[k] = 1; });
  var nouveauxLivres = avec('quetes', function () {
    return finies().filter(function (r) { return !connus[r.book.id + ':' + r.nth] && r.end > now - 3 * DAY; });
  });
  if (nouveauxLivres.length <= 3) {
    nouveauxLivres.forEach(function (r) { fetes.push({type: 'livre', r: r}); });
  }
  // cases de bingo de l'année
  if (avant.annee === apres.annee) {
    var nouvellesCases = apres.cases.filter(function (k) { return (avant.cases || []).indexOf(k) < 0; });
    if (nouvellesCases.length) {
      fetes.push({type: 'case', cases: nouvellesCases, bingos: apres.bingos, avantBingos: avant.bingos || 0, nbOk: apres.cases.length});
    }
  }
  res.defis.forEach(function (d) { fetes.push({type: 'defi', d: d}); });
  if (res.pari) {
    fetes.push({type: 'pari', p: res.pari.p, r: res.pari.r});
  }
  // quêtes de saison réussies (celles en cours ou qui viennent de finir)
  if (avant.saisons) {
    apres.saisons.forEach(function (k) {
      var i = instanceSaison(k);
      if (avant.saisons.indexOf(k) < 0 && i && i.fin > now - 3 * DAY) {
        fetes.push({type: 'saison', cle: k});
      }
    });
  }
  // décorations gagnées
  if (avant.decos) {
    var connues = avant.catalogue || ['plante', 'bougie', 'chat', 'boule', 'chouette', 'pile', 'lanterne', 'sablier', 'fiole', 'oeuf', 'citrouille', 'sapin'];
    apres.decos.forEach(function (id) {
      if (avant.decos.indexOf(id) < 0 && connues.indexOf(id) >= 0) {
        fetes.push({type: 'deco', id: id});
      }
    });
  }
  // sceaux et paliers
  var dates = Object.assign({}, datesSceaux());
  var nouveauxSceaux = false;
  Object.keys(apres.sceaux).forEach(function (k) {
    var a = (avant.sceaux || {})[k] || 0;
    for (var p = a + 1; p <= apres.sceaux[k]; p++) {
      dates[k + ':' + p] = now;
      nouveauxSceaux = true;
      fetes.push({type: 'sceau', cle: k, palier: p});
    }
  });
  if (nouveauxSceaux) {
    regler('sceauxDates', dates).then(planifierSauvegarde).catch(function (e) {
      noterErreur(e && e.message, 'dates des sceaux');
    });
  }
  if (apres.niveau > (avant.niveau || 0)) {
    fetes.push({type: 'niveau', de: avant.niveau || 0, a: apres.niveau});
  }
  return fetes;
}

function confettis() {
  var c = ['#e7c36b', '#a879ff', '#2fd0a8', '#ff8fb8', '#fff3c4'];
  var s = '';
  for (var i = 0; i < 40; i++) {
    s += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + c[i % 5] + ';animation-duration:' + (2.4 + Math.random() * 2.4).toFixed(2) + 's;animation-delay:-' + (Math.random() * 4).toFixed(2) + 's"></i>';
  }
  return '<div class="confettis">' + s + '</div>';
}
function vibrerFete(motif) {
  if (navigator.vibrate) {
    try {
      navigator.vibrate(motif);
    } catch (e) {}
  }
}
function contenuFete(f) {
  var y = new Date().getFullYear();
  if (f.type === 'livre') {
    var b = f.r.book;
    var couv = esc(titre(b));
    if (b.image && /^(https?|blob):/.test(b.image)) {
      couv = '<img src="' + esc(b.image) + '" alt="">';
    }
    var xp = Math.round(xpLecture(f.r));
    var taille = '';
    if (f.r.page_type === 'TIME') {
      taille = '<span>' + dureeDefi(f.r.total_page) + ' d\'écoute</span>';
    } else if (pagesLecture(f.r)) {
      taille = '<span>' + pagesLecture(f.r) + ' pages</span>';
    }
    var rang = avec('quetes', function () { return finies().filter(function (r) { return annee(r.end) === y; }).length; });
    // la carte de collection de ce livre
    var carte = cartesCollection().filter(function (c) { return c.r.book.id === b.id && c.r.nth === f.r.nth; })[0];
    var visuel = '<div class="couv-fete">' + couv + '</div>';
    var nouvelle = '';
    var fond = confettis();
    if (carte) {
      visuel = '<div class="carte-fete">' + htmlCarte(carte, true) + '</div>';
      nouvelle = '<span>Nouvelle carte ' + RARETES[carte.rar][1].toLowerCase() + ' ' + RARETES[carte.rar][2] + '</span>';
      if (carte.rar === 3) {
        fond = '<div class="rayons-fete"></div>' + confettis();
      }
    }
    return {html: fond + visuel + '<div class="etiq" style="margin-top:16px">Livre terminé</div><h2>' + esc(titre(b)) + '</h2><div class="pastilles-fete"><span class="or" data-compteur="' + xp + '">+0 XP</span>' + taille + '<span>' + rang + (rang > 1 ? 'ᵉ' : 'ᵉʳ') + ' livre de ' + y + '</span>' + nouvelle + '</div>', bouton: 'Youpi ✨', vib: [80, 60, 80]};
  }
  if (f.type === 'case') {
    var cases = avec('quetes', function () { return casesBingo(y); });
    var c = cases[f.cases[0]];
    var avecLivre = '';
    if (c[3] && c[3].book) {
      avecLivre = '<div class="sous-fete">avec <i>' + esc(titre(c[3].book)) + '</i></div>';
    }
    var autres = '';
    if (f.cases.length > 1) {
      autres = '<div class="autres-cases">' + f.cases.slice(1).map(function (k) { return cases[k][0]; }).join('') + '</div><div class="sous-fete">et ' + (f.cases.length - 1) + ' autre' + (f.cases.length > 2 ? 's' : '') + ' case' + (f.cases.length > 2 ? 's' : '') + '</div>';
    }
    var bingo = '';
    var nb = f.bingos - f.avantBingos;
    var vib = [50];
    if (nb > 0) {
      bingo = '<div class="bingo-fete">BINGO' + (nb > 1 ? ' ×' + nb : '') + ' !</div>';
      vib = [60, 40, 60, 40, 160];
    }
    return {html: (nb > 0 ? confettis() : '') + '<div class="etiq">Case' + (f.cases.length > 1 ? 's' : '') + ' cochée' + (f.cases.length > 1 ? 's' : '') + '</div><div class="tampon-fete">' + c[0] + '</div><h2>' + esc(c[2]) + '</h2>' + avecLivre + autres + bingo + '<div class="sous-fete" style="margin-top:6px">' + f.nbOk + ' / 25 cases · ' + f.bingos + ' bingo' + (f.bingos > 1 ? 's' : '') + '</div>', bouton: 'Trop bien 🎉', vib: vib};
  }
  if (f.type === 'pari') {
    var avance = Math.max(0, Math.floor((f.p.echeance - f.r.end) / DAY));
    return {html: confettis() + '<div class="etiq">Pari gagné</div><div class="de-fete">🎲</div><h2>' + esc(titre(f.r.book)) + '</h2><div class="sous-fete">fini ' + avance + ' jour' + (avance > 1 ? 's' : '') + ' avant la date. Le destin s\'incline.</div><div class="pastilles-fete"><span class="or" data-compteur="' + f.p.xp + '">+0 XP</span></div>', bouton: 'Le destin, c\'est moi ✨', vib: [60, 40, 60, 40, 160]};
  }
  if (f.type === 'saison') {
    var i = instanceSaison(f.cle);
    var deco = '';
    if (i.q[6]) {
      deco = '<br>Et une nouvelle décoration : ' + esc(nomDeco(i.q[6])) + ' !';
    }
    return {html: '<div class="rayons-fete"></div>' + confettis() + '<div class="etiq">Quête de saison réussie</div><div class="sceau-s sceau-fete"><span>' + i.q[1] + '</span></div><h2>' + esc(i.nom) + '</h2><div class="sous-fete">Le sceau rejoint ta collection.' + deco + '</div><div class="pastilles-fete"><span class="or" data-compteur="' + i.q[5] + '">+0 XP</span></div>', bouton: 'Magique ✨', vib: [100, 50, 100]};
  }
  if (f.type === 'deco') {
    var dd = DECOS.filter(function (x) { return x[0] === f.id; })[0];
    var place = 'Pose-la sur tes étagères avec 🪴 Décos.';
    if (f.posee) {
      place = 'La voilà posée sur ton étagère.';
    }
    return {html: '<div class="rayons-fete"></div><div class="etiq">Nouvelle décoration</div><div class="deco-fete">' + svgDeco(f.id, true) + '</div><h2>' + esc(dd[1]) + '</h2><div class="sous-fete">Débloquée : ' + esc(dd[2].charAt(0).toLowerCase() + dd[2].slice(1)) + '.<br>' + place + '</div>', bouton: 'Je l\'adopte 💛', vib: [80, 50, 80]};
  }
  if (f.type === 'defi') {
    return {html: '<div class="etiq">Défi réussi</div><div class="ico-defi-fete">' + f.d.ico + '</div><h2>' + esc(f.d.titre) + '</h2><div class="pastilles-fete"><span class="or" data-compteur="' + f.d.xp + '">+0 XP</span></div>', bouton: 'Bien joué ✨', vib: [50, 40, 50]};
  }
  if (f.type === 'sceau') {
    var fam = FAMILLES_SCEAUX.filter(function (x) { return x[0] === f.cle; })[0];
    var uni = SCEAUX_UNIQUES.filter(function (x) { return x[0] === f.cle; })[0];
    var em = '', nom = '', desc = '', cls = 'p3';
    if (fam) {
      em = fam[1];
      nom = fam[2] + ' · palier ' + CHIFFRES_ROMAINS[f.palier];
      desc = nombreFr(fam[3][f.palier - 1]) + ' ' + uniteSceau(fam, fam[3][f.palier - 1]) + '. Bravo !';
      cls = 'p' + f.palier;
    } else if (uni) {
      em = uni[1];
      nom = uni[2];
      desc = avec('quetes', function () { return uni[4](donneesSceaux()); });
    }
    return {html: '<div class="rayons-fete"></div><div class="etiq">Nouveau sceau</div><div class="cire cire-fete ' + cls + '"><span>' + em + '</span></div><h2>' + esc(nom) + '</h2><div class="sous-fete">' + esc(desc) + '</div>', bouton: 'Je le garde 💛', vib: [100, 50, 100]};
  }
  // niveau
  var n = niveau();
  var de = NIVEAUX[f.de];
  var lv = NIVEAUX[f.a];
  var prochain = '';
  if (NIVEAUX[f.a + 1]) {
    prochain = '<br>Prochain : ' + NIVEAUX[f.a + 1][1] + ' ' + esc(NIVEAUX[f.a + 1][2]) + ' à ' + nombreFr(NIVEAUX[f.a + 1][0]) + ' XP';
  }
  var quitte = '';
  if (n.dates[f.de] && n.dates[f.a]) {
    quitte = 'Tu quittes ' + de[1] + ' ' + esc(de[2]) + ' après ' + dureeNiveau(n.dates[f.a] - n.dates[f.de]) + '.';
  }
  return {html: '<div class="rayons-fete"></div>' + confettis() + '<div class="etiq">Niveau ' + (f.a + 1) + '</div><div class="medaille-fete">' + lv[1] + '</div><h2>' + esc(lv[2]) + '</h2><div class="sous-fete">' + quitte + prochain + '</div>', bouton: 'Je déploie mes ailes ✨', vib: [100, 60, 100, 60, 300]};
}
function montrerFete() {
  if (document.getElementById('feteJeu') || !fileFetes.length) {
    return;
  }
  var f = fileFetes.shift();
  var c = contenuFete(f);
  var d = document.createElement('div');
  d.id = 'feteJeu';
  d.className = 'fete-jeu';
  d.setAttribute('role', 'dialog');
  d.setAttribute('aria-modal', 'true');
  d.innerHTML = c.html + '<button class="fermer-fete">' + c.bouton + '</button>';
  document.body.appendChild(d);
  vibrerFete(c.vib);
  // l'XP défile en comptant
  var compteur = d.querySelector('[data-compteur]');
  if (compteur) {
    var cible = parseInt(compteur.dataset.compteur, 10);
    var t0 = null;
    var pas = function (t) {
      if (!t0) {
        t0 = t;
      }
      var p = Math.min(1, (t - t0) / 1200);
      compteur.textContent = '+' + nombreFr(cible * (1 - Math.pow(1 - p, 3))) + ' XP';
      if (p < 1 && document.body.contains(compteur)) {
        requestAnimationFrame(pas);
      }
    };
    setTimeout(function () { requestAnimationFrame(pas); }, 500);
  }
  d.querySelector('.fermer-fete').addEventListener('click', function (e) {
    e.stopPropagation();
    d.classList.add('sort');
    setTimeout(function () {
      d.remove();
      montrerFete();
    }, 240);
  });
  setTimeout(function () { d.querySelector('.fermer-fete').focus(); }, 60);
}
apresEcritureHooks.push(function () {
  planifierVerifJeu(350);
});
</script>

<script>
// ---------- Animations réduites (réglage de ce téléphone) ----------
// Mêmes effets que « Supprimer les animations » du téléphone : chaque règle @media (prefers-reduced-motion) des styles
// est recopiée sous html.calme, donc une nouvelle règle de ce genre vaut aussi pour le réglage, sans rien ajouter.
function mouvementReduit() {
  if (document.documentElement.classList.contains('calme')) {
    return true;
  }
  return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function appliquerCalme(on) {
  document.documentElement.classList.toggle('calme', on);
  if (!on || document.getElementById('styleCalme')) {
    return;
  }
  var regles = [];
  Array.prototype.forEach.call(document.styleSheets, function (feuille) {
    var liste;
    try {
      liste = feuille.cssRules;
    } catch (e) {
      // feuille d'un autre site (polices) : illisible, et sans animation
      return;
    }
    Array.prototype.forEach.call(liste, function (r) {
      if (!r.media || !/prefers-reduced-motion/.test(r.media.mediaText)) {
        return;
      }
      Array.prototype.forEach.call(r.cssRules, function (x) {
        if (x.selectorText) {
          regles.push(x.selectorText.split(',').map(function (s) { return 'html.calme ' + s.trim(); }).join(',') + '{' + x.style.cssText + '}');
        }
      });
    });
  });
  var st = document.createElement('style');
  st.id = 'styleCalme';
  st.textContent = regles.join('\n');
  document.head.appendChild(st);
}
function choixCalmeHtml() {

}

  h += '<div class="reglage"><h4>✨ Compléter avec Claude</h4><p class="small muted">Genres, tropes et traducteurs des livres de ta PAL et en cours qui n\'en ont pas encore : tu envoies la demande à Claude, puis tu colles sa réponse et tu valides livre par livre.</p><div class="row"><button class="act doux" data-act="preparerClaude">' + ic('share-2') + ' Préparer la demande</button><button class="act doux" data-act="collerClaude">' + ic('clipboard-paste') + ' Coller la réponse de Claude</button></div></div>';

function afficherStockage() {

<style>

</style>
<script>
// ---------- erreurs visibles : un message discret, et un journal (⚙️ Réglages → 🐞 Journal des erreurs) ----------
var JOURNAL_MAX = 30;
var dernierMessageErreur = 0;
function journalErreurs() {
  try {
    return JSON.parse(lsGet('bm_erreurs') || '[]');
  } catch (e) {
    return [];
  }
}
function noterErreur(message, ou) {
  message = String(message || 'erreur inconnue');
  // bruit du navigateur, sans conséquence
  if (/ResizeObserver loop/.test(message)) {
    return;
  }
  var j = journalErreurs();
  j.push({date: Date.now(), message: message.slice(0, 300), ou: String(ou || '').slice(0, 200), version: VERSION_APPLI});
  lsSet('bm_erreurs', JSON.stringify(j.slice(-JOURNAL_MAX)));
  // un message au plus toutes les 10 secondes
  if (Date.now() - dernierMessageErreur > 10000 && document.body) {
    dernierMessageErreur = Date.now();
    toast('⚠️ Un petit souci est arrivé (détails : ⚙️ → Journal des erreurs)');
  }
}
window.addEventListener('error', function (e) {
  noterErreur(e.message || (e.error && e.error.message), (e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ':' + (e.colno || ''));
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  var ou = '';
  if (r && r.stack) {
    ou = r.stack.split('\n').slice(0, 2).join(' ');
  }
  noterErreur((r && r.message) || r, ou);
});

// ---------- Version appli (PWA) : démarrage, fichiers reçus (partage Android ou 📥) ----------
var CACHE_PARTAGE = 'grimoire-partage';

// ancienne base « grimoire » (version lecture seule) : on n'y lit plus que le dernier export reçu
function idb() {
  return new Promise(function (ok, ko) {
    var r = indexedDB.open('grimoire', 1);
    r.onupgradeneeded = function () {
      r.result.createObjectStore('fichiers');
    };
    r.onsuccess = function () {
      ok(r.result);
    };
    r.onerror = function () {
      ko(r.error);
    };
  });
}
function idbGet(k) {
  return idb().then(function (db) {
    return new Promise(function (ok, ko) {
      var q = db.transaction('fichiers').objectStore('fichiers').get(k);
      q.onsuccess = function () {
        ok(q.result);
      };
      q.onerror = function () {
        ko(q.error);
      };
    });
  });
}

// toast(texte) ; toast(texte, {libelle, f}) : avec un bouton (« ↩️ Annuler »), il reste 5 s
function toast(texte, action) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  var duree = 3500;
  if (action) {
    // un seul message à bouton à la fois : le précédent s'en va
    document.querySelectorAll('.toast.avec-action').forEach(function (x) { x.remove(); });
    t.classList.add('avec-action');
    var s = document.createElement('span');
    s.textContent = texte;
    var b = document.createElement('button');
    b.textContent = action.libelle;
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      t.remove();
      action.f();
    });
    t.appendChild(s);
    t.appendChild(b);
    duree = 5000;
  } else {
    t.textContent = texte;
  }
  document.body.appendChild(t);
  setTimeout(function () { t.classList.add('vis'); }, 50);
  setTimeout(function () {
    t.classList.remove('vis');
    setTimeout(function () { t.remove(); }, 400);
  }, duree);
}
function erreurEcran(e) {
  // même en cas de pépin, les données déjà chargées peuvent partir dans un fichier
  var secours = '';
  if (typeof D !== 'undefined' && D.livres && valeurs(D.livres).length) {
    secours = '<p class="small" style="margin-top:14px">Tes données sont toujours là : tu peux les mettre à l\'abri.</p><div class="row" style="justify-content:center"><button class="act" data-act="exporterSauvegarde">' + ic('share-2') + ' Exporter mon grimoire</button></div>';
  }
  document.getElementById('app').innerHTML = '<div id="load" class="err">' + esc((e && e.message) || e) + secours + '</div>';
}

function majSource() {
  var morceaux = [];
  var imp = reglage('dernierImport');
  if (reglage('mode', 'miroir') === 'miroir' && imp) {
    morceaux.push('Copie de Bookmory du ' + fdate(imp.date));
  }
  if (texteSauvegarde()) {
    morceaux.push(texteSauvegarde());
  }
  document.getElementById('src').textContent = morceaux.join(' · ');
}
function afficherGrimoire() {
  M = modeleDepuisBase();
  majSource();
  rendre();
  majPastille();
  // défis réussis, cases, sceaux ou niveau gagnés depuis la dernière fois
  planifierVerifJeu(1200);
}

// Fichier reçu : propositions (→ à valider), sauvegarde du grimoire (→ restaurer) ou export Bookmory (→ importer en miroir)
function recevoirFichier(buf) {
  document.getElementById('app').innerHTML = '<div id="load">J\'ouvre le fichier…</div>';
  var propositions = lirePropositions(buf);
  if (propositions) {
    afficherSiPossible();
    proposerPropositions(propositions);
    return Promise.resolve();
  }
  return lireSauvegarde(buf).then(function (lu) {
    if (lu) {
      return proposerRestauration(lu);
    }
    if (reglage('mode', 'miroir') !== 'miroir') {
      afficherSiPossible();
      proposerExportBookmory(buf);
      return;
    }
    return importerEtAfficher(buf);
  }).catch(function (e) {
    erreurEcran(e);
  });
}
// grimoire indépendant : un export Bookmory sert surtout à récupérer les photos des citations
function proposerExportBookmory(buf) {
  ouvrirFeuille('<h3>Un export Bookmory</h3><p class="small muted">Ton grimoire ne dépend plus de Bookmory. Que veux-tu faire de ce fichier ?</p>' +
    '<button class="act" data-act="photosBookmory" style="margin-top:8px">' + ic('image') + ' Récupérer les photos des citations</button><p class="small muted">Ajoute les photos qui manquent aux citations venues de Bookmory. Rien d\'autre ne change.</p>' +
    '<button class="act doux" data-act="reimporterBookmory" style="margin-top:12px">' + ic('rotate-ccw') + ' Tout réimporter</button><p class="small muted">Remplace les livres venus de Bookmory par leur version de l\'export : ce que tu as changé sur ces livres dans le grimoire serait perdu.</p>');
  ACTIONS.photosBookmory = function () {
    fermerFeuille();
    toast('J\'ouvre l\'export…');
    recupererPhotosBookmory(buf).then(function (r) {
      if (r.ajoutees) {
        apresEcriture();
      }
      return avertir(texteRecupPhotos(r), 'Photos des citations');
    }).catch(erreurEcriture);
  };
  ACTIONS.reimporterBookmory = function () {
    fermerFeuille();
    demander('Les livres venus de Bookmory seront remplacés par leur version de l\'export. Ce que tu as changé sur ces livres dans le grimoire sera perdu.', {titre: 'Tout réimporter ?', oui: 'Réimporter', danger: true}).then(function (ok) {
      if (ok) {
        return importerEtAfficher(buf);
      }
    }).catch(erreurEcran);
  };
}
function importerEtAfficher(buf) {
  return faireInstantane('avant un réimport').then(function () {
    return importerBookmory(buf);
  }).then(function (recap) {
    afficherGrimoire();
    planifierSauvegarde();
    toast('✨ Grimoire mis à jour · ' + recap.livres + ' livres');

}
function afficherSiPossible() {
  if (valeurs(D.livres).length || reglage('mode', 'miroir') !== 'miroir') {
    afficherGrimoire();
  } else {
    ecranVide();

}
function proposerRestauration(lu) {

  ouvrirFeuille('<h3>Restaurer une sauvegarde</h3><p>' + esc(resumeSauvegarde(lu.donnees)) + '</p><p class="small muted">Tout ce qui est actuellement dans le grimoire sera remplacé par cette sauvegarde.</p><div class="row"><button class="act" data-act="confirmerRestauration">' + ic('rotate-ccw') + ' Restaurer</button><button class="act doux" data-act="fermer">Annuler</button></div>');
  ACTIONS.confirmerRestauration = function () {
    fermerFeuille();
    faireInstantane('avant une restauration').then(function () {
      return restaurerSauvegarde(lu);
    }).then(function () {
      afficherSiPossible();
      planifierSauvegarde();
      toast('✨ Sauvegarde restaurée');
    }).catch(erreurEcriture);
  };
}

function ecranVide() {

  document.getElementById('src').textContent = '';
  document.getElementById('app').innerHTML = card('Bienvenue dans ton grimoire ✨', '<div class="vide"><p><b>Nouveau téléphone ?</b> Retrouve ton grimoire depuis ton Drive : ⚙️ Réglages → colle ton code de liaison (fichier <i>Grimoire sauvegardes / code-de-liaison.txt</i>) → ' + ic('rotate-ccw') + ' Restaurer.</p><div class="row" style="justify-content:center"><button class="act" data-act="reglages">' + ic('cloud-download') + ' Restaurer depuis mon Drive</button></div><p class="small muted" style="margin-top:16px">Ou reprends une sauvegarde du grimoire (un fichier .zip).</p><div class="row" style="justify-content:center"><button class="act doux" data-act="choisirExport">' + ic('folder-open') + ' Choisir un fichier</button><button class="act doux" data-act="grimoireVide">' + ic('sparkles') + ' Commencer à zéro</button></div><p class="small" style="margin-top:16px"><a href="aide.html" style="color:var(--accent)">📖 Le mode d\'emploi : installer, sauvegarder, mettre à jour</a></p></div>');
}
ACTIONS.grimoireVide = function () {
  ecrire([{t: 'reglages', o: {id: 'mode', v: 'independant'}}, {t: 'reglages', o: {id: 'bascule', v: Date.now()}}]).then(function () {

    toast('✨ À toi d\'écrire la première page : touche « + »');
  }).catch(erreurEcriture);
};
// première ouverture de la nouvelle version : l'ancien export est déjà sur le téléphone
function proposerImportAncien(e) {

  document.getElementById('app').innerHTML = card('Ton grimoire fait peau neuve ✨', '<div class="vide"><p>Il a maintenant sa propre base : tes lectures vont y être copiées, avec ton carnet, tes exclusions et ton objectif.</p><p class="small muted">Dernier export reçu : ' + fdate(e.date) + '. Pour avoir aussi les photos de tes citations, partage plutôt un nouvel export depuis Bookmory (ta macro le fait quand tu fermes Bookmory).</p><div class="row" style="justify-content:center"><button class="act" data-act="importerAncien">' + ic('sparkles') + ' Importer maintenant</button><button class="act doux" data-act="choisirExport">' + ic('folder-open') + ' Un autre fichier</button></div></div>');

ACTIONS.choisirExport = function () {

};

// ---------- mises à jour de l'appli ----------
// assembler.py écrit la date de fabrication ici et dans version.txt : si le site a une version plus récente
// que la page ouverte (Android garde l'appli en mémoire), on recharge en revenant dans l'appli.
var VERSION_APPLI = '2026-10-06 11:04:02';
function appliOccupee() {
  return !!(document.getElementById('feuille') || document.querySelector('.boite-fond') || document.getElementById('pageMinuteur'));
}
// recharge sans aucune copie gardée : désinstalle le service worker et vide ses caches (sauf un fichier partagé
// en attente), puis rouvre la page à une adresse neuve. La base (les livres) et les réglages ne sont pas touchés.
function rechargerSansCopie() {
  var sw = Promise.resolve();
  if (navigator.serviceWorker) {
    sw = navigator.serviceWorker.getRegistrations().then(function (l) {
      return Promise.all(l.map(function (r) { return r.unregister(); }));
    });
  }
  var cs = Promise.resolve();
  if (window.caches) {
    cs = caches.keys().then(function (l) {
      return Promise.all(l.filter(function (k) { return k !== CACHE_PARTAGE; }).map(function (k) { return caches.delete(k); }));
    });
  }
  Promise.all([sw, cs]).catch(function () {}).then(function () {
    location.replace(location.pathname + '?maj=' + Date.now());
  });
}
// déjà rechargée une fois pour cette version mais toujours l'ancienne : le bouton recharge sans copie
function proposerMiseAJour(sansCopie) {
  if (document.getElementById('majDispo')) {
    return;
  }
  var b = document.createElement('button');
  b.id = 'majDispo';
  b.className = 'maj-dispo';
  b.innerHTML = ic('refresh-cw') + ' Nouvelle version : toucher pour l\'avoir';
  b.addEventListener('click', function () {
    if (sansCopie) {
      rechargerSansCopie();
    } else {
      location.reload();
    }
  });
  document.body.appendChild(b);
}
var derniereVerifMaj = 0;
function verifierMiseAJour() {
  if (VERSION_APPLI.indexOf('__') === 0 || !navigator.onLine) {
    return;
  }
  derniereVerifMaj = Date.now();
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistration().then(function (r) {
      if (r) {
        r.update().catch(function () {});
      }
    }).catch(function () {});
  }
  // adresse unique : un ancien service worker qui garderait version.txt en cache ne peut pas répondre à sa place
  fetch('version.txt?t=' + Date.now(), {cache: 'no-store'}).then(function (r) {
    if (!r.ok) {
      return '';
    }
    return r.text();
  }).then(function (v) {
    v = v.trim();
    if (!v || v <= VERSION_APPLI) {
      return;
    }
    // un seul rechargement automatique par version (si le serveur tarde à servir la nouvelle page, on n'insiste pas)
    var deja = '';
    try {
      deja = sessionStorage.getItem('bm_maj') || '';
    } catch (e) {}
    if (deja === v) {
      proposerMiseAJour(true);
      return;
    }
    if (appliOccupee()) {
      proposerMiseAJour(false);
      return;
    }
    try {
      sessionStorage.setItem('bm_maj', v);
    } catch (e) {}
    location.reload();
  }).catch(function () {});
}
document.addEventListener('visibilitychange', function () {
  // en passant d'une appli à l'autre : une vérification toutes les 2 minutes suffit
  if (document.visibilityState === 'visible' && Date.now() - derniereVerifMaj > 2 * 60 * 1000) {
    verifierMiseAJour();
  }
});

function demarrer() {
  appliquerTheme(lsGet('bm_theme') || 'fetes');
  appliquerCalme(lsGet('bm_calme') === '1');
  try {
    var s = JSON.parse(lsGet('bm_sous') || '{}');
    Object.keys(s).forEach(function (k) { sous[k] = s[k]; });
  } catch (e) {}
  // l'appli s'ouvre sur l'Accueil, sauf si elle reprend là où on était (fermée par Android il y a moins d'une heure)
  var reprise = vueGardee();
  onglet = 'accueil';
  if (reprise && reprise.onglet) {
    onglet = reprise.onglet;
  }

  if ('serviceWorker' in navigator) {
    // service worker en place mais sans ses fichiers hors ligne (après une réparation) : on les lui fait recharger
    navigator.serviceWorker.register('sw.js').then(function () {
      return navigator.serviceWorker.ready;
    }).then(function (r) {
      return caches.keys().then(function (l) {
        var aucun = !l.some(function (k) { return k.indexOf('grimoire-v') === 0; });
        if (aucun && r.active) {
          r.active.postMessage('precharger');
        }
      });
    }).catch(function () {});
  }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
  document.getElementById('fichierImport').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (f) {
      f.arrayBuffer().then(recevoirFichier).catch(erreurEcran);
    }
    e.target.value = '';
  });

  preparerBase().then(function () {
    reprendreSauvegarde();
    var params = new URLSearchParams(location.search);
    // ?maj=… : adresse neuve après une réparation de la mise à jour, on la retire de la barre d'adresse
    if (params.has('maj')) {
      history.replaceState(null, '', location.pathname);
    }
    if (params.has('partage') && 'caches' in window) {
      history.replaceState(null, '', location.pathname);
      return caches.open(CACHE_PARTAGE).then(function (c) {
        return c.match('partage-recu').then(function (rep) {
          if (!rep) {
            return ouvrirGrimoire();
          }
          return rep.arrayBuffer().then(function (b) {
            c.delete('partage-recu').catch(function () {});
            return recevoirFichier(b);
          });
        });
      });
    }
    // test en local seulement : ?db=fichier
    if (params.get('db') && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      return fetch(params.get('db')).then(function (r) { return r.arrayBuffer(); }).then(recevoirFichier);
    }
    return Promise.resolve(ouvrirGrimoire()).then(function () {
      reprendreVue(reprise);
      // une mise à jour des données a échoué au démarrage : on le dit (elle sera retentée au prochain)
      if (lsGet('bm_erreur_migration')) {
        lsSet('bm_erreur_migration', '');
        toast('⚠️ Une mise à jour de tes données n\'a pas pu se faire : nouvel essai au prochain démarrage');
      }
    });
  }).then(function () {
    setTimeout(verifierMiseAJour, 2000);
  }).catch(erreurEcran);
}

// ---------- reprendre là où on était ----------
// Android ferme parfois l'appli restée en arrière-plan (pour la mémoire) : elle redémarre alors. On garde l'onglet,
// la position dans la page et la fiche de livre ouverte quand elle passe en arrière-plan (ou se recharge pour une
// mise à jour), et on les retrouve au démarrage s'il y a moins d'une heure.
var REPRISE_MAX = 60 * 60 * 1000;
function garderVue() {
  var f = document.getElementById('feuille');
  var v = {quand: Date.now(), onglet: onglet, scroll: window.scrollY || 0, fiche: '', scrollFiche: 0};
  if (f && f.dataset.fiche) {
    v.fiche = f.dataset.fiche;
    v.scrollFiche = f.querySelector('.sheet').scrollTop || 0;
  }
  lsSet('bm_vue', JSON.stringify(v));
}
function vueGardee() {
  try {
    var v = JSON.parse(lsGet('bm_vue') || 'null');
    if (v && Date.now() - v.quand < REPRISE_MAX) {
      return v;
    }
  } catch (e) {}
  return null;
}
function reprendreVue(v) {
  if (!v || !M) {
    return;
  }
  // juste après l'affichage de l'onglet (setTimeout plutôt que requestAnimationFrame, en pause si la page est cachée)
  setTimeout(function () {
    window.scrollTo(0, v.scroll || 0);
    if (v.fiche && D.livres[v.fiche]) {
      ouvrirFiche(v.fiche);
      var s = document.querySelector('#feuille .sheet');
      if (s) {
        s.scrollTop = v.scrollFiche || 0;
      }
    }
  }, 30);
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') {
    garderVue();
  }
});
window.addEventListener('pagehide', garderVue);

function ouvrirGrimoire() {
  if (valeurs(D.livres).length || reglage('mode', 'miroir') !== 'miroir') {
    afficherGrimoire();
    return;
  }
  return ancienneBaseExiste().then(function (existe) {
    if (!existe) {
      return null;
    }
    return idbGet('export');
  }).then(function (e) {
    if (e && e.octets) {
      proposerImportAncien(e);
    } else {
      ecranVide();
    }
  }).catch(ecranVide);
}
// la très ancienne base « grimoire » n'existe que sur un téléphone qui avait la version lecture seule :
// on ne l'ouvre (donc on ne la crée) que si elle est là ; un navigateur qui ne sait pas lister les bases l'ouvre comme avant
function ancienneBaseExiste() {
  if (!indexedDB.databases) {
    return Promise.resolve(true);
  }
  return indexedDB.databases().then(function (l) {
    return l.some(function (b) { return b.name === 'grimoire'; });
  }, function () {
    return true;
  });
}
</script>

<script>demarrer();</script>
