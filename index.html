// motifs qui bougent en fond : 14 petits éléments répartis au hasard (mais toujours au même endroit pour un thème)
function semerMotifs(motifs, anim) {
  var zone = document.querySelector('.etoiles');
  if (!zone) {
    return;
  }
  var h = '';
  for (var i = 0; i < 14; i++) {
    var gauche = (i * 37 + 7) % 96;
    var haut = (i * 53 + 11) % 92;
    var taille = 10 + (i % 4) * 4;
    var duree = anim === 'brille' ? 2.4 + (i % 5) * 0.5 : 14 + (i % 6) * 3;
    var style = 'font-size:' + taille + 'px;animation-duration:' + duree + 's;animation-delay:-' + ((i * 2.3) % duree).toFixed(1) + 's;';
    if (anim === 'flotte') {
      style += 'top:' + haut + '%;';
    } else if (anim === 'brille') {
      style += 'left:' + gauche + '%;top:' + haut + '%;';
    } else {
      style += 'left:' + gauche + '%;';
    }
    h += '<i class="' + anim + '" style="' + style + '">' + motifs[i % motifs.length] + '</i>';
  }
  zone.innerHTML = h;
}

function appliquerTheme(t) {
  var racine = document.documentElement;
  racine.removeAttribute('style');
  feteActive = null;
  themeChoisi = t;
  var id = null;
  if (t === 'fetes') {
    id = feteDuJour(new Date());
  } else if (t.indexOf('f:') === 0) {
    id = t.slice(2);
  }
  var motifs = ['✦', '✧'];
  var anim = 'brille';
  if (id && FETES[id]) {
    var f = FETES[id];
    feteActive = id;
    racine.setAttribute('data-theme', 'fete');
    Object.keys(f.c).forEach(function (k) {
      racine.style.setProperty('--' + k, f.c[k]);
    });
    racine.style.setProperty('--bandeau', f.bandeau);
    motifs = f.motifs;
    anim = f.anim;
    document.querySelectorAll('meta[name=theme-color]').forEach(function (m) { m.setAttribute('content', f.c.bg); });
  } else {
    if (t === 'auto') {
      racine.removeAttribute('data-theme');
    } else {
      racine.setAttribute('data-theme', t);
    }
    if (t === 'autumn') {
      motifs = ['🍂', '🍁'];
      anim = 'tombe';
    }
  }
  semerMotifs(motifs, anim);
  var p = document.getElementById('puceFete');
  if (p) {
    p.innerHTML = puceFete();
  }
}
function choisirTheme(t) {
  lsSet('bm_theme', t);
  appliquerTheme(t);
  if (M) {
    rendre();
  }
  if (document.getElementById('choixThemes')) {
    document.getElementById('choixThemes').innerHTML = choixThemesHtml();
  }
}
ACTIONS.theme = function (el) {
  choisirTheme(el.dataset.t);
};
ACTIONS.themeFete = function (el) {
  choisirTheme(el.value ? 'f:' + el.value : 'fetes');
};
// choix du thème, dans les Réglages
function choixThemesHtml() {
  var essai = '<select class="champ" data-chg="themeFete"><option value="">🎉 Essayer une fête ou une saison…</option>' + Object.keys(FETES).map(function (k) {
    var sel = '';
    if (themeChoisi === 'f:' + k) {
      sel = ' selected';
    }
    return '<option value="' + k + '"' + sel + '>' + FETES[k].emoji + ' ' + FETES[k].nom + '</option>'; // esc-ok : fêtes écrites dans le code
  }).join('') + '</select>';
  return '<div>' + THEMES.map(function (th) {
    var cls = 'chip';
    if (th[0] === themeChoisi) {
      cls += ' on';
    }
    return '<button class="' + cls + '" data-act="theme" data-t="' + th[0] + '">' + ic(th[1]) + ' ' + th[2] + '</button>';
  }).join('') + '</div>' + essai;
}
// la petite étiquette sous le titre : fête ou saison du moment
function puceFete() {
  if (!feteActive) {
    return '';
  }
  var f = FETES[feteActive];
  return '<div class="puce-fete"><span class="em">' + f.emoji + '</span><span><b>' + f.nom + '</b> · ' + f.phrase + '</span></div>'; // esc-ok : fêtes écrites dans le code
}

<script>
// ---------- Scanner de code-barres (en librairie : « est-ce que je l'ai déjà ? ») ----------
var scan = {flux: null, minuteur: null, detecteur: null, surCode: null, trouve: false};

function chiffres(s) {
  return String(s || '').replace(/[^0-9Xx]/g, '').toUpperCase();
}
// convertit un ISBN-10 en ISBN-13 pour pouvoir comparer
function isbn13(s) {
  var c = chiffres(s);
  if (c.length === 13) {
    return c;
  }
  if (c.length !== 10) {
    return '';
  }
  var base = '978' + c.slice(0, 9);
  var somme = 0;
  for (var i = 0; i < 12; i++) {
    var poids = 1;
    if (i % 2 === 1) {
      poids = 3;
    }
    somme += parseInt(base[i], 10) * poids;
  }
  return base + ((10 - somme % 10) % 10);
}
function normTitre(t) {
  return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\([^)]*\)/g, ' ').split(/\s[:\-–]\s|:/)[0].replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
// « Jennifer Twice » → {nom: 'twice', initiale: 'j'} ; gère « Nom, Prénom » et « A & B »
function personnes(l) {
  var p = [];
  (l || []).join(' & ').split(/\s*(?:&|;| et | and )\s*/).forEach(function (n) {
    n = n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    if (!n) {
      return;
    }
    var mots;
    if (n.indexOf(',') > 0) {
      var parts = n.split(',');
      mots = (parts[1] + ' ' + parts[0]).split(/[^a-z]+/).filter(Boolean);
    } else {
      mots = n.split(/[^a-z]+/).filter(Boolean);
    }
    if (!mots.length) {
      return;

// (Les corrections d'achats et de reventes de l'utilisatrice ne sont plus dans le code : elles passent par un

// Plusieurs migrations peuvent modifier le même enregistrement au même démarrage : chacune part de la base
// d'avant et renvoie l'objet entier. On ne garde de chacune que ce qu'elle change, dans l'ordre, pour

function fusionnerMigrations(ops) {

function ouvrirBase() {
  if (baseOuverte) {
    return baseOuverte;
  }
  baseOuverte = new Promise(function (ok, ko) {
    var r = indexedDB.open(BASE_NOM, BASE_VERSION);
    r.onupgradeneeded = function () {
      var db = r.result;
      Object.keys(TABLES).forEach(function (t) {
        if (!db.objectStoreNames.contains(t)) {
          var s = db.createObjectStore(t, {keyPath: 'id'});
          TABLES[t].forEach(function (i) { s.createIndex(i, i); });
        }
      });
    };
    r.onsuccess = function () {
      var db = r.result;
      // une nouvelle version de l'appli a besoin de la base : on lui laisse la place
      db.onversionchange = function () {
        db.close();
        location.reload();
      };
      ok(db);
    };
    r.onerror = function () {
      ko(r.error);
    };
  });
  return baseOuverte;
}

function chargerBase() {
  return ouvrirBase().then(function (db) {
    var noms = Object.keys(TABLES);
    return new Promise(function (ok, ko) {
      var tx = db.transaction(noms);
      noms.forEach(function (t) {
        var q = tx.objectStore(t).getAll();
        q.onsuccess = function () {
          D[t] = {};
          q.result.forEach(function (o) { D[t][o.id] = o; });
        };
      });
      tx.oncomplete = function () {
        Object.keys(PHOTOS).forEach(function (id) { URL.revokeObjectURL(PHOTOS[id]); });
        PHOTOS = {};
        valeurs(D.photos).forEach(function (p) { PHOTOS[p.id] = URL.createObjectURL(p.blob); });
        ok(D);
      };
      tx.onerror = function () {
        ko(tx.error);
      };
    });
  });
}

// ecrire([{t: 'livres', o: objet}, {t: 'sessions', suppr: id}…]) : une seule transaction pour tout.
// Ce qui est asynchrone (réseau, photos) doit être fait AVANT. D n'est mis à jour qu'une fois tout écrit.
// {garderDate: true} conserve modifieLe (import).
function ecrire(ops) {
  if (!ops.length) {
    return Promise.resolve();
  }
  return ouvrirBase().then(function (db) {
    var tables = [];
    ops.forEach(function (op) {
      if (tables.indexOf(op.t) < 0) {
        tables.push(op.t);
      }
    });
    return new Promise(function (ok, ko) {
      var tx = db.transaction(tables, 'readwrite');
      var maintenant = Date.now();
      // tout ou rien : une erreur sur une écriture annule toute la transaction (rien n'est gardé à moitié)
      try {
        ops.forEach(function (op) {
          var s = tx.objectStore(op.t);
          if (op.suppr !== undefined) {
            s.delete(op.suppr);
            return;
          }
          if (!op.o.id) {
            op.o.id = nouvelId();
          }
          if (!op.o.creeLe) {
            op.o.creeLe = maintenant;
          }
          if (!op.garderDate || !op.o.modifieLe) {
            op.o.modifieLe = maintenant;
          }
          s.put(op.o);
        });
      } catch (e) {
        try {
          tx.abort();
        } catch (e2) {}
        ko(e);
        return;
      }
      tx.oncomplete = function () {
        viderCacheCalculs();
        ops.forEach(function (op) {
          if (op.suppr !== undefined) {
            delete D[op.t][op.suppr];
            if (op.t === 'photos' && PHOTOS[op.suppr]) {
              URL.revokeObjectURL(PHOTOS[op.suppr]);
              delete PHOTOS[op.suppr];
            }
            return;
          }
          D[op.t][op.o.id] = op.o;
          if (op.t === 'photos') {
            if (PHOTOS[op.o.id]) {
              URL.revokeObjectURL(PHOTOS[op.o.id]);
            }
            PHOTOS[op.o.id] = URL.createObjectURL(op.o.blob);
          }
        });
        ok();
      };
      tx.onerror = function () {
        ko(tx.error);
      };
      tx.onabort = function () {
        ko(tx.error || new Error('Écriture annulée'));
      };
    });
  });
}

// Une copie complète des données (sans les photos, qui ne changent pas dans ces opérations), dans une base à part.
// On garde les 5 dernières ; ⚙️ Réglages → Copies de sécurité permet d'y revenir.
var BASE_INSTANTANES = 'grimoire-instantanes';
var INSTANTANES_MAX = 5;
function baseInstantanes() {
  return new Promise(function (ok, ko) {
    var r = indexedDB.open(BASE_INSTANTANES, 1);
    r.onupgradeneeded = function () {

// ne bloque jamais l'opération qui suit : une copie ratée est seulement signalée dans la console
function faireInstantane(raison) {
  if (!valeurs(D.livres).length) {
    return Promise.resolve();
  }
  var tables = {};
  Object.keys(TABLES).forEach(function (t) {
    if (t !== 'photos') {
      tables[t] = valeurs(D[t]);
    }
  });
  var inst = {id: Date.now(), raison: raison, livres: valeurs(D.livres).length, tables: tables};
  return baseInstantanes().then(function (db) {
    return new Promise(function (ok) {
      var tx = db.transaction('instantanes', 'readwrite');
      var s = tx.objectStore('instantanes');
      s.put(inst);
      var req = s.getAllKeys();
      req.onsuccess = function () {
        var cles = req.result.slice().sort(function (a, b) { return a - b; });
        cles.slice(0, Math.max(0, cles.length - INSTANTANES_MAX)).forEach(function (k) {
          s.delete(k);
        });
      };
      tx.oncomplete = ok;
      tx.onerror = function () {
        ok();
      };
    });
  }).catch(function (e) {
    console.error(e);
  });
}
function listerInstantanes() {
  return baseInstantanes().then(function (db) {
    return new Promise(function (ok, ko) {
      var req = db.transaction('instantanes').objectStore('instantanes').getAll();
      req.onsuccess = function () {
        ok(req.result.sort(function (a, b) { return b.id - a.id; }));
      };
      req.onerror = function () {
        ko(req.error);
      };
    });
  });
}

  return listerInstantanes().then(function (l) {
    var inst = l.find(function (x) { return x.id === id; });
    if (!inst) {

    }
    return faireInstantane('avant de revenir à une copie').then(function () {
      var tables = {};
      Object.keys(TABLES).forEach(function (t) {
        tables[t] = inst.tables[t] || [];
      });
      tables.photos = valeurs(D.photos);
      REGLAGES_PRIVES.forEach(function (k) {

      page_type: UNITE_BM[l.unite] || 'PAGE',
      total_page: l.total || 0,
      created_at: l.creeLe,
      wishlist: l.possession === 'envie',
      possession: l.possession || '',
      // revendu : {prix, devise, date, lieu} (champ revente du livre, possession « revendu »)
      revendu: l.possession === 'revendu',
      revente: (l.possession === 'revendu' && l.revente) || null,
      isbn: (l.isbns || [])[0] || '',
      isbns: l.isbns || [],
      publication_date: l.parution || (l.annee ? String(l.annee) : ''),
      publisher: l.editeur || '',
      description: l.resume || '',
      tagsBruts: [],
      tagList: (l.genreIds || []).filter(function (g) { return D.genres[g]; }).map(function (g) { return D.genres[g].nom; }),
      genreIds: (l.genreIds || []).filter(function (g) { return D.genres[g]; }),
      etagereIds: (l.etagereIds || []).filter(function (e) { return D.etageres[e]; }),
      series_memberships: membres,
      series_key: l.serieId || '',

      purchases: achatsPar[l.id] || [],
      reads: [],

    var ls = (lecturesPar[l.id] || []).sort(function (x, y) { return (x.nth || 0) - (y.nth || 0); });
    ls.forEach(function (x) {
      var logs = (sessionsPar[x.id] || []).filter(function (s) {

      }).map(function (s) {

      var r = {

        book: b,

        updated_at: x.modifieLe,

    }

    return b;
  });

  var notes = valeurs(D.citations).sort(function (a, b) { return (a.creeLe || 0) - (b.creeLe || 0); }).map(function (c) {
    var type = 'BOOK_CONTENT';
    if (c.type === 'pensee') {
      type = 'THOUGHT';
    } else if (c.type === 'note') {
      type = 'NOTE';
    }
    return {_key: c.id, texte: c.texte || '', book: parId[c.livreId], bid: c.livreId, page: c.page || 0, page_end: c.pageFin || 0, type: type, created_at: c.creeLe, photo: urlPhoto(c.photoId), favori: !!c.favori};
  });

  // jours de lecture, comme Bookmory : un relevé, un minuteur, un début ou une fin de lecture
  var jl = {};
  function marquer(ts, livreId) {
    if (!ts || !parId[livreId]) {
      return;
    }
    var k = dkey(new Date(ts));
    if (!jl[k]) {
      jl[k] = [];

      jl[k].push(livreId);

  valeurs(D.lectures).forEach(function (x) {
    marquer(x.debut, x.livreId);
    marquer(x.fin, x.livreId);

  valeurs(D.sessions).forEach(function (s) {
    marquer(s.debut, s.livreId);
    marquer(s.fin, s.livreId);

  Object.keys(jl).forEach(function (k) { jours[k] = jl[k].length; });

    return {id: s.id, book: parId[s.livreId], lectureId: s.lectureId, debut: s.debut, fin: s.fin, dureeSec: s.dureeSec || 0, position: s.position, origine: s.origine};
  });

  EXCLUS = {};
  valeurs(D.livres).forEach(function (l) {
    var e = {};
    CATS_EXCLUSION.forEach(function (c) {
      if (l.exclusions && l.exclusions[c[0]]) {

    }

  valeurs(D.avis).forEach(function (a) {
    var n = {humeurs: [], tropes: [], mot: a.mot || '', maj: a.maj || a.modifieLe};
    Object.keys(a.notes || {}).forEach(function (k) { n[k] = a.notes[k]; });
    (a.humeurIds || []).forEach(function (id) {
      var h = D.humeurs[id];
      if (h) {
        n.humeurs.push((h.emoji ? h.emoji + ' ' : '') + h.nom);
      }
    });
    (a.tropeIds || []).forEach(function (id) {
      if (D.tropes[id]) {
        n.tropes.push(D.tropes[id].nom);
      }
    });
    NOTES[a.id] = n;
  });

  return {livres: livres, lectures: lectures, notes: notes, series: series, jours: jours, joursLivres: jl, parId: parId, sessions: sessions};
}

// ---------- écritures venues des vues actuelles (carnet, exclusions, objectif) ----------
// Le carnet édite NOTES (format historique) : on le retraduit en « avis ».
function avisDepuisNote(id, n) {
  var notes = {};
  valeurs(D.criteres).forEach(function (c) {
    if (n[c.id]) {
      notes[c.id] = n[c.id];
    }
  });
  var ops = [];
  var humeurIds = (n.humeurs || []).map(function (libelle) {
    var id = idHumeur(libelle);
    if (!D.humeurs[id]) {
      var p = libelle.split(' ');
      ops.push({t: 'humeurs', o: {id: id, nom: p.slice(1).join(' ') || libelle, emoji: p[0], ordre: valeurs(D.humeurs).length + ops.length}});
    }
    return id;
  });
  var tropeIds = (n.tropes || []).map(function (nom) {
    var id = idTrope(nom);
    if (!D.tropes[id]) {
      ops.push({t: 'tropes', o: {id: id, nom: nom, emoji: '', ordre: valeurs(D.tropes).length + ops.length}});
    }
    return id;
  });
  var ancien = D.avis[id] || {};
  ops.push({t: 'avis', o: {id: id, notes: notes, humeurIds: humeurIds, tropeIds: tropeIds, mot: n.mot || '', maj: n.maj || Date.now(), creeLe: ancien.creeLe}});
  return ops;
}
function sauverExclusion(id) {
  var l = D.livres[id];
  if (!l) {
    return;
  }
  var copie = Object.assign({}, l, {exclusions: Object.assign({}, EXCLUS[id] || {})});
  ecrire([{t: 'livres', o: copie}]).then(apresEcriture).catch(erreurEcriture);
}
function objectifAnnee(y) {
  return D.objectifs[String(y)] || {id: String(y)};
}
function sauverObjectif(y, champs) {
  var o = Object.assign({}, objectifAnnee(y), champs);
  ecrire([{t: 'objectifs', o: o}]).then(apresEcriture).catch(erreurEcriture);
}
function erreurEcriture(e) {
  avertir('Oups, la modification n\'a pas pu être enregistrée : ' + ((e && e.message) || e));
}

<script>
// ---------- Import d'un export Bookmory (une fois, ou en miroir avant la bascule) ----------
// Avant la bascule, chaque export reçu remplace les données venues de Bookmory, sans toucher à ce qui
// appartient au grimoire (carnet, exclusions, listes, objectifs).
var SQLJS = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';
var JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
var TABLES_BOOKMORY = ['livres', 'auteurs', 'series', 'etageres', 'lectures', 'sessions', 'citations', 'achats', 'photos'];
var scriptsCharges = {};

function chargerScript(src) {
  if (!scriptsCharges[src]) {
    scriptsCharges[src] = new Promise(function (ok, ko) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      s.onerror = function () {
        delete scriptsCharges[src];
        ko(new Error('Impossible de charger ' + src + ' (es-tu hors connexion ?)'));
      };
      document.head.appendChild(s);
    });
  }
  return scriptsCharges[src];
}
function sqlJs() {
  return chargerScript(SQLJS + 'sql-wasm.js').then(function () {
    return initSqlJs({locateFile: function (f) { return SQLJS + f; }});
  });
}
function jszip() {
  return chargerScript(JSZIP).then(function () { return JSZip; });
}

function estZip(u8) {
  return u8[0] === 0x50 && u8[1] === 0x4b;
}

// Lit un export (.zip complet avec photos, ou base new_bookmory.db seule) → {stores, images: {nom: Blob}}
function lireExportBookmory(buf) {
  var u8 = new Uint8Array(buf);
  var images = {};
  var etape = Promise.resolve(u8);
  if (estZip(u8)) {
    etape = jszip().then(function (JSZip) {
      return JSZip.loadAsync(buf);
    }).then(function (z) {
      var f = Object.keys(z.files).find(function (n) { return /new_bookmory\.db$/.test(n); });
      if (!f) {
        throw new Error('Ce fichier ne contient pas de base Bookmory (new_bookmory.db).');
      }
      var photos = Object.keys(z.files).filter(function (n) { return /images\/notes\/[^/]+\.(jpe?g|png|webp)$/i.test(n); });
      return Promise.all(photos.map(function (n) {
        return z.file(n).async('blob').then(function (b) {
          images[n.split('/').pop()] = b;
        });
      })).then(function () {
        return z.file(f).async('uint8array');
      });
    });
  }
  return etape.then(function (db) {
    return sqlJs().then(function (SQL) {
      return {stores: storesBookmory(SQL, db), images: images};
    });
  });
}
function storesBookmory(SQL, u8) {
  var db = new SQL.Database(u8);
  var res = db.exec("SELECT store, CAST(key AS TEXT), value FROM entry WHERE deleted IS NULL OR deleted = 0");
  var stores = {};
  res[0].values.forEach(function (r) {
    if (!stores[r[0]]) {
      stores[r[0]] = [];
    }
    var o = JSON.parse(r[2]);
    o._key = r[1];
    stores[r[0]].push(o);
  });
  db.close();
  return stores;
}

// ---------- conversion ----------
var FORMAT_FR = {paperBook: 'papier', eBook: 'numerique', audioBook: 'audio'};
var STATUT_FR = {READING: 'en_cours', PAUSE: 'pause', DONE: 'terminee', GIVE_UP: 'abandonnee'};
var UNITE_FR = {PAGE: 'pages', TIME: 'secondes', PERCENT: 'pourcent', EPISODE: 'episodes'};
var ROLES_SUFFIXES = [
  [/^(pr[ée]face|introductions?|avant-propos|postface)$/i, 'preface'],
  [/^(traduction|traducteur|traductrice|translator)$/i, 'traduction'],
  [/^(illustrations?|illustrateur|illustratrice|illustrator)$/i, 'illustration'],

function idAuteur(nom) {

}

function lireContributeur(s, roleParDefaut) {

// ancien = {notes, exclus, objectif} : le carnet et les réglages de la version « lecture seule »
function convertirBookmory(S, images, ancien) {
  var ops = [];
  var nouveaux = {};
  TABLES_BOOKMORY.forEach(function (t) { nouveaux[t] = {}; });
  function mettre(t, o) {

    nouveaux[t][o.id] = o;

  }

  // genres manquants (les listes de départ existent déjà : preparerBase)
  var opsListes = [];
  var genresConnus = {};

  (S.series || []).forEach(function (s) {

    if (s.status === 'ongoing') {
      st = 'en_cours';
    } else if (s.status === 'completed') {
      st = 'terminee';
    }

    mettre('series', {id: s._key, nom: s.name || 'Série', statut: st, nbTomes: ancienne.nbTomes || null, creeLe: s.created_at, modifieLe: s.updated_at});
  });

  });

  var auteurs = {};
  (S.books || []).forEach(function (b) {
    var id = b._key;

    var fmtLivre = FORMAT_FR[b.book_type] || 'papier';
    var uniteLivre = UNITE_FR[b.page_type] || 'pages';

    var contributeurs = [];
    function ajouterContributeur(s, role) {
      var c = lireContributeur(s, role);
      if (!c.nom) {
        return;

      if (!auteurs[aid]) {
        var ancienAuteur = D.auteurs[aid] || {};

    (b.illustrators || []).forEach(function (a) { ajouterContributeur(a, 'illustration'); });
    (b.narrators || []).forEach(function (a) { ajouterContributeur(a, 'narration'); });

    var tags = (b.tags || '').split(/\s+/).filter(Boolean).map(function (t) { return t.replace(/^#/, ''); });
    var genreIds = genresFr(tags).map(function (g) {
      var gid = idGenre(g);

        genresConnus[gid] = {id: gid, nom: g, emoji: '', couleur: '', ordre: Object.keys(genresConnus).length};
        opsListes.push({t: 'genres', o: genresConnus[gid]});
      }

    var serieId = '';

    var parution = normaliserParution(b.publication_date);

    if (b.wishlist) {

    mettre('livres', {

      titre: b.title || 'Sans titre',

      editeur: b.publisher || '',

      genreIds: genreIds,

        modifieLe: r.updated_at
      });
      var vus = {};
      function idUnique(base) {
        var k = base;
        var n = 1;
        while (vus[k]) {

        if (!relevesPar[l.created_at]) {
          relevesPar[l.created_at] = [];
        }
        relevesPar[l.created_at].push(l);
      });
      (r.read_timer_list || []).forEach(function (t) {
        var debut = t.read_started_at || t.created_at;
        var rel = (relevesPar[t.created_at] || []).shift();
        var fin = debut + (t.elapsed_sec || 0) * 1000;
        var position = null;
        if (rel) {
          fin = rel.created_at;
          position = rel.page;
        }
        mettre('sessions', {id: idUnique(lid + ':T:' + debut), lectureId: lid, livreId: id, debut: debut, fin: fin, dureeSec: t.elapsed_sec || 0, position: position, creeLe: t.created_at, modifieLe: t.updated_at});
      });
      Object.keys(relevesPar).forEach(function (k) {
        relevesPar[k].forEach(function (l) {
          mettre('sessions', {id: idUnique(lid + ':L:' + l.created_at), lectureId: lid, livreId: id, debut: l.created_at, fin: l.created_at, dureeSec: null, position: l.page, creeLe: l.created_at, modifieLe: l.updated_at});

      if (images[fichier]) {

        photoId = pid;

      } else if (D.photos[pid]) {

      creeLe: n.created_at,
      modifieLe: n.updated_at
    });
  });

  // miroir : ce qui venait de Bookmory et n'y est plus disparaît (les données du grimoire restent)
  var suppressions = 0;
  TABLES_BOOKMORY.forEach(function (t) {
    valeurs(D[t]).forEach(function (o) {
      if (o.origine === 'bookmory' && !nouveaux[t][o.id]) {
        ops.push({t: t, suppr: o.id});
        suppressions++;
      }
    });
  });

  // carnet, exclusions et objectif de la version précédente (seulement s'ils n'existent pas encore)
  var nbAvis = 0;
  Object.keys(ancien.notes || {}).forEach(function (id) {
    if (!D.avis[id] && nouveaux.livres[id]) {
      avisDepuisNote(id, ancien.notes[id]).forEach(function (op) {
        if (op.t === 'avis') {
          nbAvis++;
          op.o.creeLe = ancien.notes[id].maj;
        }
        ops.push(op);
      });
    }
  });
  var y = String(new Date().getFullYear());
  if (ancien.objectif && !D.objectifs[y]) {
    ops.push({t: 'objectifs', o: {id: y, livres: parseInt(ancien.objectif, 10) || 25}});
  }

  return {
    ops: opsListes.concat(ops),
    recap: {
      livres: Object.keys(nouveaux.livres).length,
      lectures: Object.keys(nouveaux.lectures).length,
      sessions: Object.keys(nouveaux.sessions).length,
      citations: Object.keys(nouveaux.citations).length,
      photos: nbPhotos,
      achats: Object.keys(nouveaux.achats).length,
      series: Object.keys(nouveaux.series).length,
      auteurs: Object.keys(nouveaux.auteurs).length,
      avis: nbAvis,
      suppressions: suppressions
    }
  };
}

// ancien carnet, exclusions et objectif (localStorage de la version « lecture seule »)
function ancienCarnet() {
  var a = {notes: {}, exclus: {}, objectif: lsGet('bm_objectif')};
  try {
    a.notes = JSON.parse(lsGet('bm_notes') || '{}');
  } catch (e) {}
  try {
    a.exclus = JSON.parse(lsGet('bm_exclus') || '{}');
  } catch (e) {}
  return a;
}

function texteRecap(r) {
  var morceaux = [r.livres + ' livres', r.lectures + ' lectures', r.sessions + ' relevés et minuteurs', r.citations + ' citations'];
  if (r.photos) {
    morceaux.push(r.photos + ' photos');
  }
  morceaux.push(r.achats + ' achats', r.series + ' séries');
  if (r.avis) {
    morceaux.push(r.avis + ' notes de carnet');
  }
  return morceaux.join(' · ');
}

// Ajoute seulement les photos manquantes aux citations venues de Bookmory : rien d'autre ne change.
// → {ajoutees, dejaLa, sansPhotoDansLeFichier, citationsSupprimees}
function recupererPhotosBookmory(buf) {
  return lireExportBookmory(buf).then(function (lu) {
    var ops = [];
    var r = {ajoutees: 0, dejaLa: 0, sansPhotoDansLeFichier: 0, citationsSupprimees: 0};
    (lu.stores.notes || []).forEach(function (n) {
      var fichier = ((n.images || [])[0] || '').split('/').pop();
      if (!fichier) {
        return;
      }
      var c = D.citations[n._key];
      if (!c) {
        r.citationsSupprimees++;
        return;
      }
      if (c.photoId && D.photos[c.photoId]) {
        r.dejaLa++;
        return;
      }
      var blob = lu.images[fichier];
      if (!blob) {
        r.sansPhotoDansLeFichier++;
        return;
      }
      var pid = 'p:' + fichier;
      ops.push({t: 'photos', o: {id: pid, blob: blob, type: blob.type || 'image/jpeg', creeLe: n.created_at}});
      ops.push({t: 'citations', o: Object.assign({}, c, {photoId: pid}), garderDate: true});
      r.ajoutees++;
    });
    if (!ops.length) {
      return r;
    }
    return ecrire(ops).then(function () {
      return r;
    });
  });
}
function texteRecupPhotos(r) {
  var t = '';
  if (r.ajoutees) {
    t = r.ajoutees + ' photo' + (r.ajoutees > 1 ? 's ajoutées' : ' ajoutée') + ' à tes citations.';
  } else {
    t = 'Aucune photo à ajouter.';
  }
  if (r.dejaLa) {
    t += '\n' + r.dejaLa + ' citation' + (r.dejaLa > 1 ? 's avaient déjà leur photo.' : ' avait déjà sa photo.');
  }
  if (r.sansPhotoDansLeFichier) {
    t += '\n' + r.sansPhotoDansLeFichier + ' photo' + (r.sansPhotoDansLeFichier > 1 ? 's manquent' : ' manque') + ' dans ce fichier : il faut l\'export complet (.zip) de Bookmory, pas seulement la base.';
  }
  if (r.citationsSupprimees) {
    t += '\n' + r.citationsSupprimees + ' citation' + (r.citationsSupprimees > 1 ? 's ne sont' : ' n\'est') + ' plus dans ton grimoire : ignorée' + (r.citationsSupprimees > 1 ? 's' : '') + '.';
  }
  return t;
}

// Importe un export : renvoie le récapitulatif. Ne redessine rien (l'appelant décide).
function importerBookmory(buf) {
  return lireExportBookmory(buf).then(function (lu) {
    var c = convertirBookmory(lu.stores, lu.images, ancienCarnet());
    return ecrire(c.ops).then(function () {
      return regler('dernierImport', {date: Date.now(), recap: c.recap});
    }).then(function () {
      return c.recap;
    });
  });
}
</script>

<script>
// ---------- Sauvegarde : tout le grimoire dans un zip (donnees.json + photos/) ----------
var FORMAT_SAUVEGARDE = 'grimoire';
// réglages qui ne quittent jamais le téléphone
// propres au téléphone, jamais remplacés par une restauration : le code de liaison, et la dernière sauvegarde
// (sinon une vieille sauvegarde restaurée désarmerait le garde-fou contre un grimoire soudain vidé)
var REGLAGES_PRIVES = ['liaison', 'derniereSauvegarde'];

function nomFichierPhoto(id, type) {
  var ext = 'jpg';
  if (/png/.test(type || '')) {
    ext = 'png';
  } else if (/webp/.test(type || '')) {
    ext = 'webp';
  }
  return 'photos/' + id.replace(/^p:/, '').replace(/\.(jpe?g|png|webp)$/i, '').replace(/[^a-zA-Z0-9_-]/g, '_') + '.' + ext;
}

// → Promise<Blob> (zip)
function fabriquerSauvegarde() {
  return jszip().then(function (JSZip) {
    var z = new JSZip();
    var tables = {};
    Object.keys(TABLES).forEach(function (t) {
      if (t === 'photos') {
        return;
      }
      tables[t] = valeurs(D[t]);
      if (t === 'reglages') {
        tables[t] = tables[t].filter(function (r) { return REGLAGES_PRIVES.indexOf(r.id) < 0; });
      }
    });
    var photos = valeurs(D.photos).map(function (p) {
      var f = nomFichierPhoto(p.id, p.type);
      // les photos sont déjà compressées (JPEG) : les recompresser coûte du temps pour rien
      z.file(f, p.blob, {compression: 'STORE'});
      return {id: p.id, type: p.type, fichier: f, creeLe: p.creeLe, modifieLe: p.modifieLe, origine: p.origine};
    });
    z.file('donnees.json', JSON.stringify({format: FORMAT_SAUVEGARDE, version: BASE_VERSION, date: Date.now(), tables: tables, photos: photos}));
    return z.generateAsync({type: 'blob', compression: 'DEFLATE', compressionOptions: {level: 6}});
  });
}

// Le zip est-il une sauvegarde du grimoire ? → Promise<{donnees, zip}|null>
function lireSauvegarde(buf) {
  if (!estZip(new Uint8Array(buf))) {
    return Promise.resolve(null);
  }
  return jszip().then(function (JSZip) {
    return JSZip.loadAsync(buf);
  }).then(function (z) {
    var f = z.file('donnees.json');
    if (!f) {
      return null;
    }
    return f.async('string').then(function (t) {
      var d = JSON.parse(t);
      if (d.format !== FORMAT_SAUVEGARDE) {
        return null;
      }
      return {donnees: d, zip: z};
    });
  });
}
function resumeSauvegarde(d) {
  var t = d.tables || {};
  function n(x) {
    return (t[x] || []).length;
  }
  return n('livres') + ' livres · ' + n('lectures') + ' lectures · ' + n('citations') + ' citations · ' + (d.photos || []).length + ' photos · du ' + fdate(d.date);
}

// Remplace TOUTE la base par la sauvegarde (les réglages privés du téléphone sont gardés).
function restaurerSauvegarde(lu) {
  var d = lu.donnees;
  var photos = d.photos || [];
  return Promise.all(photos.map(function (p) {
    var f = lu.zip.file(p.fichier);
    if (!f) {
      return null;
    }
    return f.async('blob').then(function (b) {
      return {id: p.id, blob: new Blob([b], {type: p.type || 'image/jpeg'}), type: p.type, creeLe: p.creeLe, modifieLe: p.modifieLe, origine: p.origine};
    });
  })).then(function (ph) {
    var tables = {};
    Object.keys(TABLES).forEach(function (t) {
      tables[t] = (d.tables || {})[t] || [];
    });
    tables.photos = ph.filter(Boolean);
    REGLAGES_PRIVES.forEach(function (k) {
      if (D.reglages[k]) {
        tables.reglages = tables.reglages.filter(function (r) { return r.id !== k; }).concat([D.reglages[k]]);
      }
    });
    return remplacerBase(tables);
  });
}
function remplacerBase(tables) {
  return ouvrirBase().then(function (db) {
    var noms = Object.keys(TABLES);
    return new Promise(function (ok, ko) {
      var tx = db.transaction(noms, 'readwrite');
      noms.forEach(function (t) {
        var s = tx.objectStore(t);
        s.clear();
        (tables[t] || []).forEach(function (o) {
          if (o && o.id !== undefined) {
            s.put(o);
          }
        });
      });
      tx.oncomplete = ok;
      tx.onerror = function () {
        ko(tx.error);
      };
      tx.onabort = function () {
        ko(tx.error || new Error('Restauration annulée'));
      };
    });
  }).then(chargerBase);
}

function nomSauvegarde() {
  return 'grimoire-' + dkey(new Date()) + '.zip';
}
ACTIONS.exporterSauvegarde = function () {
  fabriquerSauvegarde().then(function (blob) {
    var f = new File([blob], nomSauvegarde(), {type: 'application/zip'});
    if (navigator.canShare && navigator.canShare({files: [f]})) {
      return navigator.share({files: [f], title: 'Sauvegarde de mon grimoire'}).catch(function () {});
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    a.click();
  }).catch(erreurEcriture);
};

// ---------- Sauvegarde automatique dans le Drive, par le relais Apps Script ----------
// Code de liaison : « https://script.google.com/macros/s/…/exec#secret », collé une fois dans Réglages.
var DELAI_SAUVEGARDE = 30000;
var minuteurSauvegarde = null;
var sauvegardeEnCours = false;
var etatSauvegarde = '';

function liaison() {
  return reglage('liaison', null);
}
function lireCodeLiaison(code) {
  var m = String(code || '').trim().match(/^(https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec)#([A-Za-z0-9_-]{20,})$/);
  if (!m) {
    return null;
  }
  return {url: m[1], secret: m[2]};
}
function appelRelais(action, champs, l) {
  l = l || liaison();
  if (!l) {
    return Promise.reject(new Error('Sauvegarde Drive pas encore reliée'));
  }
  var corps = Object.assign({secret: l.secret, action: action}, champs || {});
  // un envoi bloqué (réseau perdu) est abandonné au bout d'un moment, pour ne pas bloquer les suivants
  var arret = null;
  var opts = {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(corps)};
  if (window.AbortController) {
    var ctrl = new AbortController();
    opts.signal = ctrl.signal;
    var delai = 30000;
    if (action === 'sauver' || action === 'lire') {
      delai = 120000;
    }
    arret = setTimeout(function () {
      ctrl.abort();
    }, delai);
  }
  return fetch(l.url, opts).then(function (r) {
    return r.json();
  }).then(function (rep) {
    clearTimeout(arret);
    if (!rep.ok) {
      var msg = rep.erreur;
      if (rep.erreur === 'secret') {
        msg = 'code de liaison refusé';
      }
      throw new Error(msg);
    }
    return rep;
  });
}
function blobEnBase64(blob) {
  return new Promise(function (ok, ko) {
    var r = new FileReader();
    r.onload = function () {
      ok(String(r.result).split(',')[1]);
    };
    r.onerror = function () {
      ko(r.error);
    };
    r.readAsDataURL(blob);
  });
}
function base64EnBuffer(b64) {
  var bin = atob(b64);
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) {
    u8[i] = bin.charCodeAt(i);
  }
  return u8.buffer;
}

function heure(ts) {
  var d = new Date(ts);
  if (dkey(d) === dkey(new Date())) {
    return d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0');
  }
  return fdate(ts);
}
function texteSauvegarde() {
  if (!liaison()) {
    return '';
  }
  if (etatSauvegarde) {
    return etatSauvegarde;
  }
  var d = reglage('derniereSauvegarde');
  if (d) {
    // heure() donne « 9 h 21 » aujourd'hui, une date sinon
    var quand = heure(d.date);
    if (dkey(new Date(d.date)) === dkey(new Date())) {
      return '☁️ sauvegardé à ' + quand;
    }
    return '☁️ sauvegardé le ' + quand;
  }
  return '☁️ pas encore sauvegardé';
}
function majTemoin(etat) {
  etatSauvegarde = etat || '';
  if (typeof majSource === 'function') {
    majSource();
  }
  var r = document.getElementById('etatDrive');
  if (r) {
    r.textContent = texteSauvegarde();
  }
}

// au moins 5 min entre deux envois pendant qu'on utilise l'appli (chacun repart avec toutes les photos) ;
// le passage en arrière-plan, lui, envoie tout de suite ce qui attend
var ECART_SAUVEGARDES = 5 * 60 * 1000;
var versionDonnees = 0;
var sauvegardeARefaire = false;
function planifierSauvegarde() {
  if (!liaison()) {
    return;
  }
  versionDonnees++;
  lsSet('bm_sauv_attente', '1');
  clearTimeout(minuteurSauvegarde);
  var derniere = reglage('derniereSauvegarde');
  var delai = DELAI_SAUVEGARDE;
  if (derniere && derniere.date) {
    delai = Math.max(delai, ECART_SAUVEGARDES - (Date.now() - derniere.date));
  }
  minuteurSauvegarde = setTimeout(sauvegarderMaintenant, delai);
}
apresEcritureHooks.push(planifierSauvegarde);

// force : passe outre le garde-fou (envoi demandé à la main)
function sauvegarderMaintenant(force) {
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = null;
  if (!liaison()) {
    return Promise.resolve();
  }
  // un envoi est déjà en cours : on en refera un juste après, pour ne pas perdre ce qui vient de changer
  if (sauvegardeEnCours) {
    sauvegardeARefaire = true;
    return Promise.resolve();
  }
  var version = versionDonnees;
  var n = valeurs(D.livres).length;
  var avant = reglage('derniereSauvegarde');
  // garde-fou : un grimoire soudain vidé ne doit pas écraser les sauvegardes
  if (force !== true && avant && avant.livres && n < avant.livres * 0.8) {
    majTemoin('⚠️ sauvegarde suspendue (' + n + ' livres au lieu de ' + avant.livres + ')');
    return Promise.resolve();
  }
  sauvegardeEnCours = true;
  majTemoin('☁️ sauvegarde…');
  return fabriquerSauvegarde().then(blobEnBase64).then(function (b64) {
    return appelRelais('sauver', {contenu: b64, jour: dkey(new Date())});
  }).then(function (rep) {
    // une modification arrivée pendant l'envoi garde la sauvegarde « en attente »
    if (versionDonnees === version) {
      lsSet('bm_sauv_attente', '');
    }
    return regler('derniereSauvegarde', {date: Date.now(), livres: n, taille: rep.taille, nom: rep.nom});
  }).then(function () {
    sauvegardeEnCours = false;
    majTemoin('');
    if (sauvegardeARefaire || versionDonnees !== version) {
      sauvegardeARefaire = false;
      planifierSauvegarde();
    }
  }).catch(function (e) {
    sauvegardeEnCours = false;
    sauvegardeARefaire = false;
    var msg = (e && e.message) || 'hors connexion ?';
    if (e && e.name === 'AbortError') {
      msg = 'réseau trop lent, nouvel essai plus tard';
    }
    majTemoin('☁️ pas sauvegardé (' + msg + ')');
  });
}
// l'appli passe en arrière-plan : on n'attend pas la fin du délai
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden' && minuteurSauvegarde) {
    sauvegarderMaintenant();
  }
});
// au démarrage : une sauvegarde n'a pas pu partir la dernière fois
function reprendreSauvegarde() {
  if (lsGet('bm_sauv_attente') === '1') {
    planifierSauvegarde();
  }
}

function listerSauvegardesDrive() {
  return appelRelais('lister').then(function (rep) {
    return rep.fichiers;
  });
}
function lireSauvegardeDrive(id) {
  return appelRelais('lire', {id: id}).then(function (rep) {
    return base64EnBuffer(rep.contenu);
  });
}
</script>

<script>
// ---------- Formulaires : livres, lectures, sessions, achats, séries, auteurs ----------
var FORMATS_FR = [['papier', '📖 Papier'], ['numerique', '📱 Numérique'], ['audio', '🎧 Audio']];
var UNITES = [['pages', 'Pages'], ['secondes', 'Durée (audio)'], ['pourcent', 'Pourcentage'], ['episodes', 'Épisodes']];
var POSSESSIONS = [['possede', '📚 Dans ma bibliothèque'], ['envie', '💫 Dans mes envies'], ['emprunte', '🤝 Emprunté'], ['revendu', '💸 Revendu'], ['', 'Non précisé']];
var STATUTS = [['en_cours', '📖 En cours'], ['pause', '⏸️ En pause'], ['terminee', '✅ Terminée'], ['abandonnee', '🏳️ Abandonnée'], ['plusenvie', '🥀 Plus envie']];
var DEVISES = [['EUR', '€'], ['USD', '$'], ['GBP', '£'], ['CHF', 'CHF'], ['CAD', 'CA$']];

// ---------- petits outils de formulaire ----------
function champ(id, valeur, attrs) {
  return '<input class="champ" id="' + id + '" value="' + esc(valeur === null || valeur === undefined ? '' : valeur) + '" ' + (attrs || '') + '>';
}
function choix(id, options, valeur) {
  return '<select class="champ" id="' + id + '">' + options.map(function (o) {
    var sel = '';
    if (String(o[0]) === String(valeur === null || valeur === undefined ? '' : valeur)) {

    }
    return '<option value="' + esc(o[0]) + '"' + sel + '>' + esc(o[1]) + '</option>';
  }).join('') + '</select>';
}
function listeDeChoix(id, valeurs) {

  return '<datalist id="' + id + '">' + valeurs.filter(function (v) {
    if (!v || vus[v]) {
      return false;
    }
    vus[v] = 1;
    return true;
  }).sort(function (a, b) { return a.localeCompare(b, 'fr'); }).map(function (v) {
    return '<option value="' + esc(v) + '">';
  }).join('') + '</datalist>';
}
function val(id) {

}
function valNombre(id) {

function lireDuree(s) {

  }
  var m = s.match(/^(\d+)(?:[:h](\d{0,2}))?(?:min)?$/);
  if (!m) {

  if (s.indexOf(':') < 0 && s.indexOf('h') < 0) {

// note de 0 à 5 par demi-étoiles : toucher une étoile la remplit, la retoucher la coupe en deux, puis l'efface
function champEtoiles(id, v) {

}
// act : l'action des étoiles (« etoile » par défaut : le formulaire ; « etoileRapide » : enregistrée tout de suite)
function boutonsEtoiles(id, v, act) {
  act = act || 'etoile';
  var h = '';
  for (var i = 1; i <= 5; i++) {
    var cls = '';
    if (v >= i) {
      cls = 'plein';
    } else if (v >= i - 0.5) {
      cls = 'demi';

}
// toucher une étoile : n ; la retoucher : n − ½ ; une troisième fois : aucune note
function etoileSuivante(cur, n) {
  if (cur === n) {
    return n - 0.5;
  }
  if (cur === n - 0.5) {
    return 0;
  }
  return n;

// redimensionne une photo (appareil ou fichier) → Blob JPEG
function redimensionnerImage(fichier, max) {
  return createImageBitmap(fichier).then(function (img) {
    var r = Math.min(1, max / Math.max(img.width, img.height));
    var c = document.createElement('canvas');
    c.width = Math.round(img.width * r);
    c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return new Promise(function (ok) {
      c.toBlob(ok, 'image/jpeg', 0.85);
    });

// un livre existant : enregistrement automatique. Une série tapée qui n'existe pas encore n'est créée qu'à la fermeture
// du formulaire (jamais un nom à moitié tapé) ; auteur·ices et genres ne comptent qu'une fois ajoutés avec leur bouton.
function activerAutoFormLivre(id) {
  var original = JSON.stringify(D.livres[id]);
  var couvOriginale = D.livres[id].couverture || '';
  var photoOriginale = null;
  if (/^p:/.test(couvOriginale) && D.photos[couvOriginale]) {
    photoOriginale = D.photos[couvOriginale];
  }
  activerAutoForm({
    livreId: id,
    ignorer: ['flAuteur', 'flRole', 'flGenre', 'flFichierCouv'],
    sauver: function (final, a) {
      if (!fl || fl.id !== id) {
        return null;
      }
      if (document.getElementById('flTitre')) {
        garderChampsLivre();
      }
      if (!fl.titre) {
        etatAutoForm('⚠️ il manque le titre : rien n\'est enregistré');
        return null;
      }
      var f = fl;
      a.attente = false;
      if (!final && fl.serieNom && !serieParNom(fl.serieNom)) {
        var actuel = D.livres[id];
        var ancienneSerie = '';
        if (actuel.serieId && D.series[actuel.serieId]) {
          ancienneSerie = D.series[actuel.serieId].nom;
        }
        f = Object.assign({}, fl, {serieNom: ancienneSerie});
        a.attente = true;
      }
      var r = opsLivre(f);
      // la photo choisie n'est enregistrée qu'une fois
      if (fl.photo) {
        fl.couverture = r.livre.couverture;
        fl.photo = null;
      }
      if (r.ops.length === 1 && memeEnregistrement(r.livre, D.livres[id])) {
        etatAutoForm('✓ enregistré');
        return null;
      }
      return r.ops;
    },
    defaire: function () {
      var ops = [{t: 'livres', o: JSON.parse(original), garderDate: true}];
      if (photoOriginale && !D.photos[photoOriginale.id]) {
        ops.push({t: 'photos', o: photoOriginale, garderDate: true});
      }
      var actuel = D.livres[id];
      if (actuel && /^p:/.test(actuel.couverture || '') && actuel.couverture !== couvOriginale) {
        ops.push({t: 'photos', suppr: actuel.couverture});
      }
      return ops;
    }
  });
}

function champsParution(p) {

    var sel = '';
    if (parseInt(morceaux[1], 10) === i + 1) {

  }).join('');
  var jour = '';
  if (morceaux[2]) {
    jour = parseInt(morceaux[2], 10);
  }
  return '<div class="date-parution">' + champ('flJour', jour, 'type="number" inputmode="numeric" min="1" max="31" placeholder="jour"') +
    '<select class="champ" id="flMois">' + options + '</select>' + champ('flAnnee', morceaux[0] || '', 'type="number" inputmode="numeric" placeholder="année"') + '</div>';
}
function lireParution() {

}

// construit les écritures d'un livre : auteurs, série et genres nouveaux, photo, puis le livre
function opsLivre(f) {
  var ops = [];
  var base = {};
  if (f.id && D.livres[f.id]) {
    base = Object.assign({}, D.livres[f.id]);
  } else {
    base = {id: nouvelId(), origine: 'appli', exclusions: {}};
  }
  var crees = {};
  var contributeurs = [];
  f.contributeurs.forEach(function (c) {
    var aid = c.auteurId;
    if (!aid || !D.auteurs[aid]) {
      var exist = auteurParNom(c.nom);
      if (exist) {
        aid = exist.id;
      } else if (crees[slug(c.nom)]) {
        aid = crees[slug(c.nom)];
      } else {
        aid = 'a:' + slug(c.nom);
        if (D.auteurs[aid]) {
          aid = nouvelId();
        }
        crees[slug(c.nom)] = aid;
        ops.push({t: 'auteurs', o: {id: aid, nom: c.nom, tri: slug(c.nom.split(' ').pop())}});
      }
    }
    if (!contributeurs.some(function (x) { return x.auteurId === aid && x.role === c.role; })) {
      contributeurs.push({auteurId: aid, role: c.role});
    }
  });
  var serieId = '';
  if (f.serieNom) {
    var s = serieParNom(f.serieNom);
    if (s) {
      serieId = s.id;
    } else {
      serieId = nouvelId();
      ops.push({t: 'series', o: {id: serieId, nom: f.serieNom, statut: 'en_cours', nbTomes: null}});
    }
  }
  var genreIds = f.genres.map(function (nom) {
    var g = genreParNom(nom);
    if (g) {
      return g.id;
    }
    var gid = idGenre(nom);
    if (D.genres[gid]) {
      gid = nouvelId();
    }
    ops.push({t: 'genres', o: {id: gid, nom: nom, emoji: '', couleur: '', ordre: valeurs(D.genres).length + ops.length}});
    return gid;
  });
  var couverture = f.couverture || '';
  if (f.photo) {
    couverture = 'p:' + nouvelId();
    ops.push({t: 'photos', o: {id: couverture, blob: f.photo, type: 'image/jpeg', origine: 'appli'}});
  }
  if (/^p:/.test(base.couverture || '') && base.couverture !== couverture) {
    ops.push({t: 'photos', suppr: base.couverture});
  }
  var isbn = isbn13(f.isbn);
  var isbns = (base.isbns || []).filter(function (x) { return x !== isbn; });
  if (isbn) {
    isbns.unshift(isbn);
  }
  var livre = Object.assign(base, {
    titre: f.titre,
    contributeurs: contributeurs,
    serieId: serieId,
    tome: serieId ? f.tome : null,
    format: f.format || 'papier',
    unite: f.unite || 'pages',
    total: f.total || 0,
    possession: f.possession || '',
    isbns: isbns,
    editeur: f.editeur || '',
    parution: f.parution || (f.annee ? String(f.annee) : ''),
    annee: anneeParution(f.parution) || f.annee || null,
    langue: normaliserLangue(f.langue),
    genreIds: genreIds,
    etagereIds: f.etagereIds || [],
    couverture: couverture,
    resume: f.resume || ''
  });
  ops.push({t: 'livres', o: livre});
  return {ops: ops, livre: livre};
}

function opsSuppressionLivre(id) {
  var ops = [{t: 'livres', suppr: id}];
  var l = D.livres[id];
  if (l && /^p:/.test(l.couverture || '')) {
    ops.push({t: 'photos', suppr: l.couverture});
  }
  valeurs(D.lectures).forEach(function (x) {
    if (x.livreId === id) {
      ops.push({t: 'lectures', suppr: x.id});
    }
  });
  valeurs(D.sessions).forEach(function (x) {
    if (x.livreId === id) {
      ops.push({t: 'sessions', suppr: x.id});
    }
  });
  valeurs(D.achats).forEach(function (x) {
    if (x.livreId === id) {
      ops.push({t: 'achats', suppr: x.id});
    }
  });
  valeurs(D.citations).forEach(function (x) {
    if (x.livreId === id) {
      ops.push({t: 'citations', suppr: x.id});
      if (x.photoId) {
        ops.push({t: 'photos', suppr: x.photoId});
      }
    }
  });
  if (D.avis[id]) {
    ops.push({t: 'avis', suppr: id});
  }
  return ops;
}
ACTIONS.supprimerLivre = function (el) {
  var id = el.dataset.id;
  var l = D.livres[id];
  var ops = opsSuppressionLivre(id);
  function nb(t) {

function ouvrirFormLecture(lid, livreId) {

  }

  // la lecture d'après les champs : {lec}, ou {erreur} si elle ne tient pas debout

    }

    }
    ouvrirFeuille('<h3>J\'en suis à…</h3><p class="small muted" style="margin:0">' + esc(l.titre) + ' · dernière position : ' + texteLongueur(x.unite, depart) + reste + '</p>' +

// une fiche de livre est-elle ouverte ? (pour y revenir après une saisie lancée depuis elle)
function ficheOuverte() {
  var f = document.getElementById('feuille');
  return !!(f && f.dataset.fiche);
}
function boutonRetour(depuisFiche, livreId, texte) {
  if (depuisFiche) {
    return '<button class="act doux" data-act="retourFiche" data-id="' + livreId + '">' + texte + '</button>';
  }
  return '<button class="act doux" data-act="fermer">' + texte + '</button>';
}
// enregistre une session et avance la lecture ; propose de la terminer si on arrive au bout
function enregistrerSession(x, champs, depuisFiche) {
  var s = Object.assign({id: nouvelId(), lectureId: x.id, livreId: x.livreId}, champs);
  var ops = [{t: 'sessions', o: s}];
  if (s.position !== null && s.position !== undefined) {
    ops.push({t: 'lectures', o: Object.assign({}, x, {position: s.position})});
  }
  return ecrire(ops).then(function () {
    apresEcriture();
    if (x.total && s.position >= x.total && x.statut !== 'terminee') {
      proposerFin(x.id, depuisFiche);
      return;
    }
    if (depuisFiche) {
      ouvrirFiche(x.livreId);
    } else {
      fermerFeuille();
    }
    toast('📍 C\'est noté : ' + texteLongueur(x.unite, s.position));
  }).catch(erreurEcriture);
}
// « ✅ Je l'ai fini » (fiche et carte « En ce moment ») : la note, puis les suites possibles
ACTIONS.jaiFini = function (el) {

function proposerFin(lid, depuisFiche) {

// après « terminé » : glisser le livre dans le carnet, ajouter une citation, commencer le tome suivant
function suitesFin(lid) {
  var x = D.lectures[lid];
  var l = D.livres[x.livreId];
  var h = '<h3>Bravo ! 🎉</h3><p class="small muted" style="margin:0 0 12px">« ' + esc(l.titre) + ' » est terminé. Et maintenant ?</p><div class="suites-fin">';
  h += '<button class="act" data-act="noter" data-id="' + l.id + '">' + ic('feather') + ' Le glisser dans le carnet</button>';
  h += '<button class="act doux" data-act="formCitation" data-livre="' + l.id + '">' + ic('quote') + ' Ajouter une citation</button>';

// le premier tome suivant de la série qui n'est ni lu, ni en cours, ni revendu
function tomeSuivant(l) {
  if (!l.serieId || l.tome === null || l.tome === undefined) {
    return null;
  }
  var dejaLus = {};
  valeurs(D.lectures).forEach(function (r) {
    if (r.statut !== 'abandonnee' && r.statut !== 'plusenvie') {
      dejaLus[r.livreId] = 1;
    }
  });
  var tomes = valeurs(D.livres).filter(function (b) {
    return b.serieId === l.serieId && b.tome !== null && b.tome !== undefined && b.tome > l.tome && !dejaLus[b.id] && b.possession !== 'revendu';
  }).sort(function (a, b) { return a.tome - b.tome; });
  return tomes[0] || null;
}

// ---------- sessions d'une lecture ----------
ACTIONS.sessions = function (el) {
  afficherSessions(el.dataset.lecture);
};
// une session garde son heure de début, son heure de fin et son temps de lecture (pauses déduites)
function heureLisible(ts) {
  return heureVersChamp(ts).replace(':', ' h ');
}
function dureeLecture(sec) {
  var m = Math.round(sec / 60);
  if (m < 60) {
    return Math.max(1, m) + ' min';
  }
  return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
}
// « 18 h 00 → 19 h 00 · 45 min de lecture » ; un simple relevé de page : « à 15 h 33 »
function texteSession(s) {
  var parts = [];
  if (s.fin && s.fin - s.debut >= 60000) {
    parts.push(heureLisible(s.debut) + ' → ' + heureLisible(s.fin));
  } else if (s.dureeSec) {
    parts.push('dès ' + heureLisible(s.debut));
  } else {
    parts.push('à ' + heureLisible(s.debut));
  }
  if (s.dureeSec) {
    parts.push('<b>' + dureeLecture(s.dureeSec) + '</b> de lecture');
  }
  return parts.join(' · ');
}
function afficherSessions(lid) {
  var x = D.lectures[lid];
  var l = D.livres[x.livreId];
  var ss = valeurs(D.sessions).filter(function (s) { return s.lectureId === lid && !s.enCours; }).sort(function (a, b) { return (b.debut || 0) - (a.debut || 0); });
  // pages lues pendant chaque session : ce qu'elle a fait avancer depuis la page la plus loin atteinte avant elle
  var gains = {};
  if (x.unite === 'pages') {
    var plusLoin = 0;
    ss.slice().sort(function (a, b) { return (a.debut || 0) - (b.debut || 0); }).forEach(function (s) {
      if (s.position !== null && s.position !== undefined) {
        gains[s.id] = Math.max(0, s.position - plusLoin);
        plusLoin = Math.max(plusLoin, s.position);
      }
    });
  }
  // vitesse : seulement pour une session minutée (au moins une minute) qui a fait avancer
  function vitesse(s) {
    if (!gains[s.id] || !s.dureeSec || s.dureeSec < 60) {
      return 0;
    }
    return gains[s.id] / (s.dureeSec / 3600);
  }
  var h = '<h3>Sessions de lecture</h3><p class="small muted">' + esc(l.titre) + ' · ' + texteLecture(x) + '</p>';
  var minutees = ss.filter(function (s) { return vitesse(s) > 0; });
  if (minutees.length) {
    var pages = minutees.reduce(function (n, s) { return n + gains[s.id]; }, 0);
    var heures = minutees.reduce(function (n, s) { return n + s.dureeSec / 3600; }, 0);
    var parHeure = Math.round(pages / heures);
    h += '<p class="small">⚡ En moyenne <b>' + parHeure + ' page' + (parHeure > 1 ? 's' : '') + ' par heure</b> (' + minutees.length + ' session' + (minutees.length > 1 ? 's' : '') + ' minutée' + (minutees.length > 1 ? 's' : '') + ')</p>';
  }
  if (!ss.length) {
    h += '<p class="small muted">Aucune session notée.</p>';
  }
  h += ss.map(function (s) {
    var d = new Date(s.debut);
    var page = '';
    if (s.position !== null && s.position !== undefined) {
      page = ' · ' + texteLongueur(x.unite, s.position);
    }
    var rythme = '';
    if (vitesse(s)) {
      rythme = ' · ' + gains[s.id] + ' p. · <b>' + Math.round(vitesse(s)) + ' p./h</b>';
    } else if (gains[s.id]) {
      rythme = ' · ' + gains[s.id] + ' p.';
    }
    return '<div class="ligne-ed"><div class="small"><div>' + JOURS[(d.getDay() + 6) % 7] + ' ' + fdate(s.debut) + page + '</div><div class="muted">' + texteSession(s) + rythme + '</div></div><div class="boutons"><button aria-label="Modifier la session" class="mini-btn" data-act="formSession" data-id="' + s.id + '">' + ic('pencil') + '</button></div></div>';
  }).join('');
  h += '<div class="row" style="margin-top:12px"><button class="act doux" data-act="formSession" data-lecture="' + lid + '">' + ic('plus') + ' Ajouter une session</button><button class="act doux" data-act="retourFiche" data-id="' + l.id + '">' + ic('chevron-left') + ' Retour</button></div>';
  ouvrirFeuille(h);
  document.getElementById('feuille').dataset.sessions = lid;
}
ACTIONS.formSession = function (el) {
  var sid = el.dataset.id;
  var lid = el.dataset.lecture;
  siIndependant(function () {
    var s = (sid && D.sessions[sid]) || null;
    var x = D.lectures[(s && s.lectureId) || lid];
    var maintenant = Date.now();
    var v = s || {debut: maintenant - 30 * 60000, fin: maintenant, dureeSec: 30 * 60, position: null};
    var fin = '';
    if (v.fin && v.fin - v.debut >= 60000) {
      fin = heureVersChamp(v.fin);
    }
    var h = '<h3>' + (s ? 'Modifier la session' : 'Ajouter une session') + '</h3><div class="form">' +
      '<label>Date</label>' + champ('seDate', dateVersChamp(v.debut), 'type="date"') +
      '<div class="deux"><div><label>Début</label>' + champ('seHeure', heureVersChamp(v.debut), 'type="time"') + '</div><div><label>Fin</label>' + champ('seFin', fin, 'type="time"') + '</div></div>' +
      '<div class="deux"><div><label>Temps de lecture (min)</label>' + champ('seMinutes', v.dureeSec ? Math.round(v.dureeSec / 60) : '', 'type="number" min="0" inputmode="numeric"') + '</div><div><label>Arrivée à</label>' + champLongueur('sePosition', x.unite, v.position) + '</div></div>' +
      '<p class="small muted" style="margin:6px 0 0">Le temps de lecture compte sans les pauses : par ex. de 18 h à 19 h avec 15 min de pause, 45 min. Laisse-le vide pour compter tout le temps entre le début et la fin.</p>' +
      '<div class="row" style="margin-top:16px"><button class="act" data-act="seEnregistrer">' + ic('check') + ' Enregistrer</button><button class="act doux" data-act="seRetour">Annuler</button></div>';
    if (s) {
      h += '<button class="lien danger" data-act="seSupprimer" style="margin-top:14px">' + ic('trash-2') + ' Supprimer cette session</button>';
    }
    ouvrirFeuille(h + '</div>');
    ACTIONS.seRetour = function () {
      afficherSessions(x.id);
    };
    ACTIONS.seEnregistrer = function () {
      var jour = val('seDate');
      if (!jour) {
        avertir('Indique la date.');
        return;
      }
      var debut = new Date(jour + 'T' + (val('seHeure') || '12:00') + ':00').getTime();
      var mn = valNombre('seMinutes');
      var finSession = null;
      if (val('seFin')) {
        finSession = new Date(jour + 'T' + val('seFin') + ':00').getTime();
        // fin avant le début : la lecture a passé minuit
        if (finSession < debut) {
          finSession += DAY;
        }
        if (mn === null && finSession > debut) {
          mn = Math.round((finSession - debut) / 60000);
        }
      } else {
        finSession = debut + (mn || 0) * 60000;
      }
      if (mn && finSession > debut && mn * 60000 > finSession - debut + 59000) {
        avertir('Le temps de lecture (' + mn + ' min) dépasse le temps entre le début et la fin (' + Math.round((finSession - debut) / 60000) + ' min).');
        return;

          }

      var nonLus = [];

    ouvrirFormLivre(null, {titre: inf.titre, auteurs: inf.auteurs, isbn: inf.isbn, pages: inf.pages, image: inf.image, parution: normaliserParution(inf.date), editeur: inf.editeur, resume: inf.resume, genres: genresDepuis(inf.categories || [])});
  });
};

// ajout direct depuis le scanner : mode = pal | envie | achat | lecture
function ajouterDepuisInfos(infos, isbn, mode) {
  siIndependant(function () {
    var r = opsLivre({
      titre: infos.titre,
      contributeurs: (infos.auteurs || []).map(function (n) {
        var a = auteurParNom(n);
        return {auteurId: a && a.id, nom: (a && a.nom) || n, role: 'auteur'};
      }),
      serieNom: '',
      tome: null,
      format: 'papier',
      unite: 'pages',
      total: infos.pages || 0,
      possession: mode === 'envie' ? 'envie' : 'possede',
      isbn: isbn || infos.isbn || '',
      editeur: infos.editeur || '',
      parution: normaliserParution(infos.date),
      langue: '',
      genres: genresDepuis(infos.categories || []),
      etagereIds: [],
      couverture: infos.image || '',
      photo: null,
      resume: infos.resume || ''
    });
    var ops = r.ops;
    if (mode === 'lecture') {
      ops.push({t: 'lectures', o: {id: nouvelId(), livreId: r.livre.id, nth: 1, format: 'papier', debut: Date.now(), fin: null, statut: 'en_cours', unite: 'pages', total: infos.pages || 0, position: 0, etoiles: null, commentaire: '', origine: 'appli'}});
    }
    ecrire(ops).then(function () {
      apresEcriture();
      if (mode === 'achat') {
        ouvrirFormAchat(null, r.livre.id);
      } else {
        ouvrirFiche(r.livre.id);
      }
      toast('✨ Ajouté à ton grimoire');
    }).catch(erreurEcriture);
  });
}
</script>

<script>
// ---------- Minuteur de lecture ----------
// Une seule session ouverte à la fois, enregistrée dans la base (elle survit à la fermeture de l'appli) :
// {enCours: true, debut, accumule (secondes déjà comptées), repriseA (ms, ou null en pause)}.
var minuteurTic = null;
var verrouEcran = null;

function sessionEnCours() {
  return valeurs(D.sessions || {}).find(function (s) { return s.enCours; }) || null;
}
function ecoule(s) {
  var t = s.accumule || 0;
  if (s.repriseA) {
    t += (Date.now() - s.repriseA) / 1000;
  }
  return Math.max(0, Math.round(t));
}
function texteChrono(sec) {
  var h = Math.floor(sec / 3600);
  var m = Math.floor((sec % 3600) / 60);
  var s = sec % 60;
  var mm = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  if (h) {
    return h + ':' + mm;
  }
  return mm;
}
function vibrer(motif) {
  if (navigator.vibrate) {
    try {
      navigator.vibrate(motif);
    } catch (e) {}
  }
}
function titreCourt(l) {
  return String((l && l.titre) || 'Lecture').replace(/\s*\([^)]*#\d+(\.\d+)?\)\s*$/, '');
}
function couvSession(s) {
  var b = M && M.parId[s.livreId];
  if (b) {
    return cover(b);
  }
  return '<div class="ph"></div>';
}

// garder l'écran allumé tant que la page du minuteur est ouverte et que la lecture tourne
function majVerrouEcran() {
  var s = sessionEnCours();
  var voulu = !!(document.getElementById('pageMinuteur') && s && s.repriseA && document.visibilityState === 'visible');
  if (voulu && !verrouEcran && navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(function (v) {
      verrouEcran = v;
      v.addEventListener('release', function () {
        verrouEcran = null;
      });
    }).catch(function () {});
  } else if (!voulu && verrouEcran) {
    verrouEcran.release().catch(function () {});
    verrouEcran = null;
  }
}

// rafraîchit le mini-lecteur et la page du minuteur (chaque seconde tant qu'une session est ouverte)
function majMinuteur() {
  var s = sessionEnCours();
  var bar = document.getElementById('lecteur');
  document.body.classList.toggle('minuteur-actif', !!s);
  if (!s) {
    if (bar) {
      bar.remove();
    }
    fermerPageMinuteur();
    clearInterval(minuteurTic);
    minuteurTic = null;
    return;
  }
  if (!minuteurTic) {
    minuteurTic = setInterval(majMinuteur, 1000);
  }
  // écran éteint ou autre appli : rien à redessiner, le retour sur l'appli remet tout à jour
  if (document.hidden) {
    return;
  }
  var l = D.livres[s.livreId];
  var pause = !s.repriseA;
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'lecteur';
    bar.className = 'lecteur';
    document.body.appendChild(bar);
    bar.innerHTML = '<div class="ouvrir" data-act="pageMinuteur"><span class="couv-mini"></span><div class="txt"><div class="chrono"></div><div class="tt"></div></div></div><button class="b" data-act="basculerMinuteur" aria-label="Pause ou reprise"></button><button class="b stop" data-act="arreterMinuteur" aria-label="Terminer la session">' + ic('square') + '</button>';
  }
  if (bar.dataset.session !== s.id) {
    bar.dataset.session = s.id;
    bar.querySelector('.couv-mini').innerHTML = couvSession(s);
  }
  bar.classList.toggle('pause', pause);
  bar.querySelector('.chrono').textContent = texteChrono(ecoule(s));
  bar.querySelector('.tt').textContent = (pause ? '⏸ EN PAUSE · ' : '') + titreCourt(l);
  var bascule = bar.querySelector('[data-act="basculerMinuteur"]');
  if (bascule.dataset.etat !== String(pause)) {
    bascule.dataset.etat = String(pause);
    bascule.innerHTML = pause ? ic('play') : ic('pause');
  }
  majPageMinuteur();
}
// ancien nom, appelé ailleurs
var majPastille = majMinuteur;
apresEcritureHooks.push(majMinuteur);
document.addEventListener('visibilitychange', function () {
  if (D.sessions) {
    majMinuteur();
    majVerrouEcran();
  }
});

// ---------- page du minuteur ----------
ACTIONS.pageMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  fermerFeuille();
  var p = document.getElementById('pageMinuteur');
  if (!p) {
    p = document.createElement('div');
    p.id = 'pageMinuteur';
    p.className = 'page-minuteur';
    document.body.appendChild(p);
  }
  var l = D.livres[s.livreId] || {};
  var b = M && M.parId[s.livreId];
  var auteurs = '';
  if (b) {
    auteurs = b.authors.join(', ');
  }
  p.innerHTML = '<div class="bandeau-pause">⏸ EN PAUSE ⏸ EN PAUSE ⏸ EN PAUSE ⏸ EN PAUSE</div>' +
    '<div class="haut"><button data-act="fermerPageMinuteur">' + ic('chevron-left') + ' Retour</button><span class="small muted" id="eveilEcran"></span><button class="annuler-haut" data-act="annulerMinuteur">' + ic('x') + ' Annuler</button></div>' +
    '<div class="couv">' + couvSession(s) + '</div><div class="titre">' + esc(titreCourt(l)) + '</div><div class="auteur">' + esc(auteurs) + '</div>' +
    '<div class="anneau-m"><div class="chrono-m" id="chronoGrand"></div><div class="etat-m" id="etatMinuteur"></div></div>' +
    '<div class="infos-m" id="infosMinuteur"></div>' +
    '<div class="commandes"><button class="rond-m annuler" data-act="annulerMinuteur">' + ic('x') + '<small>annuler</small></button><button class="gros-m" id="boutonMinuteur" data-act="basculerMinuteur"></button><button class="rond-m" data-act="arreterMinuteur">' + ic('square') + '<small>terminer</small></button></div>';
  majPageMinuteur();
  majVerrouEcran();
};
function majPageMinuteur() {
  var p = document.getElementById('pageMinuteur');
  var s = sessionEnCours();
  if (!p || !s) {
    return;
  }
  var pause = !s.repriseA;
  p.classList.toggle('pause', pause);
  document.getElementById('chronoGrand').textContent = texteChrono(ecoule(s));
  document.getElementById('etatMinuteur').textContent = pause ? '⏸ en pause' : '✨ lecture en cours';
  var gros = document.getElementById('boutonMinuteur');
  if (gros.dataset.etat !== String(pause)) {
    gros.dataset.etat = String(pause);
    gros.innerHTML = pause ? ic('play') : ic('pause');
  }
  var x = D.lectures[s.lectureId] || {};
  // le texte sous le chrono (heure de début, estimation de fin) ne se recalcule que s'il a pu changer, pas chaque seconde
  var boite = document.getElementById('infosMinuteur');
  var cle = [s.id, pause, s.pauseA, s.debut, x.position].join('|');
  if (pause) {
    cle += '|' + Math.round((Date.now() - (s.pauseA || 0)) / 60000);
  }
  if (boite.dataset.cle !== cle || infoMinuteurM !== M) {
    boite.dataset.cle = cle;
    infoMinuteurM = M;
    boite.innerHTML = texteInfosMinuteur(s, x, pause);
  }
  var eveil = document.getElementById('eveilEcran');
  if (eveil) {
    eveil.textContent = (verrouEcran && !pause) ? '🔆 écran allumé' : '';
  }
}
var infoMinuteurM = null;
function texteInfosMinuteur(s, x, pause) {
  var info;
  if (pause) {
    info = 'en pause' + (s.pauseA ? ' depuis <b>' + dureeCourte((Date.now() - s.pauseA) / 1000) + '</b>' : '') + '<br>touche ▶ pour reprendre';
  } else {
    info = 'commencé à <b>' + heureVersChamp(s.debut).replace(':', ' h ') + '</b>';
    if (x.position) {
      info += ' · départ <b>' + texteLongueur(x.unite, x.position) + '</b>';
    }
    var r = M && M.lectures.find(function (y) { return y._id === s.lectureId; });
    if (r) {
      var est = estimationLecture(r);
      if (est.reste) {
        info += '<br>' + est.reste.replace('⏳ ', '') + ' pour finir le livre';
      }
    }
  }
  return info;
}
function fermerPageMinuteur() {
  var p = document.getElementById('pageMinuteur');
  if (p) {
    p.remove();
  }
  majVerrouEcran();
}
ACTIONS.fermerPageMinuteur = fermerPageMinuteur;

// ---------- commandes ----------
// ▶ Lire : lance le minuteur (ou rouvre celui qui tourne) et affiche sa page
ACTIONS.lireMaintenant = function (el) {
  var lid = el.dataset.lecture;
  siIndependant(function () {
    var s = sessionEnCours();
    if (s) {
      if (s.lectureId !== lid) {
        toast('⏱️ Un minuteur tourne déjà pour « ' + titreCourt(D.livres[s.livreId]) + ' »');
      }
      ACTIONS.pageMinuteur();
      return;
    }
    var x = D.lectures[lid];
    var maintenant = Date.now();
    var ops = [{t: 'sessions', o: {id: nouvelId(), lectureId: lid, livreId: x.livreId, debut: maintenant, fin: null, dureeSec: null, position: null, accumule: 0, repriseA: maintenant, enCours: true, origine: 'minuteur'}}];
    if (x.statut === 'pause') {
      ops.push({t: 'lectures', o: Object.assign({}, x, {statut: 'en_cours'})});
    }
    vibrer(50);
    ecrire(ops).then(function () {
      fermerFeuille();
      apresEcriture();
      ACTIONS.pageMinuteur();
    }).catch(erreurEcriture);
  });
};
ACTIONS.lancerMinuteur = ACTIONS.lireMaintenant;
ACTIONS.ouvrirMinuteur = function () {
  ACTIONS.pageMinuteur();
};
function modifierSessionEnCours(champs) {
  var s = sessionEnCours();
  if (!s) {
    return Promise.resolve();
  }
  return ecrire([{t: 'sessions', o: Object.assign({}, s, champs)}]).then(function () {
    majMinuteur();
    majVerrouEcran();
  }).catch(erreurEcriture);
}
// ▶ / ⏸ : un « bzz » pour reprendre, deux pour la pause
ACTIONS.basculerMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  if (s.repriseA) {
    vibrer([60, 80, 60]);
    modifierSessionEnCours({accumule: ecoule(s), repriseA: null, pauseA: Date.now()});
  } else {
    vibrer(50);
    modifierSessionEnCours({repriseA: Date.now(), pauseA: null});
  }
};
ACTIONS.pauseMinuteur = function () {
  var s = sessionEnCours();
  if (s && s.repriseA) {
    ACTIONS.basculerMinuteur();
  }
};
ACTIONS.repriseMinuteur = function () {
  var s = sessionEnCours();
  if (s && !s.repriseA) {
    ACTIONS.basculerMinuteur();
  }
};
ACTIONS.annulerMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  demander('Cette session ne sera pas comptée.', {titre: 'Annuler ce minuteur ?', oui: 'Annuler le minuteur', non: 'Continuer', danger: true}).then(function (ok) {
    if (!ok) {
      return;
    }
    ecrire([{t: 'sessions', suppr: s.id}]).then(function () {
      fermerPageMinuteur();
      apresEcriture();
    }).catch(erreurEcriture);
  });
};

// ⏹ : la fenêtre d'arrêt, avec la page pré-remplie et des raccourcis
function pagesMoyennesParSession(lid) {
  var ss = valeurs(D.sessions).filter(function (s) { return s.lectureId === lid && !s.enCours && s.position !== null && s.position !== undefined; }).sort(function (a, b) { return (a.fin || a.debut) - (b.fin || b.debut); });
  var gains = [];
  var max = 0;
  ss.forEach(function (s, i) {
    if (i > 0 && s.dureeSec && s.position > max) {
      gains.push(s.position - max);
    }
    max = Math.max(max, s.position);
  });
  if (gains.length < 2) {
    return null;
  }
  return Math.round(mediane(gains));
}
// le champ de position avec − et +, et pour les pages les raccourcis +10, +20, ta moyenne, +50
// (à l'arrêt du minuteur et dans « J'en suis à… ») ; pasPosition fait avancer le champ
function champPosition(id, x, propose) {
  var pas = '';
  if (x.unite === 'pages') {
    var moy = pagesMoyennesParSession(x.id);
    var raccourcis = [10, 20];
    if (moy && raccourcis.indexOf(moy) < 0) {
      raccourcis.push(moy);
    }
    raccourcis.push(50);
    raccourcis.sort(function (a, b) { return a - b; });
    pas = '<div class="pas">' + raccourcis.map(function (n) {
      var moyenne = '';
      if (n === moy) {
        moyenne = ' (ta moyenne)';
      }
      return '<button data-act="pasPage" data-n="' + n + '">+' + n + moyenne + '</button>';
    }).join('') + '</div>';
  }
  var c;
  if (x.unite === 'secondes') {
    c = champ(id, texteDuree(propose), 'inputmode="numeric"');
  } else {
    c = champ(id, propose || '', 'inputmode="decimal"');
  }
  return '<div class="champ-page"><button class="rond-m" data-act="pasPage" data-n="-1" aria-label="Moins">' + ic('minus') + '</button>' + c + '<button class="rond-m" data-act="pasPage" data-n="1" aria-label="Plus">' + ic('plus') + '</button></div>' + pas;
}
// −1 / +1 partent de ce qui est dans le champ, les raccourcis de la position de départ
function pasPosition(id, x, depart, n) {
  var champPos = document.getElementById(id);
  if (x.unite === 'secondes') {
    var v = lireDuree(val(id)) || depart;
    champPos.value = texteDuree(Math.max(0, v + n * 60));
    return;
  }
  var base = depart;
  if (Math.abs(n) === 1) {
    base = valNombre(id) || depart;
  }
  var nv = Math.max(0, base + n);
  if (x.total && x.unite === 'pages') {
    nv = Math.min(nv, x.total);
  }
  champPos.value = String(nv).replace('.', ',');
}
ACTIONS.arreterMinuteur = function () {
  var s = sessionEnCours();
  if (!s) {
    return;
  }
  vibrer(120);
  var sec = ecoule(s);
  var finArret = Date.now();
  var x = D.lectures[s.lectureId];
  var mn = Math.max(1, Math.round(sec / 60));
  var pauseSec = Math.max(0, (finArret - s.debut) / 1000 - sec);
  var plage = '' + ic('history') + ' ' + heureLisible(s.debut) + ' → ' + heureLisible(finArret);
  if (pauseSec >= 60) {
    plage += ' · ⏸ ' + dureeLecture(pauseSec) + ' de pause';
  }
  var depart = x.position || 0;
  var propose = depart;
  if (x.unite === 'secondes') {
    // en audio, la position avance avec le temps d'écoute
    propose = depart + sec;
  }
  var oubli = '';
  if (sec > 6 * 3600) {
    oubli = '<p class="small">🤔 Plus de 6 heures : tu as peut-être oublié d\'arrêter le minuteur ? Corrige la durée si besoin.</p>';
  }
  var question = 'Tu en es à quelle page ?';
  if (x.unite === 'secondes') {
    question = 'Tu en es où dans l\'écoute ? (h:mm)';
  } else if (x.unite === 'pourcent') {
    question = 'Tu en es à combien de % ?';
  }
  ouvrirFeuille('<h3>Session terminée ✨</h3><p class="small muted" style="margin:0">' + esc(titreCourt(D.livres[s.livreId])) + '</p>' +
    '<div class="grand-chrono">' + dureeLecture(sec) + '</div><p class="small muted" style="text-align:center;margin:0">de lecture · ' + plage + '</p>' + oubli +
    '<p class="small" style="margin:6px 0 0;text-align:center">' + question + '</p>' +
    champPosition('arPosition', x, propose) + '<p class="small muted" style="text-align:center;margin:8px 0 0" id="arResume"></p>' +
    '<div class="form" style="margin-top:6px"><label>Temps de lecture (min, pauses déduites)</label>' + champ('arMinutes', mn, 'type="number" min="1" inputmode="numeric"') + '</div>' +
    '<div class="row" style="margin-top:14px"><button class="act" data-act="validerArret">' + ic('check') + ' Enregistrer</button><button class="act doux" data-act="reprendreApresArret">' + ic('play') + ' Reprendre</button></div>');
  function resume() {
    var pos = lireLongueur('arPosition', x.unite);
    var el = document.getElementById('arResume');
    if (!el) {
      return;
    }
    var avant = 'avant : ' + texteLongueur(x.unite, depart);
    if (pos !== null && pos > depart && x.unite === 'pages') {
      avant += ' · soit <b style="color:var(--ink)">' + round(pos - depart, 1) + ' pages</b> en ' + (valNombre('arMinutes') || mn) + ' min';
    }
    el.innerHTML = avant;
  }
  resume();
  document.getElementById('arPosition').addEventListener('input', resume);
  ACTIONS.pasPage = function (el) {
    pasPosition('arPosition', x, depart, parseFloat(el.dataset.n));
    resume();
  };
  ACTIONS.reprendreApresArret = function () {
    fermerFeuille();
    ACTIONS.pageMinuteur();
  };
  ACTIONS.validerArret = function () {
    var s2 = sessionEnCours();
    if (!s2) {
      fermerFeuille();
      return;
    }
    var minutes = valNombre('arMinutes') || mn;
    var pos = lireLongueur('arPosition', x.unite);
    var session = Object.assign({}, s2, {enCours: false, fin: finArret, dureeSec: Math.round(minutes * 60), position: pos});
    delete session.accumule;
    delete session.repriseA;
    delete session.pauseA;
    var ops = [{t: 'sessions', o: session}];
    var lec = D.lectures[s2.lectureId];
    if (pos !== null) {
      ops.push({t: 'lectures', o: Object.assign({}, lec, {position: pos})});
    }
    ecrire(ops).then(function () {
      fermerPageMinuteur();
      apresEcriture();
      if (lec.total && pos !== null && pos >= lec.total) {
        proposerFin(lec.id);
      } else {
        fermerFeuille();
        toast('⏱️ ' + Math.round(minutes) + ' min de lecture notées');
      }
    }).catch(erreurEcriture);
  };
};
</script>
