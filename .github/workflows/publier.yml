# Publie le grimoire sur GitHub Pages à chaque push sur main : les fichiers du dépôt sont servis tels quels.
name: Publier le grimoire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule publication à la fois ; une nouvelle remplace celle qui attend encore
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
